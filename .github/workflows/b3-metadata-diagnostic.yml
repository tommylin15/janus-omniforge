name: B3 Lakehouse metadata diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b3-metadata-diagnostic.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe BigQuery-facing Lakehouse table metadata
        shell: bash
        run: |
          set +e
          project='gen-lang-client-0593591102'
          table_a="${project}:janus_core_dev.b2_core_fixed_20261007.benchmark_v1"
          table_b="janus_core_dev.b2_core_fixed_20261007.benchmark_v1"
          table_c="${project}.janus_core_dev.b2_core_fixed_20261007.benchmark_v1"
          for value in "$table_a" "$table_b" "$table_c"; do
            echo "=== bq show: $value ==="
            bq show --format=prettyjson --project_id="$project" "$value"
            echo "rc=$?"
          done
          echo "=== bq ls catalog namespace ==="
          bq ls --format=prettyjson --project_id="$project" janus_core_dev.b2_core_fixed_20261007
          echo "rc=$?"
          echo "=== existing project IAM for Mart / ingestion / CI ==="
          gcloud projects get-iam-policy "$project" --format=json > /tmp/project-iam.json
          python - <<'PY'
import json
p=json.load(open('/tmp/project-iam.json'))
targets=('intelligence-mart@','ingestion-core@','janus-ci@')
for b in p.get('bindings',[]):
    members=[m for m in b.get('members',[]) if any(t in m for t in targets)]
    if members:
        print(json.dumps({"role":b.get("role"),"members":members}, sort_keys=True))
PY
          echo "rc=$?"
          exit 0
