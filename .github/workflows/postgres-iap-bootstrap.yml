name: Bootstrap bounded PostgreSQL IAP access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postgres-iap-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply specific-VM IAP binding through Cloud Build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          build_id="$(gcloud builds submit --no-source \
            --project="${GCP_PROJECT_ID}" \
            --config=scripts/gcp/cloudbuild-postgres-iap-bootstrap.yaml \
            --async --format='value(id)')"
          test -n "${build_id}"
          for _ in $(seq 1 60); do
            status="$(gcloud builds describe "${build_id}" \
              --project="${GCP_PROJECT_ID}" --format='value(status)')"
            case "${status}" in
              SUCCESS)
                echo "Bounded PostgreSQL IAP bootstrap succeeded: ${build_id}"
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds describe "${build_id}" --project="${GCP_PROJECT_ID}" \
                  --format='yaml(id,status,statusDetail,failureInfo,steps.id,steps.status)' || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for bounded PostgreSQL IAP bootstrap: ${build_id}" >&2
          exit 1
