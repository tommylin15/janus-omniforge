name: Bootstrap bounded PostgreSQL IAP access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postgres-iap-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply specific-VM IAP binding through Cloud Build identity
        run: >-
          gcloud builds submit --no-source
          --project="${GCP_PROJECT_ID}"
          --config=scripts/gcp/cloudbuild-postgres-iap-bootstrap.yaml
