name: Bootstrap bounded PostgreSQL IAP access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postgres-iap-bootstrap.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Restore bounded IAP tunnel access for Cloud Build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          project_number="$(gcloud projects describe "${GCP_PROJECT_ID}" --format='value(projectNumber)')"
          principal="serviceAccount:${project_number}-compute@developer.gserviceaccount.com"
          has_binding() {
            gcloud projects get-iam-policy "${GCP_PROJECT_ID}" \
              --flatten='bindings[].members' \
              --filter="bindings.role:roles/iap.tunnelResourceAccessor AND bindings.members:${principal}" \
              --format='value(bindings.members)' | grep -Fxq "${principal}"
          }

          if has_binding; then
            echo 'Bounded Cloud Build IAP tunnel access is already present.'
          else
            gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
              --member="${principal}" \
              --role='roles/iap.tunnelResourceAccessor' \
              --condition=None \
              --quiet >/dev/null
          fi

          has_binding
          echo 'Bounded Cloud Build IAP tunnel access is present for the dev PostgreSQL control path.'
