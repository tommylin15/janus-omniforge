name: Verify dev serving projection hot path

on:
  push:
    branches: [main]
    paths:
      - 'ops/api-serving-projection-acceptance'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate telemetry contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_public_runtime_source_telemetry.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify live API projection source evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence=''
          for attempt in $(seq 1 12); do
            entries="$(gcloud logging read \
              'resource.type="cloud_run_revision" AND "core_query_source"' \
              --project="${GCP_PROJECT_ID}" --freshness=20m --limit=100 --order=desc --format=json)"
            evidence="$(jq -c '
              [ .[] |
                (.jsonPayload? // (.textPayload? | select(type == "string") | (try fromjson catch null))) |
                select(type == "object") |
                select(.component == "janus-api" and .operation == "core_query_source" and .dataset == "ohlcv" and .source == "serving_projection")
              ] | first // empty
            ' <<< "${entries}")"
            if [[ -n "${evidence}" ]]; then break; fi
            if [[ "${attempt}" != '12' ]]; then sleep 5; fi
          done
          if [[ -z "${evidence}" ]]; then
            echo 'No live serving_projection hot-path evidence found.' >&2
            exit 1
          fi
          echo "hot_path_evidence=${evidence}"
