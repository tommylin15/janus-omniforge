name: Verify dev serving projection hot path

on:
  push:
    branches: [main]
    paths:
      - 'ops/api-serving-projection-acceptance'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.lock
      - name: Install telemetry test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Validate telemetry contract
        shell: bash
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_public_runtime_source_telemetry.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Trigger live public stock read
        shell: bash
        run: |
          set -Eeuo pipefail
          api_url="$(gcloud run services describe janus-api \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(status.url)')"
          test -n "${api_url}"
          response="$(curl -fsS "${api_url}/api/v1/public/history/2330?limit=1&offset=0")"
          jq -e '.dataset_id == "ohlcv" and .symbol == "2330" and (.rows | length) > 0' <<< "${response}" >/dev/null
          echo 'live_public_stock_read=ok'
      - name: Verify live API projection source evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence=''
          for attempt in $(seq 1 12); do
            entries="$(gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="janus-api" AND (jsonPayload.operation="core_query_source" OR textPayload:"core_query_source")' \
              --project="${GCP_PROJECT_ID}" --freshness=20m --limit=100 --order=desc --format=json)"
            evidence="$(jq -c '
              [ .[] |
                (.jsonPayload? // (.textPayload? | select(type == "string") | (try fromjson catch null))) |
                select(type == "object") |
                select(.component == "janus-api" and .operation == "core_query_source" and .dataset == "ohlcv" and .source == "serving_projection")
              ] | first // empty
            ' <<< "${entries}")"
            if [[ -n "${evidence}" ]]; then break; fi
            if [[ "${attempt}" != '12' ]]; then sleep 5; fi
          done
          if [[ -z "${evidence}" ]]; then
            echo 'No live serving_projection hot-path evidence found.' >&2
            exit 1
          fi
          echo "hot_path_evidence=${evidence}"
