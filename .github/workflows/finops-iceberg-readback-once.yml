name: One-shot read-only Iceberg post-recovery evidence
on:
  push:
    branches: [main]
    paths:
      - 'ops/finops-iceberg-readback-once.json'
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify bounded read-only intent
        run: |
          jq -e '.intent=="read-existing-iceberg-post-recovery" and
                  .no_gcp_mutation==true and .project=="gen-lang-client-0593591102" and
                  .region=="us-central1"' ops/finops-iceberg-readback-once.json > /dev/null
      - name: Inspect current Scheduler, four immutable images and execution fence without secrets
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts/gcp')
          import ghcr_jobs_rollout as r
          s = r.scheduler()
          out = {'scheduler':{'name':r.SCHEDULER,'state':s.get('state'),
                 'schedule':s.get('schedule'),'timezone':s.get('timeZone')},
                 'jobs':{}, 'read_only':True}
          for name, _ in r.JOB_COMPONENT:
              j = r.job(name)
              env = j.get('template',{}).get('template',{}).get('containers',[{}])[0].get('env',[])
              out['jobs'][name] = {'image':r.image(j),'configuration_hash':r.fingerprint(j),
                 'core_retention_fence_env_present':any(x.get('name')=='CORE_RETENTION_FENCE_URI' for x in env)}
          try:
              r.fence()
              out['execution_fence'] = 'ALL_TERMINAL'
          except (ValueError, RuntimeError) as e:
              out['execution_fence'] = 'BLOCKED_OR_ACTIVE'
              out['execution_fence_error_type'] = type(e).__name__
          from urllib.parse import quote
          blocked = []
          examined = 0
          truncated = False
          for name in r.REQUIRED_JOBS:
              page_path = f"{r.ROOT}/jobs/{name}/executions?pageSize=100"
              seen = set()
              for _ in range(25):
                  if not page_path:
                      break
                  page = r.cloud(page_path)
                  for execution in page.get('executions', []):
                      examined += 1
                      if not r.terminal(execution):
                          conditions = [c for c in execution.get('conditions', []) if c.get('type') == 'Completed']
                          blocked.append({'job':name,
                                          'execution':execution.get('name', '').rsplit('/', 1)[-1],
                                          'running_count':execution.get('runningCount', 0),
                                          'completed_state':conditions[0].get('state') if conditions else None})
                  token = page.get('nextPageToken')
                  if not token:
                      page_path = None
                  elif token in seen:
                      truncated = True
                      break
                  else:
                      seen.add(token)
                      page_path = f"{r.ROOT}/jobs/{name}/executions?pageSize=100&pageToken={quote(token, safe='')}"
              if page_path:
                  truncated = True
          out['execution_diagnostics'] = {'examined':examined,
                 'nonterminal_count':len(blocked),'nonterminal_examples':blocked[:10],
                 'truncated':truncated}
          print(json.dumps(out, sort_keys=True))
          PY
      - name: Read bounded GCS operation and object inventory baseline
        run: |
          python scripts/gcp/iceberg-gcs-ops-audit.py || echo 'GCS audit returned unknown/partial/blocked; no write was performed.'
      - name: Diagnose exact failed audit execution without replay or raw logs
        run: |
          python - <<'PY'
          import json, re, sys
          sys.path.insert(0, 'scripts/gcp')
          import ghcr_jobs_rollout as r
          def diagnose(start, end):
              selector = ('resource.type="cloud_run_job" AND resource.labels.job_name="janus-ingestion-core" '
                          f'AND timestamp>="{start}" AND timestamp<="{end}"')
              entries = json.loads(r.command(['gcloud','logging','read',selector,
                         '--project='+r.PROJECT,'--limit=500','--order=asc','--format=json']))
              names = sorted({e.get('labels',{}).get('run.googleapis.com/execution_name') for e in entries}
                             - {None, ''})
              page = r.cloud(r.ROOT+'/jobs/janus-ingestion-core/executions?pageSize=100')
              names = sorted(set(names) | {e['name'].rsplit('/',1)[-1] for e in page.get('executions',[]) if start <= e.get('createTime','') <= end})
              known = ('PermissionDenied','Forbidden','AccessDenied','BadRequest','NotFound','ValueError',
                       'RuntimeError','KeyError','TypeError','MemoryError','ArrowInvalid',
                       'CommitFailedException','AuthorizationPermissionMismatch','ModuleNotFoundError','SyntaxError',
                       'UndefinedColumn','InsufficientPrivilege','AttributeError','OperationalError','403','404')
              signatures = sorted({kind for e in entries for kind in known
                                   if kind.lower() in json.dumps(e).lower()})
              receipts = []
              reference_receipts = []
              failures = []
              for e in entries:
                  data = e.get('jsonPayload')
                  if not isinstance(data,dict):
                      try: data = json.loads(e.get('textPayload',''))
                      except (ValueError,TypeError): continue
                  if isinstance(data,dict) and data.get('component') == 'iceberg-audit-only-cleanup':
                      receipts.append({k:data.get(k) for k in ('component','mode','status','deleted_objects',
                        'expired_snapshots','canonical_tables_modified','core_execution_manifests_deleted')})
                  if isinstance(data,dict) and data.get('component') == 'iceberg-maintenance' and data.get('status') == 'failed':
                      code = str(data.get('error_code',''))
                      location = str(data.get('error_location',''))
                      if re.fullmatch(r'[A-Z_]{3,80}',code) and re.fullmatch(r'[a-z_]+\.py:[0-9]+',location):
                          failures.append({'error_code':code,'error_location':location})
              from finops_reference_runtime import checked_result, PREFIX
              for entry in entries:
                  raw = entry.get('textPayload') or ''
                  if PREFIX in raw:
                      reference_receipts.append(checked_result(json.loads(raw.split(PREFIX,1)[1])))
              executions = []
              for name in names:
                  if not name.startswith('janus-ingestion-core-'): raise ValueError('execution_scope_invalid')
                  e = r.cloud(r.ROOT+'/jobs/janus-ingestion-core/executions/'+name)
                  executions.append({'name':name,'terminal':r.terminal(e),
                     'succeeded_count':e.get('succeededCount',0),'failed_count':e.get('failedCount',0),
                     'created_at':e.get('createTime'),'completed_at':e.get('completionTime'),
                     'conditions':[{'type':c.get('type'),'state':c.get('state'),'reason':c.get('reason'),'execution_reason':c.get('executionReason')} for c in e.get('conditions',[])],
                     'system_error_flags':[x for x in ('executable','not found','permission','timed out','memory','failed to start','image') if x in str(e.get('conditions',[])).lower()]})
              print(json.dumps({'component':'d06-prior-cleanup-diagnostic','read_only':True,
                'window_start':start,'window_end':end,'entries':len(entries),'possibly_truncated':len(entries)==500,'executions':executions,
                'http_error_codes':sorted(set(re.findall(r'HTTP Error ([0-9]{3})',json.dumps(entries)))),
                'permission_signatures':[x for x in ('storage.objects.get','storage.objects.delete','storage.objects.list','permission denied','timeout','memory limit') if x in json.dumps(entries).lower()],
                'known_error_signatures':signatures,'cleanup_receipts':receipts,'maintenance_failures':failures,'reference_receipts':reference_receipts,
                'actual_deletions':'UNKNOWN' if not receipts else 'SEE_RECEIPT'},sort_keys=True))
          diagnose('2026-10-15T05:40:30Z','2026-10-15T05:44:40Z')
          diagnose('2026-10-16T07:21:46Z','2026-10-16T07:30:00Z')
          PY
