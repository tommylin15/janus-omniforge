name: B2 IAM capability preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b2-iam-capability-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe existing IAM visibility only
        shell: bash
        run: |
          set +e
          echo "project_policy_read"
          gcloud projects get-iam-policy gen-lang-client-0593591102             --flatten='bindings[].members'             --filter='bindings.members:serviceAccount:janus-ci@gen-lang-client-0593591102.iam.gserviceaccount.com'             --format='table(bindings.role)' 2>&1
          echo "project_policy_rc=$?"
          echo "dataset_policy_read"
          bq get-iam-policy gen-lang-client-0593591102:janus_analytics_dev 2>&1
          echo "dataset_policy_rc=$?"
          exit 0
