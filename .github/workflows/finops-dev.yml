name: Janus FinOps operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        type: choice
        options:
          - gcs-hourly-io
          - gcs-storage-footprint
          - stage-retention-trace
          - stage48-api-live-readback
          - core-reference-audit
          - runtime-references
          - iceberg-readback
          - gcp-acceptance
          - ci-orphans
          - seq04-closeout
      dry-run:
        description: 'Dry run (no mutations)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'ops/finops-gcs-hourly-io.json'
      - 'ops/finops-gcs-storage-footprint.json'
      - 'ops/finops-stage-trace.json'
      - 'ops/stage48-api-live-readback.json'
      - 'ops/finops-core-reference-audit.json'
      - 'ops/finops-reference-runtime.json'
      - 'ops/finops-iceberg-readback-once.json'
      - 'ops/finops-gcp-live-acceptance.json'
      - 'ops/finops-ci-orphan-generations.json'
      - 'ops/seq04-live-closeout-request.json'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: janus-finops-${{ github.event.inputs.operation || 'push' }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.detect.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        run: |
          if [[ -n "${{ github.event.inputs.operation }}" ]]; then
            echo "operation=${{ github.event.inputs.operation }}" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD~1 HEAD -- ops/finops-*.json ops/stage48-api-live-readback.json 2>/dev/null || echo "")
            case "$changed" in
              *gcs-storage-footprint*) echo "operation=gcs-storage-footprint" >> "$GITHUB_OUTPUT" ;;
              *stage-trace*) echo "operation=stage-retention-trace" >> "$GITHUB_OUTPUT" ;;
              *stage48-api-live-readback*) echo "operation=stage48-api-live-readback" >> "$GITHUB_OUTPUT" ;;
              *gcs-hourly-io*) echo "operation=gcs-hourly-io" >> "$GITHUB_OUTPUT" ;;
              *core-reference-audit*) echo "operation=core-reference-audit" >> "$GITHUB_OUTPUT" ;;
              *reference-runtime*) echo "operation=runtime-references" >> "$GITHUB_OUTPUT" ;;
              *iceberg-readback*) echo "operation=iceberg-readback" >> "$GITHUB_OUTPUT" ;;
              *gcp-live-acceptance*) echo "operation=gcp-acceptance" >> "$GITHUB_OUTPUT" ;;
              *ci-orphan*) echo "operation=ci-orphans" >> "$GITHUB_OUTPUT" ;;
              *seq04-live-closeout*) echo "operation=seq04-closeout" >> "$GITHUB_OUTPUT" ;;
              *) echo "operation=none" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  stage48-api-live-readback:
    needs: detect
    if: needs.detect.outputs.operation == 'stage48-api-live-readback'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: none
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Verify bounded read-only request and exact promotion receipt
        run: |
          jq -e '.intent=="stage48-read-only-api-traffic" and .no_gcp_mutation==true and
              .no_owner_mutation==true and .no_traffic_mutation==true and
              (.source_sha|test("^[0-9a-f]{40}$")) and (.promotion_run|test("^[0-9]+$"))' ops/stage48-api-live-readback.json >/dev/null
          mkdir -p /tmp/stage48-promotion-proof
          gh run download "$(jq -r '.promotion_run' ops/stage48-api-live-readback.json)" \
            -n ghcr-api-promotion-receipt -D /tmp/stage48-promotion-proof
          test -s /tmp/stage48-promotion-proof/ghcr-api-promote.json
      - name: Independently read 100% traffic, fixed digest, 200 health and Admin denial
        run: python scripts/gcp/stage48_api_live_readback.py

  stage-retention-trace:
    needs: detect
    if: needs.detect.outputs.operation == 'stage-retention-trace'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: none
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate read-only trace request
        run: |
          jq -e '.intent=="read-only-stage-retention-trace" and .no_gcp_mutation==true' ops/finops-stage-trace.json
      - name: Inspect Stage cleanup receipts and lifecycle metadata
        run: python scripts/gcp/finops_stage_trace.py

  gcs-hourly-io:
    needs: detect
    if: needs.detect.outputs.operation == 'gcs-hourly-io'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate request
        run: |
          python -m pytest -q tests/test_finops_gcs_hourly_io.py
          jq -e '.intent=="read-only-gcs-hourly-method-audit" and .no_gcp_mutation==true' ops/finops-gcs-hourly-io.json
      - name: Inspect GCS method counts
        run: python scripts/gcp/finops_gcs_hourly_io.py


  gcs-storage-footprint:
    needs: detect
    if: needs.detect.outputs.operation == 'gcs-storage-footprint'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate metadata-only request and tests
        run: |
          python -m pytest -q tests/test_finops_gcs_storage_footprint.py
          jq -e '.intent=="read-only-gcs-storage-footprint" and .no_gcp_mutation==true and .project=="gen-lang-client-0593591102"' ops/finops-gcs-storage-footprint.json
      - name: Read bounded bucket sizes and versions without payload access
        run: python scripts/gcp/finops_gcs_storage_footprint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-gcs-storage-footprint-readonly
          path: gcs-storage-footprint-report.json
          if-no-files-found: ignore
          retention-days: 14

  core-reference-audit:
    needs: detect
    if: needs.detect.outputs.operation == 'core-reference-audit'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate request
        run: |
          python -m pytest -q tests/test_finops_core_reference_audit.py
          jq -e '.intent=="read-only-core-reference-discovery" and .no_gcp_mutation==true' ops/finops-core-reference-audit.json
      - name: Read Core references
        env:
          FINOPS_REFERENCE_CANDIDATE_PATH: core-reference-candidates.json
        run: python scripts/gcp/finops_core_reference_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finops-core-reference-candidates
          path: core-reference-candidates.json
          if-no-files-found: ignore

  runtime-references:
    needs: detect
    if: needs.detect.outputs.operation == 'runtime-references'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate request
        run: python -m pytest -q tests/test_finops_reference_runtime.py
      - name: Read runtime references
        run: python scripts/gcp/finops_reference_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d06-runtime-references
          path: d06-runtime-references.json
          if-no-files-found: ignore
          retention-days: 14

  iceberg-readback:
    needs: detect
    if: needs.detect.outputs.operation == 'iceberg-readback'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: none
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate request
        run: |
          jq -e '.intent=="read-existing-iceberg-post-recovery" and .no_gcp_mutation==true' ops/finops-iceberg-readback-once.json
      - name: Inspect Jobs and Scheduler
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts/gcp')
          import ghcr_jobs_rollout as r
          s = r.scheduler()
          out = {'scheduler':{'name':r.SCHEDULER,'state':s.get('state'),'schedule':s.get('schedule')},'jobs':{},'read_only':True}
          for name, _ in r.JOB_COMPONENT:
              j = r.job(name)
              out['jobs'][name] = {'image':r.image(j),'configuration_hash':r.fingerprint(j)}
          try:
              r.fence()
              out['execution_fence'] = 'ALL_TERMINAL'
          except (ValueError, RuntimeError):
              out['execution_fence'] = 'BLOCKED_OR_ACTIVE'
          # Metadata-only diagnosis of the existing four Jobs, never an
          # execution dispatch, cancellation or Scheduler state mutation.
          out['execution_diagnostic'] = {}
          from urllib.parse import quote
          for name, _ in r.JOB_COMPONENT:
              path = f"{r.ROOT}/jobs/{name}/executions?pageSize=100"
              seen, pages, counts, samples = set(), 0, 0, []
              while path and pages < 15:
                  data = r.cloud(path)
                  pages += 1
                  for execution in data.get('executions', []):
                      if not r.terminal(execution):
                          counts += 1
                          if len(samples) < 10:
                              conditions = [c for c in execution.get('conditions', [])
                                            if c.get('type') == 'Completed']
                              samples.append({
                                  'execution': execution.get('name', '').rsplit('/', 1)[-1][:100],
                                  'created_utc': execution.get('createTime'),
                                  'running_count': execution.get('runningCount', 0),
                                  'reconciling': execution.get('reconciling', False),
                                  'completed_condition': conditions[0].get('state') if len(conditions) == 1 else 'MISSING_OR_AMBIGUOUS'
                              })
                  token = data.get('nextPageToken')
                  if token in seen:
                      raise RuntimeError('read_only_diagnostic_pagination_loop')
                  if token:
                      seen.add(token)
                  path = (f"{r.ROOT}/jobs/{name}/executions?pageSize=100&pageToken={quote(token, safe='')}"
                          if token else None)
              out['execution_diagnostic'][name] = {
                  'nonterminal_count_observed': counts,
                  'pagination_complete': path is None,
                  'pages': pages,
                  'sample': samples
              }
          print(json.dumps(out, sort_keys=True))
          PY

  gcp-acceptance:
    needs: detect
    if: needs.detect.outputs.operation == 'gcp-acceptance'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      id-token: write
    concurrency:
      group: janus-dev-runtime-writers
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: 'jobs/ingestion-core:.'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate request
        run: python -m pytest -q tests/test_finops_one_shot_maintenance.py tests/test_finops_unlinked_small_files.py tests/test_finops_ci_orphans.py
      - name: Execute maintenance
        run: python scripts/gcp/finops-one-shot-maintenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finops-unlinked-small-file-receipts
          path: |
            finops-unlinked-dispatch.json
            finops-unlinked-receipt.json
            finops-unlinked-generations.json
          if-no-files-found: ignore
          retention-days: 14

  ci-orphans:
    needs: detect
    if: needs.detect.outputs.operation == 'ci-orphans'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate request
        run: python -m pytest -q tests/test_finops_ci_orphans.py
      - name: Execute CI orphan cleanup
        run: python scripts/gcp/finops_ci_orphans.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finops-ci-orphan-receipts
          path: |
            finops-ci-orphan-receipt.json
          if-no-files-found: ignore
          retention-days: 14


  seq04-closeout:
    needs: detect
    if: needs.detect.outputs.operation == 'seq04-closeout'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 26
    concurrency:
      group: janus-dev-runtime-writers
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: 'jobs/ingestion-core:.'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: test
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate live request and affected bounded retention tests
        run: |
          python -m py_compile scripts/gcp/seq04_live_closeout.py
          python -m pytest -q tests/test_data_retention.py tests/test_private_ledger_backup_retention.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('ops/seq04-live-closeout-request.json').read_text())
          assert x == {
              'intent':'seq04-existing-dev-bounded-closeout',
              'project':'gen-lang-client-0593591102',
              'approved':True,
              'no_new_gcp_resources':True,
              'no_scheduler_changes':True,
              'no_owner_mutation':True,
              'stage_max_objects':6000,
              'stage_max_bytes':268435456,
              'private_daily_cap':3,
              'private_weekly_cap':1,
              'private_monthly_cap':1,
              'phase':x.get('phase'),
              'attempt':x.get('attempt'),
          }
          assert x['phase'] in ('readback','stage','private','all')
          assert isinstance(x['attempt'],int) and 1 <= x['attempt'] <= 4
          PY
      - name: Refuse mutation while release lease requires recovery
        run: |
          python scripts/gcp/ghcr_release_lease.py inspect > /tmp/seq04-release-lease.json
          jq -e '.status == "ABSENT"' /tmp/seq04-release-lease.json >/dev/null
      - name: Existing dev bounded Stage and Private closeout
        run: python scripts/gcp/seq04_live_closeout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq04-bounded-closeout-receipt
          path: seq04-closeout-live-receipt.json
          if-no-files-found: ignore
          retention-days: 14
