name: Probe MOPS source

on:
  push:
    branches:
      - main
    paths:
      - 'ops/mops-source-probe.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe MOPS OpenAPI metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import sys
          import time
          from datetime import date
          from urllib.request import Request, urlopen

          def parse_date(value):
              text = str(value).strip().replace("/", "-")
              if text.isdigit() and len(text) == 8:
                  return date(int(text[:4]), int(text[4:6]), int(text[6:]))
              if text.isdigit() and len(text) == 7:
                  return date(int(text[:3]) + 1911, int(text[3:5]), int(text[5:]))
              if len(text) == 9 and text.count("-") == 2:
                  year, month, day = text.split("-")
                  text = f"{int(year) + 1911:04d}-{int(month):02d}-{int(day):02d}"
              return date.fromisoformat(text)

          url = "https://openapi.twse.com.tw/v1/opendata/t187ap06_L_ci"
          started = time.monotonic()
          try:
              request = Request(url, headers={
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
                  "User-Agent": "Mozilla/5.0 (compatible; JanusAI-Upstream-Probe/1.0)",
              })
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
                  status = response.status
                  content_type = response.headers.get_content_type()
              document = json.loads(payload)
              rows = document if isinstance(document, list) else document.get("data", document.get("rows", []))
              invalid_identity = 0
              missing_identity = 0
              contains_2330 = False
              for row in rows:
                  if not isinstance(row, dict):
                      invalid_identity += 1
                      continue
                  symbol = str(row.get("公司代號", row.get("symbol", ""))).strip()
                  contains_2330 = contains_2330 or symbol == "2330"
                  if not symbol or row.get("出表日期") in {None, ""} or row.get("年度") in {None, ""} or row.get("季別") in {None, ""}:
                      missing_identity += 1
                      continue
                  try:
                      parse_date(row["出表日期"])
                      int(str(row["年度"]))
                      int(str(row["季別"]))
                  except (TypeError, ValueError):
                      invalid_identity += 1
              print(json.dumps({
                  "status": "ok",
                  "http_status": status,
                  "content_type": content_type,
                  "rows": len(rows),
                  "contains_2330": contains_2330,
                  "missing_identity": missing_identity,
                  "invalid_identity": invalid_identity,
                  "elapsed_ms": round((time.monotonic() - started) * 1000),
              }, sort_keys=True))
          except Exception as error:
              print(json.dumps({
                  "status": "failed",
                  "error_code": type(error).__name__,
                  "elapsed_ms": round((time.monotonic() - started) * 1000),
              }, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          PY
