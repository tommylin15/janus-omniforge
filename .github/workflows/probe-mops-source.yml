name: Probe MOPS source

on:
  push:
    branches:
      - main
    paths:
      - 'ops/mops-source-probe.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONPATH: jobs/ingestion-core:.
    steps:
      - uses: actions/checkout@v4
      - name: Probe MOPS fetch normalization and local Stage path
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import tempfile
          import time
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          from ingestion_core.__main__ import _limit_response
          from ingestion_core.adapters import CollectionRequest
          from ingestion_core.first_batch import dataset_adapters, stage_raw_response
          from ingestion_core.stage import LocalObjectStore
          from packages.duckdb_query.iceberg import DuckDBIcebergCore

          url = "https://openapi.twse.com.tw/v1/opendata/t187ap06_L_ci"
          started = time.monotonic()
          request = Request(url, headers={
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
              "User-Agent": "Mozilla/5.0 (compatible; JanusAI-Upstream-Probe/1.0)",
          })
          with urlopen(request, timeout=30) as response:
              payload = response.read()
              http_status = response.status
              content_type = response.headers.get_content_type()

          clock = lambda: datetime.now(timezone.utc)
          adapter = dataset_adapters(transport=lambda _url: payload)["mops"]
          adapter.clock = clock
          target = date(2026, 9, 24)
          collection = CollectionRequest(
              execution_id="probe-mops-20260925",
              trace_id="probe-mops-20260925",
              source_id="mops",
              dataset_id="financials",
              market="TWSE",
              symbols=("2330",),
              window_start=target - timedelta(days=400),
              window_end=target,
              timeout_seconds=30,
          )
          source_response = _limit_response(adapter.fetch(collection), ("2330",))
          identifiers = DuckDBIcebergCore.IDENTIFIERS["financials"]
          missing_identifiers = sum(
              1 for row in source_response.rows
              if any(row.get(field) in {None, ""} for field in identifiers)
          )
          normalized = [
              DuckDBIcebergCore._normalise(dict(row), "probe-execution", "probe-provenance", "mops")
              for row in source_response.rows
          ]
          with tempfile.TemporaryDirectory() as directory:
              staged, _ = stage_raw_response(
                  source_response,
                  collection,
                  bucket="probe-stage",
                  store=LocalObjectStore(Path(directory)),
                  execution_scoped=True,
              )
              stage_files = len(tuple(Path(directory).rglob("*.*")))

          print(json.dumps({
              "status": "ok",
              "http_status": http_status,
              "content_type": content_type,
              "selected_rows": len(source_response.rows),
              "missing_identifiers": missing_identifiers,
              "normalized_rows": len(normalized),
              "has_availability_at": bool(normalized and normalized[0].get("availability_at")),
              "publication_time_authoritative": normalized[0].get("publication_time_authoritative") if normalized else None,
              "stage_reused": staged.reused,
              "stage_files": stage_files,
              "elapsed_ms": round((time.monotonic() - started) * 1000),
          }, sort_keys=True))
          if not source_response.rows or missing_identifiers or len(normalized) != len(source_response.rows):
              raise SystemExit(1)
          PY
