name: Janus GHCR Jobs fail-closed cutover gate

on:
  push:
    branches: [main]
    paths:
      - 'ops/ghcr-jobs-cutover-guard-request.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: janus-ghcr-jobs-guard
  cancel-in-progress: false

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe cutover guard and consolidated Scheduler contracts
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_ghcr_job_cutover_guard.py tests/test_private_pipeline_scheduler.py tests/test_ghcr_job_cutover_plan.py tests/test_ghcr_private_historical_fence.py tests/test_ghcr_execution_v2_readback.py tests/test_ghcr_stale_tasks_summary.py
  live-readback:
    needs: guard-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Capture sanitized live Scheduler, Job and GHCR evidence (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          request='ops/ghcr-jobs-cutover-guard-request.json'
          jq -e '.intent=="read-only-cutover-guard" and (.sha|test("^[0-9a-f]{40}$"))' "$request" >/dev/null
          source_sha="$(jq -r .sha "$request")"
          mkdir -p /tmp/ghcr-readback
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          : > /tmp/ghcr-readback/images.ndjson
          for component in ingestion-core intelligence-mart private-pipeline; do
            if skopeo inspect --no-creds \
               "docker://ghcr.io/tommylin15/janus-${component}:sha-${source_sha}" \
               > /tmp/ghcr-readback/manifest.json 2>/dev/null; then
              digest="$(jq -r '.Digest // ""' /tmp/ghcr-readback/manifest.json)"
              revision="$(jq -r '.Labels["org.opencontainers.image.revision"] // ""' /tmp/ghcr-readback/manifest.json)"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$revision" == "$source_sha" ]]; then
                jq -cn --arg c "$component" --arg d "$digest" --arg s "$source_sha" \
                  '{key:$c,value:{digest:$d,source_sha:$s,anonymous_pull_verified:true}}' \
                  >> /tmp/ghcr-readback/images.ndjson
              fi
            fi
          done

          if gcloud scheduler jobs list --project="$PROJECT" --location="$REGION" \
             --format=json > /tmp/ghcr-readback/schedulers.json 2>/dev/null; then
            echo true > /tmp/ghcr-readback/scheduler-readable
          else
            echo false > /tmp/ghcr-readback/scheduler-readable
            echo '[]' > /tmp/ghcr-readback/schedulers.json
          fi

          : > /tmp/ghcr-readback/jobs.ndjson
          for job in janus-batch-controller janus-ingestion-core janus-intelligence-mart \
                     janus-private-pipeline janus-research-big-move-500; do
            # Never export env vars or private resource attributes into the artifact.
            gcloud run jobs describe "$job" --project="$PROJECT" --region="$REGION" \
              --format=json > /tmp/ghcr-readback/job.json
            gcloud run jobs executions list --job="$job" --project="$PROJECT" \
              --region="$REGION" --limit=500 --format=json \
              > /tmp/ghcr-readback/executions.json
            # Only aggregate execution state, never output task logs or payloads.
            jq -cn --arg job "$job" \
              --slurpfile e /tmp/ghcr-readback/executions.json '{
                job:$job,
                scanned:($e[0]|length),
                possibly_active:([$e[0][] | select(
                  ((.status.completionTime // "") == "") and
                  (([.status.conditions[]? | select(.type=="Completed" and .status=="True")]|length)==0)
                )]|length),
                running_count_total:([$e[0][] | (.status.runningCount // 0)]|add // 0),
                with_completion_time:([$e[0][] | select((.status.completionTime // "") != "")]|length),
                with_completed_true:([$e[0][] | select(
                  [.status.conditions[]? | select(.type=="Completed" and .status=="True")] | length>0
                )]|length)
              }' >> /tmp/ghcr-readback/execution-summary.ndjson
            if [[ "$job" == "janus-private-pipeline" ]]; then
              jq '[
                .[] | select(
                  ((.status.completionTime // "") == "") and
                  (([.status.conditions[]? | select(.type=="Completed" and .status=="True")]|length)==0)
                ) | {
                  describe_status:"LIST_READABLE",
                  execution:(.metadata.name // .name // "" | split("/")[-1]),
                  created:(.metadata.creationTimestamp // .createTime // null),
                  started:(.status.startTime // null),
                  completed:(.status.completionTime // null),
                  runningCount:(.status.runningCount // 0),
                  succeededCount:(.status.succeededCount // 0),
                  failedCount:(.status.failedCount // 0),
                  cancelledCount:(.status.cancelledCount // 0),
                  conditions:[.status.conditions[]? | {type,status,reason}]
                }
              ][:20]' /tmp/ghcr-readback/executions.json > /tmp/ghcr-readback/ambiguous-private-executions.json
            fi
            rollback_ref="$(jq -r '.spec.template.spec.template.spec.containers[0].image // ""' /tmp/ghcr-readback/job.json)"
            rollback_readable=false
            if [[ "$rollback_ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              rollback_digest="${rollback_ref##*@}"
              if gcloud artifacts docker images describe "$rollback_ref" \
                 --project="$PROJECT" --format=json \
                 > /tmp/ghcr-readback/rollback-description.json 2>/dev/null; then
                if jq -e --arg d "$rollback_digest" \
                  '[.. | strings | select(contains($d))] | length > 0' \
                  /tmp/ghcr-readback/rollback-description.json >/dev/null; then
                  rollback_readable=true
                fi
              fi
            fi
            jq -cn --arg j "$job" --argjson rollback "$rollback_readable" \
              --slurpfile x /tmp/ghcr-readback/job.json \
              --slurpfile e /tmp/ghcr-readback/executions.json '{
                 key:$j,
                 value:{
                   image:($x[0].spec.template.spec.template.spec.containers[0].image // ""),
                   # AR digest existence is an independently checked rollback baseline,
                   # not proof of a successful runtime rollback rehearsal.
                   rollback_image_readable:$rollback,
                   execution_list_complete:($e[0]|length < 500),
                   potentially_active:([$e[0][] | select(
                     ((.status.completionTime // "") == "") and
                     (([.status.conditions[]? | select(.type=="Completed" and .status=="True")]|length)==0)
                   )]|length)
                 }
               }' >> /tmp/ghcr-readback/jobs.ndjson
          done

          # Cross-check only historical UNKNOWN private executions in THIS run.
          # Do not treat Completed=False/zero tasks alone as terminal. V2
          # Completed=CONDITION_FAILED is terminal reconciliation failure,
          # never evidence of successfully processed private data.
          jq -r '.[].execution' /tmp/ghcr-readback/ambiguous-private-executions.json \
            > /tmp/ghcr-readback/private-unknown-names.txt
          unknown_count="$(wc -l < /tmp/ghcr-readback/private-unknown-names.txt)"
          (( unknown_count <= 20 )) || {
            echo "BLOCKED: more than 20 unknown private executions" >&2
            exit 78
          }
          echo '{}' > /tmp/ghcr-readback/private-failure-proof.json
          if (( unknown_count > 0 )); then
            : > /tmp/ghcr-readback/private-task-states.ndjson
            while IFS= read -r execution; do
              [[ "$execution" =~ ^janus-private-pipeline-[a-z0-9-]+$ ]] || exit 78
              if timeout 40s gcloud run jobs executions tasks list \
                   --execution="$execution" --project="$PROJECT" --region="$REGION" \
                   --succeeded --limit=100 --format=json \
                   > /tmp/ghcr-readback/private-tasks.json 2>/dev/null; then
                # An incomplete or failed readback produces an explicitly
                # UNVERIFIABLE row; it will never authorize a Job image.
                python3 scripts/gcp/ghcr_stale_tasks_summary.py \
                  --execution "$execution" \
                  --tasks-json /tmp/ghcr-readback/private-tasks.json \
                  >> /tmp/ghcr-readback/private-task-states.ndjson || true
              else
                jq -nc --arg execution "$execution" \
                  '{execution:$execution,task_readback:"UNKNOWN_OR_BLOCKED",
                    tasks_scanned:null,tasks_started:null,tasks_completed:null,
                    terminal_confirmed:false}' \
                    >> /tmp/ghcr-readback/private-task-states.ndjson
              fi
            done < /tmp/ghcr-readback/private-unknown-names.txt
            python3 scripts/gcp/ghcr_execution_v2_readback.py \
              --executions-file /tmp/ghcr-readback/private-unknown-names.txt \
              > /tmp/ghcr-readback/private-v2.json || {
                echo "BLOCKED: v2 readback command could not complete." >&2
                exit 78
              }
            jq -e '.resource_writes==0 and .cancel_executions==false and
                   .authorize_job_promotion==false' \
              /tmp/ghcr-readback/private-v2.json >/dev/null
            jq -n --slurpfile v1 /tmp/ghcr-readback/ambiguous-private-executions.json \
              --slurpfile t /tmp/ghcr-readback/private-task-states.ndjson \
              --slurpfile v2 /tmp/ghcr-readback/private-v2.json \
              '{v1_records:$v1[0],task_records:$t,v2_readback:$v2[0]}' \
              > /tmp/ghcr-readback/private-failure-proof.json
          fi

          jq -n --arg project "$PROJECT" --arg region "$REGION" \
            --arg sha "$source_sha" \
            --slurpfile images /tmp/ghcr-readback/images.ndjson \
            --slurpfile sched /tmp/ghcr-readback/schedulers.json \
            --slurpfile snaps /tmp/ghcr-readback/jobs.ndjson \
            --slurpfile historical /tmp/ghcr-readback/private-failure-proof.json \
            --argjson full "$(cat /tmp/ghcr-readback/scheduler-readable)" '{
              project:$project,region:$region,source_sha:$sha,
              ghcr_images:($images|map({(.key):.value})|add // {}),
              scheduler:{
                full_region_enumeration:$full,
                jobs:[$sched[0][] | {
                  name:(.name|split("/")[-1]),
                  state,
                  schedule,
                  time_zone:(.timeZone // null),
                  target:(.httpTarget.uri // null),
                  identity:(.httpTarget.oauthToken.serviceAccountEmail // null),
                  retry_count:(.retryConfig.retryCount // 0)
                }]
              },
              job_snapshots:($snaps|map({(.key):.value})|add // {}),
              private_historical_failure_readback:($historical[0] // {}),
              # All three are NOT YET VERIFIED, never derived from the request.
              durable_deployment_mutex_verified:false,
              owner_oauth_and_data_acceptance_verified:false,
              rollback_procedure_verified:false
            }' > /tmp/ghcr-readback/evidence.json

          python3 scripts/gcp/ghcr_job_cutover_guard.py \
            --input /tmp/ghcr-readback/evidence.json \
            --output /tmp/ghcr-readback/report.json
          python3 scripts/gcp/ghcr_job_cutover_plan.py \
            --input /tmp/ghcr-readback/evidence.json \
            --output /tmp/ghcr-readback/plan.json
          # Only report summary counts; image-only plan is in sanitized artifact.
          jq '{status,change_count:(.updates|length),blockers,automatic_apply,resource_writes}' \
             /tmp/ghcr-readback/plan.json
          cat /tmp/ghcr-readback/report.json
          echo 'Historical pre-task failure classification is diagnostic only;'
          echo 'it is NOT successful processing and never bypasses Scheduler,'
          echo 'owner OAuth or actual rollback readiness.'
          echo 'Sanitized execution-state aggregates:'
          cat /tmp/ghcr-readback/execution-summary.ndjson
          if [[ -f /tmp/ghcr-readback/ambiguous-private-executions.json ]]; then
            echo 'Private Pipeline ambiguous terminal-state metadata (no payloads):'
            cat /tmp/ghcr-readback/ambiguous-private-executions.json
          fi
          {
            echo '## Janus GHCR Jobs — actual cutover gate'
            echo 'Live metadata readback only. No Scheduler, Cloud Run Job, GCS,'
            echo 'Artifact Registry, Cloud Build or service traffic changes.'
            echo '~~~json'
            cat /tmp/ghcr-readback/report.json
            echo '~~~'
            echo 'A green code-test step does NOT authorize promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r .status /tmp/ghcr-readback/report.json)" == "BLOCKED" ]]; then
            echo 'BLOCKED: genuine dev workload gates not met. No mutations performed.' >&2
            exit 78
          fi
      - name: Upload sanitized readiness report only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-ghcr-job-gate-summary
          path: |
            /tmp/ghcr-readback/report.json
            /tmp/ghcr-readback/plan.json
          if-no-files-found: ignore
          retention-days: 14
