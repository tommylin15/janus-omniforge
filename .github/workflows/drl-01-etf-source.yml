name: DRL-01 read-only official ETF source compatibility
on:
  push:
    branches: [main]
    paths: ['ops/drl-01-etf-source-request.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-dev-read-only-etf-diagnostic
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/gcp/drl01_etf_source_probe.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read existing official source on existing dev Job without writes
        env:
          PYTHONPATH: .
        run: python scripts/gcp/drl01_etf_source_probe.py ops/drl-01-etf-source-request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drl01-etf-source-compatibility
          path: /tmp/drl01-etf-source.json
          if-no-files-found: ignore
          retention-days: 7
