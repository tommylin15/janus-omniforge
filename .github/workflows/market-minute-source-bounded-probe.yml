name: Janus three-symbol public quote and baseline diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-minute-source-bounded-probe.yml'
permissions:
  contents: read
  id-token: write
jobs:
  read-public:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare active and 0-percent candidate public quote source and previous-close metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe janus-api --project=gen-lang-client-0593591102 --region=us-central1 --format=json > /tmp/janus-public-traffic.json
          python3 - <<'PY'
          import json,urllib.request,urllib.error,datetime,time
          from pathlib import Path
          svc=json.loads(Path('/tmp/janus-public-traffic.json').read_text())
          traffic=svc.get('status',{}).get('traffic') or []
          candidate=next((x.get('url') for x in traffic if x.get('tag')=='ghcr-775fdc5343a4'),None)
          active='https://janus-api-2oo7qbkd5q-uc.a.run.app'
          assert candidate and candidate.startswith('https://')
          def get(url):
              started=time.monotonic()
              req=urllib.request.Request(url,headers={'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=14) as res:
                      return res.status,json.loads(res.read(110000)),round(time.monotonic()-started,2)
              except urllib.error.HTTPError as error:
                  return error.code,{},round(time.monotonic()-started,2)
              except Exception as error:
                  return type(error).__name__,{},round(time.monotonic()-started,2)
          report={'scope':'public_three_symbols_one_request_each','statuses':{},'no_owner_information':True,'no_gcp_mutations':True}
          for label,base in (('candidate',candidate),('active',active)):
              report['statuses'][label]={}
              for symbol in ('2330','5876','3231'):
                  code,item,seconds=get(base+'/api/v1/public/stock-header/'+symbol)
                  report['statuses'][label][symbol]={'http':code,'seconds':seconds,
                      'session':item.get('session'),'refresh':item.get('refresh_status'),
                      'trade_date':item.get('trade_date'),'price_source':item.get('price_source'),
                      'quote_state':item.get('quote_state'),'has_reference':item.get('previous_close') is not None,
                      'has_change':item.get('change') is not None,'price_status':item.get('price_status')}
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
