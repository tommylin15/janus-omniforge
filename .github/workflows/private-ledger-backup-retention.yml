name: Janus independent Private ledger backup retention

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-ledger-backup-retention.yml'
      - 'ops/private-ledger-backup-retention-request.json'
  workflow_dispatch:
  # Activate only after real GCS dry-run evidence and approved seven-daily/six-monthly policy.
  # schedule:
  #   - cron: '30 5 * * *'   # 13:30 Asia/Taipei, safely after the 02:30 backup due slot.

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-ledger-daily-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline deletion boundary and policy tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_private_ledger_backup_retention.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Existing Private backup GCS metadata inventory
        env:
          # Scheduled apply remains disabled until the real dry-run is accepted.
          JANUS_BACKUP_RETENTION_SCHEDULED_APPLY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/gcp/private_ledger_backup_retention.py --mode apply
          else
            python scripts/gcp/private_ledger_backup_retention.py --mode dry-run
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-private-backup-retention
          path: private-ledger-backup-retention-receipt.json
          if-no-files-found: ignore
          retention-days: 14
