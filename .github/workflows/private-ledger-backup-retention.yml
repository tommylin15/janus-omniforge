name: Janus independent Private ledger backup retention

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-ledger-backup-retention.yml'
      - 'ops/private-ledger-backup-retention-request.json'
      - 'ops/private-ledger-backup-retention-apply-request.json'
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'   # 13:30 Asia/Taipei; independently approved apply.
    - cron: '15,25,35 7 24 10 *' # 2026-10-24 15:15/25/35 Taipei; diagnostic only, no GCP.

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: private-ledger-daily-retention
  cancel-in-progress: false

jobs:
  scheduler-trigger-probe:
    if: github.event_name == 'schedule' && github.event.schedule == '15,25,35 7 24 10 *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Prove GitHub schedule registration without GCP credentials
        run: |
          echo 'P0-1 scheduler probe only; GCP calls=0; backup writes=0; deletions=0'
          echo 'Normal 13:30 retention apply remains a different cron and job.'
  retention:
    if: github.event_name != 'schedule' || github.event.schedule == '30 5 * * *'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline deletion boundary and policy tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_private_ledger_backup_retention.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify pinned real dry-run and isolated restore for one-time apply
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mode=dry-run
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 5 * * *" ]]; then
            mode=apply
          elif [[ "${{ github.event_name }}" == "push" ]] &&
               git diff --name-only HEAD~1 HEAD | grep -Fxq 'ops/private-ledger-backup-retention-apply-request.json'; then
            jq -e '.intent=="private-ledger-retention-one-time-apply" and .approved==true
              and .scope=="existing-dev-private-backup-prefixes" and .dry_run_run==39974251644
              and .restore_run==38991644822 and .max_daily_deletes==3
              and .max_monthly_deletes==1 and .no_new_backup==true
              and .no_pg_mutation==true and .no_iam_expansion==true' \
              ops/private-ledger-backup-retention-apply-request.json >/dev/null
            gh run view 39974251644 --json headSha,status,conclusion,workflowName | \
              jq -e '.headSha=="c064cff362f0b7fc488403f622d3cb3c955b078d"
                and .status=="completed" and .conclusion=="success"
                and .workflowName=="Janus independent Private ledger backup retention"' >/dev/null
            gh run view 38991644822 --json status,conclusion,workflowName | \
              jq -e '.status=="completed" and .conclusion=="success"
                and .workflowName=="Janus controller backup executor and guarded handoff"' >/dev/null
            mode=apply
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
      - name: Existing Private backup GCS metadata inventory and bounded retention
        env:
          JANUS_BACKUP_RETENTION_SCHEDULED_APPLY: ${{ steps.gate.outputs.mode == 'apply' && 'true' || 'false' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/gcp/private_ledger_backup_retention.py --mode "${{ steps.gate.outputs.mode }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-private-backup-retention
          path: private-ledger-backup-retention-receipt.json
          if-no-files-found: ignore
          retention-days: 14
