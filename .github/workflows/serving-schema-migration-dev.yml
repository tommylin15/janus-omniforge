name: Apply dev serving schema migration

on:
  workflow_call:
    inputs:
      migration:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      migration:
        description: Allow-listed serving schema migration
        required: true
        type: choice
        options:
          - 041_operational_position_projection
          - 042_stock_serving_projection
          - 043_admin_batch_read
          - 044_quotes_broker_profile
          - 045_private_pipeline_operations
          - 046_twse_only_latest_price
          - 047_latest_price_route_v2
          - 048_private_recalculation_queue
          - 049_batch_occurrence_skipped_status
          - 050_holdings_previous_close_read
          - 051_analysis_product
          - 052_ceo_daily_quota_50
          - 054_market_serving
          - 055_full_market_universe
          - 056_controller_ledger_backup
          - 057_home_market_snapshot
          - 058_official_held_etf_identity
          - 059_ledger_automatic_charges
          - 060_official_held_bond_etf_identity
          - 061_tpex_official_eod_daily
          - 062_owner_cash_balance_snapshots
          - 063_stock_valuation_five_year
          - 064_usage_analytics
          - 067_mis_otc_previous_close_instrument_kind
  push:
    branches: [main]
    paths:
      - 'ops/serving-schema-migration'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-ingestion-operation
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve allow-listed migration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n '${{ inputs.migration }}' ]]; then
            MIGRATION='${{ inputs.migration }}'
          elif [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            MIGRATION="$(tr -d '[:space:]' < ops/serving-schema-migration)"
          else
            MIGRATION='${{ inputs.migration }}'
          fi
          case "${MIGRATION}" in
            041_operational_position_projection|042_stock_serving_projection|043_admin_batch_read|044_quotes_broker_profile|045_private_pipeline_operations|046_twse_only_latest_price|047_latest_price_route_v2|048_private_recalculation_queue|049_batch_occurrence_skipped_status|050_holdings_previous_close_read|051_analysis_product|052_ceo_daily_quota_50|054_market_serving|055_full_market_universe|056_controller_ledger_backup|057_home_market_snapshot|058_official_held_etf_identity|059_ledger_automatic_charges|060_official_held_bond_etf_identity|061_tpex_official_eod_daily|062_owner_cash_balance_snapshots|063_stock_valuation_five_year|064_usage_analytics|067_mis_otc_previous_close_instrument_kind) ;;
            *) echo "Unsupported serving schema migration: ${MIGRATION}" >&2; exit 2 ;;
          esac
          echo "MIGRATION=${MIGRATION}" >> "${GITHUB_ENV}"
      - name: Test fixed official ETF migration before any dev data changes
        if: env.MIGRATION == '058_official_held_etf_identity' || env.MIGRATION == '060_official_held_bond_etf_identity'
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_official_etf_identity_migration.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply migration through existing ingestion runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          project='gen-lang-client-0593591102'
          region='us-central1'
          job='janus-ingestion-core'
          executions="$(gcloud run jobs executions list --job="${job}" --project="${project}" --region="${region}" --limit=20 --format=json)"
          if [[ "$(jq '[.[] | select(.status.completionTime == null)] | length' <<< "${executions}")" != '0' ]]; then
            echo 'An ingestion execution is still running; retry migration after it completes.' >&2
            exit 1
          fi

          if [[ "${MIGRATION}" == '051_analysis_product' || "${MIGRATION}" == '052_ceo_daily_quota_50' || "${MIGRATION}" == '054_market_serving' || "${MIGRATION}" == '055_full_market_universe' || "${MIGRATION}" == '056_controller_ledger_backup' || "${MIGRATION}" == '057_home_market_snapshot' || "${MIGRATION}" == '058_official_held_etf_identity' || "${MIGRATION}" == '059_ledger_automatic_charges' || "${MIGRATION}" == '060_official_held_bond_etf_identity' || "${MIGRATION}" == '061_tpex_official_eod_daily' || "${MIGRATION}" == '062_owner_cash_balance_snapshots' || "${MIGRATION}" == '063_stock_valuation_five_year' || "${MIGRATION}" == '064_usage_analytics' || "${MIGRATION}" == '067_mis_otc_previous_close_instrument_kind' ]]; then
            python scripts/gcp/analysis_schema_bootstrap.py --migration "${MIGRATION}" --receipt /tmp/analysis-schema-bootstrap.json
            exit 0
          fi

          execution="$(gcloud run jobs execute "${job}" \
            --project="${project}" \
            --region="${region}" \
            --update-env-vars="JANUS_SERVING_SCHEMA_MIGRATION=${MIGRATION},ICEBERG_MAINTENANCE_MODE=,QUEUE_CONSUMER=false,MART_JOB=,JANUS_CONTROL_MIGRATION=,JANUS_DATA_SUPPLEMENT_MODE=" \
            --async --format='value(metadata.name)')"
          test -n "${execution}"
          execution_name="${execution##*/}"
          echo "migration=${MIGRATION}"
          echo "execution=${execution_name}"

          completed=''
          for _ in $(seq 1 180); do
            description="$(gcloud run jobs executions describe "${execution_name}" \
              --project="${project}" --region="${region}" --format=json)"
            completed="$(jq -r '.status.completionTime // empty' <<< "${description}")"
            if [[ -n "${completed}" ]]; then
              break
            fi
            sleep 5
          done
          test -n "${completed}"

          evidence=''
          entries='[]'
          for attempt in $(seq 1 12); do
            entries="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${job}\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution_name}\"" \
              --project="${project}" --freshness=20m --limit=200 --order=asc --format=json)"
            evidence="$(jq -c --arg migration "${MIGRATION}" \
              '[.[] | .jsonPayload? | select(.component == "ingestion-core" and .operation == "serving_schema_migration" and .migration == $migration)] | last // empty' \
              <<< "${entries}")"
            if [[ -z "${evidence}" ]]; then
              evidence="$(jq -c --arg migration "${MIGRATION}" \
                '[.[] | .textPayload? | select(type == "string") | (try fromjson catch empty) | select(.component == "ingestion-core" and .operation == "serving_schema_migration" and .migration == $migration)] | last // empty' \
                <<< "${entries}")"
            fi
            if [[ -n "${evidence}" ]]; then break; fi
            if [[ "${attempt}" != '12' ]]; then sleep 5; fi
          done
          if [[ -z "${evidence}" ]]; then
            echo 'Serving migration evidence not found.' >&2
            exit 1
          fi
          echo "migration_evidence=${evidence}"
          test "$(jq -r '.status' <<< "${evidence}")" = 'succeeded'
