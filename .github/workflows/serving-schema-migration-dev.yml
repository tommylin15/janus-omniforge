name: Apply dev serving schema migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: Allow-listed serving schema migration
        required: true
        type: choice
        options:
          - 041_operational_position_projection
          - 042_stock_serving_projection
  push:
    branches: [main]
    paths:
      - 'ops/serving-schema-migration'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-ingestion-operation
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve allow-listed migration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            MIGRATION="$(tr -d '[:space:]' < ops/serving-schema-migration)"
          else
            MIGRATION='${{ inputs.migration }}'
          fi
          case "${MIGRATION}" in
            041_operational_position_projection|042_stock_serving_projection) ;;
            *) echo "Unsupported serving schema migration: ${MIGRATION}" >&2; exit 2 ;;
          esac
          echo "MIGRATION=${MIGRATION}" >> "${GITHUB_ENV}"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply migration through existing ingestion runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          executions="$(gcloud run jobs executions list \
            --job=janus-ingestion-core \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --limit=20 --format=json)"
          if [[ "$(jq '[.[] | select(.status.completionTime == null)] | length' <<< "${executions}")" != '0' ]]; then
            echo 'An ingestion execution is still running; retry migration after it completes.' >&2
            exit 1
          fi
          execution="$(gcloud run jobs execute janus-ingestion-core \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --update-env-vars="JANUS_SERVING_SCHEMA_MIGRATION=${MIGRATION},ICEBERG_MAINTENANCE_MODE=,QUEUE_CONSUMER=false,MART_JOB=,JANUS_CONTROL_MIGRATION=,JANUS_DATA_SUPPLEMENT_MODE=" \
            --wait --format='value(metadata.name)')"
          test -n "${execution}"
          execution_name="${execution##*/}"
          echo "migration=${MIGRATION}"
          echo "execution=${execution_name}"
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"janus-ingestion-core\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution_name}\"" \
            --project=gen-lang-client-0593591102 \
            --freshness=20m \
            --limit=100 \
            --order=asc \
            --format='value(textPayload)'
