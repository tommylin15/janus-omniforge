name: SEQ05 one-off bounded research quickfill
on:
  push:
    branches: [main]
    paths: ['ops/seq05-oneoff-quickfill.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  single-dev-patch:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check bounded source and scope before mutating any Core
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/gcp/seq05_oneoff_core.py scripts/gcp/seq05_quickfill_dispatch.py
          python -m pip -q install pytest
          python -m pytest -q tests/test_seq05_oneoff_quickfill.py
      - name: One-time existing dev ingestion Job execution override
        env:
          PYTHONPATH: scripts/gcp
        run: python scripts/gcp/seq05_quickfill_dispatch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq05-oneoff-quickfill-receipt
          path: /tmp/seq05-oneoff-quickfill-receipt.json
          retention-days: 14
          if-no-files-found: ignore
