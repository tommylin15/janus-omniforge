name: One-shot read-only GCP controller activation verification
on:
  push:
    branches: [main]
    paths: [ops/finops-controller-mode-request.json]
permissions:
  contents: read
  id-token: write
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify existing project and read-only operation
        run: jq -e '.intent=="existing-controller-mode-readback" and .no_gcp_mutation==true' ops/finops-controller-mode-request.json
      - name: Inspect only controller mode and ingestion retention fence presence
        run: |
          set -Eeuo pipefail
          for name in janus-batch-controller janus-ingestion-core; do
            gcloud run jobs describe "$name" --project=gen-lang-client-0593591102 --region=us-central1 --format=json | python scripts/gcp/finops-runtime-readback.py
          done
