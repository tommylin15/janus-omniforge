name: Exact-SHA CEO worker image after full release tests
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful full GHCR release run on this exact main SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require full release tests for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > /tmp/release.json
          jq -e --arg sha "$GITHUB_SHA" '.head_sha==$sha and .conclusion=="success" and .path==".github/workflows/ghcr-publish-dev.yml"' /tmp/release.json >/dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dedicated Codex runtime in the existing public package
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --push \
            --target mart-ceo-provider -f jobs/intelligence-mart/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "ghcr.io/tommylin15/janus-intelligence-mart:sha-$GITHUB_SHA-ceo" .
      - name: Anonymous immutable digest gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-intelligence-mart:sha-$GITHUB_SHA-ceo" > /tmp/ceo-image.json
          jq -e '.Digest|test("^sha256:[0-9a-f]{64}$")' /tmp/ceo-image.json >/dev/null
          echo "Dedicated CEO image only; no GCP resource or traffic change." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ceo-worker-digest
          path: /tmp/ceo-image.json
          retention-days: 14
