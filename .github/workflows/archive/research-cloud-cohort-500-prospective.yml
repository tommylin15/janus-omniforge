name: Research cloud cohort 500 prospective registry

on:
  push:
    branches:
      - main
    paths:
      - 'research/cloud-cohort-500/PROSPECTIVE_REQUEST.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: research-cloud-cohort-500
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  RESEARCH_BUCKET: gen-lang-client-0593591102-dev-research-big-move-500
  RESEARCH_PREFIX: research/big-move-cloud-cohort-500
  RESEARCH_JOB: janus-research-big-move-500
  RESEARCH_SA_NAME: janus-research-big-move-500
  IMAGE_REPO: us-central1-docker.pkg.dev/gen-lang-client-0593591102/janusai-poc/research-cloud-cohort-500

jobs:
  prospective-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate frozen prospective request
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/cloud-cohort-500/PROSPECTIVE_REQUEST.json').read_text())
          assert p['action']=='materialize_prospective_registry'
          assert p['cohort_size']==500
          assert p['market']=='TWSE'
          assert p['security_type']=='common_equity'
          assert p['historical_cutoff_inclusive']=='2026-09-16'
          assert p['prospective_observation_start']=='2026-09-17'
          assert p['pv1_observation_end']=='2026-12-31'
          assert p['materialize_through']=='2026-09-30'
          assert p['primary_cohort_run_id']=='f7b91d3373bf6275493649fe8fbc5959f6e21e68'
          assert p['independent_cohort_run_id']=='8ab9048f5738d9db9b6ed25d9bed45e5c6a71d12-ind-cohort'
          assert p['source_gcs_object']
          assert len(p['source_sha256'])==64
          assert int(p['source_size_bytes'])>0
          assert p['database_allowed'] is False
          assert p['existing_janus_iceberg_allowed'] is False
          assert p['canonical_core_mart_writes_allowed'] is False
          assert p['outcome_evaluation_allowed'] is False
          assert p['event_label_materialization_allowed'] is False
          print('prospective request governance: PASS')
          PY

      - name: Verify existing research resources
        shell: bash
        run: |
          set -Eeuo pipefail
          sa_email="${RESEARCH_SA_NAME}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud iam service-accounts describe "${sa_email}" --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud storage buckets describe "gs://${RESEARCH_BUCKET}" --project="${GCP_PROJECT_ID}" >/dev/null
          echo "RESEARCH_SA_EMAIL=${sa_email}" >> "${GITHUB_ENV}"

      - name: Build research image with prospective registry runner
        shell: bash
        run: |
          set -Eeuo pipefail
          image_tag="${IMAGE_REPO}:prospective-${GITHUB_SHA}"
          build_id="$(gcloud builds submit research/cloud-cohort-500 --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --gcs-source-staging-dir="gs://${GCP_PROJECT_ID}-cloudbuild-regional/source" --tag="${image_tag}" --async --format='value(id)')"
          test -n "${build_id}"
          echo "research Cloud Build id=${build_id}"
          while true; do
            status="$(gcloud builds describe "${build_id}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status)')"
            case "${status}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "research Cloud Build failed: ${status}" >&2; exit 1 ;;
              QUEUED|PENDING|WORKING) sleep 5 ;;
              *) echo "unexpected Cloud Build status: ${status}" >&2; exit 1 ;;
            esac
          done
          digest="$(gcloud artifacts docker images describe "${image_tag}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "RESEARCH_IMAGE=${IMAGE_REPO}@${digest}" >> "${GITHUB_ENV}"

      - name: Upload immutable prospective request
        shell: bash
        run: |
          set -Eeuo pipefail
          request_object="${RESEARCH_PREFIX}/prospective/pv1/requests/${GITHUB_SHA}.json"
          gcloud storage cp research/cloud-cohort-500/PROSPECTIVE_REQUEST.json "gs://${RESEARCH_BUCKET}/${request_object}"
          echo "RESEARCH_REQUEST_OBJECT=${request_object}" >> "${GITHUB_ENV}"

      - name: Point existing research-only Cloud Run Job at prospective request
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs update "${RESEARCH_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${RESEARCH_IMAGE}" \
            --service-account="${RESEARCH_SA_EMAIL}" \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=30m --cpu=1 --memory=512Mi \
            --set-env-vars="RESEARCH_BUCKET=${RESEARCH_BUCKET},RESEARCH_PREFIX=${RESEARCH_PREFIX},RESEARCH_REQUEST_OBJECT=${RESEARCH_REQUEST_OBJECT},RESEARCH_RUN_ID=${GITHUB_SHA},RESEARCH_SERVICE_ACCOUNT=${RESEARCH_SA_EMAIL}" \
            --quiet

      - name: Execute prospective registry materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p research-result
          gcloud run jobs execute "${RESEARCH_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --wait --format=json > research-result/execution.json
          result_object="${RESEARCH_PREFIX}/executions/${GITHUB_SHA}/prospective_registry_result.json"
          gcloud storage cp "gs://${RESEARCH_BUCKET}/${result_object}" research-result/action_result.json
          gcloud run jobs describe "${RESEARCH_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json > research-result/job_snapshot.json

      - name: Verify no-peeking registry acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research-result/action_result.json').read_text())
          assert p['status']=='ok'
          assert p['action']=='materialize_prospective_registry'
          assert p['pv1']['historical_cutoff_inclusive']=='2026-09-16'
          assert p['pv1']['observation_start']=='2026-09-17'
          assert p['pv1']['observation_end_frozen']=='2026-12-31'
          assert p['pv1']['materialized_through']=='2026-09-30'
          assert p['pv1']['realized_observation_dates']==['2026-09-17','2026-09-21','2026-09-29']
          assert p['panels']['primary_500']['size']==500
          assert p['panels']['independent_500']['size']==500
          assert p['panels']['stock_overlap']==0
          assert p['score']['bands']=={'S70':0.7,'S80':0.8,'S90':0.9}
          assert p['registry']['row_count']==3000
          assert p['registry']['expected_row_count']==3000
          assert p['registry']['late_materialization_count']==0
          assert p['registry']['outcome_fields_present'] is False
          assert p['ledger']['row_count']==3000
          assert p['ledger']['mfe60_populated_count']==0
          assert p['dq']['rows']==6
          assert p['dq']['all_panel_t_rows_equal_500'] is True
          assert p['dq']['duplicate_primary_key_count']==0
          assert p['dq']['conflicting_row_hash_count']==0
          for k,v in p['embargo'].items():
              assert v is False, (k,v)
          iso=p['isolation']
          for k in ['postgresql_used','database_used','existing_janus_iceberg_catalog_used','janus_core_written','janus_mart_written','janus_private_mart_written','runtime_secret_used']:
              assert iso[k] is False, (k,iso[k])
          print('prospective registry acceptance: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: research-cloud-cohort-500-prospective-${{ github.sha }}
          path: research-result/
          if-no-files-found: error
          retention-days: 30
