name: SEQ-04 Scheduler denied-update diagnosis (read-only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seq04-scheduler-denial-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Read exact Scheduler and bounded audit-log denial evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT=gen-lang-client-0593591102
          gcloud scheduler jobs describe janus-ingestion-daily \
            --project="$PROJECT" --location=us-central1 --format=json \
            > /tmp/seq04-scheduler-readback.json
          if gcloud logging read \
            'protoPayload.serviceName="cloudscheduler.googleapis.com" AND protoPayload.status.code=7 AND timestamp>="2026-10-25T03:00:00Z"' \
            --project="$PROJECT" --limit=40 --format=json \
            > /tmp/seq04-denials.json 2>/dev/null; then
            export SEQ04_LOG_RESULT=READABLE
          else
            export SEQ04_LOG_RESULT=BLOCKED
            printf '[]\n' > /tmp/seq04-denials.json
          fi
          python - <<'PY'
          import json, os, re
          job=json.load(open('/tmp/seq04-scheduler-readback.json'))
          entries=json.load(open('/tmp/seq04-denials.json'))
          results=[]
          for item in entries:
              payload=item.get('protoPayload') or {}
              auth=payload.get('authorizationInfo') or []
              denied=[{'permission':str(a.get('permission',''))[:90],
                       'granted':a.get('granted')}
                       for a in auth if a.get('granted') is False]
              results.append({
                  'time':item.get('timestamp'),
                  'method':str(payload.get('methodName',''))[:130],
                  'principal':str((payload.get('authenticationInfo') or {}).get('principalEmail',''))[:125],
                  'status_code':(payload.get('status') or {}).get('code'),
                  'status_permission_hints':sorted(set(re.findall(
                      r'(?:cloudscheduler\\.jobs\\.[A-Za-z]+|iam\\.serviceAccounts\\.[A-Za-z]+)',
                      str((payload.get('status') or {}).get('message','')))))[:8],
                  'error_reasons':[str(d.get('reason',''))[:75]
                      for d in (payload.get('status') or {}).get('details',[])
                      if isinstance(d,dict) and re.fullmatch(r'[A-Z_]{3,75}',str(d.get('reason','')))],
                  'denied_permissions':denied[:12]
              })
          oauth=(job.get('httpTarget') or {}).get('oauthToken') or {}
          oidc=(job.get('httpTarget') or {}).get('oidcToken') or {}
          print(json.dumps({'seq04_denial_diagnostic':{
              'audit_query':os.environ['SEQ04_LOG_RESULT'],
              'entry_count':len(entries),
              'most_recent_denials':results[:20],
              'scheduler_name':job.get('name'),
              'schedule':job.get('schedule'),
              'time_zone':job.get('timeZone'),
              'state':job.get('state'),
              'target_service_account':oauth.get('serviceAccountEmail') or oidc.get('serviceAccountEmail'),
              'gcp_writes':0,
          }},sort_keys=True))
          PY

      - name: Check effective CI Scheduler update and target actAs permissions (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          token=subprocess.check_output(
              ['gcloud','auth','print-access-token'], text=True).strip()
          project='gen-lang-client-0593591102'
          sa='janus-ingestion-scheduler@'+project+'.iam.gserviceaccount.com'
          checks={
              'scheduler_project_update':(
                  'https://cloudresourcemanager.googleapis.com/v3/projects/'+project+':testIamPermissions',
                  'cloudscheduler.jobs.update'),
              'target_service_account_act_as':(
                  'https://iam.googleapis.com/v1/projects/'+project+'/serviceAccounts/'+sa+':testIamPermissions',
                  'iam.serviceAccounts.actAs')
          }
          out={}
          for label,(url,permission) in checks.items():
              req=Request(url,
                          data=json.dumps({'permissions':[permission]}).encode('utf-8'),
                          method='POST',
                          headers={'Authorization':'Bearer '+token,
                                   'Content-Type':'application/json'})
              try:
                  with urlopen(req,timeout=30) as response:
                      result=json.load(response)
                  out[label]='GRANTED' if permission in result.get('permissions',[]) else 'NOT_GRANTED'
              except HTTPError as err:
                  out[label]='HTTP_'+str(err.code)
              except (OSError, ValueError):
                  out[label]='UNKNOWN'
          print(json.dumps({'seq04_effective_iam':out,'gcp_writes':0},
                           sort_keys=True))
          PY

      - name: Read back successful SEQ-04 single Scheduler after cutover
        env:
          PYTHONPATH: scripts/gcp
        run: |
          python - <<'PY'
          import hashlib,json
          from ghcr_jobs_rollout import cloud, ROOT, scheduler
          live=scheduler()
          target=live.get("httpTarget",{})
          h=hashlib.sha256(json.dumps(target,sort_keys=True).encode()).hexdigest()
          required="5b647622b2abbcecbbb1e74e0e9134ac60155d41a0f209115ceae0271aa4b3ea"
          ok=(live.get("name")=="projects/gen-lang-client-0593591102/locations/us-central1/jobs/janus-ingestion-daily"
              and live.get("schedule")=="30 */2 * * *"
              and live.get("timeZone")=="Asia/Taipei"
              and live.get("state")=="ENABLED" and h==required)
          runs=cloud(f"{ROOT}/jobs/janus-batch-controller/executions?pageSize=15")
          values=[]
          for e in runs.get("executions",[])[:15]:
              values.append({"execution":e.get("name","").rsplit("/",1)[-1],
                             "created":e.get("createTime"),
                             "started":e.get("startTime"),
                             "completed":e.get("completionTime"),
                             "terminal":any(c.get("type")=="Completed"
                                and c.get("state") in ("CONDITION_SUCCEEDED","CONDITION_FAILED")
                                for c in e.get("conditions",[]))})
          print(json.dumps({"seq04_postcutover_readback":{
              "scheduler_status":"PASS" if ok else "FAIL",
              "scheduler_name":live.get("name"),
              "schedule":live.get("schedule"),
              "time_zone":live.get("timeZone"),
              "state":live.get("state"),
              "target_hash_unchanged":h==required,
              "controller_recent_executions":values,
              "controller_executions_next_page":bool(runs.get("nextPageToken")),
              "natural_two_hour_tick":"NOT_VERIFIED_UNTIL_NEXT_SCHEDULED_TICK",
              "gcp_writes":0}},sort_keys=True))
          if not ok:
              raise SystemExit("seq04_scheduler_postcutover_readback_failed")
          PY
