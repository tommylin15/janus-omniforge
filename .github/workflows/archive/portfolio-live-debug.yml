name: Portfolio Live Migration Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-live-debug.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Describe bounded IAP bootstrap build
        run: gcloud builds describe c4b92126-c411-497f-b044-b7dd604d828d --project="${GCP_PROJECT_ID}"
      - name: Print bounded IAP bootstrap build logs
        run: gcloud builds log c4b92126-c411-497f-b044-b7dd604d828d --project="${GCP_PROJECT_ID}" || true
