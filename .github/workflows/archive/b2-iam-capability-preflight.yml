name: B2 IAM capability preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b2-iam-capability-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Record existing IAM visibility only
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def run(args):
              p=subprocess.run(args,capture_output=True,text=True)
              return {
                  "returncode":p.returncode,
                  "stdout":p.stdout.strip()[:12000],
                  "stderr":p.stderr.strip()[:4000],
              }

          project=run([
              "gcloud","projects","get-iam-policy","gen-lang-client-0593591102",
              "--flatten=bindings[].members",
              "--filter=bindings.members:serviceAccount:janus-ci@gen-lang-client-0593591102.iam.gserviceaccount.com",
              "--format=json(bindings.role,bindings.members)",
          ])
          dataset=run([
              "bq","get-iam-policy","gen-lang-client-0593591102:janus_analytics_dev"
          ])
          evidence={
              "status":"pass" if project["returncode"]==0 else "partial",
              "mutations_performed":False,
              "project_policy_read":project,
              "dataset_policy_read":dataset,
          }
          Path("doc/archive/group-b-b2-iam-capability-preflight-2026-10-07.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({"project_policy_rc":project["returncode"],"dataset_policy_rc":dataset["returncode"]}))
          PY
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/archive/group-b-b2-iam-capability-preflight-2026-10-07.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: record B2 IAM capability preflight [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
