name: SEQ-04 natural two-hour Scheduler receipt readback (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seq04-natural-tick-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Inspect Scheduler at 14:30 Taipei and corresponding Controller executions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          PROJECT = "gen-lang-client-0593591102"
          ZONE = "us-central1"
          EPOCH = "2026-10-25T06:30:00Z"  # 14:30 Taipei
          def gcloud(args):
              p = subprocess.run(["gcloud", *args], capture_output=True,
                                 text=True, check=True, timeout=90)
              return json.loads(p.stdout)
          scheduler = gcloud(["scheduler", "jobs", "describe", "janus-ingestion-daily",
                              "--project="+PROJECT, "--location="+ZONE, "--format=json"])
          runs = gcloud(["run", "jobs", "executions", "list",
                         "--project="+PROJECT, "--region="+ZONE,
                         "--job=janus-batch-controller",
                         "--limit=20", "--format=json"])
          if not isinstance(runs, list):
              raise SystemExit("controller_executions_wrong_shape")
          def normalized(t):
              if not t: return None
              try: return datetime.fromisoformat(t.replace("Z","+00:00"))
              except ValueError: return None
          boundary = normalized(EPOCH)
          def finished(x):
              for c in x.get("conditions", []):
                  if c.get("type") == "Completed":
                      return c.get("state") in ("CONDITION_SUCCEEDED","CONDITION_FAILED") or c.get("status") in ("True","False")
              return bool(x.get("completionTime"))
          recent = []
          for item in runs[:20]:
              when = normalized(item.get("createTime"))
              if when is None or when < boundary: continue
              recent.append({
                  "created_utc": item.get("createTime"),
                  "started_utc": item.get("startTime"),
                  "completed_utc": item.get("completionTime"),
                  "execution_suffix": item.get("name","").rsplit("/",1)[-1],
                  "terminal": finished(item),
                  "succeeded": any(c.get("type")=="Completed" and
                      (c.get("state")=="CONDITION_SUCCEEDED" or c.get("status")=="True")
                      for c in item.get("conditions", [])),
                  "failed": any(c.get("type")=="Completed" and
                      (c.get("state")=="CONDITION_FAILED" or c.get("status")=="False")
                      for c in item.get("conditions", [])),
              })
          # Logs are optional; a log query failure is reported, not hidden.
          try:
              logs = gcloud(["logging","read",
                  'resource.type="cloud_scheduler_job" AND '
                  'resource.labels.job_id="janus-ingestion-daily" AND '
                  'timestamp>="2026-10-25T06:28:00Z"',
                  "--project="+PROJECT, "--limit=30","--format=json"])
              log_access="PASS"
          except (subprocess.CalledProcessError,subprocess.TimeoutExpired):
              logs=[]
              log_access="BLOCKED"
          scheduler_logs=[]
          for e in logs:
              stamp=e.get("timestamp","")
              if stamp < "2026-10-25T06:28:00Z": continue
              meta=e.get("jsonPayload") or {}
              scheduler_logs.append({
                  "timestamp":stamp,
                  "severity":e.get("severity"),
                  "message_code":str(meta.get("status",meta.get("jobStatus","")))[:60],
                  "log_name":str(e.get("logName","")).rsplit("/",1)[-1][:90],
              })
          # Cross-check the Cloud Run REST v2 execution list as well as gcloud.
          # Never emit full payloads, headers, or scheduler target URLs.
          import sys, re
          sys.path.insert(0,"scripts/gcp")
          from ghcr_jobs_rollout import cloud, ROOT
          rest_state="PASS"
          rest_items=[]
          try:
              rest = cloud(f"{ROOT}/jobs/janus-batch-controller/executions?pageSize=25")
              for e in rest.get("executions",[])[:10]:
                  rest_items.append({
                      "create_utc":e.get("createTime"),
                      "start_utc":e.get("startTime"),
                      "completion_utc":e.get("completionTime"),
                      "completed_condition":[{
                          "state":v.get("state"),
                          "status":v.get("status")
                      } for v in e.get("conditions",[]) if v.get("type")=="Completed"][:1],
                  })
          except Exception:
              rest_state="BLOCKED_REST_LIST"
          log_details=[]
          for entry in logs[:12]:
              payload=entry.get("jsonPayload") or {}
              proto=entry.get("protoPayload") or {}
              # Capture only named/sanitized status fields, no text or URLs.
              raw_text=str(payload.get("debugInfo",""))+" "+str(payload.get("status",""))
              http_codes=re.findall(r"(?:HTTP|http|code|response)[^0-9]{0,30}([1-5][0-9]{2})",raw_text)[:3]
              log_details.append({
                  "timestamp":entry.get("timestamp"),
                  "severity":entry.get("severity"),
                  "json_keys":sorted(payload.keys())[:20],
                  "proto_keys":sorted(proto.keys())[:12],
                  "text_payload_present":bool(entry.get("textPayload")),
                  "event_status":str(payload.get("status",""))[:60],
                  "http_codes":http_codes,
                  "message_code":str(payload.get("messageCode",""))[:90],
              })
          try:
              runlogs=gcloud(["logging","read",
                  'resource.type="cloud_run_job" AND '
                  'resource.labels.job_name="janus-batch-controller" AND '
                  'timestamp>="2026-10-25T06:29:00Z"',
                  "--project="+PROJECT, "--limit=12", "--format=json"])
              runlog_check="PASS"
          except Exception:
              runlogs=[]
              runlog_check="BLOCKED"
          controller_logs=[
              {"timestamp":e.get("timestamp"),"severity":e.get("severity")}
              for e in runlogs[:12]]
          report={
              "component":"seq04_natural_tick_readonly",
              "observed_utc":datetime.now(timezone.utc).isoformat(),
              "expected_tick_utc":EPOCH,
              "scheduler":{
                "schedule":scheduler.get("schedule"),
                "time_zone":scheduler.get("timeZone"),
                "state":scheduler.get("state"),
                "last_attempt_utc":scheduler.get("lastAttemptTime"),
                "status_code":(scheduler.get("status") or {}).get("code")
              },
              "controller_new_executions":recent,
              "scheduler_logs_status":log_access,
              "scheduler_logs":scheduler_logs[:12],
              "scheduler_log_fields":log_details,
              "rest_executions_status":rest_state,
              "rest_recent_executions":rest_items,
              "controller_cloud_logging_status":runlog_check,
              "controller_cloud_logs":controller_logs,
              "ingestion_natural_2026_10_26_0230":"NOT_DUE_YET",
              "gcp_writes":0,"job_dispatches":0
          }
          print("SEQ04_RECEIPT="+json.dumps(report,sort_keys=True))
          if (scheduler.get("schedule") != "30 */2 * * *"
              or scheduler.get("timeZone") != "Asia/Taipei"
              or scheduler.get("state") != "ENABLED"):
              raise SystemExit("scheduler_configuration_drift")
          PY
