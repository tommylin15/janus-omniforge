name: Bounded persisted specialist runtime acceptance on existing dev Mart
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full tested SHA of the deployed Mart and serving API
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install public image reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Verify serving API identity and acquire shared lease
        run: |
          set -Eeuo pipefail
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(curl -fsS --max-time 30 https://janus-api-2oo7qbkd5q-uc.a.run.app/app/build-id.txt)" = "$PRODUCT_SHA"
          python scripts/gcp/ghcr_release_lease.py acquire
      - name: Persist latest real Core baselines twice without LLM or scheduled Job changes
        run: |
          python scripts/gcp/ghcr_release_lease.py assert
          python - <<'PY'
          import json,os,re,sys,time
          sys.path.insert(0,'scripts/gcp')
          from ghcr_jobs_rollout import cloud,ROOT,terminal,fence,command
          from ceo_worker_deploy import execution_fence
          path=ROOT+'/jobs/janus-intelligence-mart'
          source=cloud(path)
          image=source['template']['template']['containers'][0]['image'].removeprefix('cache.us-docker.pkg.dev/')
          metadata=json.loads(command(['skopeo','inspect','--no-creds','docker://'+image]))
          assert metadata['Labels']['org.opencontainers.image.revision']==os.environ['PRODUCT_SHA']
          assert re.fullmatch(r'ghcr.io/tommylin15/janus-intelligence-mart@sha256:[0-9a-f]{64}',source['template']['template']['containers'][0]['image'].removeprefix('cache.us-docker.pkg.dev/'))
          assert not source.get('reconciling') and source['terminalCondition']['state']=='CONDITION_SUCCEEDED'
          container=source['template']['template']['containers'][0]
          assert container.get('command', []) in ([], ['python'])
          override={'args': (['python'] if not container.get('command') else []) + ['-m','intelligence_mart.__main__'], 'env':[{'name':'MART_OPERATION','value':'deep-coverage'},{'name':'MART_OOS_EVALUATION','value':'false'},{'name':'MART_AI_ENABLED','value':'false'}]}
          if container.get('name'):
              override['name']=container['name']
          results=[]
          for index in range(2):
              fence()
              execution_fence()
              operation=cloud(path+':run',{'etag':source['etag'],'overrides':{'taskCount':1,'timeout':'480s','containerOverrides':[override]}},'POST')
              name=operation.get('name','')
              assert name.startswith(ROOT+'/operations/')
              print(json.dumps({'operation':name,'status':'UNKNOWN','attempt':index+1}),flush=True)
              deadline=time.monotonic()+660
              while time.monotonic()<deadline:
                  current=cloud(name)
                  if current.get('done'):
                      assert not current.get('error'), 'execution failed; no automatic retry'
                      result=current.get('response',{})
                      execution=result.get('name','')
                      assert execution.startswith(path+'/executions/')
                      result=cloud(execution)
                      assert terminal(result) and result.get('succeededCount')==1 and not result.get('failedCount',0)
                      results.append(execution)
                      print(json.dumps({'execution':execution,'status':'PASS','operation':'deep-coverage','llm_api_tokens':0}),flush=True)
                      break
                  time.sleep(3)
              else:
                  raise RuntimeError('execution unknown; no automatic retry')
          assert len(results)==2
          PY
          python scripts/gcp/ghcr_release_lease.py release --safe-to-release
