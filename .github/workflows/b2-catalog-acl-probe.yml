name: B2 catalog ACL probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b2-catalog-acl-probe.yml'
      - 'scripts/gcp/cloudbuild-b2-catalog-acl-probe.yaml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prove catalog-scoped admin grant and revoke
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud builds submit --no-source \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --config=scripts/gcp/cloudbuild-b2-catalog-acl-probe.yaml \
            --quiet
          python3 - <<'PY'
          import json
          from pathlib import Path
          e={
            'catalog':'janus_core_dev',
            'scope':'catalog-only',
            'role':'roles/biglake.admin',
            'temporary_grant_revoke_cycle':True,
            'project_iam_mutated':False,
            'status':'pass',
          }
          Path('doc/archive/group-b-b2-catalog-acl-probe-2026-10-07.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/archive/group-b-b2-catalog-acl-probe-2026-10-07.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: record B2 catalog ACL probe [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
