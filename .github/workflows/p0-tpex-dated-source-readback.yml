name: Janus P0 dated TPEx 00697B official source read-only proof
on:
  push:
    branches: [main]
    paths: ['ops/p0-tpex-dated-source-readback.json']
permissions:
  contents: read
jobs:
  official-day:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact official day and no private/runtime mutation
        run: |
          jq -e '.intent=="official-one-day-read-only" and
            .symbol=="00697B" and .trade_date=="2026-10-14" and
            .no_gcp_mutation==true and .no_ledger_read==true and .no_data_write==true' \
             ops/p0-tpex-dated-source-readback.json >/dev/null
      - name: Compare official TPEx dated source formats, no prices or owner
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen
          from services.api.tpex_quotes import _official_day
          endpoints={
            'official_www_gregorian':'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?'+urlencode({'date':'2026/10/14','response':'json'}),
            'official_www_roc':'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?'+urlencode({'date':'115/10/14','response':'json'}),
            'official_legacy_no1430':'https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?'+urlencode({'l':'zh-tw','d':'115/10/14','se':'EW','o':'json'}),
          }
          for name,url in endpoints.items():
            result={'source':name,'scope':'official_date_2026-10-14_only','no_price_logged':True,'no_data_write':True}
            try:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; JanusResearch/1.0)','Accept':'application/json'}),timeout=20) as response:
                body=response.read(12_000_001)
                result['http_status']=response.status
              if len(body)>12_000_000:raise ValueError('payload_bound_exceeded')
              doc=json.loads(body.decode('utf-8-sig'))
              result['document_kind']=type(doc).__name__
              if isinstance(doc,dict):
                result['response_date']=str(doc.get('date',''))[:22]
                result['response_day']=str(_official_day(doc.get('date')))
                result['status']=str(doc.get('stat',''))[:22]
                result['document_keys']=sorted(doc)[:15]
                tables=doc.get('tables',[])
                if isinstance(tables,list):
                  result['tables']=len(tables)
                  matches=[]
                  count=0
                  for t in tables:
                    fields=t.get('fields',[])
                    for values in t.get('data',[]):
                      count+=1
                      if isinstance(values,list) and len(values)==len(fields):
                        row=dict(zip(fields,values))
                        if any(str(row.get(k,'')).strip()=='00697B' for k in ('代號','證券代號','股票代號')):
                          matches.append(row)
                  result['row_count']=count
                  result['matching_rows']=len(matches)
                  result['fields']=sorted(matches[0])[:25] if matches else []
              if isinstance(doc,list):
                result['row_count']=len(doc)
                matches=[x for x in doc if isinstance(x,dict) and any(str(x.get(k,'')).strip()=='00697B' for k in ('SecuritiesCompanyCode','Code','代號'))]
                result['matching_rows']=len(matches)
                result['match_day']=str(_official_day(matches[0].get('Date') or matches[0].get('資料日期'))) if matches else None
            except Exception as e:
              result['error_type']=type(e).__name__
            print(json.dumps(result,ensure_ascii=False,sort_keys=True),flush=True)
          from datetime import date
          from scripts.gcp.p0_tpex_asof_owner_acceptance import _read_exact_official
          official_record,digest=_read_exact_official(date(2026,10,14))
          assert official_record['Date']=='115/10/14' and len(digest)==64
          print(json.dumps({'source':'official_www_gregorian','exact_record_date':'2026-10-14',
            'symbol':'00697B','record_hash_valid':True,'no_price_logged':True,
            'no_data_write':True,'status':'PASS'},sort_keys=True))
          PY
