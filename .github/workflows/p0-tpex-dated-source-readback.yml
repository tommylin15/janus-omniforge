name: Janus P0 dated TPEx 00697B official source read-only proof
on:
  push:
    branches: [main]
    paths: ['ops/p0-tpex-dated-source-readback.json']
permissions:
  contents: read
jobs:
  official-day:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact official day and no private/runtime mutation
        run: |
          jq -e '.intent=="official-one-day-read-only" and
            .symbol=="00697B" and .trade_date=="2026-10-14" and
            .no_gcp_mutation==true and .no_ledger_read==true and .no_data_write==true' \
             ops/p0-tpex-dated-source-readback.json >/dev/null
      - name: Verify official dated 2026-10-14 source, without showing quote amount
        run: |
          python - <<'PY'
          from datetime import date
          import json
          from scripts.gcp.p0_tpex_asof_owner_acceptance import _read_exact_official
          try:
            row,digest=_read_exact_official(date(2026,10,14))
          except ValueError:
            from urllib.parse import urlencode
            from urllib.request import Request,urlopen
            from services.api.tpex_quotes import TPEX_OFFICIAL_DATED_URL,_official_day
            url=TPEX_OFFICIAL_DATED_URL+"?"+urlencode({'l':'zh-tw','o':'json','d':'115/10/14','s':'0'})
            with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; JanusResearch/1.0)','Accept':'application/json'}),timeout=20) as response:
              body=response.read(12_000_001)
            payload=json.loads(body.decode('utf-8-sig'))
            tables=payload.get('tables') or []
            match_count=0
            for table in tables:
              fields=table.get('fields',[])
              for values in table.get('data',[]):
                if isinstance(values,list) and len(values)==len(fields):
                  record=dict(zip(fields,values))
                  if str(record.get('代號','')).strip()=='00697B':
                    match_count+=1
            print(json.dumps({'scope':'read_only_official_response_metadata','response_date':str(payload.get('date'))[:25],
              'date_parsed':str(_official_day(payload.get('date'))),
              'status':str(payload.get('stat'))[:25],'document_keys':sorted(payload)[:12],
              'matched_symbol_rows':match_count,'no_price_values':True},sort_keys=True))
            raise
          assert row['SecuritiesCompanyCode']=='00697B' and row['Date']=='115/10/14'
          assert len(digest)==64
          print(json.dumps({'symbol':'00697B','date':'2026-10-14',
            'official_record_hash_valid':True,'source':'tpex_dated_official_json',
            'no_owner_read':True,'no_price_logged':True,'no_data_write':True,
            'status':'PASS'},sort_keys=True))
          PY
