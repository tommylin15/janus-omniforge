name: Portfolio Completeness Contract

on:
  push:
    branches:
      - main
    paths:
      - 'services/api/private_pipeline.py'
      - 'services/api/repository.py'
      - 'services/api/store.py'
      - 'services/api/models.py'
      - 'services/api/app.py'
      - 'tests/test_portfolio_completeness.py'
      - 'tests/test_portfolio_api_completeness.py'
      - '.github/workflows/portfolio-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.lock
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Run portfolio completeness contract tests
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
        run: python -m pytest -q tests/test_portfolio_completeness.py tests/test_portfolio_api_completeness.py
