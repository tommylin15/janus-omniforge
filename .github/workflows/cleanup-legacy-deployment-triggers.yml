name: Guard legacy deployment controller cleanup

on:
  push:
    branches:
      - main
    paths:
      - 'ops/cleanup-legacy-deployment-triggers.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Preflight and export rollback evidence
        if: ${{ fromJSON(hashFiles('ops/cleanup-legacy-deployment-triggers.json') != '') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          request='ops/cleanup-legacy-deployment-triggers.json'
          mode="$(jq -r '.mode' "${request}")"
          [[ "${mode}" == 'cleanup' || "${mode}" == 'verify' ]] || {
            echo "unsupported mode: ${mode}" >&2
            exit 2
          }

          mkdir -p trigger-backup
          printf '%s\n' "${mode}" > trigger-backup/mode.txt

          job_state() {
            local job="$1"
            local ready image
            ready="$(gcloud run jobs describe "${job}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(status.conditions[0].status)')"
            image="$(gcloud run jobs describe "${job}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(spec.template.spec.template.spec.containers[0].image)')"
            [[ "${ready}" == 'True' ]] || {
              echo "${job} is not Ready before controller mutation" >&2
              exit 2
            }
            [[ -n "${image}" ]] || {
              echo "${job} has no runtime image before controller mutation" >&2
              exit 2
            }
            printf '%s\t%s\n' "${job}" "${image}" >> trigger-backup/job-images-before.tsv
          }

          job_state janus-ingestion-core
          job_state janus-intelligence-mart

          if [[ "${mode}" == 'verify' ]]; then
            exit 0
          fi

          current="$(gcloud builds triggers list \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          jq -e '
            ([.[] | select(.name == "janus-ingestion-core" or .name == "janus-intelligence-mart")] | length) == 2 and
            (any(.[]; .id == "5e201f5a-c206-4006-92b9-40a53c4155ed" and .name == "janus-ingestion-core")) and
            (any(.[]; .id == "b8215cb9-1823-401d-b293-65fbdf73ce30" and .name == "janus-intelligence-mart"))
          ' <<<"${current}" >/dev/null || {
            echo 'legacy trigger set does not match the approved two-trigger cleanup target' >&2
            exit 2
          }

          export_trigger() {
            local id="$1" name="$2" dockerfile="$3" image_name="$4" runtime="$5"
            local payload
            payload="$(gcloud builds triggers describe "${id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
            jq -e \
              --arg id "${id}" \
              --arg name "${name}" \
              --arg dockerfile "${dockerfile}" \
              --arg image_name "${image_name}" \
              --arg runtime "${runtime}" '
                .id == $id and
                .name == $name and
                (.disabled // false) == false and
                .filename == "cloudbuild.yaml" and
                .substitutions._DEPLOY_TARGET == "job" and
                .substitutions._DOCKERFILE == $dockerfile and
                .substitutions._IMAGE_NAME == $image_name and
                .substitutions._IMAGE_TAG == "main" and
                .substitutions._RUNTIME_NAME == $runtime
              ' <<<"${payload}" >/dev/null || {
                echo "trigger identity/config guard failed for ${name}" >&2
                exit 2
              }
            printf '%s\n' "${payload}" > "trigger-backup/${name}.json"
          }

          export_trigger \
            5e201f5a-c206-4006-92b9-40a53c4155ed \
            janus-ingestion-core \
            jobs/ingestion-core/Dockerfile \
            ingestion-core \
            janus-ingestion-core
          export_trigger \
            b8215cb9-1823-401d-b293-65fbdf73ce30 \
            janus-intelligence-mart \
            jobs/intelligence-mart/Dockerfile \
            intelligence-mart \
            janus-intelligence-mart

          cp "${request}" trigger-backup/request.json
          echo 'Preflight guards passed; rollback trigger JSON has been exported.'

      - name: Upload rollback evidence
        if: ${{ success() && hashFiles('trigger-backup/janus-ingestion-core.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: legacy-deployment-trigger-backup-${{ github.sha }}
          path: trigger-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Delete approved legacy regional triggers
        shell: bash
        run: |
          set -Eeuo pipefail
          mode="$(jq -r '.mode' ops/cleanup-legacy-deployment-triggers.json)"
          if [[ "${mode}" != 'cleanup' ]]; then
            echo 'verify mode: no trigger mutation requested'
            exit 0
          fi
          [[ -s trigger-backup/janus-ingestion-core.json && -s trigger-backup/janus-intelligence-mart.json ]] || {
            echo 'rollback evidence is missing; refusing deletion' >&2
            exit 2
          }

          gcloud builds triggers delete 5e201f5a-c206-4006-92b9-40a53c4155ed \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet
          gcloud builds triggers delete b8215cb9-1823-401d-b293-65fbdf73ce30 \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet

      - name: Verify trigger absence and Job readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          mode="$(jq -r '.mode' ops/cleanup-legacy-deployment-triggers.json)"

          remaining="$(gcloud builds triggers list \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          jq -e '[.[] | select(.name == "janus-ingestion-core" or .name == "janus-intelligence-mart")] | length == 0' \
            <<<"${remaining}" >/dev/null || {
              echo 'one or more legacy deployment triggers still exist' >&2
              exit 2
            }

          for id in \
            5e201f5a-c206-4006-92b9-40a53c4155ed \
            b8215cb9-1823-401d-b293-65fbdf73ce30; do
            if gcloud builds triggers describe "${id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" >/dev/null 2>&1; then
              echo "legacy trigger ${id} still resolves after cleanup" >&2
              exit 2
            fi
          done

          verify_job() {
            local job="$1"
            local ready image before_image
            ready="$(gcloud run jobs describe "${job}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(status.conditions[0].status)')"
            image="$(gcloud run jobs describe "${job}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(spec.template.spec.template.spec.containers[0].image)')"
            [[ "${ready}" == 'True' ]] || {
              echo "${job} is not Ready after controller cleanup" >&2
              exit 2
            }
            if [[ "${mode}" == 'cleanup' ]]; then
              before_image="$(awk -F '\t' -v job="${job}" '$1 == job {print $2}' trigger-backup/job-images-before.tsv)"
              [[ -n "${before_image}" && "${image}" == "${before_image}" ]] || {
                echo "${job} image changed during trigger-only cleanup" >&2
                exit 2
              }
            fi
            echo "${job}: Ready=True image=${image}"
          }

          verify_job janus-ingestion-core
          verify_job janus-intelligence-mart
          echo 'Legacy regional deployment triggers are absent and both canonical Jobs are Ready.'
