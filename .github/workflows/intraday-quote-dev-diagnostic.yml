name: Janus intraday quote dev diagnostic
on:
  push:
    paths:
      - '.github/workflows/intraday-quote-dev-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read effective live service config without printing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          project=gen-lang-client-0593591102
          region=us-central1
          gcloud run services describe janus-api --project="$project" --region="$region" --format=json >/tmp/svc.json
          revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0) | .revisionName] | first // empty' /tmp/svc.json)"
          test -n "$revision"
          gcloud run revisions describe "$revision" --project="$project" --region="$region" --format=json > /tmp/rev.json
          echo "active_revision=$revision"
          jq -r '[.status.conditions[]? | select(.type == "Ready") | .status] | first // "unknown" | "ready=" + .' /tmp/svc.json
          jq -r '
            [.spec.containers[]?.env[]? | select(.name == "JANUS_MIS_QUOTES_ENABLED")
             | if (.value // "") == "true" then "true"
               elif (.value // "") == "false" then "false"
               elif (.valueFrom != null) then "secret_ref"
               else "unknown" end] | first // "missing"
             | "effective_mis_quotes_enabled=\(.)"
          ' /tmp/rev.json
          jq -r '
            [.spec.containers[]?.env[]? | select(.name == "JANUS_MIS_QUOTES_ENABLED")] | length
            | "effective_mis_env_count=\(.)"
          ' /tmp/rev.json
      - name: Count recent quote resolver errors if logging permission exists
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          gcloud logging read             'resource.type="cloud_run_revision" AND resource.labels.service_name="janus-api" AND timestamp>="2026-10-30T00:00:00Z" AND (textPayload:"quote refresh unavailable" OR jsonPayload.message:"quote refresh unavailable" OR textPayload:"latest price resolver unavailable")'             --project=gen-lang-client-0593591102 --limit=50 --format=json > /tmp/quote-errors.json
          jq -r 'length | "recent_quote_error_records=\(.)"' /tmp/quote-errors.json
          python - <<'PY'
          import collections
          import json
          import re
          rows = json.load(open('/tmp/quote-errors.json'))
          counts = collections.Counter()
          for row in rows:
              message = row.get('textPayload') or (row.get('jsonPayload') or {}).get('message') or ''
              found = re.search(r'quote refresh unavailable:\s*([A-Za-z_][A-Za-z0-9_]*)', str(message))
              if found:
                  counts[found.group(1)] += 1
          print('quote_error_classes=' + (','.join(f'{key}:{value}' for key, value in sorted(counts.items())) or 'unclassified'))
          PY
      - name: Read bounded recent 2-hour quote error diagnostics without owner data
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          since="2026-10-30T06:08:00Z"
          echo "quote_diagnostics_window=after_2026-10-30T06:08Z"
          filter="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"janus-api\" AND timestamp>=\"$since\" AND \"quote refresh\""
          gcloud logging read "$filter" --project=gen-lang-client-0593591102 --limit=50 --format=json >/tmp/quote-recent.json
          python - <<'PY'
          import json,re,collections
          arr=json.load(open('/tmp/quote-recent.json'))
          counts=collections.Counter()
          for row in arr:
              message=(row.get('textPayload') or (row.get('jsonPayload') or {}).get('message') or '')
              if 'quote refresh yielded no accepted rows' in message:
                  counts['no_accepted_rows']+=1
              if 'quote refresh unavailable' in message:
                  matched=re.search(r'quote refresh unavailable:\s*([A-Za-z_]+)',message)
                  counts['exception_'+(matched.group(1) if matched else 'unknown')]+=1
                  status=re.search(r'http_status=(\d{3})',message)
                  if status:
                      counts['http_'+status.group(1)]+=1
          print('last_2h_quote_diagnostics='+str(dict(sorted(counts.items()))))
          PY

      - name: Read Shioaji Proxy effective configuration and sanitized runtime classes
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          gcloud run services describe shioaji-quote-proxy \
            --project=gen-lang-client-0593591102 --region=asia-east1 \
            --format=json >/tmp/shioaji-service.json
          jq '{
            ready: ([.status.conditions[]? | select(.type=="Ready") | .status] | first),
            latest_ready: .status.latestReadyRevisionName,
            max_instances: (.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] // "unknown"),
            min_instances: (.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "unknown"),
            serving: [.status.traffic[]? | {revisionName, percent}]
          }' /tmp/shioaji-service.json
          if gcloud logging read \
              'resource.type="cloud_run_revision" AND (resource.labels.service_name="shioaji-quote-proxy" OR resource.labels.service_name="janus-api")' \
              --project=gen-lang-client-0593591102 --freshness=30m --limit=120 \
              --format=json >/tmp/quote-logs.json 2>/dev/null; then
            python3 - <<'PY'
          import json,collections
          rows=json.load(open('/tmp/quote-logs.json'))
          categories=collections.Counter()
          for item in rows:
              name=item.get('resource',{}).get('labels',{}).get('service_name','unknown')
              message=str(item.get('textPayload') or item.get('jsonPayload',{}).get('message') or '')
              if 'quote refresh unavailable' in message:
                categories[name+':quote_refresh_unavailable']+=1
                import re
                match=re.search(r'quote refresh unavailable:\s*([A-Za-z_][A-Za-z0-9_]*)',message)
                categories[name+':exception_'+(match.group(1) if match else 'unknown')]+=1
                status=re.search(r'http_status=(\d{3})',message)
                if status: categories[name+':http_status_'+status.group(1)]+=1
              if 'quote refresh yielded no accepted rows' in message: categories[name+':no_accepted_rows']+=1
              if 'Shioaji simulation login failed' in message: categories[name+':simulation_login_failed']+=1
              if 'Shioaji login successful' in message: categories[name+':shioaji_login_ok']+=1
              if 'Quote subscription unavailable' in message: categories[name+':subscribe_unavailable']+=1
              if 'TWSE MIS query failed' in message: categories[name+':mis_query_failed']+=1
              if name=='shioaji-quote-proxy':
                import re
                for cls in re.findall(r'\b(?:AttributeError|TypeError|KeyError|RuntimeError|ValueError|TimeoutError|IndexError|NotImplementedError|ImportError)\b',message):
                  categories['proxy_exception_'+cls]+=1
                for module,line in re.findall(r'(main|streaming)\.py", line (\d+)',message):
                  categories['proxy_stack_'+module+'_line_'+line]+=1
              if 'quote' in message.lower() or 'shioaji' in message.lower(): categories[name+':quote_related_records']+=1
          print('sanitized_quote_classes='+json.dumps(dict(categories),sort_keys=True))
          PY
          else
            echo 'quote_cloud_logging=permission_unavailable'
          fi

      - name: Private Proxy simulation health with existing IAM identity only
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          BASE=https://shioaji-quote-proxy-131494961796.asia-east1.run.app
          ACCOUNT=janus-user-api@gen-lang-client-0593591102.iam.gserviceaccount.com
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$ACCOUNT" \
            --audiences="$BASE" 2>/dev/null || true)"
          if [[ -z "$TOKEN" ]]; then
            echo 'proxy_private_probe=service_account_impersonation_unavailable'
            exit 0
          fi
          export QUOTE_BASE="$BASE" QUOTE_TOKEN="$TOKEN"
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          url=os.environ['QUOTE_BASE']
          token=os.environ['QUOTE_TOKEN']
          def get(path):
              req=urllib.request.Request(url+path,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      return resp.status,json.loads(resp.read(120000))
              except urllib.error.HTTPError as err:
                  return err.code,{}
              except Exception as err:
                  return type(err).__name__,{}
          code,health=get('/health')
          quote_code,body=get('/quotes?symbols=2330,TAIEX')
          quotes=body.get('quotes') or {}
          print(json.dumps({
              'health_status':code,
              'simulation':(health.get('shioaji') or {}).get('simulation'),
              'simulation_mode':(health.get('shioaji') or {}).get('mode'),
              'shioaji_logged_in':(health.get('shioaji') or {}).get('logged_in'),
              'subscribed_count':(health.get('shioaji') or {}).get('subscribed_count'),
              'quotes_status':quote_code,
              'observations':{symbol:{
                  'source':item.get('source'),
                  'exchange':item.get('exchange'),
                  'trade_time':item.get('trade_time')
              } for symbol,item in quotes.items() if symbol in {'2330','TAIEX'} and isinstance(item,dict)}
          },sort_keys=True))
          PY

      - name: Probe MIS public API from CI network (diagnostic only; not GCP)
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          url = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2382.tw&json=1&delay=0'
          req = Request(url, headers={'User-Agent':'JanusPersonalResearch/1.0','Referer':'https://mis.twse.com.tw/stock/index.jsp'})
          try:
              with urlopen(req, timeout=6) as response:
                  payload = json.load(response)
                  rows = payload.get('msgArray')
                  print('ci_mis_http=', response.status, 'rtcode=', payload.get('rtcode'), 'row_count=', len(rows) if isinstance(rows,list) else 'invalid')
          except HTTPError as e:
              print('ci_mis_error_class=HTTPError; http_status=', e.code)
          except (URLError, ValueError, OSError) as e:
              print('ci_mis_error_class=', type(e).__name__)
          PY
