name: B8 ML/OOS equal-run performance and FinOps

# Explicit only: one bounded B5 SQL materialization x cold/warm, no retrain.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b8-ml-oos-equal-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: b8-ml-oos-equal-run-dev
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      PYTHONPATH: jobs/intelligence-mart:jobs/ingestion-core:.
      B8_B5_MANIFEST_URI: gs://gen-lang-client-0593591102-dev-mart/ml-oos-data/v1/70e0dc3b7d4a6ab3a0437bd0c633de56986bc72b6d8b14e5d85861f0771164a6/manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen Mart and BigQuery dependencies
        run: |
          python -m pip install --require-hashes -r jobs/intelligence-mart/requirements.lock
          python -m pip install --require-hashes -r jobs/intelligence-mart/requirements-bigquery-probe.lock
          python -m pip install -r requirements-dev.txt
      - name: B8 safety, PIT and Parquet regression tests
        run: |
          python -m py_compile scripts/gcp/b8-ml-oos-equal-run.py
          python -m pytest -q tests/test_b8_ml_oos_equal_run.py tests/test_b8_matched_ml_oos.py tests/test_b5_ml_oos_data.py
      - name: Live fixed Core cold/warm reduction and native Parquet export
        run: |
          set -Eeuo pipefail
          python scripts/gcp/b8-ml-oos-equal-run.py \
            --manifest-uri "$B8_B5_MANIFEST_URI" \
            --output b8-ml-oos-equal-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path("b8-ml-oos-equal-run.json").read_text())
          assert e["status"] == "pass" and e["overall_fidelity"] is True
          assert [x["backend"] for x in e["samples"]] == ["pyiceberg","bigquery-export","bigquery-export","pyiceberg"]
          assert all(x["rows"] == 10978 and x["comparison"]["equal"] for x in e["samples"])
          assert e["billed_bytes"] is not None and 0 <= e["billed_bytes"] <= 1073741824
          assert e["default"] == "pyiceberg" and e["cutover"] is False
          assert e["canonical_write"] is False and e["cache_write"] is False
          assert e["storage_read_api_used"] is False and e["ml_retraining_triggered"] is False
          assert e["performance_decision"] == "inconclusive"
          PY
      - name: Save equal-run evidence whether PASS or PARTIAL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b8-ml-oos-equal-run-${{ github.run_id }}
          path: b8-ml-oos-equal-run.json
          if-no-files-found: warn
          retention-days: 14
