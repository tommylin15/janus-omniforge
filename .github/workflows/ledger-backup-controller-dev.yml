name: Janus controller backup executor and guarded handoff
on:
  push:
    branches: [main]
    paths:
      - 'ops/ledger-backup-controller-request.json'
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful full GHCR release containing these executor scripts
        required: true
        type: string
      phase:
        description: Install while retaining original timer, or verify restore before handoff
        required: true
        type: choice
        options: [install, handoff]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      GCP_ENVIRONMENT: dev
      GCP_PROJECT_ID: gen-lang-client-0593591102
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify explicitly authorized backup phase and source identity
        id: request
        env:
          MANUAL_RELEASE_RUN: ${{ inputs.release_run }}
          MANUAL_PHASE: ${{ inputs.phase }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            jq -e '.intent == "dev-ledger-backup-handoff" and .approved == true and
              .environment == "dev" and (.release_run | type == "number") and
              (.release_sha | test("^[0-9a-f]{40}$")) and
              (.phase == "install" or .phase == "handoff")' \
              ops/ledger-backup-controller-request.json >/dev/null
            release_run="$(jq -r .release_run ops/ledger-backup-controller-request.json)"
            release_sha="$(jq -r .release_sha ops/ledger-backup-controller-request.json)"
            phase="$(jq -r .phase ops/ledger-backup-controller-request.json)"
          else
            release_run="$MANUAL_RELEASE_RUN"
            release_sha=""
            phase="$MANUAL_PHASE"
          fi
          [[ "$release_run" =~ ^[0-9]+$ ]]
          [[ "$phase" == "install" || "$phase" == "handoff" ]]
          echo "release_run=$release_run" >>"$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >>"$GITHUB_OUTPUT"
          echo "phase=$phase" >>"$GITHUB_OUTPUT"
      - name: Verify exact tested executor source
        env:
          RELEASE_RUN: ${{ steps.request.outputs.release_run }}
          EXPECTED_RELEASE_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$RELEASE_RUN" --json headSha,conclusion,status,workflowName >/tmp/release.json
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/gcp')
          from ghcr_jobs_rollout import successful_operation
          if not successful_operation(json.load(open('/tmp/release.json')), os.environ['RELEASE_RUN'],
                  'Janus GHCR full-test image publication', 'release'):
              raise SystemExit('full_release_not_successful')
          PY
          sha="$(jq -r .headSha /tmp/release.json)"
          if [[ -n "$EXPECTED_RELEASE_SHA" ]]; then
            test "$sha" = "$EXPECTED_RELEASE_SHA"
          fi
          git merge-base --is-ancestor "$sha" HEAD
          git diff --exit-code "$sha" HEAD -- scripts/gcp/ledger_backup_executor.py scripts/gcp/ledger-durability-dev.sh scripts/gcp/ledger_restore_verify.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install local request executor without stopping original backup
        if: steps.request.outputs.phase == 'install'
        run: |
          set -Eeuo pipefail
          gcloud compute scp scripts/gcp/ledger_backup_executor.py janus-postgres-dev:/tmp/janus-ledger-backup-executor.py --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute scp scripts/gcp/ledger_restore_verify.py janus-postgres-dev:/tmp/janus-ledger-restore-verify.py --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute scp scripts/gcp/ledger-durability-dev.sh janus-postgres-dev:/tmp/janus-ledger-durability --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo env GCP_PROJECT_ID=gen-lang-client-0593591102 GCP_ENVIRONMENT=dev bash /tmp/janus-ledger-durability install-controller'
      - name: Read actual controller backup receipt and verify immutable bytes
        if: steps.request.outputs.phase == 'handoff'
        run: |
          set -Eeuo pipefail
          umask 077
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c \"SELECT json_build_object('day',backup_date,'sha256',sha256,'size_bytes',size_bytes) FROM control.ledger_backup_requests WHERE status='succeeded' AND completed_at>now()-interval '30 hours' ORDER BY backup_date DESC LIMIT 1\"" >/tmp/backup-receipt.json
          jq -e '(.day|test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.sha256|test("^[a-f0-9]{64}$")) and .size_bytes>=1024 and .size_bytes<=67108864' /tmp/backup-receipt.json >/dev/null
          day="$(jq -r .day /tmp/backup-receipt.json)"
      - name: Restore verified immutable backup in the existing VM's isolated database
        if: steps.request.outputs.phase == 'handoff'
        run: |
          set -Eeuo pipefail
          day="$(jq -r .day /tmp/backup-receipt.json)"
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo env GCP_PROJECT_ID=gen-lang-client-0593591102 GCP_ENVIRONMENT=dev bash /var/lib/janus/ledger-durability vm-restore-verify '${day}'" >/tmp/restore-receipt.json
          jq -e '.restore=="PASS" and .original_database_unchanged==true and
            .checks.owner_boundary_valid==true and .checks.latest_versions_valid==true and
            .checks.correction_links_valid==true' /tmp/restore-receipt.json >/dev/null
          echo 'CONTROLLER_BACKUP_RESTORE=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Handoff only after executor and restore passed
        if: steps.request.outputs.phase == 'handoff'
        run: |
          set -Eeuo pipefail
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo systemctl is-active janus-ledger-backup-executor.timer && sudo systemctl disable --now janus-ledger-backup.timer && ! sudo systemctl is-enabled janus-ledger-backup.timer'
          echo 'BACKUP_TIMER_HANDOFF=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private temporary backup on every outcome
        if: always()
        run: rm -f /tmp/restore-receipt.json /tmp/backup-receipt.json
