name: Janus controller backup executor and guarded handoff
on:
  push:
    branches: [main]
    paths:
      - 'ops/ledger-backup-controller-request.json'
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful full GHCR release containing these executor scripts
        required: true
        type: string
      phase:
        description: Install while retaining original timer, or verify restore before handoff
        required: true
        type: choice
        options: [install, handoff, audit, resume]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      GCP_ENVIRONMENT: dev
      GCP_PROJECT_ID: gen-lang-client-0593591102
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify explicitly authorized backup phase and source identity
        id: request
        env:
          MANUAL_RELEASE_RUN: ${{ inputs.release_run }}
          MANUAL_PHASE: ${{ inputs.phase }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            jq -e '.intent == "dev-ledger-backup-handoff" and .approved == true and
              .environment == "dev" and (.release_run | type == "number") and
              (.release_sha | test("^[0-9a-f]{40}$")) and
              (.phase == "install" or .phase == "handoff" or .phase == "audit" or .phase == "resume")' \
              ops/ledger-backup-controller-request.json >/dev/null
            release_run="$(jq -r .release_run ops/ledger-backup-controller-request.json)"
            release_sha="$(jq -r .release_sha ops/ledger-backup-controller-request.json)"
            phase="$(jq -r .phase ops/ledger-backup-controller-request.json)"
          else
            release_run="$MANUAL_RELEASE_RUN"
            release_sha=""
            phase="$MANUAL_PHASE"
          fi
          [[ "$release_run" =~ ^[0-9]+$ ]]
          [[ "$phase" == "install" || "$phase" == "handoff" || "$phase" == "audit" || "$phase" == "resume" ]]
          echo "release_run=$release_run" >>"$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >>"$GITHUB_OUTPUT"
          echo "phase=$phase" >>"$GITHUB_OUTPUT"
      - name: Verify exact tested executor source
        if: steps.request.outputs.phase == 'install' || steps.request.outputs.phase == 'handoff'
        env:
          RELEASE_RUN: ${{ steps.request.outputs.release_run }}
          EXPECTED_RELEASE_SHA: ${{ steps.request.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$RELEASE_RUN" --json headSha,conclusion,status,workflowName >/tmp/release.json
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/gcp')
          from ghcr_jobs_rollout import successful_operation
          if not successful_operation(json.load(open('/tmp/release.json')), os.environ['RELEASE_RUN'],
                  'Janus GHCR full-test image publication', 'release'):
              raise SystemExit('full_release_not_successful')
          PY
          sha="$(jq -r .headSha /tmp/release.json)"
          if [[ -n "$EXPECTED_RELEASE_SHA" ]]; then
            test "$sha" = "$EXPECTED_RELEASE_SHA"
          fi
          git merge-base --is-ancestor "$sha" HEAD
          git diff --exit-code "$sha" HEAD -- scripts/gcp/ledger_backup_executor.py scripts/gcp/ledger-durability-dev.sh scripts/gcp/ledger_restore_verify.py scripts/gcp/private_ledger_backup_retention.py ops/private-ledger-backup-retention-request.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare SSH key before capturing machine-readable receipts
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t rsa -b 3072 -N '' -f "$HOME/.ssh/google_compute_engine"
      - name: Audit existing VM backup timer and five-day backup requests read only
        if: steps.request.outputs.phase == 'audit'
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='
            set -eu
            for unit in janus-ledger-backup-executor.timer janus-ledger-backup.timer; do
              printf "\nTIMER=%s\n" "$unit"
              sudo systemctl show "$unit" --no-pager -p ActiveState -p UnitFileState -p NextElapseUSecRealtime -p LastTriggerUSec || true
            done
            for unit in janus-ledger-backup-executor.service janus-ledger-backup.service; do
              printf "\nSERVICE=%s\n" "$unit"
              sudo systemctl show "$unit" --no-pager -p Result -p ExecMainStatus -p ExecMainExitTimestamp || true
            done
            echo "BACKUP_REQUEST_STATUS_PAST_5_DAYS"
            sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c "SELECT backup_date::text,status,coalesce(size_bytes,0),coalesce(to_char(completed_at at time zone '\''UTC'\'','\''YYYY-MM-DD HH24:MI:SS'\''),'\''NULL'\''),coalesce(error_code,'\''NONE'\'') FROM control.ledger_backup_requests WHERE backup_date >= (now() at time zone '\''Asia/Taipei'\'')::date - 5 ORDER BY backup_date DESC LIMIT 8"
            echo "CONTROLLER_BACKUP_OCCURRENCES_PAST_5_DAYS"
            sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c "SELECT scheduled_at::text,state->>'\''batch'\'',state->>'\''status'\'' FROM control.batch_occurrences WHERE state->>'\''batch'\''='\''ledger-backup'\'' AND scheduled_at >= now()-interval '\''5 days'\'' ORDER BY scheduled_at DESC LIMIT 8"
          '
      - name: Inspect existing hourly Controller Scheduler and Cloud Run executions read only
        if: steps.request.outputs.phase == 'audit'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "EXISTING_CONTROLLER_SCHEDULER"
          gcloud scheduler jobs describe janus-ingestion-daily \
            --project="$GCP_PROJECT_ID" --location=us-central1 \
            --format='json(name,state,schedule,timeZone,lastAttemptTime,status)' || true
          echo "RECENT_CONTROLLER_EXECUTIONS"
          gcloud run jobs executions list --job=janus-batch-controller \
            --project="$GCP_PROJECT_ID" --region=us-central1 --limit=15 \
            --format='table(name,createTime,completionTime,succeededCount,failedCount)' || true
          echo "CONTROLLER_EXECUTION_BOUNDED_JSON"
          gcloud run jobs executions list --job=janus-batch-controller \
            --project="$GCP_PROJECT_ID" --region=us-central1 --limit=20 \
            --format=json | python -c '
          import json,sys
          for item in json.load(sys.stdin):
            print(json.dumps({"name":item.get("metadata",{}).get("name",item.get("name")),
            "created":item.get("metadata",{}).get("creationTimestamp",item.get("createTime")),
            "completed":item.get("status",{}).get("completionTime",item.get("completionTime")),
            "succeeded":item.get("status",{}).get("succeededCount",item.get("succeededCount")),
            "failed":item.get("status",{}).get("failedCount",item.get("failedCount"))},sort_keys=True))
          '
          echo "CONTROLLER_OCCURRENCE_BY_LOCAL_DAY"
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c "SELECT (scheduled_at AT TIME ZONE '\''Asia/Taipei'\'')::date::text,count(*),count(*) FILTER (WHERE state->>'\''status'\''='\''succeeded'\''),count(*) FILTER (WHERE state->>'\''status'\''='\''failed'\''),count(*) FILTER (WHERE state->>'\''batch'\''='\''ledger-backup'\'') FROM control.batch_occurrences WHERE scheduled_at>=now()-interval '\''3 days'\'' GROUP BY 1 ORDER BY 1 DESC LIMIT 4"'
          echo "LIVE_CONTROLLER_CONFIG_ALLOWLIST_ONLY"
          gcloud run jobs describe janus-batch-controller --project="$GCP_PROJECT_ID" --region=us-central1 --format=json |
            python -c '
          import json,sys
          obj=json.load(sys.stdin)
          tpl=obj.get("spec",{}).get("template",{}).get("spec",{}).get("template",{}).get("spec",{})
          containers=tpl.get("containers",[])
          allowed={"BATCH_CONTROLLER_MODE","BATCH_CONTROLLER_NOT_BEFORE","FINOPS_WEEKLY_MAINTENANCE"}
          env={r["name"]:r.get("value","NON_LITERAL")
               for c in containers for r in c.get("env",[]) if r.get("name") in allowed}
          print(json.dumps({"allowed_runtime_env":env,
              "image_sha_digest_present":any("@sha256:" in c.get("image","") for c in containers)},
              sort_keys=True))
          '
          echo "TODAY_EXACT_OCCURRENCES"
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c "SELECT scheduled_at::text,state->>'\''batch'\'',state->>'\''status'\'',coalesce(state->>'\''reason'\'','\''NONE'\'') FROM control.batch_occurrences WHERE scheduled_at >= (now() AT TIME ZONE '\''Asia/Taipei'\'')::date AT TIME ZONE '\''Asia/Taipei'\'' ORDER BY scheduled_at ASC LIMIT 18"'
          echo "LEDGER_BACKUP_PAUSE_AND_EXACT_LOCAL_DAY"
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='
            sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c "SELECT setting_key,coalesce(value_json->>'\''paused'\'','\''NULL'\''),version FROM control.admin_settings WHERE setting_key='\''batch_control:ledger-backup'\'' LIMIT 1";
            sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c "SELECT occurrence_id,scheduled_at::text,state->>'\''batch'\'',state->>'\''status'\'',coalesce(state->>'\''reason'\'','\''NONE'\'') FROM control.batch_occurrences WHERE scheduled_at>='\''2026-10-23T16:00:00+00'\''::timestamptz AND scheduled_at<'\''2026-10-24T16:00:00+00'\''::timestamptz ORDER BY scheduled_at ASC LIMIT 25"
          '
          echo "NO_SCHEDULER_OR_JOB_MUTATION=true"
      - name: Resume only the verified paused daily ledger-backup schedule with CAS
        if: steps.request.outputs.phase == 'resume'
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo docker exec --user postgres janus-postgres psql -X -qAt -v ON_ERROR_STOP=1 -d janus_control -c "UPDATE control.admin_settings SET value_json=value_json || jsonb_build_object('\''paused'\'',false,'\''action'\'','\''resume'\''),version=version+1,updated_at=now(),updated_by='\''p0-1-20261024-bounded-resume'\'' WHERE setting_key='\''batch_control:ledger-backup'\'' AND version=1 AND value_json->>'\''paused'\''='\''true'\'' RETURNING setting_key,version,value_json->>'\''paused'\'',value_json->>'\''action'\'';"' )"
          echo "$result"
          if [[ "$result" != *"batch_control:ledger-backup|2|false|resume"* ]]; then
            echo 'Ledger-backup schedule resume CAS did not confirm exact one-row transition' >&2
            exit 78
          fi
          echo 'LEDGER_BACKUP_PAUSE_RESUME_CAS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'BACKUP_EXECUTION=NOT_TRIGGERED; GCS_DELETIONS=0; IAM_CHANGES=0' >> "$GITHUB_STEP_SUMMARY"
      - name: Install local request executor without stopping original backup
        if: steps.request.outputs.phase == 'install'
        run: |
          set -Eeuo pipefail
          gcloud compute scp scripts/gcp/private_ledger_backup_retention.py janus-postgres-dev:/tmp/private_ledger_backup_retention.py --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute scp ops/private-ledger-backup-retention-request.json janus-postgres-dev:/tmp/private-ledger-backup-retention-request.json --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute scp scripts/gcp/ledger_backup_executor.py janus-postgres-dev:/tmp/janus-ledger-backup-executor.py --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute scp scripts/gcp/ledger_restore_verify.py janus-postgres-dev:/tmp/janus-ledger-restore-verify.py --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute scp scripts/gcp/ledger-durability-dev.sh janus-postgres-dev:/tmp/janus-ledger-durability --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo env GCP_PROJECT_ID=gen-lang-client-0593591102 GCP_ENVIRONMENT=dev bash /tmp/janus-ledger-durability install-controller'
      - name: Read actual controller backup receipt and verify immutable bytes
        if: steps.request.outputs.phase == 'handoff'
        run: |
          set -Eeuo pipefail
          umask 077
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo docker exec --user postgres janus-postgres psql -X -qAt -d janus_control -c \"SELECT json_build_object('day',backup_date,'sha256',sha256,'size_bytes',size_bytes) FROM control.ledger_backup_requests WHERE status='succeeded' AND completed_at>now()-interval '30 hours' ORDER BY backup_date DESC LIMIT 1\"" >/tmp/backup-receipt.json
          jq -e '(.day|test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.sha256|test("^[a-f0-9]{64}$")) and .size_bytes>=1024 and .size_bytes<=67108864' /tmp/backup-receipt.json >/dev/null
          day="$(jq -r .day /tmp/backup-receipt.json)"
      - name: Restore verified immutable backup in the existing VM's isolated database
        if: steps.request.outputs.phase == 'handoff'
        run: |
          set -Eeuo pipefail
          day="$(jq -r .day /tmp/backup-receipt.json)"
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo env GCP_PROJECT_ID=gen-lang-client-0593591102 GCP_ENVIRONMENT=dev bash /var/lib/janus/ledger-durability vm-restore-verify '${day}'" >/tmp/restore-receipt.json
          jq -e '.restore=="PASS" and .original_database_unchanged==true and
            .checks.owner_boundary_valid==true and .checks.latest_versions_valid==true and
            .checks.correction_links_valid==true' /tmp/restore-receipt.json >/dev/null
          echo 'CONTROLLER_BACKUP_RESTORE=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Handoff only after executor and restore passed
        if: steps.request.outputs.phase == 'handoff'
        run: |
          set -Eeuo pipefail
          gcloud compute ssh janus-postgres-dev --project="$GCP_PROJECT_ID" --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo systemctl is-active janus-ledger-backup-executor.timer && sudo systemctl disable --now janus-ledger-backup.timer && ! sudo systemctl is-enabled janus-ledger-backup.timer'
          echo 'BACKUP_TIMER_HANDOFF=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private temporary backup on every outcome
        if: always()
        run: rm -f /tmp/restore-receipt.json /tmp/backup-receipt.json
