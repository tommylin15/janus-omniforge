name: Janus A-CHANGE post-promotion API read-only acceptance
on:
  push:
    branches: [main]
    paths: ['ops/a-change-api-live-request.json']
permissions:
  contents: read
  id-token: write
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Read exact live source, API and anonymous owner fences
        run: |
          python - <<'PY'
          import json,re,subprocess,urllib.request,urllib.error
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          q=json.loads(Path("ops/a-change-api-live-request.json").read_text())
          assert q["intent"]=="a-change-api-only-postpromote-readonly"
          assert q["scope"]=="existing-dev" and q["read_only"] is True
          assert q["no_gcp_mutation"] is True and q["no_owner_mutation"] is True
          assert q["no_traffic_mutation"] is True
          assert re.fullmatch(r"[0-9a-f]{40}",q["source_sha"])
          def cmd(args):
              return json.loads(subprocess.run(args,check=True,timeout=70,
                  capture_output=True,text=True).stdout)
          gcp=["--project=gen-lang-client-0593591102",
               "--region=us-central1","--format=json"]
          svc=cmd(["gcloud","run","services","describe","janus-api",*gcp])
          assert any(c.get("type")=="Ready" and c.get("status")=="True"
                     for c in svc.get("status",{}).get("conditions",[]))
          active=[x for x in svc.get("status",{}).get("traffic",[])
                  if (x.get("percent") or 0)>0]
          assert len(active)==1 and active[0]["percent"]==100
          rev=cmd(["gcloud","run","revisions","describe",
                   active[0]["revisionName"],*gcp])
          image=rev["spec"]["containers"][0]["image"].removeprefix("cache.us-docker.pkg.dev/")
          assert re.fullmatch(r"ghcr[.]io/tommylin15/janus-api@sha256:[0-9a-f]{64}",image)
          base="https://janus-api-2oo7qbkd5q-uc.a.run.app"
          def get(path):
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(base+path,method="GET"),timeout=25) as r:
                      return r.status,r.read(250000)
              except urllib.error.HTTPError as e:
                  return e.code,b""
          build_code,build_body=get("/app/build-id.txt")
          assert build_code==200 and build_body.decode("utf-8","replace").strip()==q["source_sha"]
          for path in ("/app/","/health","/api/v1/public/health"):
              assert get(path)[0]==200,path
          protected=("/api/v1/me/profile",
                     "/api/v1/me/portfolio/intraday?symbol=2330",
                     "/api/v1/me/watchlist/intraday?symbol=2330",
                     "/api/v1/me/portfolio/order-book?symbol=2330",
                     "/api/v1/me/portfolio/value-history?days=365",
                     "/api/v1/me/today-changes?session=postmarket",
                     "/api/v1/me/analysis/2330/changes",
                     "/api/v1/admin/batch-dashboard")
          codes={}
          for path in protected:
              code,_=get(path)
              assert code in (401,403),(path,code)
              codes[path.split("?")[0]]=code
          market_code,market_raw=get("/api/v1/public/market-home")
          assert market_code==200,"market_home_unavailable"
          market_json=json.loads(market_raw) if market_raw else {}
          sections=(market_json.get("sections") or {}) if isinstance(market_json,dict) else {}
          taiex=((sections.get("taiex") or {}).get("data") or {})
          minutes=taiex.get("intraday_points") or []
          assert isinstance(minutes,list),"index_minutes_schema_invalid"
          eod=taiex.get("history_points") or []
          assert isinstance(eod,list) and len(eod)>=2,"index_eod_history_missing"
          flow_code,flow_raw=get("/api/v1/public/market-leverage-flow")
          assert flow_code==200,"market_leverage_flow_unavailable"
          flow_root=json.loads(flow_raw) if flow_raw else {}
          assert isinstance(flow_root,dict),"market_leverage_flow_schema_invalid"
          margin=flow_root.get("margin") or {}
          institution=flow_root.get("institutional") or {}
          assert isinstance(margin,dict) and isinstance(institution,dict),"market_leverage_flow_sections_invalid"
          capital_flow={"http":flow_code,"margin_status":margin.get("status"),
                        "margin_as_of":margin.get("as_of"),
                        "margin_history_count":len(margin.get("history") or []),
                        "institutional_status":institution.get("status"),
                        "institutional_as_of":institution.get("as_of"),
                        "institutional_item_count":len(institution.get("items") or [])}
          public_code,public_data=get("/api/v1/public/history/2330?limit=1&offset=0")
          public_rows=None
          if public_code==200:
              try:
                  value=json.loads(public_data)
                  public_rows=bool(value.get("rows")) if isinstance(value,dict) else None
              except (ValueError,TypeError):pass
          # Public, non-owner-specific 0050 operational quote diagnostic.
          # Do not confuse a public price with private daily PnL acceptance.
          etf_code,etf_raw=get("/api/v1/public/stock-header/0050")
          etf={}
          if etf_code==200 and etf_raw:
              try:
                  etf=json.loads(etf_raw)
              except (ValueError,TypeError):
                  etf={}
          etf_probe={
              "symbol":"0050","http":etf_code,
              "price_date":etf.get("trade_date"),
              "price_status":etf.get("price_status"),
              "source":etf.get("price_source"),
              "quote_state":etf.get("quote_state"),
              "has_price":etf.get("close") not in (None,""),
              "has_published_prior_close":etf.get("previous_close") not in (None,""),
              "owner_day_pnl":"NOT_VERIFIED_NO_OWNER_SESSION",
          }
          # The two screenshot symbols must be independently visible after
          # the API-only traffic cutover; private Owner content stays protected.
          tw=datetime.now(timezone(timedelta(hours=8)))
          trading=tw.weekday()<5 and 540<=tw.hour*60+tw.minute<810
          symbol_quotes={}
          for symbol in ("3231","5876"):
              code,raw=get("/api/v1/public/stock-header/"+symbol)
              assert code==200,("stock_public_unavailable",symbol,code)
              row=json.loads(raw)
              assert row.get("close") not in (None,""),("stock_price_missing",symbol)
              assert row.get("previous_close") not in (None,""),("stock_reference_missing",symbol)
              if trading:
                  assert row.get("trade_date")==tw.date().isoformat(),("stock_not_today",symbol)
                  assert row.get("quote_state")=="intraday",("stock_not_intraday",symbol)
                  assert row.get("price_source") in ("shioaji","twse_mis"),("stock_source_invalid",symbol)
              symbol_quotes[symbol]={
                  "http":code,"trade_date":row.get("trade_date"),
                  "quote_state":row.get("quote_state"),"source":row.get("price_source"),
                  "has_official_close_baseline":row.get("previous_close") not in (None,"")}
          result={"status":"API_LIVE_READBACK_PASS","source_sha":q["source_sha"],
                  "promotion_run":q["promotion_run"],
                  "active_revision":active[0]["revisionName"],
                  "active_percent":100,"immutable_image_digest":image.rsplit("@",1)[-1],
                  "health_and_app":True,"anonymous_owner_admin":codes,
                  "public_market_home_http":market_code,
                  "taiex_observed_minute_count":len(minutes),
                  "taiex_eod_history_count":len(eod),
                  "taiex_eod_latest_date":eod[-1].get("date") if eod else None,
                  "longterm_capital_flow":capital_flow,
                  "anonymous_stock_minutes":codes.get("/api/v1/me/portfolio/intraday"),
                  "anonymous_stock_order_book":codes.get("/api/v1/me/portfolio/order-book"),
                  "public_stock_http":public_code,"public_rows_present":public_rows,
                  "etf_0050_public_probe":etf_probe,
                  "repaired_symbol_quotes":symbol_quotes,
                  "is_regular_session":trading,
                  "owner_authenticated_positive":"NOT_VERIFIED_NO_USER_SESSION",
                  "owner_change_business_rows":"UNKNOWN",
                  "live_390px_user_screenshot":"NOT_VERIFIED",
                  "data_mutations":0,"gcp_mutations":0}
          Path("a-change-api-live-readback.json").write_text(
              json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2))
          print(json.dumps({"status":result["status"],
              "active_percent":100,"source_sha":result["source_sha"],
              "public_stock_http":public_code,"public_rows_present":public_rows,
              "taiex_eod_history_count":len(eod),
              "longterm_capital_flow":capital_flow,
              "owner_authenticated_positive":"NOT_VERIFIED","gcp_mutations":0}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-a-change-api-dev-readback
          path: a-change-api-live-readback.json
          if-no-files-found: ignore
          retention-days: 14
