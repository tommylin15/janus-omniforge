name: SEQ-08 TPEx official benchmark bounded Core repair
on:
  push:
    branches: [main]
    paths:
      - 'jobs/ingestion-core/ingestion_core/tpex_benchmark.py'
      - 'tests/test_seq08_tpex_benchmark.py'
      - 'scripts/gcp/seq08_tpex_benchmark_once.py'
      - 'tests/test_seq08_tpex_benchmark_once.py'
      - 'ops/seq08-tpex-benchmark-request.json'
      - '.github/workflows/seq08-tpex-benchmark-once.yml'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: janus-seq08-tpex-benchmark-one-shot
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal core contract dependencies
        run: python -m pip install -r jobs/ingestion-core/requirements.lock 'pytest>=8,<9'
      - name: Exact-source TPEx parser, schema and one-shot guards
        env:
          PYTHONPATH: 'jobs/ingestion-core:.'
        run: python -m pytest -q tests/test_seq08_tpex_benchmark.py tests/test_seq08_tpex_benchmark_once.py
  apply:
    needs: offline
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(seq08): run one official TPEx benchmark Core repair')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Install existing immutable GHCR verification tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: One existing ingestion Job, official TPEx only and Core readback
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: 'scripts/gcp:.'
        run: python scripts/gcp/seq08_tpex_benchmark_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq08-official-tpex-core-once-receipt
          path: /tmp/seq08-tpex-benchmark-receipt.json
          retention-days: 14
          if-no-files-found: ignore
