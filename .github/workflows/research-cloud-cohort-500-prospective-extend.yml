name: Research cloud cohort 500 prospective extension

on:
  push:
    branches:
      - main
    paths:
      - 'research/cloud-cohort-500/PROSPECTIVE_EXTEND_REQUEST.json'
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: research-cloud-cohort-500
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  RESEARCH_BUCKET: gen-lang-client-0593591102-dev-research-big-move-500
  RESEARCH_PREFIX: research/big-move-cloud-cohort-500
  RESEARCH_JOB: janus-research-big-move-500
  RESEARCH_SA_NAME: janus-research-big-move-500
  IMAGE_REPO: us-central1-docker.pkg.dev/gen-lang-client-0593591102/janusai-poc/research-cloud-cohort-500

jobs:
  prospective-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: request
        name: Prepare and validate frozen extension request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p research-result
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          p=json.loads(Path('research/cloud-cohort-500/PROSPECTIVE_EXTEND_REQUEST.json').read_text())
          event=os.environ['EVENT_NAME']
          if event in {'schedule','workflow_dispatch'}:
              today=datetime.now(ZoneInfo('Asia/Taipei')).date()
              end=datetime.fromisoformat(p['pv1_observation_end']).date()
              through=min(today,end)
              p['materialize_through']=through.isoformat()
              p['request_id']=f"pv1-extension-{through.isoformat()}-{event}"

          assert p['action']=='extend_prospective_registry'
          assert p['cohort_size']==500
          assert p['market']=='TWSE'
          assert p['security_type']=='common_equity'
          assert p['historical_cutoff_inclusive']=='2026-09-16'
          assert p['prospective_observation_start']=='2026-09-17'
          assert p['pv1_observation_end']=='2026-12-31'
          assert p['primary_cohort_run_id']=='f7b91d3373bf6275493649fe8fbc5959f6e21e68'
          assert p['independent_cohort_run_id']=='8ab9048f5738d9db9b6ed25d9bed45e5c6a71d12-ind-cohort'
          assert p['score_bands']=={'S90':0.9,'S80':0.8,'S70':0.7}
          assert float(p['event_seed_fraction'])==0.10
          assert int(p['event_gap_trading_days'])==7
          assert p['source_gcs_object']
          assert len(p['source_sha256'])==64
          assert int(p['source_size_bytes'])>0
          assert p['database_allowed'] is False
          assert p['existing_janus_iceberg_allowed'] is False
          assert p['canonical_core_mart_writes_allowed'] is False
          assert p['outcome_evaluation_allowed'] is False
          assert p['event_label_materialization_allowed'] is False
          Path('research-result/effective_request.json').write_text(json.dumps(p,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"materialize_through={p['materialize_through']}\n")
          print(f"prospective extension request governance: PASS through={p['materialize_through']}")
          PY

      - name: Verify existing research resources
        shell: bash
        run: |
          set -Eeuo pipefail
          sa_email="${RESEARCH_SA_NAME}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud iam service-accounts describe "${sa_email}" --project="${GCP_PROJECT_ID}" >/dev/null
          gcloud storage buckets describe "gs://${RESEARCH_BUCKET}" --project="${GCP_PROJECT_ID}" >/dev/null
          echo "RESEARCH_SA_EMAIL=${sa_email}" >> "${GITHUB_ENV}"

      - id: gate
        name: Check whether a new weekly observation can exist
        shell: bash
        env:
          MATERIALIZE_THROUGH: ${{ steps.request.outputs.materialize_through }}
        run: |
          set -Eeuo pipefail
          state_uri="gs://${RESEARCH_BUCKET}/${RESEARCH_PREFIX}/prospective/pv1/state/latest_registry.json"
          should_run=true
          if gcloud storage cat "${state_uri}" >/tmp/pv1-state.json 2>/dev/null; then
            SHOULD_RUN="$(python - <<'PY'
          import json, os
          from datetime import date
          s=json.load(open('/tmp/pv1-state.json'))
          latest=date.fromisoformat(s['latest_observation_T'])
          through=date.fromisoformat(os.environ['MATERIALIZE_THROUGH'])
          same_or_older_week=(through.isocalendar()[:2] <= latest.isocalendar()[:2])
          print('false' if same_or_older_week else 'true')
          PY
            )"
            should_run="${SHOULD_RUN}"
          fi
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "prospective extension runtime gate should_run=${should_run}"

      - name: Build research image with extension runner
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          image_tag="${IMAGE_REPO}:prospective-extend-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          build_id="$(gcloud builds submit research/cloud-cohort-500 --project="${GCP_PROJECT_ID}" --tag="${image_tag}" --async --format='value(id)')"
          test -n "${build_id}"
          echo "research Cloud Build id=${build_id}"
          while true; do
            status="$(gcloud builds describe "${build_id}" --project="${GCP_PROJECT_ID}" --format='value(status)')"
            case "${status}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "research Cloud Build failed: ${status}" >&2; exit 1 ;;
              QUEUED|PENDING|WORKING) sleep 5 ;;
              *) echo "unexpected Cloud Build status: ${status}" >&2; exit 1 ;;
            esac
          done
          digest="$(gcloud artifacts docker images describe "${image_tag}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "RESEARCH_IMAGE=${IMAGE_REPO}@${digest}" >> "${GITHUB_ENV}"

      - name: Upload immutable extension request
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          request_object="${RESEARCH_PREFIX}/prospective/pv1/requests/extensions/${GITHUB_SHA}-${GITHUB_RUN_ID}.json"
          gcloud storage cp research-result/effective_request.json "gs://${RESEARCH_BUCKET}/${request_object}"
          echo "RESEARCH_REQUEST_OBJECT=${request_object}" >> "${GITHUB_ENV}"

      - name: Point existing research-only Cloud Run Job at extension request
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs update "${RESEARCH_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${RESEARCH_IMAGE}" \
            --service-account="${RESEARCH_SA_EMAIL}" \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=30m --cpu=1 --memory=512Mi \
            --set-env-vars="RESEARCH_BUCKET=${RESEARCH_BUCKET},RESEARCH_PREFIX=${RESEARCH_PREFIX},RESEARCH_REQUEST_OBJECT=${RESEARCH_REQUEST_OBJECT},RESEARCH_RUN_ID=${GITHUB_SHA}-${GITHUB_RUN_ID},RESEARCH_SERVICE_ACCOUNT=${RESEARCH_SA_EMAIL}" \
            --quiet

      - name: Execute prospective registry extension
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs execute "${RESEARCH_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --wait --format=json > research-result/execution.json
          run_id="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          result_object="${RESEARCH_PREFIX}/executions/${run_id}/prospective_extension_result.json"
          gcloud storage cp "gs://${RESEARCH_BUCKET}/${result_object}" research-result/action_result.json
          gcloud run jobs describe "${RESEARCH_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json > research-result/job_snapshot.json

      - name: Verify append-only no-peeking acceptance
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research-result/action_result.json').read_text())
          assert p['action']=='extend_prospective_registry'
          assert p['status'] in {'ok','noop_no_new_observation'}
          assert p['duplicate_primary_key_count']==0 if 'duplicate_primary_key_count' in p else True
          assert p['conflicting_row_hash_count']==0 if 'conflicting_row_hash_count' in p else True
          assert p['late_materialization_count']==0 if 'late_materialization_count' in p else True
          if p['status']=='ok':
              assert p['registry_rewritten'] is True
              assert p['existing_row_hashes_preserved'] is True
              assert p['added_registry_rows']==1000*len(p['appended_observation_dates'])
          else:
              assert p['appended_observation_dates']==[]
              assert p['registry_rewritten'] is False
          for k,v in p['embargo'].items():
              assert v is False, (k,v)
          iso=p['isolation']
          for k in ['postgresql_used','database_used','existing_janus_iceberg_catalog_used','janus_core_written','janus_mart_written','janus_private_mart_written','runtime_secret_used']:
              assert iso[k] is False, (k,iso[k])
          print(f"prospective extension acceptance: PASS status={p['status']} appended={p['appended_observation_dates']}")
          PY

      - name: Record skipped same-week check
        if: steps.gate.outputs.should_run != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p={
            'status':'skipped_same_or_older_week',
            'action':'extend_prospective_registry',
            'materialize_through':'${{ steps.request.outputs.materialize_through }}',
            'reason':'latest registered observation is already in the same or a later ISO week; no new frozen weekly T can exist',
          }
          Path('research-result/action_result.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: research-cloud-cohort-500-prospective-extension-${{ github.run_id }}
          path: research-result/
          if-no-files-found: error
          retention-days: 30
