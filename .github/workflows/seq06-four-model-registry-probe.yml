name: SEQ-06 four-model GCS registry exact read-only inventory
on:
  push:
    branches: [main]
    paths:
      - 'ops/seq06-four-model-registry-probe.json'
      - '.github/workflows/seq06-four-model-registry-probe.yml'
      - 'ops/seq08-model-import-request.json'
      - 'ops/seq08-model-activation-request.json'
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded no-write request
        run: |
          jq -e '.intent=="seq06-four-model-registry-readonly" and .approval_date=="2026-10-25" and .read_only==true and .no_gcp_mutation==true' ops/seq06-four-model-registry-probe.json >/dev/null
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read 4 exact pointers and check pointed model bytes without any writes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/gcp/seq06_registry_probe.py | tee /tmp/seq06-registry-probe.json
      - name: Preserve bounded audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seq06-four-model-registry-readonly
          path: /tmp/seq06-registry-probe.json
          retention-days: 14
          if-no-files-found: ignore

  seq08-candidate-import:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(seq08): import verified five model candidates') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Guard bounded create-only intent
        run: |
          jq -e '.intent=="seq08-import-five-candidates" and .source_bundle_drive_id=="1hcysaHpaExtgB-OqFfWu3i3qNBSe7Gz1" and .source_bundle_sha256=="91df593d9d13cad1858017f989e568c82ece99ca80fa900c6443073a342545a8" and .apply==true and .registry_mutations==false and .model_promotion==false' ops/seq08-model-import-request.json >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'xgboost==3.1.3'
      - uses: google-github-actions/auth@v2
        id: gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - name: Import exact five model heads via existing Dev WIF
        env:
          SEQ08_DRIVE_READ_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py acquire
          trap 'python scripts/gcp/ghcr_release_lease.py release --safe-to-release' EXIT
          python scripts/gcp/ghcr_release_lease.py assert
          PYTHONPATH=scripts/gcp python scripts/gcp/seq08_drive_import_dev.py --apply | tee /tmp/seq08-candidate-import-receipt.json
          python scripts/gcp/ghcr_release_lease.py release --safe-to-release
          trap - EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq08-five-head-gcs-import
          path: /tmp/seq08-candidate-import-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  # Same existing Dev workflow; no new Workflow, Scheduler, bucket or Cloud Run resource.
  # This job only runs for an explicit operator commit; all other pushes are read-only.
  seq08-model-activation:
    needs: inventory
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops(seq08): activate five models') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: "jobs/intelligence-mart:."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact model load tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'xgboost==3.1.3' 'pytest>=8,<9'
      - name: Offline gate tests before any model activation
        run: python -m pytest -q tests/test_seq08_registry_activate.py tests/test_seq08_native_serving.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create only approved five-head Dev ACTIVE pointer and read back
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py acquire
          python scripts/gcp/ghcr_release_lease.py assert
          if python scripts/gcp/seq08_activate_registry.py --apply --receipt /tmp/seq08-model-activation.json; then
            python scripts/gcp/ghcr_release_lease.py assert
            python scripts/gcp/ghcr_release_lease.py release --safe-to-release
          else
            echo 'SEQ-08 activation blocked; lease retained pending verification of pointer state' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seq08-five-head-active-registry-receipt
          path: /tmp/seq08-model-activation.json
          if-no-files-found: ignore
          retention-days: 14
