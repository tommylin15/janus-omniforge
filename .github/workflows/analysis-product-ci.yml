name: Analysis product PostgreSQL and runtime contracts
on:
  push:
    branches: [main]
    paths:
      - 'packages/analysis*'
      - 'packages/valuation_range.py'
      - 'packages/valuation_reference.py'
      - 'jobs/ingestion-core/ingestion_core/valuation_range_inputs.py'
      - 'tests/test_valuation_range.py'
      - 'tests/test_valuation_range_inputs.py'
      - 'tests/test_valuation_reference.py'
      - 'tests/test_seq05_valuation_mart.py'
      - 'jobs/intelligence-mart/intelligence_mart/valuation_reference.py'
      - 'jobs/intelligence-mart/intelligence_mart/analyst_inputs.py'
      - 'services/api/app.py'
      - 'services/api/analysis.py'
      - 'jobs/intelligence-mart/intelligence_mart/product_runtime.py'
      - 'jobs/intelligence-mart/intelligence_mart/specialists.py'
      - 'infra/postgres/migrations/051_analysis_product.sql'
      - 'infra/postgres/migrations/052_ceo_daily_quota_50.sql'
      - 'jobs/intelligence-mart/intelligence_mart/provider_routing.py'
      - 'scripts/gcp/analysis_schema_bootstrap.py'
      - 'tests/test_analysis*'
      - 'tests/test_mart_provider_routing.py'
      - 'scripts/gcp/ceo_p0v_full_prompt_canary.py'
      - 'tests/test_ceo_p0v_full_prompt_canary.py'
      - '.github/workflows/analysis-product-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: janus_analysis_test
          POSTGRES_PASSWORD: analysis_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d janus_analysis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            jobs/ingestion-core/requirements.lock
            jobs/intelligence-mart/requirements.lock
            services/api/requirements.lock
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install -r requirements-dev.txt
          python -m pip install -r jobs/ingestion-core/requirements.lock
          python -m pip install -r jobs/intelligence-mart/requirements.lock
          python -m pip install -r services/api/requirements.lock
      - name: Real PostgreSQL ACL, concurrency, immutable reports and runtime regression
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
          ANALYSIS_TEST_DSN: postgresql://postgres:analysis_ci_only@127.0.0.1:5432/janus_analysis_test
        run: >-
          python -m pytest -q tests/test_analysis_product.py tests/test_analysis_api.py
          tests/test_valuation_range.py tests/test_valuation_range_inputs.py
          tests/test_valuation_reference.py
          tests/test_seq05_valuation_mart.py
          tests/test_risk_api_baseline_serving.py
          tests/test_analysis_postgres.py tests/test_mart_provider_routing.py
          tests/test_market_screening.py tests/test_b4_deep_coverage.py
          tests/test_serving_schema_migration.py tests/test_user_api.py
          tests/test_ceo_p0v_full_prompt_canary.py
