name: One-shot read-only GCS operations attribution

on:
  push:
    branches: [main]
    paths: [ops/finops-ops-attribution-request.json]

permissions:
  contents: read
  id-token: write

concurrency:
  group: janus-finops-read-only-hour-attribution
  cancel-in-progress: false

jobs:
  read-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify only bounded nonmutating diagnosis
        run: |
          jq -e '.intent=="one-shot-read-only-gcs-method-attribution" and .no_gcp_mutation==true and .hours==48' ops/finops-ops-attribution-request.json
      - name: Read 48-hour method/hour counters and Cloud Run windows
        run: python scripts/gcp/finops-ops-attribution.py
