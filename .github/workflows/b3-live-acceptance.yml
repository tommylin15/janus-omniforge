name: B3 live acceptance

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: b3-live-acceptance
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  ALLOW_DEV_DEPLOY: true
  MART_JOB: janus-intelligence-mart
  CONTROLLER_JOB: janus-batch-controller
  FIXED_INPUT: gs://gen-lang-client-0593591102-dev-mart/acceptance/specialists/b1-fixed-snapshot-20261007.json
  EVIDENCE_FILE: doc/archive/group-b-b3-live-acceptance-2026-10-07.json

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install B3 acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r jobs/intelligence-mart/requirements.lock
          python -m pip install --require-hashes -r jobs/intelligence-mart/requirements-bigquery-probe.lock
          python -m pip install -r requirements-dev.txt

      - name: Run targeted B3 contracts
        env:
          PYTHONPATH: jobs/intelligence-mart:jobs/ingestion-core:.
        run: |
          python -m pytest -q tests/test_market_screening.py tests/test_bigquery_reader.py
          python -m py_compile scripts/gcp/b3-screening-canary.py
          touch /tmp/tests.ok

      - name: Verify released B3 controller and Mart runtime
        run: |
          bash scripts/gcp/verify-dev.sh ingestion-core
          bash scripts/gcp/verify-dev.sh intelligence-mart
          gcloud run jobs describe "${MART_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json > /tmp/mart-job.json
          gcloud run jobs describe "${CONTROLLER_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json > /tmp/controller-job.json
          touch /tmp/deploy.ok

      - name: Run fixed-snapshot PyIceberg vs BigQuery canary via Cloud Build
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mart_image="$(gcloud run jobs describe "${MART_JOB}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${mart_image}"
          output_uri="gs://${GCP_PROJECT_ID}-dev-mart/acceptance/b3-canary/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

          log_uri="${output_uri%.json}.log"
          rc_uri="${output_uri%.json}.rc"
          cat > /tmp/b3-canary-cloudbuild.yaml <<'YAML'
          steps:
            - name: '${_MART_IMAGE}'
              entrypoint: bash
              env:
                - 'PYTHONPATH=/workspace/jobs/intelligence-mart:/workspace/jobs/ingestion-core:/workspace'
              args:
                - -ceu
                - |
                  cd /workspace
                  set +e
                  python -m pip install --no-cache-dir --require-hashes \
                    -r jobs/intelligence-mart/requirements-bigquery-probe.lock \
                    > /workspace/b3-canary.log 2>&1
                  rc=$?
                  if [[ "${rc}" -eq 0 ]]; then
                    python scripts/gcp/b3-screening-canary.py --output /workspace/b3-canary.json \
                      >> /workspace/b3-canary.log 2>&1
                    rc=$?
                  fi
                  echo "${rc}" > /workspace/b3-canary.rc
                  if [[ ! -s /workspace/b3-canary.json ]]; then
                    python - <<'PY'
                  import json
                  from pathlib import Path
                  log = Path("/workspace/b3-canary.log").read_text(errors="replace")[-12000:]
                  Path("/workspace/b3-canary.json").write_text(
                      json.dumps({"status":"failed","error":log}, indent=2) + "\n"
                  )
                  PY
                  fi
                  exit 0
            - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
              entrypoint: bash
              args:
                - -ceu
                - |
                  gcloud storage cp /workspace/b3-canary.json '${_OUTPUT_URI}'
                  gcloud storage cp /workspace/b3-canary.log '${_LOG_URI}'
                  gcloud storage cp /workspace/b3-canary.rc '${_RC_URI}'
          options:
            logging: CLOUD_LOGGING_ONLY
          YAML

          gcloud builds submit . \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --config=/tmp/b3-canary-cloudbuild.yaml \
            --gcs-source-staging-dir="gs://${GCP_PROJECT_ID}-cloudbuild-regional/source" \
            --substitutions="_MART_IMAGE=${mart_image},_OUTPUT_URI=${output_uri},_LOG_URI=${log_uri},_RC_URI=${rc_uri}" \
            --format='value(id)' > /tmp/b3-canary-build-id

          build_id="$(tr -d '\r\n' < /tmp/b3-canary-build-id)"
          test -n "${build_id}"
          gcloud builds describe "${build_id}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format=json > /tmp/b3-canary-build.json

          gcloud storage cp "${output_uri}" /tmp/b3-canary.json
          gcloud storage cp "${log_uri}" /tmp/b3-canary.log
          gcloud storage cp "${rc_uri}" /tmp/b3-canary.rc
          test "$(tr -d '\r\n ' < /tmp/b3-canary.rc)" = "0"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/b3-canary.json'))
          assert data['status']=='pass'
          assert data['screening_count']==500
          assert data['output_equal'] is True
          assert data['default']=='pyiceberg' and data['cutover'] is False
          tele=data['bigquery_telemetry']
          assert tele['execution_byte_budget'] == 1073741824
          assert tele['total_rows'] <= 150000
          billed=sum((v.get('billed_bytes') or 0) for v in tele['scan_evidence'].values())
          assert billed <= 1073741824
          assert all((v.get('elapsed_seconds') or 0) <= 60 for v in tele['scan_evidence'].values())
          PY
          touch /tmp/canary.ok

      - name: Run fixed-snapshot Cloud Run acceptance twice
        shell: bash
        run: |
          set -Eeuo pipefail

          run_one() {
            local idx="$1"
            local result_uri="gs://${GCP_PROJECT_ID}-dev-mart/acceptance/b3-live/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${idx}.json"
            gcloud run jobs execute "${MART_JOB}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --update-env-vars="MART_OPERATION=market-screening-acceptance,MART_ACCEPTANCE_INPUT_URI=${FIXED_INPUT},MART_ACCEPTANCE_RESULT_URI=${result_uri},MART_AI_ENABLED=false,MART_OOS_EVALUATION=false" \
              --tasks=1 --task-timeout=30m --wait --format=json > "/tmp/mart-exec-${idx}.json"
            python - "/tmp/mart-exec-${idx}.json" "/tmp/mart-exec-${idx}.name" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          name=((data.get('metadata') or {}).get('name') or data.get('name') or '').split('/')[-1]
          if not name:
              raise SystemExit('missing Cloud Run execution name')
          open(sys.argv[2],'w').write(name)
          PY
            for attempt in $(seq 1 6); do
              if gcloud storage cat "${result_uri}" > "/tmp/mart-result-${idx}.json"; then
                break
              fi
              sleep 5
            done
            test -s "/tmp/mart-result-${idx}.json"
            local logical_id
            logical_id="$(python -c "import json; print(json.load(open('/tmp/mart-result-${idx}.json'))['execution_id'])")"
            for attempt in $(seq 1 6); do
              if gcloud storage cat "gs://gen-lang-client-0593591102-dev-mart/executions/${logical_id}/screening-manifest.json" > "/tmp/screening-receipt-${idx}.json"; then
                break
              fi
              sleep 5
            done
            test -s "/tmp/screening-receipt-${idx}.json"
          }

          run_one 1
          run_one 2

          python - <<'PY'
          import json
          r1=json.load(open('/tmp/screening-receipt-1.json'))
          r2=json.load(open('/tmp/screening-receipt-2.json'))
          j1=json.load(open('/tmp/mart-result-1.json'))
          j2=json.load(open('/tmp/mart-result-2.json'))
          for r,j in ((r1,j1),(r2,j2)):
              assert r['screening_count']==500
              assert r['specialist_count']==0
              assert r['llm_api_tokens']==0
              assert r['ceo_triggered'] is False
              assert j['analysis_as_of']=='2026-10-06'
              assert j['llm_api_tokens']==0
          assert r2['reused'] is True
          assert r2['artifact_growth_bytes']==0
          assert r1['identity_hash']==r2['identity_hash']
          assert r1['screening']==r2['screening']
          PY
          touch /tmp/live.ok

      - name: Exercise controller catch-up and read occurrence state
        shell: bash
        run: |
          set -Eeuo pipefail
          screening_date="$(TZ=Asia/Taipei date +%F)"
          occurrence="market-screening/${screening_date}/16"

          cat > /tmp/b3_state_probe.py <<'PY'
          import json, os
          from urllib.parse import urlparse
          from ingestion_core.__main__ import _control_plane
          from ingestion_core.stage import GcsObjectStore

          occurrence=os.environ['B3_OCCURRENCE_ID']
          control=_control_plane()
          try:
              with control.connection.cursor() as cursor:
                  cursor.execute("SELECT occurrence_id,scheduled_at,state FROM control.batch_occurrences WHERE occurrence_id=%s", (occurrence,))
                  row=cursor.fetchone()
              if row is None:
                  payload={"found": False, "occurrence_id": occurrence}
              else:
                  payload={"found": True, "occurrence_id": row[0], "scheduled_at": row[1].isoformat(), "state": row[2]}
          finally:
              control.close()

          target=urlparse(os.environ['B3_PROBE_RESULT_URI'])
          bucket=os.environ.get('CORE_BUCKET','').strip()
          if target.scheme != 'gs' or target.netloc != bucket or not target.path.startswith('/acceptance/b3-controller/'):
              raise ValueError('B3 controller probe result must stay inside existing dev-core acceptance prefix')
          name=target.path.lstrip('/')
          raw=(json.dumps(payload, sort_keys=True)+'\n').encode()
          store=GcsObjectStore(bucket)
          created=store.create(name, raw, 'application/json')
          if not created and store.read(name) != raw:
              raise RuntimeError('B3 controller probe immutable result conflict')
          if store.read(name) != raw:
              raise RuntimeError('B3 controller probe result readback mismatch')
          print(raw.decode().strip())
          PY
          export B3_PROBE_CODE="$(base64 -w0 /tmp/b3_state_probe.py)"
          wrapper='exec(__import__("base64").b64decode(__import__("os").environ["B3_PROBE_CODE"]))'

          probe_state() {
            local idx="$1"
            local result_uri="gs://${GCP_PROJECT_ID}-dev-core/acceptance/b3-controller/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${idx}.json"
            gcloud run jobs execute "${CONTROLLER_JOB}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --args="-c,${wrapper}" \
              --update-env-vars="B3_PROBE_CODE=${B3_PROBE_CODE},B3_OCCURRENCE_ID=${occurrence},B3_PROBE_RESULT_URI=${result_uri}" \
              --task-timeout=5m --wait --format=json > /tmp/b3-probe-exec.json
            for read_attempt in $(seq 1 6); do
              if gcloud storage cat "${result_uri}" > /tmp/b3-occurrence.json; then
                break
              fi
              sleep 5
            done
            test -s /tmp/b3-occurrence.json
          }

          for attempt in $(seq 1 12); do
            gcloud run jobs execute "${CONTROLLER_JOB}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --update-env-vars="BATCH_CONTROLLER_MODE=active" \
              --task-timeout=5m --wait >/tmp/b3-controller-tick.txt
            probe_state "${attempt}"
            status="$(python -c "import json; d=json.load(open('/tmp/b3-occurrence.json')); print((d.get('state') or {}).get('status','missing'))")"
            if [[ "${status}" == "succeeded" ]]; then
              touch /tmp/controller.ok
              break
            fi
            if [[ "${status}" == "failed" || "${status}" == "skipped" || "${status}" == "ambiguous" ]]; then
              echo "B3 occurrence ended in ${status}" >&2
              exit 1
            fi
            sleep 30
          done

          test -f /tmp/controller.ok
          python - <<'PY'
          import json
          d=json.load(open('/tmp/b3-occurrence.json'))
          assert d['found'] is True
          s=d['state']
          assert s['batch']=='market-screening'
          assert s['job']=='janus-intelligence-mart'
          assert s['status']=='succeeded'
          env=dict(s.get('env') or [])
          assert env['MART_OPERATION']=='market-screening'
          assert env['MART_OOS_EVALUATION']=='false'
          assert env['MART_AI_ENABLED']=='false'
          assert env['SCREENING_DATE']==d['scheduled_at'][:10]
          PY

      - name: Assemble immutable B3 evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return {"unparsed": p.read_text(errors='replace')[-4000:]}

          markers={name: Path('/tmp/'+name+'.ok').exists() for name in ('tests','deploy','canary','live','controller')}
          evidence={
              "schema_version":"b3-live-acceptance-v1",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "git_sha":os.environ.get("GITHUB_SHA"),
              "status":"pass" if all(markers.values()) else "failed",
              "markers":markers,
              "constraints":{
                  "project":"gen-lang-client-0593591102",
                  "region":"us-central1",
                  "mart_cpu":1,
                  "mart_memory":"1Gi",
                  "bigquery_execution_budget_bytes":1073741824,
                  "bigquery_query_timeout_seconds":60,
                  "storage_read_api":False,
                  "default_reader":"pyiceberg",
                  "cutover":False,
              },
              "canary":load('/tmp/b3-canary.json'),
              "canary_cloud_build":load('/tmp/b3-canary-build.json'),
              "fixed_snapshot_run_1":{
                  "cloud_run":load('/tmp/mart-exec-1.json'),
                  "result":load('/tmp/mart-result-1.json'),
                  "receipt":load('/tmp/screening-receipt-1.json'),
              },
              "fixed_snapshot_run_2":{
                  "cloud_run":load('/tmp/mart-exec-2.json'),
                  "result":load('/tmp/mart-result-2.json'),
                  "receipt":load('/tmp/screening-receipt-2.json'),
              },
              "scheduled_occurrence":load('/tmp/b3-occurrence.json'),
              "mart_job":load('/tmp/mart-job.json'),
              "controller_job":load('/tmp/controller-job.json'),
          }
          Path(os.environ['EVIDENCE_FILE']).write_text(json.dumps(evidence, indent=2, sort_keys=True, default=str)+"\n")
          PY

      - name: Commit B3 evidence
        if: always()
        shell: bash
        run: |
          git config user.name "janus-ci"
          git config user.email "janus-ci@users.noreply.github.com"
          git add "${EVIDENCE_FILE}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record B3 live acceptance evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require complete B3 acceptance
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data=json.load(open(os.environ['EVIDENCE_FILE']))
          if data['status'] != 'pass':
              raise SystemExit('B3 acceptance incomplete; inspect committed evidence')
          PY
