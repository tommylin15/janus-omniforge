name: BigQuery compatibility contracts
on:
  push:
    branches: [main]
    paths:
      - 'jobs/intelligence-mart/intelligence_mart/bigquery_reader.py'
      - 'jobs/intelligence-mart/requirements-bigquery-probe.*'
      - 'tests/test_bigquery_reader.py'
      - 'tests/test_b2_lakehouse_acceptance.py'
      - 'scripts/gcp/bigquery-compatibility.py'
      - 'scripts/gcp/b2-lakehouse-acceptance.py'
      - '.github/workflows/bigquery-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r jobs/intelligence-mart/requirements-bigquery-probe.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_bigquery_reader.py
      - run: python -m unittest discover -s tests -p test_b2_lakehouse_acceptance.py
      - run: python -m py_compile scripts/gcp/bigquery-compatibility.py scripts/gcp/b2-lakehouse-acceptance.py
