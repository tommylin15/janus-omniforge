name: Private recalculation live acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/private-recalc-live-acceptance.yml'
      - 'scripts/gcp/cloudbuild-private-recalc-live-acceptance.yaml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-recalc-live-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/131494961796/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: janus-ci@gen-lang-client-0593591102.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run bounded owner queue canary
        run: |
          set -Eeuo pipefail
          project=gen-lang-client-0593591102
          build_id="$(gcloud builds submit --no-source --async \
            --project="${project}" \
            --config=scripts/gcp/cloudbuild-private-recalc-live-acceptance.yaml \
            --format='value(id)')"
          test -n "${build_id}"
          echo "build_id=${build_id}"

          terminal=''
          for _ in $(seq 1 240); do
            terminal="$(gcloud builds describe "${build_id}" \
              --project="${project}" --format='value(status)')"
            case "${terminal}" in
              SUCCESS) break ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR|EXPIRED) break ;;
            esac
            sleep 5
          done

          echo "build_status=${terminal}"
          logs='[]'
          for attempt in $(seq 1 12); do
            logs="$(gcloud logging read \
              "resource.type=\"build\" AND resource.labels.build_id=\"${build_id}\"" \
              --project="${project}" --order=asc --limit=300 --format=json || true)"
            if [[ "${logs}" != '[]' ]]; then break; fi
            if [[ "${attempt}" != '12' ]]; then sleep 5; fi
          done
          log_text="$(python -c 'import json,sys; rows=json.load(sys.stdin); print("\\n".join(str(row.get("textPayload") or (row.get("jsonPayload") or {}).get("message") or "") for row in rows))' <<< "${logs}")"
          printf '%s\n' "${log_text}"

          test "${terminal}" = "SUCCESS"
          grep -q 'PRIVATE_RECALC_LIVE_ACCEPTANCE=PASS' <<< "${log_text}"
