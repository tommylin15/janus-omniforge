name: Janus read-only live ETF official source + Core valuation probe
on:
  push:
    branches: [main]
    paths: ['ops/held-etf-readonly-source-probe.json']
permissions:
  contents: write
  id-token: write
  actions: read
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run one read-only existing-job execution after fence; no ledger/quote writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/held_etf_readonly_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: held-etf-readonly-source-probe
          path: /tmp/held-etf-readonly-source-probe.json
          if-no-files-found: ignore
          retention-days: 14
