name: Janus GHCR Cloud Run 0-percent candidate

on:
  push:
    branches: [main]
    paths:
      - 'ops/ghcr-candidate-request.json'
  workflow_dispatch:

permissions:
  contents: write # owner-fenced release lease
  id-token: write

concurrency:
  group: janus-service-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: dev
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      SERVICE: janus-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lease and candidate recovery contracts before any GCP write
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_ghcr_release_lease.py tests/test_ghcr_candidate_lease_guard.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect public GHCR digest and source-commit request
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ops/ghcr-candidate-request.json
          test "${GITHUB_REF}" = refs/heads/main
          jq -e '.intent == "dev-api-zero-traffic" and (.sha|test("^[0-9a-f]{40}$")) and ((.digest // "") | (length == 0 or test("^sha256:[0-9a-f]{64}$")))' ops/ghcr-candidate-request.json > /dev/null
          sha="$(jq -r .sha ops/ghcr-candidate-request.json)"
          declared="$(jq -r '.digest // ""' ops/ghcr-candidate-request.json)"
          git merge-base --is-ancestor "$sha" HEAD
          # Read manifest from public GHCR using exact, previously published SHA tag.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-api:sha-${sha}" > /tmp/ghcr-identity.json
          digest="$(jq -r '.Digest // empty' /tmp/ghcr-identity.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 2
          [[ -z "$declared" || "$declared" == "$digest" ]] || exit 2
          image="ghcr.io/tommylin15/janus-api@${digest}"
          # Recheck exact immutable digest, without any registry credentials.
          skopeo inspect --no-creds "docker://${image}" > /tmp/ghcr-by-digest.json
          test "$(jq -r .Digest /tmp/ghcr-by-digest.json)" = "$digest"
          test "$(jq -r '.Labels["org.opencontainers.image.revision"]' /tmp/ghcr-identity.json)" = "$sha"
          test "$(jq -r '.Labels["org.opencontainers.image.source"]' /tmp/ghcr-identity.json)" = "https://github.com/tommylin15/janus-omniforge"
          echo "GHCR_PUBLIC_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "GHCR_EXACT_SHA=${sha}" >> "$GITHUB_ENV"
      - name: Preflight dev API identity, traffic and minimum instances
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-before.json
          jq -e '.status.conditions | any(.type=="Ready" and .status=="True")' /tmp/service-before.json >/dev/null
          jq -e '[.status.traffic[]? | select((.percent // 0)>0)] | length == 1 and .[0].percent == 100' /tmp/service-before.json >/dev/null
          # Revision-level minScale plus candidate tag could incur ongoing costs.
          jq -e '((.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0") | tonumber) == 0' /tmp/service-before.json > /dev/null
          jq '{service:.metadata.name,active:[.status.traffic[]?|select((.percent//0)>0)|{revisionName,percent}],latestReady:.status.latestReadyRevisionName}' /tmp/service-before.json > /tmp/metadata-before.json
          cat /tmp/metadata-before.json
      - name: Acquire atomic global deployment lease
        id: lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py acquire
          echo "held=true" >> "$GITHUB_OUTPUT"
      - name: Read back immutable baseline under lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py assert
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-before-locked.json
          jq -e '.metadata.name == "janus-api" and (.status.conditions | any(.type=="Ready" and .status=="True"))' /tmp/service-before-locked.json >/dev/null
          jq -e '[.status.traffic[]? | select((.percent // 0)>0)] | length == 1 and .[0].percent == 100' /tmp/service-before-locked.json >/dev/null
          jq -e '((.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0") | tonumber) == 0' /tmp/service-before-locked.json > /dev/null
      - name: Create fixed-digest candidate without switching traffic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py assert
          tag="ghcr-${GHCR_EXACT_SHA:0:12}"
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$GHCR_PUBLIC_IMAGE" --no-traffic --tag="$tag" --quiet > /dev/null
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-candidate.json
          jq -e --arg tag "$tag" '[.status.traffic[]? | select(.tag==$tag)] | length == 1 and (.[0].percent // 0) == 0' /tmp/service-candidate.json >/dev/null
          before="$(jq -r '.active[0].revisionName' /tmp/metadata-before.json)"
          jq -e --arg old "$before" '[.status.traffic[]?|select((.percent//0)>0)] | length == 1 and .[0].revisionName == $old and .[0].percent == 100' /tmp/service-candidate.json >/dev/null
          url="$(jq -r --arg tag "$tag" '.status.traffic[]|select(.tag==$tag)|.url' /tmp/service-candidate.json)"
          [[ "$url" == https://* ]] || exit 2
          for path in /health /api/v1/public/health; do
            test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url$path")" = 200
          done
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url/api/v1/me/profile")" = 401
          test "$(curl -fsS --max-time 30 "$url/app/build-id.txt")" = "$GHCR_EXACT_SHA"
          {
            echo "### Janus GHCR API candidate"
            echo "Exact source SHA: $GHCR_EXACT_SHA"
            echo "Immutable image: $GHCR_PUBLIC_IMAGE"
            echo "Candidate tagged URL: $url"
            echo "0% normal traffic; old 100% active revision: $before"
            echo "Health and unauthenticated guard PASS; **authenticated owner/OAuth/MCP and four-Jobs acceptance not yet performed**."
            echo "Promotion is deliberately NOT performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify safe candidate baseline and release owned lease
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if ! python scripts/gcp/ghcr_release_lease.py assert >/dev/null 2>&1; then
            state="$(python scripts/gcp/ghcr_release_lease.py inspect | jq -r .status)"
            if [[ "$state" == "ABSENT" && "${{ steps.lease.outputs.held }}" != "true" ]]; then
              echo 'No lease acquired; no deployment cleanup needed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo 'BLOCKED: lease owner/readback uncertain. Do not release or promote.' >&2
            exit 78
          fi
          # Never clear after an ambiguous deployment without a verified
          # fully reconciled live Service and unchanged 100% baseline.
          test -s /tmp/service-before-locked.json
          [[ "${GHCR_PUBLIC_IMAGE:-}" == ghcr.io/tommylin15/janus-api@sha256:* ]]
          [[ "${GHCR_EXACT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          tag="ghcr-${GHCR_EXACT_SHA:0:12}"
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-after-locked.json
          python scripts/gcp/ghcr_candidate_lease_guard.py \
            --before /tmp/service-before-locked.json \
            --after /tmp/service-after-locked.json \
            --image "$GHCR_PUBLIC_IMAGE" --tag "$tag"
          python scripts/gcp/ghcr_release_lease.py assert
          python scripts/gcp/ghcr_release_lease.py release --safe-to-release
          echo 'Global lease released after live baseline and candidate 0% readback. Owner OAuth/MCP/PnL still pending; promotion not authorized.' >> "$GITHUB_STEP_SUMMARY"
