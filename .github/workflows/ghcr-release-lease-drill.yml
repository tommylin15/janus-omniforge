name: Janus GHCR global deploy lease — Git-ref contention drill

on:
  push:
    branches: [main]
    paths:
      - 'ops/ghcr-release-lease-drill-request.json'
  workflow_dispatch:

permissions:
  contents: write

# Does NOT serialize unrelated GHCR/legacy workflows. Real protection comes
# only from every deployment entrypoint acquiring the same Git ref first.
concurrency:
  group: janus-ghcr-global-lease-drill
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_ghcr_release_lease.py

  github-ref-drill:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce safety request and exact main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          jq -e '.intent=="github-only-global-lease-drill" and .allow_gcp_mutation==false and .allow_runtime_promotion==false and .allow_forced_unlock==false' ops/ghcr-release-lease-drill-request.json >/dev/null
      - name: Real GitHub atomic acquire, contention and owner release
        shell: bash
        run: |
          set -Eeuo pipefail
          held=0
          cleanup() {
            if [[ "$held" == 1 ]]; then
              # This particular drill has not contacted GCP or touched runtime.
              python scripts/gcp/ghcr_release_lease.py release --safe-to-release || return 1
            fi
          }
          trap cleanup EXIT
          python scripts/gcp/ghcr_release_lease.py acquire
          held=1
          python scripts/gcp/ghcr_release_lease.py assert
          # Different run identity MUST be unable to acquire or release.
          if python scripts/gcp/ghcr_release_lease.py acquire \
              --run-id "$((GITHUB_RUN_ID + 1))" 2>/dev/null; then
            echo 'FAIL: independent contender unexpectedly acquired lease' >&2
            exit 1
          fi
          if python scripts/gcp/ghcr_release_lease.py release \
              --run-id "$((GITHUB_RUN_ID + 1))" --safe-to-release 2>/dev/null; then
            echo 'FAIL: independent contender unexpectedly released lease' >&2
            exit 1
          fi
          python scripts/gcp/ghcr_release_lease.py assert
          python scripts/gcp/ghcr_release_lease.py release --safe-to-release
          held=0
          echo 'PASS: atomic Git-ref claim, owner fencing, contention denial and owner release. GCP writes=0.' >> "$GITHUB_STEP_SUMMARY"

  independent-recovery:
    needs: [contracts, github-ref-drill]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover only this GitHub-only drill owner, never another lease
        shell: bash
        run: |
          set -Eeuo pipefail
          if python scripts/gcp/ghcr_release_lease.py assert >/dev/null 2>&1; then
            # Recovery is safe for *this* drill only: its jobs cannot mutate GCP.
            python scripts/gcp/ghcr_release_lease.py release --safe-to-release
            echo 'RECOVERED: own Git-ref drill lease cleared; no GCP writes.' >> "$GITHUB_STEP_SUMMARY"
          else
            # No own lease may mean released, never acquired, or another owner.
            # Fail closed on another owner instead of assuming it is safe.
            state="$(python scripts/gcp/ghcr_release_lease.py inspect | jq -r .status)"
            if [[ "$state" != "ABSENT" ]]; then
              echo 'BLOCKED: deployment lease exists but does not belong to this run.' >&2
              exit 78
            fi
            echo 'No drill lease present; verified Git ref absence; no mutation.' >> "$GITHUB_STEP_SUMMARY"
          fi
