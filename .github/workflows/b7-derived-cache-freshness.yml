name: B7 current Core derived cache freshness

# One bounded business-data refresh; NOT monthly retrain, B8 rerun or GHCR release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b7-derived-cache-freshness.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: janus-b7-derived-cache-freshness-dev
  cancel-in-progress: false

jobs:
  refresh-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: jobs/intelligence-mart:jobs/ingestion-core:.
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing locked Mart PyIceberg dependencies
        run: |
          python -m pip install --require-hashes -r jobs/intelligence-mart/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: B7 no-retrain source/lineage and reconciliation tests
        run: |
          python -m py_compile scripts/gcp/b7-refresh-derived-cache.py
          python -m pytest -q tests/test_b7_current_core_cache.py tests/test_b7_monthly_reconciliation.py tests/test_b5_ml_oos_data.py
      - name: Refresh only the newest eligible immutable Core ML/OOS Parquet
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/gcp/b7-refresh-derived-cache.py --output b7-current-cache-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path("b7-current-cache-evidence.json").read_text())
          assert e["status"] == "pass"
          assert e["new_reconciliation"]["status"] == "pass"
          assert e["new_reconciliation"]["ml_oos_derived_cache"]["status"] == "current"
          assert e["new_reconciliation"]["ml_oos_derived_cache"]["core_identity_relation"] == "exact-core"
          assert e["new_reconciliation"]["ml_oos_derived_cache"]["manifest_uri"] == e["dataset_manifest_uri"]
          assert e["row_count"] > 0 and e["export_bytes"] > 0
          assert e["new_reconciliation"]["missed_invalidation_detected"] is False
          assert e["monthly_original_reconciliation_status"] == "partial"
          assert e["ml_retraining_triggered"] is False and e["champion_promotion"] is False
          assert e["ceo_triggered"] is False and e["llm_api_tokens"] == 0
          assert e["bigquery_jobs"] == [] and e["bigquery_storage_read_api_used"] is False
          assert e["canonical_write"] is False
          print(json.dumps({
              "status": "pass", "core_snapshot_id": e["core_snapshot_id"],
              "dataset_manifest_uri": e["dataset_manifest_uri"],
              "receipt_uri": e["receipt_uri"],
              "row_count": e["row_count"],
              "source_fence_matched": True,
              "ml_retraining_triggered": False,
          }, sort_keys=True))
          PY
      - name: Retain source-pinned non-sensitive GCP readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b7-derived-cache-freshness-${{ github.run_id }}
          path: b7-current-cache-evidence.json
          if-no-files-found: warn
          retention-days: 14
