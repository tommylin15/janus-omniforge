name: Scoped shared Taiwan proxy Janus caller IAM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-tw-proxy-invoker-once.yml'
permissions:
  contents: read
  id-token: write
jobs:
  grant-existing-service:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Grant only Janus API caller on existing private Life proxy
        run: |
          set -Eeuo pipefail
          project=gen-lang-client-0593591102
          service=tw-activity-proxy
          region=asia-east1
          gcloud run services describe "$service" --project="$project" --region="$region" --format=json >/tmp/proxy.json
          jq -e '.metadata.name=="tw-activity-proxy"' /tmp/proxy.json
          gcloud run services get-iam-policy "$service" --project="$project" --region="$region" --format=json >/tmp/iam-before.json
          jq -e '[.bindings[]?|select(.role=="roles/run.invoker")|.members[]?|select(.=="allUsers" or .=="allAuthenticatedUsers")]|length==0' /tmp/iam-before.json
          gcloud run services add-iam-policy-binding "$service" --project="$project" --region="$region" --role=roles/run.invoker --member="serviceAccount:janus-user-api@gen-lang-client-0593591102.iam.gserviceaccount.com" --quiet >/dev/null
          gcloud run services get-iam-policy "$service" --project="$project" --region="$region" --format=json >/tmp/iam-after.json
          jq -e '[.bindings[]?|select(.role=="roles/run.invoker")|.members[]?|select(.=="allUsers" or .=="allAuthenticatedUsers")]|length==0' /tmp/iam-after.json
          jq -e '[.bindings[]?|select(.role=="roles/run.invoker")|.members[]?] | index("serviceAccount:janus-user-api@gen-lang-client-0593591102.iam.gserviceaccount.com")!=null' /tmp/iam-after.json
          echo "janus_invoker_scoped_grant=PASS"
