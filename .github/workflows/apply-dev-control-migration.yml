name: Apply bounded dev control migration

on:
  push:
    branches:
      - main
    paths:
      - 'ops/dev-control-migration.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate migration request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          migration="$(jq -r '.migration // ""' ops/dev-control-migration.json)"
          case "${migration}" in
            029_twse_2026_holiday_overrides.sql) ;;
            *) echo "Unsupported migration request: ${migration}" >&2; exit 2 ;;
          esac
          test -f "infra/postgres/migrations/${migration}"
          echo "migration=${migration}" >> "${GITHUB_OUTPUT}"
      - name: Apply migration through Cloud Build
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud builds submit . \
            --project="${GCP_PROJECT_ID}" \
            --config=scripts/gcp/cloudbuild-control-migration.yaml \
            --substitutions="_MIGRATION=${{ steps.request.outputs.migration }}" \
            --quiet
