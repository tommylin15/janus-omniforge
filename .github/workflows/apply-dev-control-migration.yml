name: Apply bounded dev control migration

on:
  push:
    branches:
      - main
    paths:
      - 'ops/dev-control-migration.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_ZONE: us-central1-a
  POSTGRES_VM: janus-postgres-dev

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate migration request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          migration="$(jq -r '.migration // ""' ops/dev-control-migration.json)"
          case "${migration}" in
            029_twse_2026_holiday_overrides.sql) ;;
            *) echo "Unsupported migration request: ${migration}" >&2; exit 2 ;;
          esac
          test -f "infra/postgres/migrations/${migration}"
          echo "migration=${migration}" >> "${GITHUB_OUTPUT}"
      - name: Apply migration through existing IAP path
        shell: bash
        env:
          MIGRATION: ${{ steps.request.outputs.migration }}
        run: |
          set -Eeuo pipefail
          source="infra/postgres/migrations/${MIGRATION}"
          remote="/tmp/janus-control-migration-${GITHUB_RUN_ID}.sql"
          cleanup() {
            gcloud compute ssh "${POSTGRES_VM}" \
              --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
              --tunnel-through-iap --quiet \
              --command="sudo rm -f '${remote}' /tmp/janus-control-migration.sql" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud compute scp "${source}" "${POSTGRES_VM}:${remote}" \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
            --tunnel-through-iap --quiet

          gcloud compute ssh "${POSTGRES_VM}" \
            --project="${GCP_PROJECT_ID}" --zone="${GCP_ZONE}" \
            --tunnel-through-iap --quiet --command="
              set -eu
              sudo docker cp '${remote}' janus-postgres:/tmp/janus-control-migration.sql
              sudo docker exec --user postgres janus-postgres \
                psql -v ON_ERROR_STOP=1 -U postgres -d janus_control \
                -f /tmp/janus-control-migration.sql
              sudo docker exec --user postgres janus-postgres \
                psql -v ON_ERROR_STOP=1 -U postgres -d janus_control -Atc \
                \"SELECT version FROM control.schema_migrations WHERE version='029_twse_2026_holiday_overrides';\"
              sudo docker exec --user postgres janus-postgres \
                psql -v ON_ERROR_STOP=1 -U postgres -d janus_control -Atc \
                \"SELECT jsonb_build_object('time',value_json->'time','enabled',value_json->'enabled','holiday_overrides',value_json->'holiday_overrides','version',version,'updated_by',updated_by) FROM control.admin_settings WHERE setting_key='schedule';\"
              sudo rm -f '${remote}'
            "
