name: ChatGPT market-sector collection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/chatgpt/market_sector_trigger.txt

permissions:
  contents: read

concurrency:
  group: chatgpt-market-sector-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests pandas pyarrow

      - name: Collect 2025-01 through 2026-09
        run: |
          python research/chatgpt/collect_market_sector.py \
            --root out \
            --start-month 2025-01 \
            --end-month 2026-09 \
            --passes 2 \
            --max-requests 300 \
            --max-minutes 40 \
            --interval-seconds 2.0

      - name: Show final receipt
        if: always()
        run: |
          if [ -f out/chatgpt_collection_summary.json ]; then
            cat out/chatgpt_collection_summary.json
          fi

      - name: Upload collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-market-sector-2025-01_2026-09
          path: out/
          if-no-files-found: error
          retention-days: 7
