name: Guarded manual specialist retrain

on:
  push:
    branches: [main]
    paths:
      - 'jobs/ingestion-core/ingestion_core/batch_controller.py'
      - 'tests/test_batch_controller_manual_retrain.py'
      - '.github/workflows/run-dev-specialist-retrain.yml'
      - 'ops/dev-specialist-retrain-request.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-specialist-retrain
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jobs/ingestion-core/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Run manual retrain controller tests
        env:
          PYTHONPATH: jobs/ingestion-core:.
        run: python -m pytest -q tests/test_batch_controller_manual_retrain.py

  detect-request:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect committed retrain request change
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          zero='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "${zero}" ]]; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          elif git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- | grep -Fxq 'ops/dev-specialist-retrain-request.json'; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          fi

  execute:
    needs: [test, detect-request]
    if: needs.detect-request.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          file='ops/dev-specialist-retrain-request.json'
          [[ -f "${file}" ]] || { echo 'missing request file' >&2; exit 2; }
          [[ "$(jq -r '.enabled // false' "${file}")" == 'true' ]] || { echo 'enabled=false; no execution'; exit 0; }
          [[ "$(jq -r '.operation // ""' "${file}")" == 'specialist-retrain' ]] || { echo 'unsupported operation' >&2; exit 2; }
          request_id="$(jq -r '.request_id // ""' "${file}")"
          [[ "${request_id}" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo 'invalid request_id' >&2; exit 2; }
          expected_mart_sha="$(jq -r '.expected_mart_deploy_sha // ""' "${file}")"
          [[ "${expected_mart_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo 'missing/invalid expected_mart_deploy_sha' >&2; exit 2; }
          echo "request_id=${request_id}" >> "${GITHUB_OUTPUT}"
          echo "expected_mart_sha=${expected_mart_sha}" >> "${GITHUB_OUTPUT}"
          echo 'enabled=true' >> "${GITHUB_OUTPUT}"
      - uses: google-github-actions/auth@v2
        if: steps.request.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.request.outputs.enabled == 'true'
      - name: B7 dev scheduler and controller image readback
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if gcloud scheduler jobs describe janus-ingestion-daily \
            --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" \
            --format='json(schedule,timeZone,state)' > /tmp/janus-b7-scheduler.json 2>/tmp/janus-b7-scheduler-error.txt; then
            echo 'B7 scheduler readback authorized'
          else
            echo 'B7 scheduler readback unavailable (cloudscheduler.jobs.get denied or resource inaccessible); acceptance remains PARTIAL' >&2
            printf '{}' > /tmp/janus-b7-scheduler.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/janus-b7-scheduler.json").read_text())
          print("B7 scheduler:", {k: data.get(k) for k in ("schedule", "timeZone", "state")})
          if data:
              assert data.get("schedule") == "30 * * * *", "unexpected controller tick cadence"
              assert data.get("timeZone") == "Asia/Taipei", "controller scheduler timezone mismatch"
              assert data.get("state") == "ENABLED", "controller scheduler is not active"
          else:
              print("B7 scheduler: BLOCKED / not verified; no IAM grant attempted")
          PY
          controller_image="$(gcloud run jobs describe janus-batch-controller \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          ingestion_image="$(gcloud run jobs describe janus-ingestion-core \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          [[ -n "${controller_image}" && "${controller_image}" == "${ingestion_image}" ]] || {
            echo 'B7 live controller image differs from ingestion deployed image' >&2
            exit 2
          }
          echo "B7 controller image alignment PASS"

      - name: B7 require exact Mart deployment image before triggering retrain
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECTED_MART_SHA: ${{ steps.request.outputs.expected_mart_sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 16); do
            mart_image="$(gcloud run jobs describe janus-intelligence-mart \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(spec.template.spec.template.spec.containers[0].image)')"
            if [[ "${mart_image}" == *":dev-${EXPECTED_MART_SHA}" ]]; then
              echo 'B7 exact Mart deployment image verified'
              exit 0
            fi
            echo "B7 Mart image not deployed yet (attempt ${attempt}/16); no controller execution issued"
            sleep 30
          done
          echo 'B7 aborted: expected Mart image not yet present; manual request not executed' >&2
          exit 2

      - name: Execute through batch controller
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -Eeuo pipefail
          gcloud run jobs execute janus-batch-controller \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --update-env-vars="BATCH_CONTROLLER_MODE=manual,BATCH_CONTROLLER_MANUAL_REQUEST_ID=${REQUEST_ID}" \
            --wait
      - name: B7 dev controller and Mart recent execution readback
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "B7 controller latest executions:"
          gcloud run jobs executions list --job=janus-batch-controller \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --limit=3 --format='table(metadata.name,status.succeededCount,status.failedCount)'
          echo "B7 Mart latest executions (control dispatch may still be pending dependencies):"
          gcloud run jobs executions list --job=janus-intelligence-mart \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --limit=5 --format='table(metadata.name,status.succeededCount,status.failedCount)'
