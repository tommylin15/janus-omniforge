name: Guarded manual specialist retrain

on:
  push:
    branches: [main]
    paths:
      - 'jobs/ingestion-core/ingestion_core/batch_controller.py'
      - 'tests/test_batch_controller_manual_retrain.py'
      - '.github/workflows/run-dev-specialist-retrain.yml'
      - 'ops/dev-specialist-retrain-request.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jobs/ingestion-core/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Run manual retrain controller tests
        env:
          PYTHONPATH: jobs/ingestion-core:.
        run: python -m pytest -q tests/test_batch_controller_manual_retrain.py

  detect-request:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect committed retrain request change
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          zero='0000000000000000000000000000000000000000'
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "${zero}" ]]; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          elif git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- | grep -Fxq 'ops/dev-specialist-retrain-request.json'; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          fi

  execute:
    timeout-minutes: 25
    needs: [test, detect-request]
    if: needs.detect-request.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          file='ops/dev-specialist-retrain-request.json'
          [[ -f "${file}" ]] || { echo 'missing request file' >&2; exit 2; }
          [[ "$(jq -r '.enabled // false' "${file}")" == 'true' ]] || { echo 'enabled=false; no execution'; exit 0; }
          [[ "$(jq -r '.operation // ""' "${file}")" == 'specialist-retrain' ]] || { echo 'unsupported operation' >&2; exit 2; }
          request_id="$(jq -r '.request_id // ""' "${file}")"
          [[ "${request_id}" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo 'invalid request_id' >&2; exit 2; }
          expected_release_sha="$(jq -r '.expected_release_sha // ""' "${file}")"
          [[ "${expected_release_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo 'missing/invalid expected_release_sha' >&2; exit 2; }
          jq -e --arg sha "${expected_release_sha}"             '.approved == true and .scope == "existing-dev-four-jobs" and .sha == $sha and .rollback_mode == "reversible_ghcr"'             ops/ghcr-jobs-rollout-request.json >/dev/null || {
              echo 'B7 request does not match the approved current GHCR Jobs release' >&2
              exit 2
            }
          echo "request_id=${request_id}" >> "${GITHUB_OUTPUT}"
          echo "expected_release_sha=${expected_release_sha}" >> "${GITHUB_OUTPUT}"
          echo 'enabled=true' >> "${GITHUB_OUTPUT}"
      - uses: google-github-actions/auth@v2
        if: steps.request.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.request.outputs.enabled == 'true'
      - name: Verify current GHCR release, scheduler and pinned controller/Mart images
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.request.outputs.expected_release_sha }}
        run: |
          set -Eeuo pipefail
          # No deployment/update here. A new B7 request must target the currently
          # approved Jobs release, not the historical Cloud Build dev-SHA tag.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          resolve_image() {
            local component="$1"
            local info digest revision
            info="$(skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-${component}:sha-${EXPECTED_RELEASE_SHA}")"
            digest="$(jq -r '.Digest // ""' <<< "${info}")"
            revision="$(jq -r '.Labels["org.opencontainers.image.revision"] // ""' <<< "${info}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ && "${revision}" == "${EXPECTED_RELEASE_SHA}" ]] || {
              echo "B7 unverified public GHCR release for ${component}" >&2
              exit 2
            }
            skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-${component}@${digest}" >/dev/null
            printf 'ghcr.io/tommylin15/janus-%s@%s' "${component}" "${digest}"
          }
          ingestion_expected="$(resolve_image ingestion-core)"
          mart_expected="$(resolve_image intelligence-mart)"
          controller_image="$(gcloud run jobs describe janus-batch-controller             --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}"             --format='value(spec.template.spec.template.spec.containers[0].image)')"
          ingestion_image="$(gcloud run jobs describe janus-ingestion-core             --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}"             --format='value(spec.template.spec.template.spec.containers[0].image)')"
          mart_image="$(gcloud run jobs describe janus-intelligence-mart             --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}"             --format='value(spec.template.spec.template.spec.containers[0].image)')"
          # Cloud Run may present the registry-import cache prefix on readback.
          controller_image="${controller_image#cache.us-docker.pkg.dev/}"
          ingestion_image="${ingestion_image#cache.us-docker.pkg.dev/}"
          mart_image="${mart_image#cache.us-docker.pkg.dev/}"
          [[ "${controller_image}" == "${ingestion_expected}" &&
             "${ingestion_image}" == "${ingestion_expected}" &&
             "${mart_image}" == "${mart_expected}" ]] || {
              echo 'B7 blocked: live Jobs differ from approved immutable GHCR digest' >&2
              exit 2
            }
          echo 'B7 controller/ingestion/Mart GHCR digest alignment PASS'

          # jobs.get was denied historically. Read the region listing via the
          # existing least-privilege identity; no new IAM permission is granted.
          gcloud scheduler jobs list --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}"             --format=json > /tmp/b7-scheduler.json || {
              echo 'B7 Scheduler readback unavailable: manual dispatch blocked' >&2
              exit 2
            }
          jq -e --arg project "${GCP_PROJECT_ID}" --arg region "${GCP_REGION}" '
            [.[] | select(.name | endswith("/jobs/janus-ingestion-daily"))] as $matches |
            ($matches | length) == 1 and
            ($matches[0].state == "ENABLED") and
            ($matches[0].schedule == "30 * * * *") and
            ($matches[0].timeZone == "Asia/Taipei") and
            ($matches[0].httpTarget.uri | endswith("/projects/" + $project + "/locations/" + $region + "/jobs/janus-batch-controller:run"))
          ' /tmp/b7-scheduler.json >/dev/null || {
            echo 'B7 Scheduler not an enabled Asia/Taipei hourly controller: manual dispatch blocked' >&2
            exit 2
          }
          echo 'B7 live Scheduler configuration PASS'
      - name: Execute through batch controller
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -Eeuo pipefail
          gcloud run jobs execute janus-batch-controller \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --update-env-vars="BATCH_CONTROLLER_MODE=manual,BATCH_CONTROLLER_MANUAL_REQUEST_ID=${REQUEST_ID}" \
            --wait
      - name: B7 dev controller and Mart recent execution readback
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "B7 controller latest executions:"
          gcloud run jobs executions list --job=janus-batch-controller \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --limit=3 --format='table(metadata.name,status.succeededCount,status.failedCount)'
          echo "B7 Mart latest executions (control dispatch may still be pending dependencies):"
          gcloud run jobs executions list --job=janus-intelligence-mart \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --limit=5 --format='table(metadata.name,status.succeededCount,status.failedCount)'
