name: Janus exact preflight no-mutation GHCR lease recovery
on:
  push:
    branches: [main]
    paths: [ops/ghcr-preflight-lease-recovery-request.json]
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact recovery proof and negative cases
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_ghcr_preflight_lease_recovery.py tests/test_ghcr_release_lease.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reconcile original runtime and delete only exact abandoned Git lease
        run: python scripts/gcp/ghcr_preflight_lease_recovery.py
