name: Janus P0 TPEx owner execution diagnostic
on:
  push:
    branches: [main]
    paths: ['ops/holdings-p0-owner-diagnostic.json']
permissions:
  contents: read
  id-token: write
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bounded Cloud Run execution status and sanitized error markers
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.intent=="read-owner-mart-execution-diagnostic" and .no_gcp_mutation==true and .job=="janus-private-pipeline"' ops/holdings-p0-owner-diagnostic.json >/dev/null
          gcloud run jobs executions list --project=gen-lang-client-0593591102 --region=us-central1 \
            --job=janus-private-pipeline --limit=12 --format=json > /tmp/private-executions.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/private-executions.json'))
          for x in rows:
              info=x.get('status') or {}
              created=x.get('metadata',{}).get('creationTimestamp') or x.get('createTime')
              if created and created < '2026-10-12T09:40:00': continue
              conditions=[{k:v.get(k) for k in ('type','status','state','reason')}
                          for v in info.get('conditions',[])
                          if v.get('type') in ('Completed','Ready')]
              print(json.dumps({
                  'execution':str(x.get('metadata',{}).get('name') or x.get('name','')).split('/')[-1],
                  'created':created,
                  'succeeded':info.get('succeededCount',x.get('succeededCount')),
                  'failed':info.get('failedCount',x.get('failedCount')),
                  'running':info.get('runningCount',x.get('runningCount')),
                  'completion':info.get('completionTime',x.get('completionTime')),
                  'conditions':conditions,
              },sort_keys=True))
          PY
          if gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="janus-private-pipeline" AND timestamp>="2026-10-12T09:42:00Z" AND timestamp<="2026-10-12T09:51:00Z"' \
            --project=gen-lang-client-0593591102 --limit=150 --format=json > /tmp/private-log.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          logs=json.load(open('/tmp/private-log.json'))
          markers=['actual_holder_owner_scope_not_exactly_one',
            'official_00719B_eligible_eod_missing',
            'official_00719B_persisted_source_not_proven',
            'owner_00719B_mart_position_missing',
            'owner_00719B_mart_price_or_checkpoint_invalid',
            'ModuleNotFoundError','OperationalError','PermissionDenied',
            'ForeignKeyViolation','IntegrityError','TimeoutError',
            'ImportError','AttributeError','TypeError',
            'CorePriceReader','PrivateIcebergStore',
            'not enough memory','DeadlineExceeded',
            'could not connect','connection refused']
          content='\n'.join(str(x.get('textPayload') or x.get('jsonPayload',{}).get('message') or '') for x in logs)
          observed=sorted({m for m in markers if m.lower() in content.lower()})
          print(json.dumps({'private_runtime_log_entries':len(logs),
            'recognized_safe_error_markers':observed,
            'raw_logs_printed':False},sort_keys=True))
          PY
          else
            echo 'private_runtime_logging_status=UNAVAILABLE_NOT_SUCCESS'
          fi
      - name: Inspect task exit code and sanitized traceback class only
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs executions describe janus-private-pipeline-kw8l5 \
            --project=gen-lang-client-0593591102 --region=us-central1 \
            --format=json > /tmp/failed-execution.json
          if gcloud run jobs executions tasks list \
            --execution=janus-private-pipeline-kw8l5 \
            --project=gen-lang-client-0593591102 --region=us-central1 \
            --format=json > /tmp/failed-tasks.json 2>/dev/null; then
            echo "task_status_read=AVAILABLE"
          else
            echo "task_status_read=UNKNOWN"
            echo '[]' > /tmp/failed-tasks.json
          fi
          python3 - <<'PY'
          import json,re
          execution=json.load(open('/tmp/failed-execution.json'))
          conditions=(execution.get('status') or {}).get('conditions',[])
          for c in conditions:
              if c.get('type') in {'Completed','Ready'}:
                  print(json.dumps({'condition':c.get('type'),
                      'reason':c.get('reason'), 'status':c.get('status')},sort_keys=True))
          tasks=json.load(open('/tmp/failed-tasks.json'))
          if not isinstance(tasks,list): tasks=[]
          for x in tasks:
              s=x.get('status') or {}
              print(json.dumps({'task':str(x.get('metadata',{}).get('name') or x.get('name','')).split('/')[-1],
                  'exit_code':s.get('exitCode',x.get('exitCode')),
                  'retries':s.get('retried',x.get('retried')),
                  'failed_count':s.get('failedCount',x.get('failedCount')),
                  'conditions':[{k:c.get(k) for k in ('type','status','reason')}
                                for c in s.get('conditions',[]) if c.get('type')=='Completed']},
                  sort_keys=True))
          logs=json.load(open('/tmp/private-log.json')) if __import__('os').path.exists('/tmp/private-log.json') else []
          allowed=[]
          for row in logs:
              value=str(row.get('textPayload') or
                        row.get('jsonPayload',{}).get('message') or '')
              classes=re.findall(r'\b[A-Z][A-Za-z0-9_]*(?:Error|Exception)\b',value)
              allowed.append({'severity':row.get('severity'),
                  'log_kind':str(row.get('logName') or '').split('/')[-1],
                  'payload_chars':len(value),
                  'exception_classes':sorted(set(classes))[:4],
                  'json_keys':sorted(list((row.get('jsonPayload') or {}).keys()))[:12]})
          print(json.dumps({'sanitized_log_shapes':allowed,'raw_logs_printed':False},sort_keys=True))
          PY
      - name: Classify bounded stderr without revealing private payloads
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('/tmp/private-log.json').read_text())
          tokens=['python','usage','invalid','argument','unrecognized',
             "can't open file",'No such file','command not found',
             'Traceback','failed to','not found','cannot open','missing',
             'owner','permission','denied','exit','source','tpex','00719B',
             'core','worker','memory','timeout','import','runtime',
             'exception','error','File','line','-c','app']
          for row in items:
              if 'stderr' not in str(row.get('logName','')): continue
              value=str(row.get('textPayload') or
                    (row.get('jsonPayload') or {}).get('message') or '')
              print(json.dumps({'stderr_chars':len(value),
                 'safe_tokens':sorted({x for x in tokens if x.lower() in value.lower()}),
                 'contains_python_path':('/usr/local/bin/python' in value or '/app/' in value),
                 'contains_cli_usage':('usage:' in value.lower()),
                 'no_raw_private_payload':True},sort_keys=True))
          PY
      - name: Extract only named traceback exception and validated failure category
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          logs=json.loads(Path('/tmp/private-log.json').read_text())
          for row in logs:
              if 'stderr' not in str(row.get('logName','')): continue
              content=str(row.get('textPayload') or
                    (row.get('jsonPayload') or {}).get('message') or '')
              candidates=[]
              for line in content.splitlines():
                  m=re.match(r'^([A-Za-z_][A-Za-z_0-9.]*)\s*:\s*',line.strip())
                  if m:
                      klass=m.group(1).split('.')[-1]
                      if re.fullmatch(r'[A-Za-z_]{3,45}',klass):
                          candidates.append(klass)
              print(json.dumps({'stderr_chars':len(content),
                  'exception_names':candidates[-3:],
                  'permission_denied':('permission denied' in content.lower()),
                  'tpex_mentioned':('tpex' in content.lower()),
                  'relation_mentioned':('relation' in content.lower()),
                  'file_missing':('no such file' in content.lower()),
                  'no_exception_message_or_private_values':True},sort_keys=True))
          PY
      - name: Identify only SQL object denied to existing pipeline role
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          logs=json.loads(Path('/tmp/private-log.json').read_text())
          for row in logs:
              if 'stderr' not in str(row.get('logName','')): continue
              content=str(row.get('textPayload') or
                  (row.get('jsonPayload') or {}).get('message') or '')
              objects=re.findall(r'permission denied for\s+(table|schema|relation|sequence|function)\s+([A-Za-z_][A-Za-z0-9_]{0,62})',
                  content,re.IGNORECASE)
              print(json.dumps({'denied_sql_objects':[
                   {'kind':kind.lower(),'object':name} for kind,name in objects],
                   'contains_embedded_sql':('LINE 1:' in content),
                   'no_sql_statement_or_private_data':True},sort_keys=True))
          PY
      - name: Identify latest 00719B owner Mart execution and safe exception category
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs executions list --project=gen-lang-client-0593591102 --region=us-central1 \
            --job=janus-private-pipeline --limit=12 --format=json > /tmp/latest-owner-executions.json
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="janus-private-pipeline" AND timestamp>="2026-10-12T11:58:00Z" AND timestamp<="2026-10-12T12:06:00Z"' \
            --project=gen-lang-client-0593591102 --limit=120 --format=json > /tmp/latest-owner-errors.json
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('/tmp/latest-owner-executions.json').read_text())
          target=[x for x in data if '2026-10-12T11:58:00' <=
                    str(x.get('metadata',{}).get('creationTimestamp') or x.get('createTime') or '') <=
                    '2026-10-12T12:06:00']
          for x in target:
              s=x.get('status') or {}
              print(json.dumps({'execution':str(x.get('metadata',{}).get('name') or x.get('name','')).split('/')[-1],
                  'state':[{k:c.get(k) for k in ('type','status','reason')}
                            for c in s.get('conditions',[]) if c.get('type')=='Completed'],
                  'failed_tasks':s.get('failedCount',x.get('failedCount'))},sort_keys=True))
          logs=json.loads(Path('/tmp/latest-owner-errors.json').read_text())
          classes=set()
          reasons=set()
          objects=set()
          modules=set()
          allowed={
              'official_00719B_eligible_eod_missing',
              'official_00719B_persisted_source_not_proven',
              'owner_00719B_mart_position_missing',
              'owner_00719B_mart_position_or_pnl_missing',
              'owner_00719B_mart_price_or_checkpoint_invalid',
              'owner_00719B_mart_price_pnl_or_checkpoint_invalid',
              'actual_holder_owner_scope_not_exactly_one',
          }
          allowed_modules={'repository.py','private_pipeline.py','store.py',
              'private_recalc_queue.py','tpex_quotes.py','postgres_bundle.py',
              'psycopg','catalog.py','schema.py'}
          for row in logs:
              value=str(row.get('textPayload') or (row.get('jsonPayload') or {}).get('message') or '')
              if not value: continue
              for cls in re.findall(r'(?:psycopg\.errors\.)?([A-Za-z_][A-Za-z_0-9]*(?:Error|Privilege|Violation|Exception))',value):
                  classes.add(cls[:50])
              for reason in allowed:
                  if reason in value: reasons.add(reason)
              for kind,obj in re.findall(r'permission denied for\s+(table|schema|relation|sequence)\s+([A-Za-z_][A-Za-z0-9_]{0,62})',value,re.I):
                  objects.add((kind,obj))
              for mod in allowed_modules:
                  if mod in value: modules.add(mod)
          print(json.dumps({'live_owner_log_rows':len(logs),
              'exception_classes':sorted(classes),
              'safe_domain_errors':sorted(reasons),
              'denied_objects':[{'kind':k,'object':v} for k,v in sorted(objects)],
              'traceback_modules':sorted(modules),
              'raw_log_emitted':False},sort_keys=True))
          PY
