name: Janus Controller-only ledger backup status repair
on:
  push:
    branches: [main]
    paths:
      - 'ops/controller-ledger-repair-request.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false

jobs:
  controller-ledger-repair:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Verify exact-source six-row no-backup no-GCS-deletion contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_controller_ledger_repair_dev.py tests/test_ghcr_release_lease.py
      - name: Install GHCR image inspector
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Deploy only existing Controller and repair six completed occurrences
        run: python scripts/gcp/controller_ledger_repair_dev.py
      - name: Preserve scoped deployment and PostgreSQL receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-controller-ledger-repair
          path: /tmp/controller-ledger-repair-receipt.json
          if-no-files-found: ignore
          retention-days: 14
