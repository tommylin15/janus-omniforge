name: Risk v1 dev candidate and EOD readback
on:
  push:
    branches: [main]
    paths:
      - ops/risk-v1-readback-request.json
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-risk-readonly-inspection
  cancel-in-progress: false
jobs:
  readback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read restricted dev resources without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(jq -r .operation ops/risk-v1-readback-request.json)" = 'readonly'
          test "$(jq -r .candidate_sha256 ops/risk-v1-readback-request.json)" = '36c77d0168a1d667223ab915c9b08fd2c1c6608f9f7db2fc046204e922854044'
          PROJECT='gen-lang-client-0593591102'
          REGION='us-central1'
          PREFIX="gs://gen-lang-client-0593591102-dev-mart/risk-models/candidates/2026Q3-20261022/"
          echo '### Risk candidate storage evidence' >> "$GITHUB_STEP_SUMMARY"
          if gcloud storage ls "${PREFIX}risk-xgboost8-2025h2-v1.ubj" --project "$PROJECT" >/tmp/risk-gcs-object.txt 2>/tmp/risk-gcs-error.txt; then
            echo 'candidate_object=present; hash_readback=not_run' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'candidate_object=not_readable_or_absent; model_deploy=NOT_VERIFIED' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '### Mart job execution image/status' >> "$GITHUB_STEP_SUMMARY"
          if gcloud run jobs describe janus-intelligence-mart --region "$REGION" --project "$PROJECT" --format=json > /tmp/risk-mart.json 2>/tmp/risk-mart-err.txt; then
            jq -r '"job=" + .metadata.name, "revision=" + ((.status.latestCreatedExecution.name // .status.latestReadyExecution.name // "not_reported")|tostring)' /tmp/risk-mart.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'mart_job_read=failed' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '### Existing batch controller scheduler (read-only)' >> "$GITHUB_STEP_SUMMARY"
          if gcloud scheduler jobs list --location "$REGION" --project "$PROJECT" --format=json >/tmp/risk-schedulers.json 2>/tmp/risk-schedulers-err.txt; then
            jq -r '.[] | select((.name // "")|contains("janus")) | [.name,.state,.schedule] | @tsv' /tmp/risk-schedulers.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'scheduler_read=failed' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Readback only. No XGBoost publication or model upload occurred.' >> "$GITHUB_STEP_SUMMARY"
      - name: Risk formal promotion preflight (no state mutations)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(jq -r .operation ops/risk-v1-readback-request.json)" = readonly
          test "$(jq -r .intent ops/risk-v1-readback-request.json)" = risk-v1-formal-promotion-preflight
          python3 scripts/gcp/risk_promotion_preflight.py \
            --receipt /tmp/risk-promotion-preflight.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path('/tmp/risk-promotion-preflight.json').read_text())
          assert result['audit_status']=='COMPLETED'
          assert result['promotion_status']=='BLOCKED_NOT_ACTIVE'
          assert result['publication_allowed'] is False
          assert not any(result[x] for x in ('would_write_registry','would_change_api','would_execute_model'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Risk formal promotion readiness (read-only)\n')
              f.write('Audit executed: COMPLETED. **Promotion: BLOCKED_NOT_ACTIVE**\n')
              f.write('Observed candidate hash: '+('PASS' if 'candidate_gcs_sha256' in result['verified'] else 'NOT_VERIFIED')+'\n')
              f.write('Observed shadow count: '+str(result['verified'].get('shadow_prediction_count','NOT_VERIFIED'))+'\n')
              f.write('Missing mandatory gates:\n')
              for reason in result['blocked_or_unverified_gates']:
                  f.write('- '+reason+'\n')
              f.write('No active registry/model/API/job/scheduler change occurred.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-formal-promotion-preflight
          path: /tmp/risk-promotion-preflight.json
          if-no-files-found: ignore
          retention-days: 14
