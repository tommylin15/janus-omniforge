name: Stock supplement controlled dev acceptance
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: baseline
        options: [baseline, migrate, run, readback]
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: python scripts/gcp/stock_supplement_ops.py ${{ inputs.operation }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-supplement-receipt
          path: /tmp/stock-supplement.json
          if-no-files-found: ignore
          retention-days: 14
