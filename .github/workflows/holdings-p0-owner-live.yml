name: Janus P0 actual owner TPEx Mart acceptance
on:
  push:
    branches: [main]
    paths: ['ops/holdings-p0-owner-live-request.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  owner-mart:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical split-Mart schema before dev mutation
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_holdings_owner_live_contract.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reconcile one existing 00719B holder and verify official price+Mart
        run: |
          set -Eeuo pipefail
          python scripts/gcp/holdings_p0_owner_live_probe.py
