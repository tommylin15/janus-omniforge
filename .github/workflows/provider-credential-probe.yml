name: Probe provider credentials

on:
  push:
    branches:
      - main
    paths:
      - 'ops/provider-credential-probe.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run bounded secret and free-entitlement probe
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/provider-probe.yaml <<'YAML'
          steps:
            - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
              entrypoint: bash
              secretEnv:
                - JANUS_RUNTIME_BUNDLE
              args:
                - -ceu
                - |
                  python3 - <<'PY'
                  import json
                  import os
                  import urllib.error
                  import urllib.request

                  bundle = json.loads(os.environ["JANUS_RUNTIME_BUNDLE"])
                  if not isinstance(bundle, dict):
                      raise SystemExit("runtime bundle is not a JSON object")

                  def matches(term):
                      return sorted(
                          key for key in bundle
                          if term in key.lower()
                      )

                  def secret_value(term):
                      candidates = [
                          key for key in bundle
                          if term in key.lower() and "key" in key.lower()
                      ]
                      for key in sorted(candidates):
                          value = bundle.get(key)
                          if isinstance(value, str) and value.strip():
                              return key, value.strip()
                      return None, None

                  result = {
                      "secret": {},
                      "fugle": {"auth_ok": False, "http_status": None},
                      "gemini": {"auth_ok": False, "http_status": None, "generate_models": None},
                      "openrouter": {"auth_ok": False, "http_status": None, "is_free_tier": None},
                  }

                  for provider in ("fugle", "gemini", "openrouter"):
                      fields = matches(provider)
                      _, value = secret_value(provider)
                      result["secret"][provider] = {
                          "fields": fields,
                          "present": bool(fields),
                          "nonempty_api_key": bool(value),
                      }

                  fugle_field, fugle_key = secret_value("fugle")
                  if fugle_key:
                      request = urllib.request.Request(
                          "https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/2330",
                          headers={"X-API-KEY": fugle_key},
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=15) as response:
                              payload = json.load(response)
                              result["fugle"].update(
                                  auth_ok=response.status == 200 and str(payload.get("symbol", "")) == "2330",
                                  http_status=response.status,
                                  api_version="v1.0",
                                  field=fugle_field,
                              )
                      except urllib.error.HTTPError as error:
                          result["fugle"].update(http_status=error.code, field=fugle_field)
                      except Exception as error:
                          result["fugle"].update(error=type(error).__name__, field=fugle_field)

                  gemini_field, gemini_key = secret_value("gemini")
                  if gemini_key:
                      request = urllib.request.Request(
                          "https://generativelanguage.googleapis.com/v1beta/models",
                          headers={"x-goog-api-key": gemini_key},
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=15) as response:
                              payload = json.load(response)
                              models = payload.get("models", []) if isinstance(payload, dict) else []
                              generate_models = sum(
                                  1 for item in models
                                  if isinstance(item, dict)
                                  and "generateContent" in item.get("supportedGenerationMethods", [])
                              )
                              result["gemini"].update(
                                  auth_ok=response.status == 200 and generate_models > 0,
                                  http_status=response.status,
                                  generate_models=generate_models,
                                  field=gemini_field,
                              )
                      except urllib.error.HTTPError as error:
                          result["gemini"].update(http_status=error.code, field=gemini_field)
                      except Exception as error:
                          result["gemini"].update(error=type(error).__name__, field=gemini_field)

                  openrouter_field, openrouter_key = secret_value("openrouter")
                  if openrouter_key:
                      request = urllib.request.Request(
                          "https://openrouter.ai/api/v1/key",
                          headers={"Authorization": f"Bearer {openrouter_key}"},
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=15) as response:
                              payload = json.load(response)
                              data = payload.get("data", {}) if isinstance(payload, dict) else {}
                              result["openrouter"].update(
                                  auth_ok=response.status == 200 and isinstance(data, dict),
                                  http_status=response.status,
                                  is_free_tier=data.get("is_free_tier") if isinstance(data, dict) else None,
                                  field=openrouter_field,
                              )
                      except urllib.error.HTTPError as error:
                          result["openrouter"].update(http_status=error.code, field=openrouter_field)
                      except Exception as error:
                          result["openrouter"].update(error=type(error).__name__, field=openrouter_field)

                  print(json.dumps(result, ensure_ascii=False, sort_keys=True))
                  PY
          availableSecrets:
            secretManager:
              - versionName: projects/$PROJECT_ID/secrets/janus-runtime-bundle/versions/latest
                env: JANUS_RUNTIME_BUNDLE
          options:
            logging: CLOUD_LOGGING_ONLY
          YAML
          gcloud builds submit --no-source \
            --project="${GCP_PROJECT_ID}" \
            --config=/tmp/provider-probe.yaml \
            --quiet
