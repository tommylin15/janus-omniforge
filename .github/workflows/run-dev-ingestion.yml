name: Run dev ingestion request

on:
  push:
    branches:
      - main
    paths:
      - 'ops/dev-ingestion-request.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse writes while a release lease needs recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py inspect > /tmp/release-lease.json
          jq -e '.status == "ABSENT"' /tmp/release-lease.json >/dev/null

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          file='ops/dev-ingestion-request.json'
          enabled="$(jq -r '.enabled // false' "${file}")"
          if [[ "${enabled}" != 'true' ]]; then
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
            echo 'Request is disabled; nothing to execute.'
            exit 0
          fi

          request_id="$(jq -r '.request_id // "unnamed"' "${file}")"
          [[ "${request_id}" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo 'invalid request_id' >&2; exit 2; }
          operation="$(jq -r '.operation // "ingestion"' "${file}")"
          case "${operation}" in
            control-migration)
              migration="$(jq -r '.migration // ""' "${file}")"
              case "${migration}" in
                030_private_stock_master_read|031_portfolio_market_coverage|032_liquid_500) ;;
                *) echo "Unsupported control migration: ${migration}" >&2; exit 2 ;;
              esac
              {
                echo 'enabled=true'
                echo 'operation=control-migration'
                echo "migration=${migration}"
                echo 'config_id='
                echo 'symbols='
                echo "request_id=${request_id}"
              } >> "${GITHUB_OUTPUT}"
              echo "Validated bounded control migration request ${request_id}: ${migration}"
              exit 0
              ;;
            analysis)
              config_id="$(jq -r '.config_id // ""' "${file}")"
              [[ "${config_id}" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo 'invalid analysis config_id' >&2; exit 2; }
              mapfile -t symbols < <(jq -r '(.symbols // [])[]' "${file}")
              (( ${#symbols[@]} >= 1 && ${#symbols[@]} <= 50 )) || { echo 'analysis symbols must contain 1..50 items' >&2; exit 2; }
              for symbol in "${symbols[@]}"; do
                [[ "${symbol}" =~ ^[A-Za-z0-9._-]{1,20}$ ]] || { echo "invalid analysis symbol: ${symbol}" >&2; exit 2; }
              done
              symbol_csv="$(IFS=,; echo "${symbols[*]}")"
              {
                echo 'enabled=true'
                echo 'operation=analysis'
                echo 'migration='
                echo "config_id=${config_id}"
                echo "symbols=${symbol_csv}"
                echo "request_id=${request_id}"
              } >> "${GITHUB_OUTPUT}"
              echo "Validated bounded Mart replay ${request_id}: config=${config_id}, symbols=${symbol_csv}"
              exit 0
              ;;
            ingestion) ;;
            *) echo "Unsupported dev ingestion operation: ${operation}" >&2; exit 2 ;;
          esac

          dataset="$(jq -r '.dataset // ""' "${file}")"
          case "${dataset}" in
            full-market-500|twse-ohlcv|twse-market-volume|taiex|twse-valuation|twse-institutional|mops|finmind|twse-events|twse-market-activity|twse-financing|twse-securities-lending-short) ;;
            *) echo "Unsupported ingestion dataset: ${dataset}" >&2; exit 2 ;;
          esac

          force_refresh="$(jq -r '.force_refresh // false' "${file}")"
          [[ "${force_refresh}" == 'true' || "${force_refresh}" == 'false' ]] || { echo 'force_refresh must be boolean' >&2; exit 2; }
          disable_mart="$(jq -r '.disable_mart_trigger // true' "${file}")"
          [[ "${disable_mart}" == 'true' || "${disable_mart}" == 'false' ]] || { echo 'disable_mart_trigger must be boolean' >&2; exit 2; }

          single="$(jq -r '.date // ""' "${file}")"
          start="$(jq -r '.start_date // ""' "${file}")"
          end="$(jq -r '.end_date // ""' "${file}")"
          date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          for value in "${single}" "${start}" "${end}"; do
            [[ -z "${value}" || "${value}" =~ ${date_re} ]] || { echo "Invalid ISO date: ${value}" >&2; exit 2; }
          done
          [[ -z "${single}" || ( -z "${start}" && -z "${end}" ) ]] || { echo 'date cannot be combined with start_date/end_date' >&2; exit 2; }
          [[ ( -z "${start}" && -z "${end}" ) || ( -n "${start}" && -n "${end}" ) ]] || { echo 'start_date and end_date must be supplied together' >&2; exit 2; }

          {
            echo 'enabled=true'
            echo 'operation=ingestion'
            echo 'migration='
            echo 'config_id='
            echo 'symbols='
            echo "dataset=${dataset}"
            echo "force_refresh=${force_refresh}"
            echo "disable_mart=${disable_mart}"
            echo "single=${single}"
            echo "start=${start}"
            echo "end=${end}"
            echo "request_id=${request_id}"
          } >> "${GITHUB_OUTPUT}"
          echo "Validated dev ingestion request ${request_id}: dataset=${dataset}"

      - uses: google-github-actions/auth@v2
        if: steps.request.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.request.outputs.enabled == 'true'

      - name: Execute bounded ingestion request
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          MIGRATION: ${{ steps.request.outputs.migration }}
          CONFIG_ID: ${{ steps.request.outputs.config_id }}
          SYMBOLS: ${{ steps.request.outputs.symbols }}
          DATASET: ${{ steps.request.outputs.dataset }}
          FORCE_REFRESH: ${{ steps.request.outputs.force_refresh }}
          DISABLE_MART: ${{ steps.request.outputs.disable_mart }}
          SINGLE_DATE: ${{ steps.request.outputs.single }}
          START_DATE: ${{ steps.request.outputs.start }}
          END_DATE: ${{ steps.request.outputs.end }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -Eeuo pipefail

          # Historical/API/manual operations may patch transient values onto the
          # Cloud Run Job definition. Remove them before every explicit dev request.
          gcloud run jobs update janus-ingestion-core \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --remove-env-vars="BACKFILL_START_DATE,BACKFILL_END_DATE,INGESTION_DATE,FORCE_REFRESH,JANUS_ANALYSIS_REPLAY_CONFIG,JANUS_ANALYSIS_REPLAY_SYMBOLS,JANUS_ANALYSIS_REPLAY_TIMEOUT_SECONDS" \
            --quiet

          cleanup_job_env() {
            local exit_status=$?
            trap - EXIT
            if ! gcloud run jobs update janus-ingestion-core \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --max-retries=1 \
              --remove-env-vars="BACKFILL_START_DATE,BACKFILL_END_DATE,INGESTION_DATE,FORCE_REFRESH,INGESTION_DATASETS,JANUS_CONTROL_MIGRATION,JANUS_ANALYSIS_REPLAY_CONFIG,JANUS_ANALYSIS_REPLAY_SYMBOLS,JANUS_ANALYSIS_REPLAY_TIMEOUT_SECONDS,QUEUE_CONSUMER" \
              --update-env-vars="MART_JOB=janus-intelligence-mart,GCP_REGION=${GCP_REGION},MART_OPERATION=queue" \
              --quiet; then
              echo 'Failed to restore canonical dev ingestion Job settings.' >&2
              exit_status=1
            fi
            exit "${exit_status}"
          }
          trap cleanup_job_env EXIT

          if [[ "${OPERATION}" == 'control-migration' ]]; then
            echo "Executing ${REQUEST_ID} against janus-ingestion-core (${MIGRATION})."
            gcloud run jobs execute janus-ingestion-core \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --update-env-vars="JANUS_CONTROL_MIGRATION=${MIGRATION},JANUS_ANALYSIS_REPLAY_CONFIG=,JANUS_ANALYSIS_REPLAY_SYMBOLS=,QUEUE_CONSUMER=false,MART_JOB=" \
              --wait
            exit 0
          fi

          if [[ "${OPERATION}" == 'analysis' ]]; then
            echo "Executing ${REQUEST_ID} Mart replay via janus-ingestion-core (${CONFIG_ID}: ${SYMBOLS})."
            gcloud run jobs update janus-ingestion-core \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --max-retries=0 \
              --quiet
            gcloud run jobs execute janus-ingestion-core \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --update-env-vars="JANUS_CONTROL_MIGRATION=,JANUS_ANALYSIS_REPLAY_CONFIG=${CONFIG_ID},JANUS_ANALYSIS_REPLAY_SYMBOLS=${SYMBOLS},JANUS_ANALYSIS_REPLAY_TIMEOUT_SECONDS=900,QUEUE_CONSUMER=false,MART_JOB=janus-intelligence-mart,GCP_REGION=${GCP_REGION}" \
              --wait
            exit 0
          fi

          dataset_selection="${DATASET}"
          if [[ "${DATASET}" == 'full-market-500' ]]; then
            # An empty setting selects the ingestion runtime's approved default source list.
            dataset_selection=""
          fi
          overrides=(
            "JANUS_CONTROL_MIGRATION="
            "JANUS_ANALYSIS_REPLAY_CONFIG="
            "JANUS_ANALYSIS_REPLAY_SYMBOLS="
            "INGESTION_DATASETS=${dataset_selection}"
            "FORCE_REFRESH=${FORCE_REFRESH}"
            "QUEUE_CONSUMER=false"
            "INGESTION_DATE=${SINGLE_DATE}"
            "BACKFILL_START_DATE=${START_DATE}"
            "BACKFILL_END_DATE=${END_DATE}"
          )
          if [[ "${DISABLE_MART}" == 'true' ]]; then
            overrides+=("MART_JOB=")
          fi
          env_csv="$(IFS=,; echo "${overrides[*]}")"
          echo "Executing ${REQUEST_ID} against janus-ingestion-core (${DATASET})."
          gcloud run jobs execute janus-ingestion-core \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --update-env-vars="${env_csv}" \
            --wait
