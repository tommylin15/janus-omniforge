name: P0-2 Controller dispatch diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check latest Controller execution logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Latest Controller Execution"
          LATEST=$(gcloud run jobs executions list --job=janus-batch-controller \
            --project=gen-lang-client-0593591102 --region=us-central1 \
            --limit=1 --format='value(name.basename())')
          echo "Latest: $LATEST"
          LOGS=$(gcloud logging read "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"$LATEST\"" \
            --project=gen-lang-client-0593591102 --limit=100 --format='value(timestamp,textPayload,jsonPayload.message)')
          echo "$LOGS"
          gh api repos/tommylin15/janus-omniforge/commits/${GITHUB_SHA}/comments -f body="### Controller Logs ($LATEST)
\`\`\`
$LOGS
\`\`\`" 
      - name: Check batch_occurrences for data-supplement
        run: |
          echo "## Looking for data-supplement dispatch decisions"
          LATEST=$(gcloud run jobs executions list --job=janus-batch-controller \
            --project=gen-lang-client-0593591102 --region=us-central1 \
            --limit=1 --format='value(name.basename())')
          gcloud logging read "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"$LATEST\" AND (textPayload:\"data-supplement\" OR textPayload:\"dispatch\" OR textPayload:\"occurrence\")" \
            --project=gen-lang-client-0593591102 --limit=30 --format='value(timestamp,textPayload,jsonPayload)' || echo "No dispatch logs found"
