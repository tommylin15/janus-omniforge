name: Inspect deployment controllers

on:
  push:
    branches:
      - main
    paths:
      - 'ops/deployment-controller-inspect.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect deployment controllers
        shell: bash
        run: |
          set -Eeuo pipefail
          request='ops/deployment-controller-inspect.json'
          since="$(jq -r '.since // "2026-09-23T00:00:00Z"' "${request}")"
          [[ "${since}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
            echo "invalid since timestamp: ${since}" >&2
            exit 2
          }

          for location in global "${GCP_REGION}"; do
            echo "=== Cloud Build triggers location=${location} ==="
            trigger_json="$(gcloud builds triggers list \
              --project="${GCP_PROJECT_ID}" --region="${location}" --format=json 2>/dev/null || echo '[]')"
            jq '[.[] | select(.name == "janus-ingestion-core" or .name == "janus-intelligence-mart") | {
              id,name,disabled,filename,createTime,serviceAccount,substitutions,github,repositoryEventConfig
            }]' <<<"${trigger_json}"

            echo "=== Relevant Cloud Builds location=${location} since=${since} ==="
            build_json="$(gcloud builds list \
              --project="${GCP_PROJECT_ID}" --region="${location}" \
              --filter="createTime>=\"${since}\"" --limit=100 --format=json 2>/dev/null || echo '[]')"
            jq '[.[] | select(
              (.substitutions._RUNTIME_NAME // "") == "janus-ingestion-core" or
              (.substitutions._RUNTIME_NAME // "") == "janus-intelligence-mart" or
              (.substitutions._IMAGE_NAME // "") == "ingestion-core" or
              (.substitutions._IMAGE_NAME // "") == "intelligence-mart"
            ) | {
              id,status,createTime,startTime,finishTime,buildTriggerId,substitutions,images
            }]' <<<"${build_json}"
          done

          echo '=== Current Cloud Run jobs ==='
          for job in janus-ingestion-core janus-intelligence-mart; do
            gcloud run jobs describe "${job}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='json(metadata.name,metadata.generation,metadata.annotations,spec.template.spec.template.spec.containers[0].image,status.conditions)' \
              || true
          done
