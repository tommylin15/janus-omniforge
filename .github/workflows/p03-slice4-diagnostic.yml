name: P0-3 Market Volume slice 4 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check recent ingestion-core executions
        run: |
          echo "## Recent Executions" >> "$GITHUB_STEP_SUMMARY"
          gcloud run jobs executions list --job=janus-ingestion-core \
            --project=gen-lang-client-0593591102 --region=us-central1 \
            --limit=10 --format='table(name,createTime,completionTime,succeededCount,failedCount)' >> "$GITHUB_STEP_SUMMARY"
      - name: Get logs for failed execution
        run: |
          echo "## Failed Execution Logs" >> "$GITHUB_STEP_SUMMARY"
          # Find the most recent failed execution
          FAILED_EXEC=$(gcloud run jobs executions list --job=janus-ingestion-core \
            --project=gen-lang-client-0593591102 --region=us-central1 \
            --filter="failedCount>0" --limit=1 --format='value(name)' | head -1)
          if [ -n "$FAILED_EXEC" ]; then
            EXEC_NAME=$(basename "$FAILED_EXEC")
            echo "Failed execution: $EXEC_NAME" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            gcloud logging read "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXEC_NAME\"" \
              --project=gen-lang-client-0593591102 --limit=100 --format='value(textPayload,jsonPayload)' >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No failed executions found" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check October data availability
        run: |
          echo "## October 2026 Trading Days Check" >> "$GITHUB_STEP_SUMMARY"
          echo "Checking if October 2026 has enough trading days..." >> "$GITHUB_STEP_SUMMARY"
          # October 2026: 1st is Thursday, so trading days should be available
          # But 10/18 might be a weekend or holiday
          python3 -c "
          from datetime import date
          import calendar
          year, month = 2026, 10
          cal = calendar.Calendar()
          weekdays = [d for d in cal.itermonthdays2(year, month) if d[0] != 0 and d[1] < 5]
          print(f'October 2026 weekdays (potential trading days): {len(weekdays)}')
          for d, dow in weekdays[:18]:
              print(f'  {year}-{month:02d}-{d:02d} ({calendar.day_name[dow]})')
          " >> "$GITHUB_STEP_SUMMARY"
