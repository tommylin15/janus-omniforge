name: Janus existing Cloud Build Compute viewer grant

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gce-viewer-existing-operator.yml']

permissions:
  contents: read
  id-token: write

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reuse authorized existing Cloud Build operator for bounded viewer grant
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit --no-source --project=gen-lang-client-0593591102 \
            --region=us-central1 --config=scripts/gcp/cloudbuild-gce-readonly-grant.yaml --quiet
