name: Janus GHCR reversible baseline live verification
on:
  push:
    branches: [main]
    paths:
      - 'ops/ghcr-reversible-baseline-request.json'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only and rollback contracts
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_ghcr_reversible_baseline.py tests/test_ghcr_jobs_rollout.py tests/test_ghcr_release_lease.py
      - name: Install public GHCR inspector
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify immutable API and four Jobs rollback baseline with GCP readback
        run: python scripts/gcp/ghcr_reversible_baseline.py --receipt /tmp/ghcr-reversible-baseline.json
      - name: Preserve non-sensitive live baseline proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-reversible-baseline-receipt
          path: /tmp/ghcr-reversible-baseline.json
          retention-days: 14
          if-no-files-found: ignore
