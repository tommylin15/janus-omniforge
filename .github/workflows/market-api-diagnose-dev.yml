name: Market API bounded Dev diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/market-api-diagnose-dev.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect existing revisions and bounded public request results
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe janus-api --project=gen-lang-client-0593591102 --region=us-central1 --format=json > /tmp/market-api-revisions.json
          python3 - <<'PY'
          import json,urllib.error,urllib.request,time,re
          from pathlib import Path
          service=json.loads(Path('/tmp/market-api-revisions.json').read_text())
          routes=service.get('status',{}).get('traffic') or []
          base='https://janus-api-2oo7qbkd5q-uc.a.run.app'
          candidate=next((x.get('url') for x in routes if str(x.get('tag','')).startswith('ghcr-3a67ce86f8fe') and (x.get('percent') or 0)==0),None)
          def probe(site,path):
            started=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(site+path,headers={'Accept':'application/json'}),timeout=12) as response:
                raw=response.read(180000)
                data=json.loads(raw) if path.startswith('/api/v1/') else None
                answer={'http':response.status,'elapsed_ms':round((time.monotonic()-started)*1000)}
                if path.endswith('market-home') and isinstance(data,dict):
                  section=((data.get('sections') or {}).get('taiex') or {})
                  answer.update({'date':section.get('as_of'),'source':(section.get('provenance') or {}).get('source'),'minutes':len((section.get('data') or {}).get('intraday_points') or [])})
                if path.endswith('2330') and isinstance(data,dict):
                  answer.update({'date':data.get('trade_date'),'state':data.get('quote_state'),'source':data.get('price_source')})
                return answer
            except urllib.error.HTTPError as error:
              return {'http':error.code,'elapsed_ms':round((time.monotonic()-started)*1000)}
            except Exception as error:
              return {'error_class':type(error).__name__,'elapsed_ms':round((time.monotonic()-started)*1000)}
          targets={'active':base}
          if candidate and candidate.startswith('https://'):targets['candidate']=candidate.rstrip('/')
          results={name:{path:probe(url,path) for path in ['/health','/api/v1/public/health','/api/v1/public/market-home','/api/v1/public/stock-header/2330']} for name,url in targets.items()}
          report={'scope':'existing_dev_public_routes_only','traffic':[{'percent':x.get('percent'),'tag':x.get('tag'),'revision':x.get('revisionName')} for x in routes],'ready':next((x.get('status') for x in service.get('status',{}).get('conditions',[]) if x.get('type')=='Ready'),None),'candidate_tag_found':bool(candidate),'results':results,'mutations':0,'owner_data':False}
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          Path('/tmp/market-api-sanitized.json').write_text(json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2))
          PY
      - name: Summarize bounded API failures by error class only
        shell: bash
        run: |
          set -Eeuo pipefail
          if gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="janus-api" AND timestamp>="2026-11-11T01:35:00Z"' --project=gen-lang-client-0593591102 --limit=400 --format=json > /tmp/market-api-logs.json 2>/dev/null; then
            python3 - <<'PY'
          import json,re,collections
          from pathlib import Path
          records=json.loads(Path('/tmp/market-api-logs.json').read_text())
          categories=collections.Counter()
          errors=collections.Counter()
          http_status=collections.Counter()
          frames=collections.Counter()
          for entry in records if isinstance(records,list) else []:
            message=entry.get('textPayload') or ((entry.get('jsonPayload') or {}).get('message') or '')
            if not isinstance(message,str):continue
            for prefix in ('public runtime unavailable','core runtime unavailable','quote calendar unavailable','quote refresh unavailable','intraday index points unavailable','api_request'):
              if prefix in message:categories[prefix]+=1
            kind=re.search(r'(?:public runtime unavailable|core runtime unavailable): ([A-Za-z_]+)(?::([A-Za-z_]+))?',message)
            if kind:errors[kind.group(1)+(':'+kind.group(2) if kind.group(2) else '')]+=1
            for name in re.findall(r'(?:psycopg|sqlalchemy|urllib3|requests|socket)[.\w]*?(?:Error|Timeout|Exception)|\b(?:OperationalError|InterfaceError|TimeoutError|QueryCanceled|ConnectionError|UndefinedTable|InsufficientPrivilege)\b',message):
              errors[name[-75:]]+=1
            for name in re.findall(r'File "/app/(?:services/api|packages/web_api)/([a-z_]+\.py)", line \d+, in ([a-z_]+)',message):
              frames['/'.join(name)]+=1
            if 'api_request family=public' in message:
              code=re.search(r'status=(\d{3}) duration_ms=(\d+)',message)
              if code:http_status[code.group(1)]+=1
          result={'scope':'bounded_cloud_run_errors_only','logging':'available','scanned':len(records),'categories':dict(categories),'setup_errors':dict(errors.most_common(15)),'public_http_status':dict(http_status),'frames':dict(frames.most_common(15)),'no_secret_payloads':True}
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
          else
            echo 'market_api_logging=DENIED_OR_UNAVAILABLE'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-api-sanitized-dev-diagnosis
          path: /tmp/market-api-sanitized.json
          if-no-files-found: ignore
          retention-days: 7
