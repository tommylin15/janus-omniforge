name: D04 bounded GCS backup isolated restore fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/d04-backup-restore-fallback.yml']
permissions:
  contents: read
  id-token: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Select one pre-existing daily GCS backup without writing live data
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          bucket='gen-lang-client-0593591102-dev-private'
          prefix='pilot-ledger-backups/daily/'
          latest="$(gcloud storage ls "gs://$bucket/$prefix" --project=gen-lang-client-0593591102 | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}[.]dump$' | LC_ALL=C sort | tail -1)"
          test -n "$latest"
          object="${latest#gs://$bucket/}"
          [[ "$object" =~ ^pilot-ledger-backups/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump$ ]]
          echo "object=$object" >> "$GITHUB_OUTPUT"
          echo "D04_BACKUP_OBJECT_SELECTED=EXISTING" >> "$GITHUB_STEP_SUMMARY"
      - name: Isolated restore using pre-existing Cloud Build configuration
        env:
          OBJECT: ${{ steps.backup.outputs.object }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OBJECT"
          gcloud builds submit --no-source --project=gen-lang-client-0593591102 --region=us-central1 --config=scripts/gcp/cloudbuild-ledger-restore.yaml --substitutions="_BUCKET=gen-lang-client-0593591102-dev-private,_OBJECT=$OBJECT" --quiet
          echo 'D04_ISOLATED_RESTORE_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
