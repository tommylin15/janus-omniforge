name: Janus bounded full-market business acceptance
on:
  # Explicit, one-shot GitHub main request. Not a schedule or new worker pipeline.
  push:
    branches: [main]
    paths:
      - 'ops/full-market-acceptance-request.json'
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful exact-source full GHCR release
        type: string
        required: true
      boundary_run:
        description: Successful same-source automated OAuth boundary
        type: string
        required: true
      phase:
        description: One official-data bootstrap or subsequent cache proof
        type: choice
        options: [bootstrap, cached]
        required: true
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN: ${{ inputs.release_run || '' }}
      BOUNDARY_RUN: ${{ inputs.boundary_run || '' }}
      PHASE: ${{ inputs.phase || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve explicit one-shot push request without scheduling
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          file=ops/full-market-acceptance-request.json
          target_sha="$(jq -r '.sha' ops/ghcr-candidate-request.json)"
          jq -e --arg sha "$target_sha" '
            .intent == "one-shot-full-market-business-acceptance" and
            .approved == true and .no_permanent_job_changes == true and
            .no_api_traffic_changes == true and
            .sha == $sha and
            (.release_run | type=="string" and test("^[0-9]+$")) and
            (.boundary_run | type=="string" and test("^[0-9]+$")) and
            (.jobs_run | type=="string" and test("^[0-9]+$")) and
            (.phase == "bootstrap" or .phase == "cached") and
            (if .phase == "cached" then
                (.bootstrap_run | type=="string" and test("^[0-9]+$"))
             else .bootstrap_run == null end)' "$file" >/dev/null
          jobs_run="$(jq -r '.jobs_run' "$file")"
          jobs="$(gh run view "$jobs_run" --json status,conclusion,workflowName)"
          jq -e '.status=="completed" and .conclusion=="success" and
            .workflowName=="Janus GHCR controlled Jobs rollout"' <<< "$jobs" >/dev/null
          release_run="$(jq -r '.release_run' "$file")"
          boundary_run="$(jq -r '.boundary_run' "$file")"
          jq -e --arg sha "$target_sha" --arg release "$release_run" --arg boundary "$boundary_run" \
            '.sha==$sha and .release_run==$release and .auth_boundary_run==$boundary' \
            ops/ghcr-jobs-rollout-request.json >/dev/null
          phase="$(jq -r '.phase' "$file")"
          if [[ "$phase" == cached ]]; then
            run="$(jq -r '.bootstrap_run' "$file")"
            verified="$(gh run view "$run" --json status,conclusion,workflowName)"
            jq -e '.status=="completed" and .conclusion=="success" and
              .workflowName=="Janus bounded full-market business acceptance"' <<< "$verified" >/dev/null
          fi
          {
            echo "RELEASE_RUN=$(jq -r '.release_run' "$file")"
            echo "BOUNDARY_RUN=$(jq -r '.boundary_run' "$file")"
            echo "PHASE=$phase"
          } >> "$GITHUB_ENV"
          echo "Explicit one-shot acceptance requested; no scheduler, API traffic or permanent Job mutation." >> "$GITHUB_STEP_SUMMARY"
      - name: Test bounded request and fixed-denominator business proof
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_full_market_dev_acceptance.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install anonymous public image reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Run one exact-source execution without permanent Job updates
        run: python scripts/gcp/full_market_dev_acceptance.py --release-run "$RELEASE_RUN" --boundary-run "$BOUNDARY_RUN" --phase "$PHASE" --receipt /tmp/full-market-acceptance.json
      - name: Retain sanitized business receipt and unknown operation fence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-market-business-acceptance
          path: /tmp/full-market-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
