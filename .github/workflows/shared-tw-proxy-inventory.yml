name: Shared TW proxy read-only inventory
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shared-tw-proxy-inventory.yml'
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect Janus caller and existing Taiwan proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          project=gen-lang-client-0593591102
          gcloud run services describe janus-api --project="$project" --region=us-central1 --format=json >/tmp/janus.json
          jq -r '"janus_service_account=" + (.spec.template.spec.serviceAccountName // "unknown")' /tmp/janus.json
          echo "janus_active_revision=$(jq -r '[.status.traffic[]? | select((.percent // 0)>0) | .revisionName] | first // "unknown"' /tmp/janus.json)"
          base="$(jq -r '.status.url // empty' /tmp/janus.json)"
          test -n "$base"
          live_sha="$(curl -fsS --max-time 15 "$base/app/build-id.txt")"
          [[ "$live_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "janus_live_source_sha=$live_sha"
          # Live negative authorization check; never touch Owner sessions.
          quote_http="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$base/api/v1/me/portfolio/quotes")"
          test "$quote_http" = "401" -o "$quote_http" = "403"
          echo "janus_owner_quote_anonymous_denied=PASS"
          jq -r '"janus_mis_enabled=" + ([.spec.template.spec.containers[]?.env[]? | select(.name=="JANUS_MIS_QUOTES_ENABLED") | .value] | first // "unset"),
                 "janus_proxy_fallback=" + ([.spec.template.spec.containers[]?.env[]? | select(.name=="JANUS_TW_PROXY_ENABLED") | .value] | first // "default")' /tmp/janus.json
          jq -e '[.status.traffic[]? | select((.percent//0)>0)] | length==1 and .[0].percent==100' /tmp/janus.json
          gcloud run services describe tw-activity-proxy --project="$project" --region=asia-east1 --format=json >/tmp/proxy.json
          jq -r '"proxy_service_url=" + (.status.url // "unknown"),
                 "proxy_ready=" + ([.status.conditions[]? | select(.type=="Ready") | .status] | first // "unknown"),
                 "proxy_active_revision=" + ([.status.traffic[]? | select((.percent//0)>0) | .revisionName] | first // "unknown"),
                 "proxy_ingress=" + (.metadata.annotations["run.googleapis.com/ingress"] // "default"),
                 "proxy_invoker_iam_check=" + (.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "default")' /tmp/proxy.json
          gcloud run services get-iam-policy tw-activity-proxy --project="$project" --region=asia-east1 --format=json >/tmp/iam.json
          jq -r '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]?] | map(select(.=="allUsers" or .=="allAuthenticatedUsers")) | length | "proxy_public_invoker_count=" + tostring' /tmp/iam.json
          jq -r '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(startswith("serviceAccount:"))] | unique | .[] | "proxy_invoker=" + .' /tmp/iam.json
          jq -e '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]?] as $members |
              ($members | index("allUsers") == null) and
              ($members | index("allAuthenticatedUsers") == null) and
              ($members | index("serviceAccount:janus-user-api@gen-lang-client-0593591102.iam.gserviceaccount.com") != null) and
              ($members | index("serviceAccount:postgres-vm@gen-lang-client-0593591102.iam.gserviceaccount.com") != null)' /tmp/iam.json
          echo "private_shared_proxy_invokers=PASS"

# Recheck after Life proxy source release; audit current IAM only.
