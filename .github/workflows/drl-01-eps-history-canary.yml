name: Janus DRL-01 official quarterly EPS history canary
on:
  push:
    branches: [main]
    paths: ['ops/drl-01-eps-history-request.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/gcp/drl01_eps_canary.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run existing official fundamental history route
        env:
          PYTHONPATH: .
        run: |
          if [ "$(python -c 'import json; print(str(json.load(open("ops/drl-01-eps-history-request.json"))["repair_official_history"]).lower())')" = "true" ]; then
            python scripts/gcp/drl01_eps_canary.py ops/drl-01-eps-history-request.json
          else
            echo "Read-only current-year Core acceptance; official history already attempted."
          fi
      - name: Verify independent official Core single quarters
        env:
          PYTHONPATH: .
        run: python scripts/gcp/drl01_eps_readback.py ops/drl-01-eps-history-request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drl01-eps-history-and-core-readback
          path: |
            /tmp/drl01-eps-canary.json
            /tmp/drl01-eps-core-readback.json
          if-no-files-found: ignore
          retention-days: 14
