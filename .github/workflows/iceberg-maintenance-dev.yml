name: Maintain dev Core Iceberg

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Maintenance mode
        required: true
        type: choice
        default: health
        options:
          - health
          - compact-dry-run
          - compact-apply
          - dry-run
          - apply
          - retention-dry-run
          - retention-apply
  push:
    branches: [main]
    paths:
      - 'ops/iceberg-maintenance-mode'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-ingestion-operation
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve bounded maintenance mode
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            MODE="$(tr -d '[:space:]' < ops/iceberg-maintenance-mode)"
          else
            MODE='${{ inputs.mode }}'
          fi
          case "${MODE}" in
            health) EXPECTED_COMPONENT='iceberg-health' ;;
            compact-dry-run|compact-apply) EXPECTED_COMPONENT='iceberg-compaction' ;;
            dry-run|apply) EXPECTED_COMPONENT='iceberg-maintenance' ;;
            retention-dry-run|retention-apply) EXPECTED_COMPONENT='data-retention' ;;
            *) echo "Unsupported maintenance mode: ${MODE}" >&2; exit 2 ;;
          esac
          echo "MODE=${MODE}" >> "${GITHUB_ENV}"
          echo "EXPECTED_COMPONENT=${EXPECTED_COMPONENT}" >> "${GITHUB_ENV}"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run bounded maintenance on existing dev Core
        shell: bash
        run: |
          set -Eeuo pipefail
          executions="$(gcloud run jobs executions list \
            --job=janus-ingestion-core \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --limit=20 --format=json)"
          if [[ "$(jq '[.[] | select(.status.completionTime == null)] | length' <<< "${executions}")" != '0' ]]; then
            echo 'An ingestion execution is still running; retry maintenance after it completes.' >&2
            exit 1
          fi
          execution="$(gcloud run jobs execute janus-ingestion-core \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --update-env-vars="ICEBERG_MAINTENANCE_MODE=${MODE},QUEUE_CONSUMER=false,MART_JOB=,JANUS_CONTROL_MIGRATION=,JANUS_DATA_SUPPLEMENT_MODE=,JANUS_SERVING_SCHEMA_MIGRATION=" \
            --wait --format='value(metadata.name)')"
          test -n "${execution}"
          execution_name="${execution##*/}"
          echo "maintenance_mode=${MODE}"
          echo "execution=${execution_name}"

          evidence=''
          entries='[]'
          for attempt in $(seq 1 12); do
            entries="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"janus-ingestion-core\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution_name}\"" \
              --project=gen-lang-client-0593591102 \
              --freshness=20m \
              --limit=200 \
              --order=asc \
              --format=json)"
            evidence="$(jq -c --arg component "${EXPECTED_COMPONENT}" \
              '[.[] | .jsonPayload? | select(.component == $component)] | last // empty' <<< "${entries}")"
            if [[ -z "${evidence}" ]]; then
              evidence="$(jq -c --arg component "${EXPECTED_COMPONENT}" \
                '[.[] | .textPayload? | select(type == "string") | (try fromjson catch empty) | select(.component == $component)] | last // empty' \
                <<< "${entries}")"
            fi
            if [[ -n "${evidence}" ]]; then
              break
            fi
            if [[ "${attempt}" != '12' ]]; then
              sleep 5
            fi
          done

          if [[ -z "${evidence}" ]]; then
            echo "Expected maintenance evidence component not found: ${EXPECTED_COMPONENT}" >&2
            jq -c '[.[] | {severity, log_name: .logName, component: (.jsonPayload.component // null)}]' <<< "${entries}" >&2
            exit 1
          fi
          echo "maintenance_evidence=${evidence}"
