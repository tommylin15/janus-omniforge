name: Maintain dev Iceberg financials

on:
  schedule:
    # Sunday 12:00 Asia/Taipei, after the daily 07:30 ingestion.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Maintenance mode
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-ingestion-operation
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Maintain existing dev financials table
        env:
          MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${MODE}" == 'apply' || "${MODE}" == 'dry-run' ]] || exit 2
          executions="$(gcloud run jobs executions list \
            --job=janus-ingestion-core \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --limit=20 --format=json)"
          if [[ "$(jq '[.[] | select(.status.completionTime == null)] | length' <<< "${executions}")" != '0' ]]; then
            echo 'An ingestion execution is still running; retry maintenance later.' >&2
            exit 1
          fi
          gcloud run jobs execute janus-ingestion-core \
            --project=gen-lang-client-0593591102 \
            --region=us-central1 \
            --update-env-vars="ICEBERG_MAINTENANCE_MODE=${MODE},QUEUE_CONSUMER=false,MART_JOB=,JANUS_CONTROL_MIGRATION=" \
            --wait
