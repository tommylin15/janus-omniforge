name: Research cloud cohort 500 execution diagnostic

on:
  push:
    branches:
      - main
    paths:
      - 'research/cloud-cohort-500/EXEC_DIAG_REQUEST.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  RESEARCH_JOB: janus-research-big-move-500
  RESEARCH_BUCKET: gen-lang-client-0593591102-dev-research-big-move-500
  RESEARCH_PREFIX: research/big-move-cloud-cohort-500

jobs:
  execution-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read execution/build metadata or export matched result
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p research-result
          python - <<'PY' > /tmp/diag.env
          import json
          from pathlib import Path
          p=json.loads(Path('research/cloud-cohort-500/EXEC_DIAG_REQUEST.json').read_text())
          print('EXECUTION_NAME=' + str(p.get('execution_name','')))
          print('BUILD_ID=' + str(p.get('build_id','')))
          print('EXPORT_REVISION=' + str(p.get('export_revision','')))
          PY
          set -a
          source /tmp/diag.env
          set +a
          if [ -n "${EXECUTION_NAME}" ]; then
            gcloud run jobs executions describe "${EXECUTION_NAME}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json \
              > research-result/execution_detail.json
            gcloud run jobs executions list \
              --job="${RESEARCH_JOB}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --limit=5 --sort-by='~createTime' --format=json \
              > research-result/recent_executions.json
          fi
          if [ -n "${BUILD_ID}" ]; then
            gcloud builds describe "${BUILD_ID}" \
              --project="${GCP_PROJECT_ID}" --format=json \
              > research-result/build_detail.json
          fi
          if [ -n "${EXPORT_REVISION}" ]; then
            mkdir -p research-result/matched
            base="gs://${RESEARCH_BUCKET}/${RESEARCH_PREFIX}/revisions/${EXPORT_REVISION}/matched"
            for f in summary.json control_assignments.csv unmatched_events.csv paired_features.csv feature_comparison.csv feature_by_year.csv; do
              gcloud storage cp "${base}/${f}" "research-result/matched/${f}"
            done
            python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path('research-result/matched/summary.json').read_text())
          assert s['status']=='ok'
          assert s['run_id']==os.environ['EXPORT_REVISION']
          assert s['feature_gate']['decision']=='DESCRIPTIVE_READY'
          print('matched result export: PASS')
          PY
          fi
          if [ -f research-result/build_detail.json ]; then
            cat research-result/build_detail.json
          elif [ -f research-result/execution_detail.json ]; then
            cat research-result/execution_detail.json
          elif [ -f research-result/matched/summary.json ]; then
            cat research-result/matched/summary.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: research-cloud-cohort-500-exec-diagnostic-${{ github.sha }}
          path: research-result/
          if-no-files-found: error
          retention-days: 7
