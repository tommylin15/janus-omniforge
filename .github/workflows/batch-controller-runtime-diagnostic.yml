name: Batch controller runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-controller-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB_NAME: janus-batch-controller
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify skipped-state constraint hypothesis
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/batch_diag.py <<'PY'
          import json
          import sys
          import psycopg
          from ingestion_core.__main__ import _control_plane
          from packages.mobile_ledger_queue import probe_mobile_ledger_queue

          control = _control_plane()
          connection = control.connection
          try:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT occurrence_id,state
                        FROM control.batch_occurrences
                       WHERE state->>'status'='pending'
                         AND state->>'batch'='mobile-ledger'
                       ORDER BY scheduled_at
                       LIMIT 1
                  """)
                  row = cursor.fetchone()
              queue_pending = bool(probe_mobile_ledger_queue(write=False)["pending"])
              if row is None:
                  sys.exit(71)
              if queue_pending:
                  sys.exit(72)
              occurrence_id, state = row
              skipped = {**state, "status": "skipped", "reason": "queue_empty"}
              try:
                  with connection.transaction():
                      connection.execute(
                          "UPDATE control.batch_occurrences SET state=%s::jsonb WHERE occurrence_id=%s",
                          (json.dumps(skipped), occurrence_id),
                      )
                      raise RuntimeError("force rollback")
              except psycopg.errors.CheckViolation:
                  sys.exit(73)
              except RuntimeError:
                  sys.exit(74)
              except psycopg.Error:
                  sys.exit(75)
          finally:
              control.close()
          PY
          export BATCH_DIAG_CODE="$(base64 -w0 /tmp/batch_diag.py)"
          wrapper='import base64;import os;exec(base64.b64decode(os.environ["BATCH_DIAG_CODE"]))'
          set +e
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --args="-c,${wrapper}" --update-env-vars="BATCH_DIAG_CODE=${BATCH_DIAG_CODE}" \
            --task-timeout=5m --wait
          execute_code=$?
          set -e
          execution="$(gcloud run jobs executions list --job="${JOB_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --limit=1 --format='value(metadata.name)')"
          echo "diagnostic_execution=${execution} gcloud_exit=${execute_code}"
          gcloud run jobs executions describe "${execution}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='yaml(metadata.name,status.startTime,status.completionTime,status.succeededCount,status.failedCount,status.conditions)'
