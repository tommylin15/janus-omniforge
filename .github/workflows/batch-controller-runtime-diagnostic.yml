name: Batch controller runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-controller-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB_NAME: janus-batch-controller
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Classify active-mode failure
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/batch_diag.py <<'PY'
          import sys
          from datetime import datetime
          import google.auth
          from google.auth.transport.requests import AuthorizedSession
          from ingestion_core.__main__ import _control_plane
          from ingestion_core.batch_controller import BATCHES, due_batches, job_active

          control = _control_plane()
          connection = control.connection
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT count(*) FROM control.batch_occurrences WHERE state->>'status' IN ('dispatching','running','ambiguous')")
                  if cursor.fetchone()[0] > 100:
                      sys.exit(31)
                  cursor.execute("SELECT occurrence_id,state FROM control.batch_occurrences WHERE state->>'status'='pending' ORDER BY scheduled_at,occurrence_id")
                  pending = cursor.fetchall()
              if len(pending) > 100:
                  sys.exit(32)
              batches = {batch.name: batch for batch in BATCHES}
              for occurrence_id, state in pending:
                  batch_name = state.get("batch")
                  if batch_name not in batches:
                      sys.exit(33)
                  if state.get("origin") == "manual":
                      continue
                  scheduled_text = state.get("scheduled_at")
                  if not scheduled_text:
                      sys.exit(34)
                  try:
                      due_row = next((row for row in due_batches(datetime.fromisoformat(scheduled_text)) if row[0] == occurrence_id), None)
                  except Exception:
                      sys.exit(34)
                  if due_row is None:
                      sys.exit(34)
              credentials, _ = google.auth.default(scopes=("https://www.googleapis.com/auth/cloud-platform",))
              session = AuthorizedSession(credentials)
              jobs = sorted({job for batch in BATCHES for job in (batch.exclusive_jobs or (batch.job,))})
              try:
                  for job in jobs:
                      job_active(session, job)
              except Exception:
                  sys.exit(35)
              sys.exit(0)
          finally:
              control.close()
          PY
          export BATCH_DIAG_CODE="$(base64 -w0 /tmp/batch_diag.py)"
          wrapper='import base64;import os;exec(base64.b64decode(os.environ["BATCH_DIAG_CODE"]))'
          set +e
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --args="-c,${wrapper}" \
            --update-env-vars="BATCH_DIAG_CODE=${BATCH_DIAG_CODE}" \
            --task-timeout=5m \
            --wait
          execute_code=$?
          set -e
          execution="$(gcloud run jobs executions list \
            --job="${JOB_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --limit=1 --format='value(metadata.name)')"
          echo "diagnostic_execution=${execution} gcloud_exit=${execute_code}"
          gcloud run jobs executions describe "${execution}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='yaml(metadata.name,status.startTime,status.completionTime,status.succeededCount,status.failedCount,status.conditions)'
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
            --project="${GCP_PROJECT_ID}" --limit=50 --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
