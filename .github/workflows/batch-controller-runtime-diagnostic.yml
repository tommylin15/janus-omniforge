name: Batch controller runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-controller-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB_NAME: janus-batch-controller
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Classify dry-run exception
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/batch_diag.py <<'PY'
          import os
          import sys
          import psycopg
          import requests
          from ingestion_core import batch_controller as controller
          from ingestion_core.__main__ import _control_plane

          os.environ["GCP_PROJECT_ID"] = "gen-lang-client-0593591102"
          os.environ["BATCH_CONTROLLER_MODE"] = "active"
          os.environ["BATCH_CONTROLLER_NOT_BEFORE"] = "2026-10-02T04:05:00Z"
          os.environ["CLOUD_RUN_EXECUTION"] = "batch-controller-dry-run"

          control = _control_plane()
          connection = control.connection
          controller.dispatch_job = lambda *args, **kwargs: (_ for _ in ()).throw(RuntimeError("diagnostic dispatch blocked"))
          controller.export_events = lambda *args, **kwargs: 0
          try:
              connection.execute("BEGIN")
              try:
                  result = controller.run(control=control, core=object())
                  if result.get("status") == "controller_busy":
                      sys.exit(66)
              except psycopg.Error:
                  sys.exit(51)
              except TypeError:
                  sys.exit(52)
              except AttributeError:
                  sys.exit(53)
              except IndexError:
                  sys.exit(54)
              except AssertionError:
                  sys.exit(55)
              except requests.RequestException:
                  sys.exit(56)
              except KeyError:
                  sys.exit(57)
              except StopIteration:
                  sys.exit(58)
              except ValueError:
                  sys.exit(59)
              except RuntimeError:
                  sys.exit(60)
              except OSError:
                  sys.exit(61)
              except LookupError:
                  sys.exit(62)
              except Exception:
                  sys.exit(65)
              finally:
                  connection.rollback()
              sys.exit(0)
          finally:
              control.close()
          PY
          export BATCH_DIAG_CODE="$(base64 -w0 /tmp/batch_diag.py)"
          wrapper='import base64;import os;exec(base64.b64decode(os.environ["BATCH_DIAG_CODE"]))'
          set +e
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --args="-c,${wrapper}" --update-env-vars="BATCH_DIAG_CODE=${BATCH_DIAG_CODE}" \
            --task-timeout=5m --wait
          execute_code=$?
          set -e
          execution="$(gcloud run jobs executions list --job="${JOB_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --limit=1 --format='value(metadata.name)')"
          echo "diagnostic_execution=${execution} gcloud_exit=${execute_code}"
          gcloud run jobs executions describe "${execution}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='yaml(metadata.name,status.startTime,status.completionTime,status.succeededCount,status.failedCount,status.conditions)'
