name: Batch controller runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-controller-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB_NAME: janus-batch-controller
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read recent controller executions
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs describe "${JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='yaml(metadata.name,metadata.generation,spec.template.spec.template.spec.containers[0].image,status.conditions)'

          gcloud run jobs executions list \
            --job="${JOB_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --limit=20 --format=json > /tmp/executions.json

          jq -r '.[] | [
            .metadata.name,
            ([.. | objects | select(has("name") and .name=="BATCH_CONTROLLER_MODE") | .value][0] // "default"),
            (.status.startTime // ""),
            (.status.completionTime // ""),
            (.status.succeededCount // 0),
            (.status.failedCount // 0),
            (.status.cancelledCount // 0),
            (.status.conditions[0].message // "")
          ] | @tsv' /tmp/executions.json

          echo '=== non-active probe details ==='
          jq -r '.[] | select(([.. | objects | select(has("name") and .name=="BATCH_CONTROLLER_MODE") | .value][0] // "active") != "active") | .metadata.name' /tmp/executions.json |
          while read -r execution; do
            [ -z "${execution}" ] && continue
            gcloud run jobs executions describe "${execution}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='yaml(metadata.name,status.startTime,status.completionTime,status.succeededCount,status.failedCount,status.cancelledCount,status.conditions)'
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
              --project="${GCP_PROJECT_ID}" --limit=50 --order=asc \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          done
