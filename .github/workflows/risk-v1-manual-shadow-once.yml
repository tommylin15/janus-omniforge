name: Risk XGBoost one-shot dev shadow EOD
on:
  push:
    branches: [main]
    paths: ['ops/risk-v1-manual-shadow-request.json']
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  # Shared with GHCR Jobs rollout: never execute against an in-flight update.
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  run-once:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 42
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      JOB: janus-intelligence-mart
      ROLLOUT_RUN: '39775830718'
      RELEASE_RUN: '39773463340'
      SOURCE_SHA: a80ac6ecdd1ce8f7f07295a8158ae6d540dea2e1
      MODEL_SHA: 36c77d0168a1d667223ab915c9b08fd2c1c6608f9f7db2fc046204e922854044
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact single-run approval and successful prior Jobs rollout
        id: guard
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e --arg rollout "$ROLLOUT_RUN" --arg release "$RELEASE_RUN" --arg source "$SOURCE_SHA" --arg model "$MODEL_SHA" '
            .enabled==true and .intent=="one-shot-risk-shadow-eod" and
            .environment=="dev" and
            (.run_once==true or (.run_once==false and
              .readback_execution=="janus-intelligence-mart-5rv6r" and
              .readback_event_uri=="gs://gen-lang-client-0593591102-dev-mart/acceptance/specialists/risk-shadow-once-2026-10-21-a65b43111a821f43.json")) and
            .publication_allowed==false and .no_job_config_changes==true and
            .no_api_traffic_changes==true and .no_new_scheduler==true and
            .rollout_run==$rollout and .release_run==$release and
            .source_sha==$source and .model_sha256==$model and
            .screening_date=="PRIOR_COMPLETED_CORE_PINNED" and
            (.request_id|type=="string" and test("^[A-Za-z0-9._-]{1,80}$"))
          ' ops/risk-v1-manual-shadow-request.json >/dev/null
          gh run view "$ROLLOUT_RUN" --json status,conclusion,headSha,jobs > /tmp/rollout.json
          jq -e --arg source "f8b06abd0322c89413fa2ec80b51fcc0587685c1" '
            .status=="completed" and .conclusion=="success" and .headSha==$source and
            (.jobs|any(.name=="jobs-rollout" and .conclusion=="success"))
          ' /tmp/rollout.json >/dev/null
          gh run view "$RELEASE_RUN" --json status,conclusion,headSha,jobs > /tmp/release.json
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="completed" and .conclusion=="success" and .headSha==$sha and
            (.jobs|any(.name=="release-verify" and .conclusion=="success"))
          ' /tmp/release.json >/dev/null
          if test "$(jq -r .run_once ops/risk-v1-manual-shadow-request.json)" = true; then
            echo "mode=execute" >> "$GITHUB_OUTPUT"
          else
            echo "mode=readback" >> "$GITHUB_OUTPUT"
          fi
          echo "Rollout+Release gate PASS; shadow execution or exact readback only" >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify immutable Mart image and no concurrent Job execution
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-intelligence-mart:sha-${SOURCE_SHA}" > /tmp/expected-mart.json
          digest="$(jq -r '.Digest' /tmp/expected-mart.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # gcloud CLI job describe uses a different schema than the Cloud Run
          # v2 API. Reuse the exact reconciled v2 resolver already proven by
          # reversible four-Jobs rollout; preserve the immutable SHA gate.
          EXPECTED_DIGEST="$digest" python3 - <<'PY'
          import os,sys
          sys.path.insert(0, 'scripts/gcp')
          from ghcr_jobs_rollout import image,job
          expected='ghcr.io/tommylin15/janus-intelligence-mart@'+os.environ['EXPECTED_DIGEST']
          if image(job('janus-intelligence-mart'))!=expected:
              raise SystemExit('mart_exact_image_mismatch')
          print('Mart Cloud Run v2 exact GHCR digest PASS')
          PY
          gcloud run jobs executions list --job="$JOB" --region="$REGION" --project="$PROJECT" --limit=30 --format=json > /tmp/executions-before.json
          jq -e '[.[] | select((.status.completionTime // "") == "")] | length == 0' /tmp/executions-before.json >/dev/null
          echo "Mart exact-image identity and no running executions PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Core date resolver without live mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q pytest==8.4.2
          python -m pytest -q tests/test_risk_shadow_asof.py
      - name: Resolve latest eligible real Core EOD date
        shell: bash
        run: |
          set -Eeuo pipefail
          if test "${{ steps.guard.outputs.mode }}" = readback; then
            # Read the exact acceptance event recorded in the completed execution;
            # no latest-selector drift and no second prediction dispatch.
            event_uri="$(jq -r .readback_event_uri ops/risk-v1-manual-shadow-request.json)"
            gcloud storage cat "$event_uri" --project "$PROJECT" > /tmp/risk-core-event.json
            EXACT_EVENT_URI="$event_uri" python - <<'PY'
          import json,hashlib,subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          event=json.loads(Path('/tmp/risk-core-event.json').read_text())
          assert event['analysisAsOf']=='2026-10-21'
          assert event['coreSnapshotUri'].startswith('gs://gen-lang-client-0593591102-dev-core/executions/')
          assert event['coreSnapshotUri'].endswith('/core-snapshot.json')
          source=subprocess.check_output(['gcloud','storage','cat',event['coreSnapshotUri'],
              '--project','gen-lang-client-0593591102'],timeout=60)
          assert 'sha256:'+hashlib.sha256(source).hexdigest()==event['coreSnapshotHash']
          core=json.loads(source)
          assert core['snapshot_id']==event['coreSnapshotId']
          assert core['analysis_as_of']==event['analysisAsOf']
          age=(datetime.now(ZoneInfo('Asia/Taipei')).date()-
              datetime.strptime(event['analysisAsOf'],'%Y-%m-%d').date()).days
          assert 0<=age<=7
          Path('/tmp/risk-core-asof.json').write_text(json.dumps({
              'analysis_as_of':event['analysisAsOf'],'age_days':age,
              'core_snapshot_hash':event['coreSnapshotHash'][7:]},sort_keys=True))
          with open(__import__('os').environ['GITHUB_ENV'],'a') as f:
              f.write('SCREENING_DATE='+event['analysisAsOf']+'\n')
              f.write('MART_ACCEPTANCE_INPUT_URI='+__import__('os').environ['EXACT_EVENT_URI']+'\n')
          print('Pinned previous Risk EOD Core identity+hash verified; no GCP writes')
          PY
          else
            python scripts/gcp/risk_shadow_asof.py --github-env "$GITHUB_ENV" --receipt /tmp/risk-core-asof.json --event /tmp/risk-core-event.json
          fi
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          as_of=json.loads(Path('/tmp/risk-core-asof.json').read_text())['analysis_as_of']
          today=datetime.now(ZoneInfo('Asia/Taipei')).date()
          if as_of >= today.isoformat():
              raise SystemExit('latest_core_not_prior_completed_trading_day')
          print('Prior completed Core business day confirmed: '+as_of)
          PY
          echo "Resolved actual prior Core date (not a hardcoded business date)" >> "$GITHUB_STEP_SUMMARY"
      - name: Pin reviewed prior-day Core event in existing Mart acceptance prefix
        if: steps.guard.outputs.mode == 'execute'
        shell: bash
        run: |
          set -Eeuo pipefail
          # Single existing dev Mart bucket; no job config/Scheduler changes.
          hash="$(sha256sum /tmp/risk-core-event.json | cut -c1-16)"
          target="gs://gen-lang-client-0593591102-dev-mart/acceptance/specialists/risk-shadow-once-${SCREENING_DATE}-${hash}.json"
          if ! gcloud storage ls "$target" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud storage cp --no-clobber /tmp/risk-core-event.json "$target" --project "$PROJECT" >/dev/null
          fi
          gcloud storage cat "$target" --project "$PROJECT" > /tmp/risk-core-event-readback.json
          cmp /tmp/risk-core-event.json /tmp/risk-core-event-readback.json
          echo "MART_ACCEPTANCE_INPUT_URI=$target" >> "$GITHUB_ENV"
          echo "Pinned prior EOD Core manifest hash verified in existing Mart acceptance GCS prefix" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute one pinned-prior-EOD Risk shadow only
        if: steps.guard.outputs.mode == 'execute'
        shell: bash
        run: |
          set -Eeuo pipefail
          # market-screening-acceptance independently validates the Core URI/hash,
          # required market date and immutable snapshot. Never run latest intraday Core.
          test -n "$SCREENING_DATE"
          test -n "$MART_ACCEPTANCE_INPUT_URI"
          gcloud run jobs execute "$JOB" --project "$PROJECT" --region "$REGION" \
            --update-env-vars="MART_OPERATION=market-screening-acceptance,MART_RISK_SHADOW_ENABLED=true,MART_AI_ENABLED=false,MART_OOS_EVALUATION=false,MART_PRODUCT_PROJECTION=false,MART_ACCEPTANCE_INPUT_URI=${MART_ACCEPTANCE_INPUT_URI},SCREENING_DATE=${SCREENING_DATE}" \
            --wait --format=json > /tmp/execute-result.json
          echo "One pinned-prior Core Risk shadow acceptance completed; no persistent Job config or traffic changes" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify actual new execution and immutable shadow report
        shell: bash
        run: |
          set -Eeuo pipefail
          if test "${{ steps.guard.outputs.mode }}" = readback; then
            # Exact completed execution reference, obtained from the original
            # successful Cloud Run call. Do not infer from two bounded list
            # windows (whose truncation can introduce false identities).
            python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/gcp')
          from ghcr_jobs_rollout import cloud,ROOT,terminal
          name='janus-intelligence-mart-5rv6r'
          data=cloud(f'{ROOT}/jobs/janus-intelligence-mart/executions/{name}')
          assert data.get('name')==f'{ROOT}/jobs/janus-intelligence-mart/executions/{name}'
          assert terminal(data) and int(data.get('succeededCount',0))>=1
          assert int(data.get('failedCount',0))==0 and data.get('completionTime')
          Path('/tmp/manual-execution-name').write_text(name)
          print('Exact historical Risk Mart execution completed successfully:',name)
          PY
          else
            gcloud run jobs executions list --job="$JOB" --region="$REGION" --project="$PROJECT" --limit=35 --format=json > /tmp/executions-after.json
            python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/executions-before.json').read_text())
          after=json.loads(Path('/tmp/executions-after.json').read_text())
          old={x.get('metadata',{}).get('name') or x.get('name') for x in before}
          created=[x for x in after if (x.get('metadata',{}).get('name') or x.get('name')) not in old]
          if len(created)!=1:
              raise SystemExit('manual_shadow_execution_identity_not_unique')
          x=created[0]
          status=x.get('status') or {}
          if not status.get('completionTime') or int(status.get('failedCount',0))>0 or int(status.get('succeededCount',0))<1:
              raise SystemExit('manual_shadow_execution_not_successful')
          Path('/tmp/manual-execution-name').write_text(str(x.get('metadata',{}).get('name') or x.get('name')))
          print('Manual Risk shadow execution verified: completed=true; succeeded_count='+str(status['succeededCount']))
            PY
          fi
          # Untrusted/owner payloads do not go to Actions logs. Print aggregate only.
          gcloud storage ls --recursive "gs://gen-lang-client-0593591102-dev-mart/risk-shadow/" --project "$PROJECT" > /tmp/shadow-uris.txt
          python - <<'PY'
          from pathlib import Path
          lines=[x for x in Path('/tmp/shadow-uris.txt').read_text().splitlines() if x.endswith('.json')]
          if not lines or len(lines)>100:
              raise SystemExit('risk_shadow_artifact_count_out_of_bounds')
          Path('/tmp/risk-shadow-uris.json').write_text(__import__('json').dumps(lines))
          print('Risk shadow artifact candidates:',len(lines))
          PY
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          urls=json.loads(Path('/tmp/risk-shadow-uris.json').read_text())
          as_of=json.loads(Path('/tmp/risk-core-asof.json').read_text())['analysis_as_of']
          event=json.loads(Path('/tmp/risk-core-event.json').read_text())
          matching=[]
          for u in urls:
              p=subprocess.run(['gcloud','storage','cat',u,'--project=gen-lang-client-0593591102'],
                               capture_output=True,check=True)
              data=json.loads(p.stdout)
              # Historical same-date failed artifacts are out of scope; only
              # the exact pinned immutable manifest may pass this receipt.
              if (data.get('analysis_as_of')==as_of
                  and data.get('model_sha256')=='36c77d0168a1d667223ab915c9b08fd2c1c6608f9f7db2fc046204e922854044'
                  and data.get('core_snapshot_id')==event['coreSnapshotId']
                  and data.get('source_manifest_hash')==event['coreSnapshotHash']):
                  if data.get('publication_allowed') is not False or data.get('status')!='SHADOW_UNVALIDATED':
                      raise SystemExit('risk_shadow_publication_boundary_failed')
                  if not isinstance(data.get('rows'),list) or len(data['rows'])<1:
                      raise SystemExit('risk_shadow_empty_predictions')
                  matching.append((u,len(data['rows']),data.get('core_snapshot_id')))
          if len(matching)!=1:
              raise SystemExit('risk_shadow_date_model_artifact_not_unique')
          uri,n,snapshot=matching[0]
          with open('/tmp/risk-shadow-sanitized.json','w') as out:
              json.dump({'status':'PASS','analysis_as_of':as_of,'model_sha256':'36c77d0168a1d667223ab915c9b08fd2c1c6608f9f7db2fc046204e922854044',
                         'eligible_symbols':n,'publication_allowed':False,'artifact_uri':uri,'snapshot_id':snapshot},out)
          print('Risk shadow real Core batch: date='+as_of+'; eligible_symbols='+str(n)+'; publication_allowed=false')
          PY
          cat /tmp/risk-shadow-sanitized.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized manual-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-v1-one-shot-shadow-receipt
          path: /tmp/risk-shadow-sanitized.json
          if-no-files-found: ignore
          retention-days: 14
