name: Backfill dev corporate actions history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Backfill start date (YYYY-MM-DD)
        required: true
        default: '2024-01-01'
        type: string
      end_date:
        description: Backfill end date (YYYY-MM-DD, empty for today)
        required: false
        default: ''
        type: string
      include_rights_detail:
        description: Fetch TWSE TWT49UDetail for stock-dividend ratios
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-ingestion-operation
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch TWSE/TPEx historical corporate actions and upsert to Dev Postgres
        run: |
          python scripts/gcp/backfill_corporate_actions_dev.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --include-rights-detail "${{ inputs.include_rights_detail }}" \
            --receipt /tmp/corporate-actions-backfill.json
      - name: Upload backfill receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corporate-actions-backfill-receipt
          path: /tmp/corporate-actions-backfill.json
          if-no-files-found: ignore
          retention-days: 14
