name: Janus GHCR operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        type: choice
        options:
          - verify
          - lease-check
          - release
          - candidate
          - preview
          - promote
          - jobs-rollout
          - jobs-baseline
          - auth-boundary
      release-run:
        description: 'Release run ID (for candidate/promote/jobs)'
        type: string
      jobs-run:
        description: 'Jobs rollout run ID (for promote)'
        type: string
  push:
    branches: [main]
    paths:
      - 'ops/ghcr-release-request.json'
      - 'ops/ghcr-candidate-request.json'
      - 'ops/ghcr-preview-request.json'
      - 'ops/ghcr-api-promote-request.json'
      - 'ops/ghcr-jobs-rollout-request.json'
      - 'ops/ghcr-candidate-boundary-request.json'

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.event.inputs.operation == 'verify' && 'janus-dev-verification' || 'janus-dev-runtime-writers' }}
  cancel-in-progress: false

env:
  PROJECT: gen-lang-client-0593591102
  REGION: us-central1
  SERVICE: janus-api

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.detect.outputs.operation }}
      release-run: ${{ steps.detect.outputs.release-run }}
      jobs-run: ${{ steps.detect.outputs.jobs-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        run: |
          if [[ -n "${{ github.event.inputs.operation }}" ]]; then
            echo "operation=${{ github.event.inputs.operation }}" >> "$GITHUB_OUTPUT"
            echo "release-run=${{ github.event.inputs.release-run }}" >> "$GITHUB_OUTPUT"
            echo "jobs-run=${{ github.event.inputs.jobs-run }}" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD~1 HEAD -- ops/ghcr-*.json 2>/dev/null || echo "")
            case "$changed" in
              *release-request*) echo "operation=release" >> "$GITHUB_OUTPUT" ;;
              *candidate-boundary*) echo "operation=auth-boundary" >> "$GITHUB_OUTPUT" ;;
              *candidate-request*) echo "operation=candidate" >> "$GITHUB_OUTPUT" ;;
              *preview-request*) echo "operation=preview" >> "$GITHUB_OUTPUT" ;;
              *promote-request*) 
                echo "operation=promote" >> "$GITHUB_OUTPUT"
                echo "release-run=$(jq -r '.release_run // empty' ops/ghcr-api-promote-request.json)" >> "$GITHUB_OUTPUT"
                echo "jobs-run=$(jq -r '.jobs_run // empty' ops/ghcr-api-promote-request.json)" >> "$GITHUB_OUTPUT"
                ;;
              *jobs-rollout*) 
                echo "operation=jobs-rollout" >> "$GITHUB_OUTPUT"
                echo "release-run=$(jq -r '.release_run // empty' ops/ghcr-jobs-rollout-request.json)" >> "$GITHUB_OUTPUT"
                ;;
              *) echo "operation=none" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  lease-check:
    needs: detect
    if: needs.detect.outputs.operation == 'lease-check'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          gcp-auth: 'false'
      - run: python -m pytest -q tests/test_ghcr_release_lease.py
      - name: Check current-main lease without GCP operations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gcp/ghcr_release_lease.py inspect
          python scripts/gcp/ghcr_release_lease.py acquire
          trap 'python scripts/gcp/ghcr_release_lease.py release --safe-to-release' EXIT
          python scripts/gcp/ghcr_release_lease.py assert
          python scripts/gcp/ghcr_release_lease.py release --safe-to-release
          trap - EXIT
          python scripts/gcp/ghcr_release_lease.py inspect

  # ============ RELEASE ============
  release-tests:
    needs: detect
    if: needs.detect.outputs.operation == 'release' || needs.detect.outputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: janus_analysis_test
          POSTGRES_PASSWORD: analysis_ci_only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d janus_analysis_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: full
          gcp-auth: 'false'
      - name: Install extra deps
        run: pip install --disable-pip-version-check -q google-cloud-bigquery==3.46.1
      - name: Run Python tests
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
          ANALYSIS_TEST_DSN: postgresql://postgres:analysis_ci_only@127.0.0.1:5432/janus_analysis_test
        run: |
          python -m pytest -q tests \
            --ignore=tests/stage_core_tests/test_2330_closed_loop.py \
            --ignore=tests/test_scheduler.py \
            --ignore=tests/test_web_auth.py \
            --ignore=tests/test_web_runtime.py \
            --ignore=tests/test_web_server.py \
            --deselect=tests/test_pilot_readiness.py::PilotReadinessTests::test_baseline_records_all_revision_dimensions \
            --deselect=tests/test_pilot_readiness.py::PilotReadinessTests::test_migration_and_backup_are_bounded_and_append_preserving

  release-flutter:
    needs: detect
    if: needs.detect.outputs.operation == 'release' || needs.detect.outputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/user_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Flutter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          python3 tool/generate_brand_assets.py
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test
          flutter build web --release -t lib/final_visual.dart --base-href /app/

  release-publish:
    needs: [detect, release-tests, release-flutter]
    if: needs.detect.outputs.operation == 'release' && needs.release-tests.result == 'success' && needs.release-flutter.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        component: [ingestion-core, intelligence-mart, private-pipeline, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          COMPONENT: ${{ matrix.component }}
          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}
          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}
        run: |
          image="ghcr.io/tommylin15/janus-${COMPONENT}:sha-${GITHUB_SHA}"
          args=(--platform linux/amd64 --provenance=false --push
                --label "org.opencontainers.image.source=https://github.com/tommylin15/janus-omniforge"
                --label "org.opencontainers.image.revision=${GITHUB_SHA}"
                --build-arg "JANUS_GIT_SHA=${GITHUB_SHA}" -t "${image}")
          case "${COMPONENT}" in
            ingestion-core) dockerfile="jobs/ingestion-core/Dockerfile" ;;
            intelligence-mart) dockerfile="jobs/intelligence-mart/Dockerfile"; args+=(--target mart-specialist) ;;
            private-pipeline) dockerfile="services/api/Dockerfile"; args+=(--target private-pipeline) ;;
            api) dockerfile="services/api/Dockerfile"; args+=(--target api --build-arg "GOOGLE_USER_CLIENT_ID=${GOOGLE_USER_CLIENT_ID}" --build-arg "GOOGLE_ADMIN_CLIENT_ID=${GOOGLE_ADMIN_CLIENT_ID}") ;;
          esac
          docker buildx build -f "${dockerfile}" "${args[@]}" .

  release-verify:
    needs: [detect, release-publish]
    if: needs.release-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify anonymous pull
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo jq
          mkdir -p receipts
          for component in ingestion-core intelligence-mart private-pipeline api; do
            skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-${component}:sha-${GITHUB_SHA}" > "receipts/${component}.json"
            digest="$(jq -r '.Digest // empty' "receipts/${component}.json")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-digest-readback
          path: receipts/*.json
          retention-days: 14

  # ============ CANDIDATE ============
  candidate:
    needs: detect
    if: needs.detect.outputs.operation == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact-source full release before candidate writes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ needs.detect.outputs.release-run }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/gcp')
          from ghcr_jobs_rollout import command, successful_operation
          requested = json.loads(Path('ops/ghcr-candidate-request.json').read_text())
          release_run = str(requested.get('release_run') or os.environ.get('RELEASE_RUN') or '')
          if not re.fullmatch(r'[0-9]+', release_run):
              raise SystemExit('candidate_full_release_run_required')
          metadata = json.loads(command(['gh','run','view',release_run,'--json',
                                         'headSha,status,conclusion,workflowName']))
          if (metadata.get('headSha') != requested.get('sha') or not successful_operation(
                  metadata, release_run, 'Janus GHCR full-test image publication', 'release')):
              raise SystemExit('candidate_full_release_not_verified')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lease and candidate recovery contracts before any GCP write
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_ghcr_release_lease.py tests/test_ghcr_candidate_lease_guard.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect public GHCR digest and source-commit request
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ops/ghcr-candidate-request.json
          test "${GITHUB_REF}" = refs/heads/main
          jq -e '.intent == "dev-api-zero-traffic" and (.sha|test("^[0-9a-f]{40}$")) and ((.digest // "") | (length == 0 or test("^sha256:[0-9a-f]{64}$")))' ops/ghcr-candidate-request.json > /dev/null
          sha="$(jq -r .sha ops/ghcr-candidate-request.json)"
          declared="$(jq -r '.digest // ""' ops/ghcr-candidate-request.json)"
          git merge-base --is-ancestor "$sha" HEAD
          # Read manifest from public GHCR using exact, previously published SHA tag.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo inspect --no-creds "docker://ghcr.io/tommylin15/janus-api:sha-${sha}" > /tmp/ghcr-identity.json
          digest="$(jq -r '.Digest // empty' /tmp/ghcr-identity.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 2
          [[ -z "$declared" || "$declared" == "$digest" ]] || exit 2
          image="ghcr.io/tommylin15/janus-api@${digest}"
          # Recheck exact immutable digest, without any registry credentials.
          skopeo inspect --no-creds "docker://${image}" > /tmp/ghcr-by-digest.json
          test "$(jq -r .Digest /tmp/ghcr-by-digest.json)" = "$digest"
          test "$(jq -r '.Labels["org.opencontainers.image.revision"]' /tmp/ghcr-identity.json)" = "$sha"
          test "$(jq -r '.Labels["org.opencontainers.image.source"]' /tmp/ghcr-identity.json)" = "https://github.com/tommylin15/janus-omniforge"
          echo "GHCR_PUBLIC_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "GHCR_EXACT_SHA=${sha}" >> "$GITHUB_ENV"
      - name: Preflight dev API identity, traffic and minimum instances
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-before.json
          jq -e '.status.conditions | any(.type=="Ready" and .status=="True")' /tmp/service-before.json >/dev/null
          jq -e '[.status.traffic[]? | select((.percent // 0)>0)] | length == 1 and .[0].percent == 100' /tmp/service-before.json >/dev/null
          # Revision-level minScale plus candidate tag could incur ongoing costs.
          jq -e '((.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0") | tonumber) == 0' /tmp/service-before.json > /dev/null
          jq '{service:.metadata.name,active:[.status.traffic[]?|select((.percent//0)>0)|{revisionName,percent}],latestReady:.status.latestReadyRevisionName}' /tmp/service-before.json > /tmp/metadata-before.json
          cat /tmp/metadata-before.json
      - name: Acquire atomic global deployment lease
        id: lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py acquire
          echo "held=true" >> "$GITHUB_OUTPUT"
      - name: Read back immutable baseline under lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py assert
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-before-locked.json
          jq -e '.metadata.name == "janus-api" and (.status.conditions | any(.type=="Ready" and .status=="True"))' /tmp/service-before-locked.json >/dev/null
          jq -e '[.status.traffic[]? | select((.percent // 0)>0)] | length == 1 and .[0].percent == 100' /tmp/service-before-locked.json >/dev/null
          jq -e '((.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0") | tonumber) == 0' /tmp/service-before-locked.json > /dev/null
      - name: Create fixed-digest candidate without switching traffic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py assert
          tag="ghcr-${GHCR_EXACT_SHA:0:12}"
          # Same immutable SHA+digest retry reuses its verified 0% candidate,
          # instead of creating unbounded extra revisions.
          existing_revision="$(jq -r --arg tag "$tag" '.status.traffic[]? | select(.tag == $tag) | .revisionName // empty' /tmp/service-before-locked.json)"
          if [[ -n "$existing_revision" ]]; then
            jq -e --arg tag "$tag" '[.status.traffic[]? | select(.tag == $tag)] | length == 1 and ((.[0].percent // 0) == 0)' /tmp/service-before-locked.json >/dev/null
            test "$(jq -r '.spec.template.spec.containers[0].image // empty' /tmp/service-before-locked.json)" = "$GHCR_PUBLIC_IMAGE"
            gcloud run revisions describe "$existing_revision" --project="$PROJECT" --region="$REGION" --format=json > /tmp/reused-revision.json
            jq -e --arg image "$GHCR_PUBLIC_IMAGE" '((.spec.containers[0].image == $image) or (.spec.containers[0].image == ("cache.us-docker.pkg.dev/" + $image))) and (.status.conditions | any(.type=="Ready" and .status=="True"))' /tmp/reused-revision.json >/dev/null
            echo "Reused existing 0% GHCR digest candidate: $existing_revision" >> "$GITHUB_STEP_SUMMARY"
          else
            gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$GHCR_PUBLIC_IMAGE" --no-traffic --tag="$tag" --quiet > /dev/null
          fi
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-candidate.json
          jq -e --arg tag "$tag" '[.status.traffic[]? | select(.tag==$tag)] | length == 1 and (.[0].percent // 0) == 0' /tmp/service-candidate.json >/dev/null
          before="$(jq -r '.active[0].revisionName' /tmp/metadata-before.json)"
          jq -e --arg old "$before" '[.status.traffic[]?|select((.percent//0)>0)] | length == 1 and .[0].revisionName == $old and .[0].percent == 100' /tmp/service-candidate.json >/dev/null
          url="$(jq -r --arg tag "$tag" '.status.traffic[]|select(.tag==$tag)|.url' /tmp/service-candidate.json)"
          [[ "$url" == https://* ]] || exit 2
          for path in /health /api/v1/public/health; do
            test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url$path")" = 200
          done
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url/api/v1/me/profile")" = 401
          test "$(curl -fsS --max-time 30 "$url/app/build-id.txt")" = "$GHCR_EXACT_SHA"
          {
            echo "### Janus GHCR API candidate"
            echo "Exact source SHA: $GHCR_EXACT_SHA"
            echo "Immutable image: $GHCR_PUBLIC_IMAGE"
            echo "Candidate tagged URL: $url"
            echo "0% normal traffic; old 100% active revision: $before"
            echo "Health and unauthenticated guard PASS; **authenticated owner/OAuth/MCP and four-Jobs acceptance not yet performed**."
            echo "Promotion is deliberately NOT performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify safe candidate baseline and release owned lease
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if ! python scripts/gcp/ghcr_release_lease.py assert >/dev/null 2>&1; then
            state="$(python scripts/gcp/ghcr_release_lease.py inspect | jq -r .status)"
            if [[ "$state" == "ABSENT" && "${{ steps.lease.outputs.held }}" != "true" ]]; then
              echo 'No lease acquired; no deployment cleanup needed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo 'BLOCKED: lease owner/readback uncertain. Do not release or promote.' >&2
            exit 78
          fi
          # Never clear after an ambiguous deployment without a verified
          # fully reconciled live Service and unchanged 100% baseline.
          test -s /tmp/service-before-locked.json
          [[ "${GHCR_PUBLIC_IMAGE:-}" == ghcr.io/tommylin15/janus-api@sha256:* ]]
          [[ "${GHCR_EXACT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          tag="ghcr-${GHCR_EXACT_SHA:0:12}"
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service-after-locked.json
          python scripts/gcp/ghcr_candidate_lease_guard.py \
            --before /tmp/service-before-locked.json \
            --after /tmp/service-after-locked.json \
            --image "$GHCR_PUBLIC_IMAGE" --tag "$tag"
          python scripts/gcp/ghcr_release_lease.py assert
          python scripts/gcp/ghcr_release_lease.py release --safe-to-release
          echo 'Global lease released after live baseline and candidate 0% readback. Owner OAuth/MCP/PnL still pending; promotion not authorized.' >> "$GITHUB_STEP_SUMMARY"

  # ============ PREVIEW ============
  preview:
    needs: detect
    if: needs.detect.outputs.operation == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate contracts
        run: python -m pytest -q tests/test_ghcr_preview_publish.py tests/test_ghcr_release_lease.py
      - name: Update preview tag
        run: python scripts/gcp/ghcr_preview_publish.py --receipt /tmp/ghcr-preview-publish.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghcr-preview-publish-receipt
          path: /tmp/ghcr-preview-publish.json
          if-no-files-found: ignore
          retention-days: 14

  # ============ AUTH BOUNDARY ============
  auth-boundary:
    needs: detect
    if: needs.detect.outputs.operation == 'auth-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify boundary-only current candidate SHA contract
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_ghcr_candidate_auth_boundary_contract.py
      - name: Resolve explicitly requested full SHA without runtime mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.intent == "dev-api-zero-traffic" and
                 (.sha|test("^[0-9a-f]{40}$")) and
                 .promotion == false and .scope == "janus-api-only" and
                 .allow_service_traffic_promotion == false and
                 .allow_job_image_update == false' ops/ghcr-candidate-request.json >/dev/null
          # Independent probe request keeps this read-only validation ordered
          # *after* candidate deployment; a candidate-request push alone must
          # not race its own 0% deployment.
          jq -e '.intent == "verify-ghcr-candidate-boundary" and
                 .scope == "read-only" and .no_gcp_mutation == true and
                 (.sha|test("^[0-9a-f]{40}$"))' ops/ghcr-candidate-boundary-request.json >/dev/null
          EXPECTED_SHA="$(jq -r .sha ops/ghcr-candidate-request.json)"
          test "$EXPECTED_SHA" = "$(jq -r .sha ops/ghcr-candidate-boundary-request.json)"
          CANDIDATE_TAG="ghcr-${EXPECTED_SHA:0:12}"
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Confirm zero-traffic fixed-digest candidate is still tagged
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/current-service.json
          jq -e --arg tag "$CANDIDATE_TAG" '
            [.status.traffic[]? | select(.tag == $tag)] |
            length == 1 and (.[0].percent // 0) == 0' /tmp/current-service.json >/dev/null
          # Previous serving baseline may already be GHCR. Do not embed an
          # obsolete AR revision name in the next candidate's read-only gate.
          jq -e --arg tag "$CANDIDATE_TAG" '
            ([.status.traffic[]? | select((.percent // 0)>0)] |
             length == 1 and .[0].percent == 100) and
            ([.status.traffic[]? | select(.tag == $tag)] |
             length == 1 and (.[0].percent // 0) == 0)' /tmp/current-service.json >/dev/null
          jq -e '.status.conditions | any(.type == "Ready" and .status == "True")' /tmp/current-service.json >/dev/null
          candidate="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url' /tmp/current-service.json)"
          [[ "$candidate" == https://* ]] || exit 2
          echo "JANUS_CANDIDATE_URL=$candidate" >> "$GITHUB_ENV"
      - name: Probe OAuth metadata, private read boundaries and MCP auth challenge
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from urllib.parse import urlparse

          base = os.environ["JANUS_CANDIDATE_URL"].rstrip("/")
          results = {}

          def request(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Accept":"application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base+path, data=data, headers=headers, method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, response.headers, response.read(96_000)
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read(96_000)

          def assert_private(path):
              code, _, _ = request(path)
              results[path] = {"status_code":code,"unauthenticated_rejected":code in (401,403)}
              assert code in (401,403), path

          for path in (
              "/api/v1/me/profile",
              "/api/v1/me/today-changes",
              "/api/v1/me/analysis/2330/changes",
              "/api/v1/me/journal/positions",
              "/api/v1/me/journal/pnl",
              "/api/v1/me/portfolio/summary",
              "/api/v1/me/portfolio/performance",
              "/api/v1/admin/data-governance",
          ):
              assert_private(path)

          # The new GCS inventory is POST-only and must reject requests before
          # any backend metadata scan without an authenticated Admin audience.
          code, _, _ = request("/api/v1/admin/gcs-storage/inspect", {})
          results["/api/v1/admin/gcs-storage/inspect"] = {
              "status_code": code, "unauthenticated_rejected": code in (401,403)}
          assert code in (401,403), "admin GCS inventory exposed"

          for path in ("/.well-known/oauth-protected-resource",
                       "/.well-known/oauth-authorization-server"):
              status, _, raw = request(path)
              data = json.loads(raw) if status == 200 else {}
              results[path] = {"status_code":status,"metadata_nonempty":bool(data)}
              assert status == 200 and isinstance(data,dict), path
              if path.endswith("oauth-protected-resource"):
                  assert data.get("resource","").startswith("https://")
                  assert all(v.startswith("https://") for v in data.get("authorization_servers", []))
                  assert data.get("authorization_servers")
              else:
                  assert data.get("issuer", "").startswith("https://")
                  assert data.get("token_endpoint", "").startswith(data["issuer"])
                  assert "S256" in data.get("code_challenge_methods_supported", [])
                  assert "refresh_token" in data.get("grant_types_supported", [])
              results[path]["contract_pass"] = True

          payload={"jsonrpc":"2.0","id":1,"method":"tools/call",
                   "params":{"name":"janus_private_context","arguments":{"resource":"positions","limit":1}}}
          status,headers,raw=request("/mcp",payload)
          response=json.loads(raw) if raw else {}
          auth_header=headers.get("WWW-Authenticate","")
          results["/mcp-private-tools-call"]={
              "status_code":status,
              "challenge_present":auth_header.startswith("Bearer "),
              "is_error":bool(response.get("result",{}).get("isError"))}
          assert status == 401 and auth_header.startswith("Bearer "), "MCP unauthenticated failure"
          assert response.get("result",{}).get("isError") is True

          status,_,raw=request("/app/build-id.txt")
          assert status==200 and raw.decode().strip()==os.environ["EXPECTED_SHA"]
          results["build_identity"]={"sha_verified":True}
          print(json.dumps({"scope":"unauthenticated_negative_and_metadata_only","result":"PASS",
                            "checks":results},sort_keys=True))
          PY
          {
            echo "## GHCR API candidate — unauthenticated boundary probe"
            echo "Candidate still at 0% canonical traffic; prior revision retained 100%."
            echo "OAuth metadata and negative owner/Admin/MCP boundaries: PASS."
            echo "**Not verified:** a real logged-in owner, OAuth callback, PnL correctness, refresh token, or owner isolation."
          } >> "$GITHUB_STEP_SUMMARY"

  jobs-baseline:
    needs: detect
    if: needs.detect.outputs.operation == 'jobs-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Install public image metadata reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Read existing four Jobs rollback baseline without cloud writes
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/gcp')
          from ghcr_jobs_rollout import JOB_COMPONENT, PIN, job, image, fingerprint, command
          result = {'rollback_images': {}, 'rollback_config_hashes': {}, 'gcp_writes': 0}
          sources = set()
          for name, _ in JOB_COMPONENT:
              data = job(name)
              ref = image(data)
              assert ref.startswith('ghcr.io/tommylin15/janus-') and PIN.fullmatch(ref)
              result['rollback_images'][name] = ref
              result['rollback_config_hashes'][name] = fingerprint(data)
              metadata = json.loads(command(['skopeo', 'inspect', '--no-creds', 'docker://' + ref]))
              sources.add(metadata.get('Labels', {}).get('org.opencontainers.image.revision', ''))
          assert len(sources) == 1
          source = sources.pop()
          assert len(source) == 40 and all(c in '0123456789abcdef' for c in source)
          result['baseline_source_sha'] = source
          receipt = json.dumps(result, sort_keys=True)
          Path('/tmp/ghcr-jobs-baseline.json').write_text(receipt)
          print(receipt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-jobs-baseline
          path: /tmp/ghcr-jobs-baseline.json
          retention-days: 14

  # ============ JOBS ROLLOUT ============
  jobs-rollout:
    needs: detect
    if: needs.detect.outputs.operation == 'jobs-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN: ${{ needs.detect.outputs.release-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate contracts
        run: python -m pytest -q tests/test_ghcr_jobs_rollout.py tests/test_ghcr_release_lease.py
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Rollout Jobs
        run: python scripts/gcp/ghcr_jobs_rollout.py --release-run "$RELEASE_RUN" --receipt /tmp/ghcr-jobs-rollout.json
      - name: Recovery on failure
        if: failure() || cancelled()
        run: |
          if test -f /tmp/ghcr-jobs-rollout.json; then
            python scripts/gcp/ghcr_jobs_rollout.py --recover --release-run "$RELEASE_RUN" --receipt /tmp/ghcr-jobs-rollout.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghcr-jobs-rollout-receipt
          path: /tmp/ghcr-jobs-rollout.json
          if-no-files-found: ignore
          retention-days: 14

  # ============ PROMOTE ============
  promote:
    needs: detect
    if: needs.detect.outputs.operation == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN: ${{ needs.detect.outputs.release-run }}
      JOBS_RUN: ${{ needs.detect.outputs.jobs-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-janus
        with:
          install-deps: minimal
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - name: Validate contracts
        run: python -m pytest -q tests/test_ghcr_api_promote.py tests/test_ghcr_jobs_rollout.py tests/test_ghcr_release_lease.py
      - name: Load Jobs evidence
        run: |
          mkdir -p /tmp/ghcr-jobs-proof
          gh run download "$JOBS_RUN" -n ghcr-jobs-rollout-receipt -D /tmp/ghcr-jobs-proof
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Promote API
        run: python scripts/gcp/ghcr_api_promote.py --release-run "$RELEASE_RUN" --jobs-run "$JOBS_RUN" --receipt /tmp/ghcr-api-promote.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghcr-api-promotion-receipt
          path: /tmp/ghcr-api-promote.json
          if-no-files-found: ignore
          retention-days: 14
