name: Inspect dev runtime

on:
  push:
    branches:
      - main
    paths:
      - 'ops/dev-runtime-inspect.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect latest ingestion executions
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs executions list \
            --job=janus-ingestion-core \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --limit=5 \
            --format='table(name,completionTime,startTime,runningCount,succeededCount,failedCount,cancelledCount)'
          latest="$(gcloud run jobs executions list \
            --job=janus-ingestion-core \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --limit=1 --format='value(name)')"
          if [[ -n "${latest}" ]]; then
            gcloud run jobs executions describe "${latest}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='yaml(name,startTime,completionTime,runningCount,succeededCount,failedCount,cancelledCount,conditions,logUri)'
          fi
