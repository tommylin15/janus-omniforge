name: B5 live acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b5-live-acceptance.yml'
      - 'jobs/intelligence-mart/intelligence_mart/ml_oos_data.py'
      - 'jobs/intelligence-mart/intelligence_mart/artifact_retention.py'
      - 'jobs/intelligence-mart/intelligence_mart/__main__.py'
      - 'scripts/gcp/b5-ml-oos-data.py'
      - 'scripts/gcp/b2-lakehouse-acceptance.py'
      - 'tests/test_b5_ml_oos_data.py'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: b5-live-acceptance-recovery-v4
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  ALLOW_DEV_DEPLOY: true
  MART_JOB: janus-intelligence-mart
  EVIDENCE_FILE: doc/archive/group-b-b5-live-acceptance-recovery-v4-2026-10-07.json

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install B5 acceptance dependencies
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install --require-hashes -r jobs/intelligence-mart/requirements.lock
            python -m pip install --require-hashes -r jobs/intelligence-mart/requirements-bigquery-probe.lock
            python -m pip install -r requirements-dev.txt
          } 2>&1 | tee /tmp/b5-install.log
          touch /tmp/install.ok

      - name: Run targeted B5 contracts
        env:
          PYTHONPATH: jobs/intelligence-mart:jobs/ingestion-core:.
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pytest -q tests/test_b5_ml_oos_data.py
            python -m py_compile jobs/intelligence-mart/intelligence_mart/ml_oos_data.py scripts/gcp/b5-ml-oos-data.py
          } 2>&1 | tee /tmp/b5-tests.log
          touch /tmp/tests.ok

      - name: Confirm or recover Mart deployment for this SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          read_sha() {
            gcloud run jobs describe "${MART_JOB}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format=json > /tmp/mart-job.json
            python - <<'PY'
          import json
          data=json.load(open('/tmp/mart-job.json'))
          def walk(value):
              if isinstance(value, dict):
                  if value.get('name') == 'JANUS_GIT_SHA':
                      return value.get('value', '')
                  for child in value.values():
                      found=walk(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found=walk(child)
                      if found:
                          return found
              return ''
          print(walk(data))
          PY
          }

          for attempt in $(seq 1 6); do
            deployed_sha="$(read_sha || true)"
            echo "B5 deploy heartbeat attempt=${attempt} deployed_sha=${deployed_sha:-missing} target=${GITHUB_SHA}"
            if [[ "${deployed_sha}" == "${GITHUB_SHA}" ]]; then
              touch /tmp/deploy.ok
              break
            fi
            if [[ -n "${deployed_sha}" ]] \
              && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "${deployed_sha}" "${GITHUB_SHA}" \
              && git diff --quiet "${deployed_sha}..${GITHUB_SHA}" -- \
                   jobs/intelligence-mart jobs/ingestion-core; then
              echo "B5 Mart runtime unchanged since deployed SHA ${deployed_sha}; reusing verified image"
              touch /tmp/deploy.ok
              break
            fi
            sleep 30
          done

          if [[ ! -f /tmp/deploy.ok ]]; then
            echo "B5 standard deploy did not converge; running bounded Mart deploy recovery"
            set -o pipefail
            bash scripts/gcp/deploy-dev.sh intelligence-mart 2>&1 | tee /tmp/b5-deploy.log
            bash scripts/gcp/verify-dev.sh intelligence-mart 2>&1 | tee -a /tmp/b5-deploy.log
            deployed_sha="$(read_sha)"
            test "${deployed_sha}" = "${GITHUB_SHA}"
            touch /tmp/deploy.ok
          fi

      - name: Export bounded versioned ML/OOS Parquet via Cloud Build
        shell: bash
        run: |
          set -Eeuo pipefail
          output_uri="gs://${GCP_PROJECT_ID}-dev-mart/acceptance/b5-build/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

          cat > /tmp/b5-export-cloudbuild.yaml <<'YAML'
          steps:
            - name: python:3.12-slim
              entrypoint: bash
              env:
                - 'PYTHONPATH=/workspace/jobs/intelligence-mart:/workspace/jobs/ingestion-core:/workspace'
              args:
                - -ceu
                - |
                  cd /workspace
                  python -m pip install --no-cache-dir --require-hashes \
                    -r jobs/intelligence-mart/requirements-bigquery-probe.lock
                  python scripts/gcp/b5-ml-oos-data.py --output /workspace/b5-export.json
            - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
              args:
                - storage
                - cp
                - /workspace/b5-export.json
                - '${_OUTPUT_URI}'
          options:
            logging: CLOUD_LOGGING_ONLY
          timeout: 900s
          YAML

          set +e
          gcloud builds submit . \
            --async \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --config=/tmp/b5-export-cloudbuild.yaml \
            --gcs-source-staging-dir="gs://${GCP_PROJECT_ID}-cloudbuild-regional/source" \
            --substitutions="_OUTPUT_URI=${output_uri}" \
            --format='value(id)' > /tmp/b5-build-id 2> /tmp/b5-submit.stderr
          submit_rc=$?
          set -e
          if [[ "${submit_rc}" -ne 0 ]]; then
            cat /tmp/b5-submit.stderr >&2 || true
            exit "${submit_rc}"
          fi

          build_id="$(tr -d '\r\n ' < /tmp/b5-build-id)"
          test -n "${build_id}"
          succeeded=0
          for attempt in $(seq 1 22); do
            gcloud builds describe "${build_id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format=json > /tmp/b5-build.json
            status="$(python -c "import json; print(json.load(open('/tmp/b5-build.json')).get('status','UNKNOWN'))")"
            echo "B5 export build heartbeat attempt=${attempt}/22 build=${build_id} status=${status}"
            case "${status}" in
              SUCCESS)
                succeeded=1
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud logging read \
                  "resource.type=build AND resource.labels.build_id=${build_id}" \
                  --project="${GCP_PROJECT_ID}" --freshness=30m --limit=200 \
                  --format='value(timestamp,severity,textPayload,jsonPayload.message)' \
                  > /tmp/b5-build.log 2>&1 || true
                cat /tmp/b5-build.log >&2 || true
                exit 1
                ;;
            esac
            sleep 30
          done

          if [[ "${succeeded}" -ne 1 ]]; then
            echo "B5 export Cloud Build exceeded 660s hard bound; cancelling ${build_id}" >&2
            gcloud builds cancel "${build_id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet || true
            gcloud builds describe "${build_id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format=json > /tmp/b5-build.json || true
            gcloud logging read \
              "resource.type=build AND resource.labels.build_id=${build_id}" \
              --project="${GCP_PROJECT_ID}" --freshness=30m --limit=200 \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' \
              > /tmp/b5-build.log 2>&1 || true
            cat /tmp/b5-build.log >&2 || true
            exit 1
          fi

          gcloud logging read \
            "resource.type=build AND resource.labels.build_id=${build_id}" \
            --project="${GCP_PROJECT_ID}" --freshness=30m --limit=200 \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' \
            > /tmp/b5-build.log 2>&1 || true
          gcloud storage cp "${output_uri}" /tmp/b5-export.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/b5-export.json'))
          assert data['status']=='pass'
          assert data['row_count'] > 0
          assert data['export_bytes'] > 0
          assert data['total_billed_bytes'] <= 1073741824
          assert data['storage_read_api_used'] is False
          assert data['manifest_uri'].startswith('gs://gen-lang-client-0593591102-dev-mart/ml-oos-data/v1/')
          PY
          touch /tmp/export.ok

      - name: Read exported dataset in deployed Mart Job
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_uri="$(python -c "import json; print(json.load(open('/tmp/b5-export.json'))['manifest_uri'])")"
          result_uri="gs://${GCP_PROJECT_ID}-dev-mart/acceptance/b5-live/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          gcloud run jobs execute "${MART_JOB}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --update-env-vars="MART_OPERATION=ml-oos-data-acceptance,MART_ML_OOS_MANIFEST_URI=${manifest_uri},MART_ML_OOS_RESULT_URI=${result_uri},MART_AI_ENABLED=false,MART_OOS_EVALUATION=false" \
            --tasks=1 --task-timeout=10m --wait --format=json > /tmp/b5-mart-exec.json

          for attempt in $(seq 1 6); do
            if gcloud storage cat "${result_uri}" > /tmp/b5-mart-result.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/b5-mart-result.json
          python - <<'PY'
          import json
          export=json.load(open('/tmp/b5-export.json'))
          result=json.load(open('/tmp/b5-mart-result.json'))
          assert result['status']=='pass'
          assert result['operation']=='ml-oos-data-acceptance'
          assert result['core_snapshot_id']==export['core_snapshot_id']
          assert result['dataset_content_hash']==export['dataset_content_hash']
          assert result['row_count']==export['row_count']
          assert result['export_bytes']==export['export_bytes']
          assert result['storage_read_api_used'] is False
          assert result['llm_api_tokens']==0
          assert result['ceo_triggered'] is False
          PY
          touch /tmp/live.ok

      - name: Assemble B5 evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return {"unparsed": p.read_text(errors='replace')[-4000:]}

          markers={name: Path('/tmp/'+name+'.ok').exists() for name in ('install','tests','deploy','export','live')}
          def tail(path):
              p=Path(path)
              return p.read_text(errors='replace')[-12000:] if p.exists() else None
          evidence={
              "schema_version":"b5-live-acceptance-v1",
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "git_sha":os.environ.get("GITHUB_SHA"),
              "status":"pass" if all(markers.values()) else "failed",
              "markers":markers,
              "install_log_tail":tail('/tmp/b5-install.log'),
              "tests_log_tail":tail('/tmp/b5-tests.log'),
              "deploy_log_tail":tail('/tmp/b5-deploy.log'),
              "cloud_build_log_tail":tail('/tmp/b5-build.log'),
              "cloud_build_submit_stderr":tail('/tmp/b5-submit.stderr'),
              "constraints":{
                  "project":"gen-lang-client-0593591102",
                  "region":"us-central1",
                  "bigquery_location":"US",
                  "bigquery_execution_budget_bytes":1073741824,
                  "bigquery_query_timeout_seconds":60,
                  "storage_read_api":False,
                  "canonical_write":False,
                  "dataset_prefix":"gs://gen-lang-client-0593591102-dev-mart/ml-oos-data/v1/",
              },
              "export":load('/tmp/b5-export.json'),
              "cloud_build":load('/tmp/b5-build.json'),
              "mart_execution":load('/tmp/b5-mart-exec.json'),
              "mart_result":load('/tmp/b5-mart-result.json'),
              "mart_job":load('/tmp/mart-job.json'),
          }
          Path(os.environ['EVIDENCE_FILE']).write_text(
              json.dumps(evidence, indent=2, sort_keys=True, default=str)+"\n"
          )
          PY

      - name: Commit B5 evidence
        if: always()
        shell: bash
        run: |
          git config user.name "janus-ci"
          git config user.email "janus-ci@users.noreply.github.com"
          git add "${EVIDENCE_FILE}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record B5 live acceptance evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require complete B5 acceptance
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data=json.load(open(os.environ['EVIDENCE_FILE']))
          if data['status'] != 'pass':
              raise SystemExit('B5 acceptance incomplete; inspect committed evidence')
          PY
