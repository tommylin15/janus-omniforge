name: Rotate dev publication owner credential

on:
  push:
    branches: [main]
    paths:
      - 'ops/publication-owner-credential-rotation'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate rotation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements-dev.txt pyyaml >/dev/null
          python -m pytest -q tests/test_publication_owner_credential_rotation.py
          python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('scripts/gcp/cloudbuild-publication-owner-credential-rotation.yaml').read_text())"
          bash -n scripts/gcp/rotate-publication-owner-credential-dev.sh
      - name: Rotate credential through existing dev control path
        shell: bash
        run: |
          set -Eeuo pipefail
          build_id="$(gcloud builds submit . \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --config=scripts/gcp/cloudbuild-publication-owner-credential-rotation.yaml \
            --async --format='value(id)' --quiet)"
          test -n "${build_id}"
          echo "Cloud Build started: ${build_id}"
          for _ in $(seq 1 180); do
            status="$(gcloud builds describe "${build_id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='value(status)')"
            case "${status}" in
              SUCCESS)
                echo "Cloud Build ${build_id} completed successfully."
                exit 0
                ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR|EXPIRED)
                echo "Cloud Build ${build_id} finished with ${status}." >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Cloud Build ${build_id} did not finish within the bounded poll window." >&2
          exit 1
