name: Rotate dev publication owner credential

on:
  push:
    branches: [main]
    paths:
      - 'ops/publication-owner-credential-rotation'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate rotation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pytest -q tests/test_publication_owner_credential_rotation.py
          bash -n scripts/gcp/rotate-publication-owner-credential-dev.sh
      - name: Rotate credential through existing dev control path
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud builds submit . \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --config=scripts/gcp/cloudbuild-publication-owner-credential-rotation.yaml \
            --quiet
