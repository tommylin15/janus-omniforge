name: Repair dev runtime

on:
  push:
    branches:
      - main
    paths:
      - 'ops/dev-runtime-repair.json'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply requested guarded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          request='ops/dev-runtime-repair.json'
          action="$(jq -r '.action // ""' "${request}")"
          [[ "${action}" == 'retire-legacy-janus-web' ]] || {
            echo "unsupported repair action: ${action}" >&2
            exit 2
          }

          trigger_id='c08067dd-5c44-414f-9e8d-9d94e89b4089'

          echo '--- guard canonical janus-api ---'
          api_ready="$(gcloud run services describe janus-api \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(status.latestReadyRevisionName)')"
          [[ -n "${api_ready}" ]] || { echo 'janus-api has no ready revision' >&2; exit 3; }
          api_url="$(gcloud run services describe janus-api \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(status.url)')"
          headers="$(mktemp)"
          status="$(curl -sS --max-redirs 0 -o /dev/null -D "${headers}" -w '%{http_code}' "${api_url}/")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r", "", $2); print $2; exit}' "${headers}")"
          rm -f "${headers}"
          [[ "${status}" == '307' && "${location}" == '/app' ]] || {
            echo "janus-api root guard failed: status=${status} location=${location}" >&2
            exit 3
          }
          curl -fsS "${api_url}/app/" | grep -Fq 'Janus · OmniForge' || {
            echo 'janus-api /app branding guard failed' >&2
            exit 3
          }

          echo '--- guard legacy janus-web ---'
          if gcloud run services describe janus-web \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json \
            >/tmp/janus-web-service.json 2>/dev/null; then
            web_ready="$(jq -r '.status.latestReadyRevisionName // ""' /tmp/janus-web-service.json)"
            web_image="$(jq -r '.spec.template.spec.containers[0].image // ""' /tmp/janus-web-service.json)"
            [[ -z "${web_ready}" ]] || { echo "refusing: janus-web unexpectedly has ready revision ${web_ready}" >&2; exit 3; }
            [[ "${web_image}" == us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/janusai-poc/web@sha256:* ]] || {
              echo "refusing: janus-web image is not the known legacy web image: ${web_image}" >&2
              exit 3
            }
          else
            echo 'janus-web already absent'
          fi

          echo '--- guard legacy Cloud Build trigger ---'
          trigger_json="$(gcloud builds triggers describe "${trigger_id}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json 2>/dev/null || true)"
          if [[ -n "${trigger_json}" ]]; then
            [[ "$(jq -r '.name // ""' <<<"${trigger_json}")" == 'janus-web' ]] || { echo 'trigger name guard failed' >&2; exit 3; }
            [[ "$(jq -r '.substitutions._RUNTIME_NAME // ""' <<<"${trigger_json}")" == 'janus-web' ]] || { echo 'trigger runtime guard failed' >&2; exit 3; }
            [[ "$(jq -r '.substitutions._DOCKERFILE // ""' <<<"${trigger_json}")" == 'apps/web/Dockerfile' ]] || { echo 'trigger Dockerfile guard failed' >&2; exit 3; }
            gcloud builds triggers delete "${trigger_id}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet
          else
            echo 'legacy janus-web trigger already absent'
          fi

          if gcloud run services describe janus-web \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" >/dev/null 2>&1; then
            gcloud run services delete janus-web \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --quiet
          fi

          echo '--- verify retired artifacts are absent ---'
          if gcloud builds triggers describe "${trigger_id}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" >/dev/null 2>&1; then
            echo 'legacy janus-web trigger still exists' >&2
            exit 4
          fi
          if gcloud run services describe janus-web \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" >/dev/null 2>&1; then
            echo 'legacy janus-web service still exists' >&2
            exit 4
          fi

          echo '--- verify canonical janus-api after cleanup ---'
          api_ready_after="$(gcloud run services describe janus-api \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --format='value(status.latestReadyRevisionName)')"
          [[ -n "${api_ready_after}" ]] || { echo 'janus-api lost ready revision' >&2; exit 4; }
          headers="$(mktemp)"
          status="$(curl -sS --max-redirs 0 -o /dev/null -D "${headers}" -w '%{http_code}' "${api_url}/")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r", "", $2); print $2; exit}' "${headers}")"
          rm -f "${headers}"
          [[ "${status}" == '307' && "${location}" == '/app' ]] || {
            echo "janus-api post-cleanup check failed: status=${status} location=${location}" >&2
            exit 4
          }
          curl -fsS "${api_url}/app/" | grep -Fq 'Janus · OmniForge' || {
            echo 'janus-api /app post-cleanup branding check failed' >&2
            exit 4
          }
          echo "legacy janus-web retired; canonical janus-api remains ready (${api_ready_after})"