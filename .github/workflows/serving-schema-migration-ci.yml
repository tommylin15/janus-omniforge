name: Validate serving schema migrations

on:
  push:
    branches: [main]
    paths:
      - 'jobs/ingestion-core/ingestion_core/entrypoint.py'
      - 'jobs/ingestion-core/ingestion_core/serving_schema_migration.py'
      - 'jobs/ingestion-core/ingestion_core/serving_projection.py'
      - 'jobs/ingestion-core/Dockerfile'
      - 'infra/postgres/migrations/041_operational_position_projection.sql'
      - 'infra/postgres/migrations/042_stock_serving_projection.sql'
      - 'tests/test_serving_schema_migration.py'
      - 'tests/test_stock_serving_projection.py'
      - '.github/workflows/serving-schema-migration-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            jobs/ingestion-core/requirements.lock
      - name: Install bounded test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jobs/ingestion-core/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Verify serving migration runtime and bounded backfill
        env:
          PYTHONPATH: jobs/ingestion-core:.
        run: |
          python -m pytest -q \
            tests/test_serving_schema_migration.py \
            tests/test_stock_serving_projection.py
          python -m compileall -q \
            jobs/ingestion-core/ingestion_core/entrypoint.py \
            jobs/ingestion-core/ingestion_core/serving_schema_migration.py \
            jobs/ingestion-core/ingestion_core/serving_projection.py
