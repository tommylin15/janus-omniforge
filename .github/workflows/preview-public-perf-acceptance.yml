name: Janus fixed-preview bounded public hotpath acceptance
on:
  push:
    branches: [main]
    paths:
      - 'ops/preview-public-perf-request.json'
permissions:
  contents: read
concurrency:
  group: janus-dev-preview-public-readonly
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact already-published Preview, no mutations
        run: |
          set -Eeuo pipefail
          jq -e --slurpfile preview ops/ghcr-preview-request.json '
            .intent=="read-only-fixed-preview-public-hotpath" and
            .approved==true and .samples==30 and
            .no_gcp_mutation==true and .no_private_data==true and
            .source_sha==$preview[0].source_sha' ops/preview-public-perf-request.json
      - name: Sample preview public market-home warm latency and failures
        run: |
          python - <<'PY'
          import json, math, statistics, time, urllib.request
          p=json.load(open('ops/ghcr-preview-request.json'))
          url=p['preview_url'].removesuffix('/app/')+'/api/v1/public/market-home'
          timings=[]
          failures=[]
          for i in range(30):
            start=time.perf_counter()
            try:
              req=urllib.request.Request(url,headers={'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=12) as response:
                if response.status != 200: raise ValueError('http_not_200')
                body=response.read(250_000)
              obj=json.loads(body)
              if not isinstance(obj,dict): raise ValueError('bad_market_home_schema')
              timings.append(round((time.perf_counter()-start)*1000,2))
            except Exception as e:
              failures.append({'sample':i+1,'error_type':type(e).__name__})
          values=sorted(timings)
          def percentile(p):
            if not values:return None
            return values[max(0,math.ceil(len(values)*p)-1)]
          result={'component':'preview_public_market_home_readonly','source_sha':p['source_sha'],
                  'requested_samples':30,'successful_samples':len(timings),'failures':failures,
                  'p50_ms':percentile(0.50),'p95_ms':percentile(0.95),
                  'min_ms':values[0] if values else None,'max_ms':values[-1] if values else None,
                  'scope':'github_runner_to_public_api_not_browser_or_authenticated_owner',
                  'status':'PASS' if len(timings)==30 else 'PARTIAL'}
          print(json.dumps(result,sort_keys=True),flush=True)
          with open('/tmp/preview-public-perf.json','w') as out:json.dump(result,out)
          if failures:raise SystemExit('public preview had failed bounded reads')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-public-perf
          path: /tmp/preview-public-perf.json
          retention-days: 7
          if-no-files-found: ignore
