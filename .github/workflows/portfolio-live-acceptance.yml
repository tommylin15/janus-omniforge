name: Portfolio Completeness Live Acceptance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-live-acceptance.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  ALLOW_DEV_DEPLOY: true

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply and verify migration 030
        run: >-
          gcloud builds submit --no-source
          --project="${GCP_PROJECT_ID}"
          --region="${GCP_REGION}"
          --config=scripts/gcp/cloudbuild-private-stock-master-acl.yaml
      - name: Deploy current private pipeline
        env:
          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}
          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}
        run: bash scripts/gcp/deploy-dev.sh private-pipeline
      - name: Verify current private pipeline
        run: bash scripts/gcp/verify-dev.sh private-pipeline
      - name: Execute private pipeline against real dev data
        run: >-
          gcloud run jobs execute janus-private-pipeline
          --project="${GCP_PROJECT_ID}"
          --region="${GCP_REGION}"
          --wait
      - name: Deploy current API and User UI
        env:
          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}
          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}
        run: bash scripts/gcp/deploy-dev.sh api
      - name: Verify current API and User UI
        run: bash scripts/gcp/verify-dev.sh api
