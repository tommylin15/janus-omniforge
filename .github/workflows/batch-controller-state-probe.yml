name: Batch controller state probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-controller-state-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB_NAME: janus-batch-controller
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read persisted controller state
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(gcloud run jobs executions list --job="${JOB_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --limit=1 --format='value(metadata.name)')"
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --command=python \
            --args="^@^-c@import base64;exec(base64.b64decode(''))" \
            --task-timeout=5m \
            --wait
          execution="$(gcloud run jobs executions list --job="${JOB_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --limit=1 --format='value(metadata.name)')"
          test -n "${execution}"
          test "${execution}" != "${before}"
          echo "probe_execution=${execution}"
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
            --project="${GCP_PROJECT_ID}" \
            --limit=100 \
            --order=asc \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)'
