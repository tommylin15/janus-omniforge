name: Janus D01 exact failed 10-16 Owner lease recovery
on:
  push:
    branches: [main]
    paths: ['ops/d01-owner-eod-1016-lease-recovery.json']
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact failed ownership and immutable diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.intent=="recover-exact-d01-1016-terminal-lease" and .approved==true and
            .owner_run==38899869851 and .owner_sha=="0d6a28291ad65eb7a659637a0fc35cda683b76b0" and
            .execution=="janus-private-pipeline-np5vk" and .no_job_run==true and
            .no_ledger_mutation==true and .no_mart_mutation==true and .no_traffic_mutation==true' ops/d01-owner-eod-1016-lease-recovery.json >/dev/null
          gh run view 38899869851 --json headSha,conclusion,status,workflowName |
            jq -e '.headSha=="0d6a28291ad65eb7a659637a0fc35cda683b76b0" and
             .status=="completed" and .conclusion=="failure" and
             .workflowName=="Janus D01 exact 10-16 official Owner Mart publication"' >/dev/null
          gh run view 38991634929 --json conclusion,status,workflowName |
            jq -e '.status=="completed" and .conclusion=="success" and
             .workflowName=="Janus D01 10-16 failed operation readonly diagnosis"' >/dev/null
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify exact successful operation and all-page fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,sys,subprocess
          sys.path.insert(0,'scripts/gcp')
          import ghcr_jobs_rollout as r
          name='janus-private-pipeline-np5vk'
          exe=r.cloud(r.ROOT+'/jobs/janus-private-pipeline/executions/'+name)
          op=r.cloud(r.ROOT+'/operations/a06f2b9f-bc81-4438-b9c2-c69729c44e87')
          if (op.get('done') is not True or op.get('error') or
              (op.get('response') or {}).get('name')!=exe.get('name') or
              not r.terminal(exe) or exe.get('succeededCount')!=1 or exe.get('failedCount',0)):
              raise RuntimeError('exact_original_operation_not_proven_successful')
          r.fence()
          if r.scheduler().get('state')!='ENABLED':
              raise RuntimeError('scheduler_not_enabled')
          print(json.dumps({'result':'PASS_TERMINAL_SUCCESS_NO_RECOVERY_DATA_WRITE','execution':name,'all_job_executions_terminal':True,'no_data_mutations':True},sort_keys=True))
          PY
      - name: Release only original completed run lease, never rerun owner Job
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/gcp/ghcr_release_lease.py release --repo tommylin15/janus-omniforge --run-id 38899869851 --run-attempt 1 --sha 0d6a28291ad65eb7a659637a0fc35cda683b76b0 --safe-to-release
          python scripts/gcp/ghcr_release_lease.py inspect --repo tommylin15/janus-omniforge --run-id 38899869851 --run-attempt 1 --sha 0d6a28291ad65eb7a659637a0fc35cda683b76b0
          echo 'D01_1016_EXACT_TERMINAL_LEASE_RECOVERY=PASS' >> "$GITHUB_STEP_SUMMARY"
