name: Deploy dev with GitHub

on:
  push:
    branches:
      - main
    paths:
      - 'jobs/ingestion-core/**'
      - 'jobs/intelligence-mart/**'
      - 'services/api/**'
      - 'packages/contracts/**'
      - 'packages/observability/**'
      - 'packages/provenance/**'
      - 'packages/governance/**'
      - 'packages/admin_api/**'
      - 'packages/web_api/**'
      - 'apps/web/static/**'
      - 'apps/user_app/**'
      - 'cloudbuild.yaml'
      - 'scripts/gcp/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      component:
        description: Runtime to build and deploy
        required: true
        type: choice
        options:
          - ingestion-core
          - intelligence-mart
          - api

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  ALLOW_DEV_DEPLOY: true

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ingestion: ${{ steps.filter.outputs.ingestion }}
      mart: ${{ steps.filter.outputs.mart }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingestion:
              - 'jobs/ingestion-core/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/provenance/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/**'
            mart:
              - 'jobs/intelligence-mart/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/provenance/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/**'
            api:
              - 'services/api/**'
              - 'packages/admin_api/**'
              - 'packages/web_api/**'
              - 'apps/web/static/**'
              - 'apps/user_app/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/**'

  deploy-ingestion:
    needs: detect
    if: >-
      needs.detect.outputs.ingestion == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'ingestion-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy ingestion-core
        shell: bash
        run: bash scripts/gcp/deploy-dev.sh ingestion-core
      - name: Verify dev runtimes
        shell: bash
        run: bash scripts/gcp/verify-dev.sh

  deploy-mart:
    needs: detect
    if: >-
      needs.detect.outputs.mart == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'intelligence-mart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy intelligence-mart
        shell: bash
        run: bash scripts/gcp/deploy-dev.sh intelligence-mart
      - name: Verify dev runtimes
        shell: bash
        run: bash scripts/gcp/verify-dev.sh

  deploy-api:
    needs: detect
    if: >-
      needs.detect.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy api
        shell: bash
        env:
          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}
          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}
        run: bash scripts/gcp/deploy-dev.sh api
      - name: Verify dev runtimes
        shell: bash
        run: bash scripts/gcp/verify-dev.sh
