name: Deploy dev with GitHub

on:
  push:
    branches:
      - main
    paths:
      - 'jobs/ingestion-core/ingestion_core/**'
      - 'jobs/ingestion-core/schemas/**'
      - 'jobs/ingestion-core/Dockerfile'
      - 'jobs/ingestion-core/requirements.in'
      - 'jobs/ingestion-core/requirements.lock'
      - 'packages/duckdb_query/**'
      - 'packages/postgres_lock.py'
      - 'packages/mobile_ledger_queue.py'
      - 'tests/test_mobile_ledger_queue.py'
      - 'tests/test_mobile_ledger_consumer.py'
      - 'tests/test_data_retention.py'
      - 'tests/ingestion/test_control_plane.py'
      - 'infra/postgres/migrations/037_batch_controller.sql'
      - 'infra/postgres/migrations/043_admin_batch_read.sql'
      - 'infra/postgres/migrations/044_quotes_broker_profile.sql'
      - 'infra/postgres/migrations/045_private_pipeline_operations.sql'
      - 'infra/postgres/migrations/046_twse_only_latest_price.sql'
      - 'infra/postgres/migrations/047_latest_price_route_v2.sql'
      - 'infra/postgres/migrations/048_private_recalculation_queue.sql'
      - 'infra/postgres/migrations/049_batch_occurrence_skipped_status.sql'
      - 'tests/test_batch_controller.py'
      - 'tests/test_duckdb_iceberg.py'
      - 'tests/test_data_supplement.py'
      - 'tests/test_market_history.py'
      - 'tests/test_data_quality.py'
      - 'tests/test_financial_publication.py'
      - 'tests/test_source_quality_probe.py'
      - 'tests/stage_core_tests/test_stage_core.py'
      - 'tests/stage_core_tests/test_first_batch_sources.py'
      - 'tests/stage_core_tests/test_data_cleaning_regressions.py'
      - 'tests/test_portfolio_deploy_contract.py'
      - 'tests/test_private_recalc_acceptance.py'
      - 'tests/test_container_build_contract.py'
      - 'jobs/intelligence-mart/**'
      - 'tests/test_intelligence_mart_runtime.py'
      - 'tests/test_specialist_engines.py'
      - 'tests/test_b4_deep_coverage.py'
      - 'tests/test_market_screening.py'
      - 'tests/test_mart_provider_routing.py'
      - 'tests/contract/test_contract_registry.py'
      - '.dockerignore'
      - 'doc/runbook-data-supplement.md'
      - 'services/api/**'
      - 'tests/test_public_runtime.py'
      - 'tests/test_public_api_routes.py'
      - 'tests/test_mcp_adapter.py'
      - 'tests/test_mcp_oauth.py'
      - 'tests/test_private_pipeline.py'
      - 'tests/test_private_recalc_queue.py'
      - 'tests/test_private_pipeline_scheduler.py'
      - 'tests/test_serving_schema_migration.py'
      - 'tests/test_security_finops_contract.py'
      - 'tests/test_user_api.py'
      - 'tests/test_portfolio_completeness.py'
      - 'tests/test_portfolio_api_completeness.py'
      - 'tests/test_quote_router_broker.py'
      - 'tests/test_intraday_quotes.py'
      - 'tests/test_portfolio_revaluation.py'
      - 'packages/contracts/**'
      - 'packages/observability/**'
      - 'packages/provenance/**'
      - 'packages/governance/**'
      - 'packages/admin_api/**'
      - 'packages/web_api/**'
      - 'apps/web/static/**'
      - 'apps/user_app/**'
      - 'cloudbuild.yaml'
      - 'scripts/gcp/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      component:
        description: Runtime to build and deploy
        required: true
        type: choice
        options:
          - ingestion-core
          - intelligence-mart
          - private-pipeline
          - api

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-main
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  ALLOW_DEV_DEPLOY: true

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      quotes_schema: ${{ steps.filter.outputs.quotes_schema }}
      operations_schema: ${{ steps.filter.outputs.operations_schema }}
      private_ops_schema: ${{ steps.filter.outputs.private_ops_schema }}
      latest_price_schema: ${{ steps.filter.outputs.latest_price_schema }}
      latest_price_route_schema: ${{ steps.filter.outputs.latest_price_route_schema }}
      private_recalc_schema: ${{ steps.filter.outputs.private_recalc_schema }}
      batch_occurrence_status_schema: ${{ steps.filter.outputs.batch_occurrence_status_schema }}
      ingestion_runtime: ${{ steps.filter.outputs.ingestion_runtime }}
      ingestion_test: ${{ steps.filter.outputs.ingestion_test }}
      mart_runtime: ${{ steps.filter.outputs.mart_runtime }}
      mart_test: ${{ steps.filter.outputs.mart_test }}
      private_pipeline_runtime: ${{ steps.filter.outputs.private_pipeline_runtime }}
      private_pipeline_live_acceptance: ${{ steps.filter.outputs.private_pipeline_live_acceptance }}
      api_runtime: ${{ steps.filter.outputs.api_runtime }}
      api_test: ${{ steps.filter.outputs.api_test }}
      mcp_runtime: ${{ steps.filter.outputs.mcp_runtime }}
      mobile_ledger_runtime: ${{ steps.filter.outputs.mobile_ledger_runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            quotes_schema:
              - 'infra/postgres/migrations/044_quotes_broker_profile.sql'
            operations_schema:
              - 'infra/postgres/migrations/043_admin_batch_read.sql'
            private_ops_schema:
              - 'infra/postgres/migrations/045_private_pipeline_operations.sql'
            latest_price_schema:
              - 'infra/postgres/migrations/046_twse_only_latest_price.sql'
            latest_price_route_schema:
              - 'infra/postgres/migrations/047_latest_price_route_v2.sql'
            private_recalc_schema:
              - 'infra/postgres/migrations/048_private_recalculation_queue.sql'
            batch_occurrence_status_schema:
              - 'infra/postgres/migrations/049_batch_occurrence_skipped_status.sql'
            ingestion_runtime:
              - 'packages/postgres_lock.py'
              - 'packages/mobile_ledger_queue.py'
              - 'packages/duckdb_query/**'
              - 'infra/postgres/migrations/037_batch_controller.sql'
              - 'infra/postgres/migrations/043_admin_batch_read.sql'
              - 'infra/postgres/migrations/044_quotes_broker_profile.sql'
              - 'infra/postgres/migrations/045_private_pipeline_operations.sql'
              - 'infra/postgres/migrations/046_twse_only_latest_price.sql'
              - 'infra/postgres/migrations/047_latest_price_route_v2.sql'
              - 'infra/postgres/migrations/048_private_recalculation_queue.sql'
              - 'infra/postgres/migrations/049_batch_occurrence_skipped_status.sql'
              - 'jobs/ingestion-core/ingestion_core/**'
              - 'jobs/ingestion-core/schemas/**'
              - 'jobs/ingestion-core/Dockerfile'
              - 'jobs/ingestion-core/requirements.in'
              - 'jobs/ingestion-core/requirements.lock'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/provenance/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/deploy-dev.sh'
            ingestion_test:
              - 'tests/ingestion/test_control_plane.py'
              - 'tests/test_data_retention.py'
              - 'tests/test_batch_controller.py'
              - 'tests/test_duckdb_iceberg.py'
              - 'tests/test_data_supplement.py'
              - 'tests/test_market_history.py'
              - 'tests/test_data_quality.py'
              - 'tests/test_financial_publication.py'
              - 'tests/test_source_quality_probe.py'
              - 'tests/stage_core_tests/test_stage_core.py'
              - 'tests/stage_core_tests/test_first_batch_sources.py'
              - 'tests/stage_core_tests/test_data_cleaning_regressions.py'
              - 'tests/test_portfolio_deploy_contract.py'
              - 'tests/test_private_recalc_acceptance.py'
            mart_runtime:
              - 'jobs/ingestion-core/ingestion_core/iceberg_maintenance.py'
              - 'jobs/ingestion-core/ingestion_core/retention.py'
              - 'jobs/ingestion-core/ingestion_core/stage.py'
              - 'packages/postgres_lock.py'
              - 'jobs/intelligence-mart/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/provenance/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/deploy-dev.sh'
            mart_test:
              - 'tests/test_intelligence_mart_runtime.py'
              - 'tests/test_specialist_engines.py'
              - 'tests/test_b4_deep_coverage.py'
              - 'tests/test_b5_ml_oos_data.py'
              - 'tests/test_market_screening.py'
              - 'tests/test_container_build_contract.py'

              - 'tests/test_mart_provider_routing.py'
              - 'tests/contract/test_contract_registry.py'
            private_pipeline_runtime:
              - 'services/api/**'
              - 'packages/mobile_ledger_queue.py'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/provenance/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/deploy-dev.sh'
              - 'scripts/gcp/verify-dev.sh'
            private_pipeline_live_acceptance:
              - 'services/api/private_pipeline.py'
              - 'services/api/private_recalc_queue.py'
              - 'services/api/private_pipeline_runtime.py'
              - 'services/api/store.py'
            mobile_ledger_runtime:
              - 'packages/mobile_ledger_queue.py'
              - 'services/api/mobile_ledger_consumer.py'
              - 'services/api/private_pipeline_runtime.py'
              - 'services/api/repository.py'
              - 'jobs/ingestion-core/ingestion_core/batch_controller.py'
              - 'tests/test_mobile_ledger_queue.py'
              - 'tests/test_mobile_ledger_consumer.py'
              - 'tests/test_batch_controller.py'
            api_runtime:
              - '.dockerignore'
              - 'doc/runbook-data-supplement.md'
              - 'scripts/gcp/verify-dev.sh'
              - 'services/api/**'
              - 'packages/admin_api/**'
              - 'packages/web_api/**'
              - 'apps/web/static/**'
              - 'apps/user_app/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/deploy-dev.sh'
            mcp_runtime:
              - 'services/api/mcp_adapter.py'
              - 'services/api/mcp_oauth.py'
            api_test:
              - 'infra/postgres/migrations/049_batch_occurrence_skipped_status.sql'
              - 'tests/test_public_runtime.py'
              - 'tests/test_public_api_routes.py'
              - 'tests/test_mcp_adapter.py'
              - 'tests/test_mcp_oauth.py'
              - 'tests/test_private_pipeline.py'
              - 'tests/test_private_recalc_queue.py'
              - 'tests/test_private_pipeline_scheduler.py'
              - 'tests/test_serving_schema_migration.py'
              - 'tests/test_security_finops_contract.py'
              - 'tests/test_user_api.py'
              - 'tests/test_portfolio_completeness.py'
              - 'tests/test_portfolio_api_completeness.py'
              - 'tests/test_quote_router_broker.py'
              - 'tests/test_intraday_quotes.py'
              - 'tests/test_portfolio_revaluation.py'
              - 'tests/test_container_build_contract.py'

  test-ingestion:
    needs: detect
    if: >-
      needs.detect.outputs.ingestion_runtime == 'true' ||
      needs.detect.outputs.ingestion_test == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'ingestion-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            jobs/ingestion-core/requirements.lock
      - name: Install ingestion test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jobs/ingestion-core/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Run ingestion targeted tests
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
        run: >-
          python -m pytest -q
          tests/stage_core_tests/test_first_batch_sources.py
          tests/stage_core_tests/test_stage_core.py
          tests/stage_core_tests/test_data_cleaning_regressions.py
          tests/test_portfolio_deploy_contract.py
          tests/test_private_recalc_acceptance.py
          tests/test_batch_controller.py
          tests/test_mobile_ledger_queue.py
          tests/test_duckdb_iceberg.py
          tests/test_data_supplement.py
          tests/test_market_history.py
          tests/test_data_quality.py
          tests/test_financial_publication.py
          tests/test_source_quality_probe.py
          tests/test_data_retention.py
          tests/ingestion/test_control_plane.py

  deploy-ingestion:
    needs: [detect, test-ingestion]
    if: >-
      always() &&
      needs.test-ingestion.result == 'success' &&
      (needs.detect.outputs.ingestion_runtime == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'ingestion-core'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy ingestion-core
        shell: bash
        run: bash scripts/gcp/deploy-dev.sh ingestion-core
      - name: Verify ingestion-core
        shell: bash
        run: bash scripts/gcp/verify-dev.sh ingestion-core
      - name: Verify mobile ledger queue reader
        if: needs.detect.outputs.mobile_ledger_runtime == 'true'
        shell: bash
        run: |
          set +e
          gcloud run jobs execute janus-batch-controller \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --update-env-vars="BATCH_CONTROLLER_MODE=mobile-probe" \
            --task-timeout=5m \
            --wait
          code=$?
          set -e
          if [[ "${code}" -ne 0 ]]; then
            execution="$(gcloud run jobs executions list \
              --job=janus-batch-controller --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --limit=1 --format='value(metadata.name)')"
            gcloud run jobs executions describe "${execution}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='yaml(metadata.name,status.conditions,status.failedCount,status.logUri)' || true
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=janus-batch-controller AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
              --project="${GCP_PROJECT_ID}" --freshness=15m --limit=50 \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            exit "${code}"
          fi

  test-mart:
    needs: detect
    if: >-
      needs.detect.outputs.mart_runtime == 'true' ||
      needs.detect.outputs.mart_test == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'intelligence-mart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            jobs/intelligence-mart/requirements.lock
      - name: Install mart test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jobs/intelligence-mart/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Run mart targeted tests
        env:
          PYTHONPATH: jobs/intelligence-mart:jobs/ingestion-core:.
        run: >-
          python -m pytest -q
          tests/test_intelligence_mart_runtime.py
          tests/test_specialist_engines.py
          tests/test_b4_deep_coverage.py
          tests/test_b5_ml_oos_data.py
          tests/test_market_screening.py
          tests/test_container_build_contract.py
          tests/test_data_retention.py
          tests/test_mart_provider_routing.py
          tests/contract/test_contract_registry.py

  deploy-mart:
    needs: [detect, test-mart]
    if: >-
      always() &&
      needs.test-mart.result == 'success' &&
      (needs.detect.outputs.mart_runtime == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'intelligence-mart'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy intelligence-mart
        shell: bash
        run: bash scripts/gcp/deploy-dev.sh intelligence-mart
      - name: Verify intelligence-mart
        shell: bash
        run: bash scripts/gcp/verify-dev.sh intelligence-mart

  test-api:
    needs: detect
    if: >-
      needs.detect.outputs.api_runtime == 'true' ||
      needs.detect.outputs.private_pipeline_runtime == 'true' ||
      needs.detect.outputs.api_test == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'api' || inputs.component == 'private-pipeline'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.lock
      - name: Install api test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Run api targeted tests
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
        run: >-
          python -m pytest -q
          tests/test_admin_api.py
          tests/test_serving_schema_migration.py
          tests/test_watchlist_read_path.py
          tests/test_visual_reference_integrity.py
          tests/test_public_runtime.py
          tests/test_public_api_routes.py
          tests/test_mcp_adapter.py
          tests/test_mcp_oauth.py
          tests/test_mobile_ledger_queue.py
          tests/test_mobile_ledger_consumer.py
          tests/test_private_pipeline.py
          tests/test_private_recalc_queue.py
          tests/test_private_pipeline_scheduler.py
          tests/test_security_finops_contract.py
          tests/test_user_api.py
          tests/test_portfolio_completeness.py
          tests/test_portfolio_api_completeness.py
          tests/test_quote_router_broker.py
          tests/test_intraday_quotes.py
          tests/test_portfolio_revaluation.py
          tests/test_container_build_contract.py

  deploy-private-pipeline:
    needs: [detect, test-api, migrate-quotes, migrate-private-operations]
    if: >-
      always() &&
      needs.test-api.result == 'success' &&
      (needs.migrate-quotes.result == 'success' ||
      (needs.migrate-quotes.result == 'skipped' && needs.detect.outputs.quotes_schema != 'true')) &&
      (needs.migrate-private-operations.result == 'success' ||
      (needs.migrate-private-operations.result == 'skipped' && needs.detect.outputs.private_ops_schema != 'true')) &&
      (needs.detect.outputs.private_pipeline_runtime == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'private-pipeline'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy private pipeline
        shell: bash
        env:
          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}
          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}
        run: bash scripts/gcp/deploy-dev.sh private-pipeline
      - name: Verify private pipeline
        shell: bash
        run: bash scripts/gcp/verify-dev.sh private-pipeline
      - name: Run private pipeline live acceptance
        if: needs.detect.outputs.private_pipeline_live_acceptance == 'true'
        shell: bash
        run: >-
          gcloud run jobs execute janus-private-pipeline
          --project="${GCP_PROJECT_ID}"
          --region="${GCP_REGION}"
          --tasks=1
          --task-timeout=30m
          --wait
      - name: Verify mobile ledger queue writer and owner binding
        if: needs.detect.outputs.mobile_ledger_runtime == 'true'
        shell: bash
        run: |
          set +e
          gcloud run jobs execute janus-private-pipeline \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --update-env-vars="MOBILE_LEDGER_PROBE_ONLY=true" \
            --task-timeout=5m \
            --wait
          code=$?
          set -e
          if [[ "${code}" -ne 0 ]]; then
            execution="$(gcloud run jobs executions list \
              --job=janus-private-pipeline --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --limit=1 --format='value(metadata.name)')"
            gcloud run jobs executions describe "${execution}" \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='yaml(metadata.name,status.conditions,status.failedCount,status.logUri)' || true
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=janus-private-pipeline AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
              --project="${GCP_PROJECT_ID}" --freshness=15m --limit=50 \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            exit "${code}"
          fi
      - name: Seed Private Pipeline operations evidence
        if: needs.detect.outputs.private_ops_schema == 'true'
        shell: bash
        run: >-
          gcloud run jobs execute janus-private-pipeline
          --project="${GCP_PROJECT_ID}"
          --region="${GCP_REGION}"
          --tasks=1
          --task-timeout=30m
          --wait

  migrate-operations:
    needs: [detect, deploy-ingestion]
    if: >-
      needs.detect.outputs.operations_schema == 'true' &&
      needs.deploy-ingestion.result == 'success'
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 043_admin_batch_read

  migrate-quotes:
    needs: [detect, deploy-ingestion]
    if: >-
      needs.detect.outputs.quotes_schema == 'true' &&
      needs.deploy-ingestion.result == 'success'
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 044_quotes_broker_profile

  migrate-private-operations:
    needs: [detect, deploy-ingestion]
    if: >-
      needs.detect.outputs.private_ops_schema == 'true' &&
      needs.deploy-ingestion.result == 'success'
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 045_private_pipeline_operations

  migrate-latest-price:
    needs: [detect, deploy-ingestion]
    if: >-
      needs.detect.outputs.latest_price_schema == 'true' &&
      needs.deploy-ingestion.result == 'success'
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 046_twse_only_latest_price

  migrate-private-recalc:
    needs: [detect, deploy-ingestion]
    if: >-
      needs.detect.outputs.private_recalc_schema == 'true' &&
      needs.deploy-ingestion.result == 'success'
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 048_private_recalculation_queue

  migrate-batch-occurrence-status:
    needs: [detect, deploy-ingestion]
    if: >-
      needs.detect.outputs.batch_occurrence_status_schema == 'true' &&
      needs.deploy-ingestion.result == 'success'
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 049_batch_occurrence_skipped_status

  migrate-latest-price-route:
    needs: [detect, deploy-ingestion, migrate-latest-price]
    if: >-
      always() &&
      needs.detect.outputs.latest_price_route_schema == 'true' &&
      needs.deploy-ingestion.result == 'success' &&
      (needs.migrate-latest-price.result == 'success' || needs.migrate-latest-price.result == 'skipped')
    uses: ./.github/workflows/serving-schema-migration-dev.yml
    with:
      migration: 047_latest_price_route_v2

  deploy-api:
    needs: [detect, test-api, deploy-private-pipeline, migrate-operations, migrate-quotes, migrate-private-operations, migrate-private-recalc, migrate-latest-price, migrate-latest-price-route]
    if: >-
      always() &&
      needs.test-api.result == 'success' &&
      (needs.migrate-quotes.result == 'success' ||
      (needs.migrate-quotes.result == 'skipped' && needs.detect.outputs.quotes_schema != 'true')) &&
      (needs.migrate-operations.result == 'success' ||
      (needs.migrate-operations.result == 'skipped' && needs.detect.outputs.operations_schema != 'true')) &&
      (needs.migrate-private-operations.result == 'success' ||
      (needs.migrate-private-operations.result == 'skipped' && needs.detect.outputs.private_ops_schema != 'true')) &&
      (needs.migrate-private-recalc.result == 'success' ||
      (needs.migrate-private-recalc.result == 'skipped' && needs.detect.outputs.private_recalc_schema != 'true')) &&
      (needs.migrate-latest-price.result == 'success' ||
      (needs.migrate-latest-price.result == 'skipped' && needs.detect.outputs.latest_price_schema != 'true')) &&
      (needs.migrate-latest-price-route.result == 'success' ||
      (needs.migrate-latest-price-route.result == 'skipped' && needs.detect.outputs.latest_price_route_schema != 'true')) &&
      (needs.deploy-private-pipeline.result == 'success' ||
      needs.deploy-private-pipeline.result == 'skipped') &&
      (needs.detect.outputs.api_runtime == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'api'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy api
        shell: bash
        env:
          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}
          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}
        run: bash scripts/gcp/deploy-dev.sh api
      - name: Verify api
        shell: bash
        run: bash scripts/gcp/verify-dev.sh api
      - name: Verify and promote MCP tagged endpoints
        if: needs.detect.outputs.mcp_runtime == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          service_json="$(gcloud run services describe janus-api \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          service_url="$(jq -r '.status.url' <<<"${service_json}")"
          latest_revision="$(jq -r '.status.latestReadyRevisionName' <<<"${service_json}")"
          env_value() {
            local name="$1"
            jq -r --arg name "${name}" \
              '.spec.template.spec.containers[0].env[] | select(.name == $name) | .value // empty' \
              <<<"${service_json}" | tail -1
          }
          mcp_enabled="$(env_value MCP_OAUTH_ENABLED)"
          mcp_issuer="$(env_value MCP_OAUTH_ISSUER)"
          mcp_resource="$(env_value MCP_RESOURCE_URL)"
          [[ "${mcp_enabled}" == true ]]
          [[ "${mcp_issuer}" == https://mcp-oauth---*.a.run.app ]]
          [[ "${mcp_resource}" == https://mcp-adapter---*.a.run.app/mcp ]]
          test -n "${service_url}" && test -n "${latest_revision}"

          gcloud builds submit --no-source \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --config=scripts/gcp/cloudbuild-mcp-oauth-verify.yaml \
            --substitutions="_SERVICE_URL=${service_url},_EXPECTED_ISSUER=${mcp_issuer},_EXPECTED_RESOURCE=${mcp_resource}" \
            --quiet

          gcloud run services update-traffic janus-api \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
            --update-tags="mcp-adapter=${latest_revision},mcp-oauth=${latest_revision}" --quiet

          adapter_url="${mcp_resource%/mcp}"
          for tagged_url in "${adapter_url}" "${mcp_issuer}"; do
            gcloud builds submit --no-source \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --config=scripts/gcp/cloudbuild-mcp-oauth-verify.yaml \
              --substitutions="_SERVICE_URL=${tagged_url},_EXPECTED_ISSUER=${mcp_issuer},_EXPECTED_RESOURCE=${mcp_resource}" \
              --quiet
          done
