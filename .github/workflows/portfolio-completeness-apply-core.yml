name: Apply Portfolio Deployment Closure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-completeness-apply-core.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Apply deployment closure changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def gh(value: str) -> str:
              return "$" + "{{ " + value + " }}"

          path = Path('.github/workflows/deploy-dev.yml')
          text = path.read_text()

          old = "          - intelligence-mart\n          - api\n"
          new = "          - intelligence-mart\n          - private-pipeline\n          - api\n"
          if old not in text: raise SystemExit('workflow dispatch options anchor not found')
          text = text.replace(old, new, 1)

          old = (
              "      api_runtime: " + gh("steps.filter.outputs.api_runtime") + "\n"
              "      api_test: " + gh("steps.filter.outputs.api_test") + "\n"
          )
          new = (
              "      private_pipeline_runtime: " + gh("steps.filter.outputs.private_pipeline_runtime") + "\n"
              "      api_runtime: " + gh("steps.filter.outputs.api_runtime") + "\n"
              "      api_test: " + gh("steps.filter.outputs.api_test") + "\n"
          )
          if old not in text: raise SystemExit('detect outputs anchor not found')
          text = text.replace(old, new, 1)

          old = "            api_runtime:\n              - 'services/api/**'\n"
          new = """            private_pipeline_runtime:
              - 'services/api/**'
              - 'packages/contracts/**'
              - 'packages/observability/**'
              - 'packages/provenance/**'
              - 'packages/governance/**'
              - 'cloudbuild.yaml'
              - 'scripts/gcp/deploy-dev.sh'
              - 'scripts/gcp/verify-dev.sh'
            api_runtime:
              - 'services/api/**'
"""
          if old not in text: raise SystemExit('private pipeline filter anchor not found')
          text = text.replace(old, new, 1)

          old = """            api_test:
              - 'tests/test_public_runtime.py'
              - 'tests/test_public_api_routes.py'
              - 'tests/test_mcp_adapter.py'
"""
          new = """            api_test:
              - 'tests/test_public_runtime.py'
              - 'tests/test_public_api_routes.py'
              - 'tests/test_mcp_adapter.py'
              - 'tests/test_private_pipeline.py'
              - 'tests/test_user_api.py'
              - 'tests/test_portfolio_completeness.py'
              - 'tests/test_portfolio_api_completeness.py'
"""
          if old not in text: raise SystemExit('api test filter anchor not found')
          text = text.replace(old, new, 1)

          old = """          tests/test_public_runtime.py
          tests/test_public_api_routes.py
          tests/test_mcp_adapter.py

  deploy-api:
"""
          job = """          tests/test_public_runtime.py
          tests/test_public_api_routes.py
          tests/test_mcp_adapter.py
          tests/test_private_pipeline.py
          tests/test_user_api.py
          tests/test_portfolio_completeness.py
          tests/test_portfolio_api_completeness.py

  deploy-private-pipeline:
    needs: [detect, test-api]
    if: >-
      always() &&
      needs.test-api.result == 'success' &&
      (needs.detect.outputs.private_pipeline_runtime == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.component == 'private-pipeline'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: __WIF__
          service_account: __CI_SA__
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy private pipeline
        shell: bash
        env:
          GOOGLE_USER_CLIENT_ID: __USER_CLIENT__
          GOOGLE_ADMIN_CLIENT_ID: __ADMIN_CLIENT__
        run: bash scripts/gcp/deploy-dev.sh private-pipeline
      - name: Verify private pipeline
        shell: bash
        run: bash scripts/gcp/verify-dev.sh private-pipeline

  deploy-api:
"""
          job = (job.replace('__WIF__', gh('vars.GCP_WIF_PROVIDER'))
                    .replace('__CI_SA__', gh('vars.GCP_CI_SERVICE_ACCOUNT'))
                    .replace('__USER_CLIENT__', gh('vars.GOOGLE_USER_CLIENT_ID'))
                    .replace('__ADMIN_CLIENT__', gh('vars.GOOGLE_ADMIN_CLIENT_ID')))
          if old not in text: raise SystemExit('deploy private pipeline insertion anchor not found')
          text = text.replace(old, job, 1)
          path.write_text(text)

          path = Path('scripts/gcp/verify-dev.sh')
          text = path.read_text()
          old = """  api)
    verify_service janus-api
    ;;
"""
          new = """  private-pipeline)
    verify_job janus-private-pipeline
    ;;
  api)
    verify_service janus-api
    ;;
"""
          if old not in text: raise SystemExit('verify private pipeline anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('scripts/gcp/apply-private-storage-postgres-migration.sh')
          text = path.read_text()
          old = """    psql -U postgres -d janus_control -f /opt/janus/migrations/028_mcp_oauth_refresh_tokens.sql
  '
"""
          new = """    psql -U postgres -d janus_control -f /opt/janus/migrations/028_mcp_oauth_refresh_tokens.sql
    psql -U postgres -d janus_control -f /opt/janus/migrations/030_private_stock_master_read.sql
  '
"""
          if old not in text: raise SystemExit('migration 030 anchor not found')
          text = text.replace(old, new, 1)
          old = """sudo docker exec --user postgres janus-postgres \\
  psql -U postgres -d janus_control -f /opt/janus/private-storage-acceptance.sql

switched=false
"""
          new = """sudo docker exec --user postgres janus-postgres \\
  psql -U postgres -d janus_control -f /opt/janus/private-storage-acceptance.sql
sudo docker exec --user postgres janus-postgres psql -U postgres -d janus_control -v ON_ERROR_STOP=1 <<'SQL'
SELECT has_schema_privilege('janus_private_api', 'control', 'USAGE')
  AND has_table_privilege('janus_private_api', 'control.stock_master', 'SELECT')
  AS private_api_stock_master_read;
SELECT has_schema_privilege('janus_private_pipeline', 'control', 'USAGE')
  AND has_table_privilege('janus_private_pipeline', 'control.stock_master', 'SELECT')
  AS private_pipeline_stock_master_read;
SQL

switched=false
"""
          if old not in text: raise SystemExit('migration acceptance anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run deployment closure tests
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
        run: |
          bash -n scripts/gcp/deploy-dev.sh scripts/gcp/verify-dev.sh scripts/gcp/apply-private-storage-postgres-migration.sh
          python -m pytest -q tests/test_portfolio_deploy_contract.py tests/test_portfolio_completeness.py tests/test_portfolio_api_completeness.py tests/test_private_pipeline.py tests/test_user_api.py tests/test_postgres_web_roles.py
      - name: Commit deployment green
        run: |
          git config user.name 'janus-ci'
          git config user.email 'janus-ci@users.noreply.github.com'
          git add .github/workflows/deploy-dev.yml scripts/gcp/verify-dev.sh scripts/gcp/apply-private-storage-postgres-migration.sh
          git commit -m 'ci: deploy private portfolio pipeline with api changes'
          git push origin HEAD:main
