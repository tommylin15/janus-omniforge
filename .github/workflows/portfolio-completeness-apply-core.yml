name: Apply Portfolio Deployment Closure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-completeness-apply-core.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.lock
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Apply deployment closure changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-dev.yml')
          text = path.read_text()

          old = '''          - intelligence-mart\n          - api\n'''
          new = '''          - intelligence-mart\n          - private-pipeline\n          - api\n'''
          if old not in text: raise SystemExit('workflow dispatch options anchor not found')
          text = text.replace(old, new, 1)

          old = '''      api_runtime: ${{ steps.filter.outputs.api_runtime }}\n      api_test: ${{ steps.filter.outputs.api_test }}\n'''
          new = '''      private_pipeline_runtime: ${{ steps.filter.outputs.private_pipeline_runtime }}\n      api_runtime: ${{ steps.filter.outputs.api_runtime }}\n      api_test: ${{ steps.filter.outputs.api_test }}\n'''
          if old not in text: raise SystemExit('detect outputs anchor not found')
          text = text.replace(old, new, 1)

          old = '''            api_runtime:\n              - 'services/api/**'\n'''
          new = '''            private_pipeline_runtime:\n              - 'services/api/**'\n              - 'packages/contracts/**'\n              - 'packages/observability/**'\n              - 'packages/provenance/**'\n              - 'packages/governance/**'\n              - 'cloudbuild.yaml'\n              - 'scripts/gcp/deploy-dev.sh'\n              - 'scripts/gcp/verify-dev.sh'\n            api_runtime:\n              - 'services/api/**'\n'''
          if old not in text: raise SystemExit('private pipeline filter anchor not found')
          text = text.replace(old, new, 1)

          old = '''            api_test:\n              - 'tests/test_public_runtime.py'\n              - 'tests/test_public_api_routes.py'\n              - 'tests/test_mcp_adapter.py'\n'''
          new = '''            api_test:\n              - 'tests/test_public_runtime.py'\n              - 'tests/test_public_api_routes.py'\n              - 'tests/test_mcp_adapter.py'\n              - 'tests/test_private_pipeline.py'\n              - 'tests/test_user_api.py'\n              - 'tests/test_portfolio_completeness.py'\n              - 'tests/test_portfolio_api_completeness.py'\n'''
          if old not in text: raise SystemExit('api test filter anchor not found')
          text = text.replace(old, new, 1)

          old = '''          tests/test_public_runtime.py\n          tests/test_public_api_routes.py\n          tests/test_mcp_adapter.py\n\n  deploy-api:\n'''
          new = '''          tests/test_public_runtime.py\n          tests/test_public_api_routes.py\n          tests/test_mcp_adapter.py\n          tests/test_private_pipeline.py\n          tests/test_user_api.py\n          tests/test_portfolio_completeness.py\n          tests/test_portfolio_api_completeness.py\n\n  deploy-private-pipeline:\n    needs: [detect, test-api]\n    if: >-\n      always() &&\n      needs.test-api.result == 'success' &&\n      (needs.detect.outputs.private_pipeline_runtime == 'true' ||\n      (github.event_name == 'workflow_dispatch' && inputs.component == 'private-pipeline'))\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: google-github-actions/auth@v2\n        with:\n          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}\n          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}\n      - uses: google-github-actions/setup-gcloud@v2\n      - name: Deploy private pipeline\n        shell: bash\n        env:\n          GOOGLE_USER_CLIENT_ID: ${{ vars.GOOGLE_USER_CLIENT_ID }}\n          GOOGLE_ADMIN_CLIENT_ID: ${{ vars.GOOGLE_ADMIN_CLIENT_ID }}\n        run: bash scripts/gcp/deploy-dev.sh private-pipeline\n      - name: Verify private pipeline\n        shell: bash\n        run: bash scripts/gcp/verify-dev.sh private-pipeline\n\n  deploy-api:\n'''
          if old not in text: raise SystemExit('deploy private pipeline insertion anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('scripts/gcp/verify-dev.sh')
          text = path.read_text()
          old = '''  api)\n    verify_service janus-api\n    ;;\n'''
          new = '''  private-pipeline)\n    verify_job janus-private-pipeline\n    ;;\n  api)\n    verify_service janus-api\n    ;;\n'''
          if old not in text: raise SystemExit('verify private pipeline anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('scripts/gcp/apply-private-storage-postgres-migration.sh')
          text = path.read_text()
          old = '''    psql -U postgres -d janus_control -f /opt/janus/migrations/028_mcp_oauth_refresh_tokens.sql\n  '\n'''
          new = '''    psql -U postgres -d janus_control -f /opt/janus/migrations/028_mcp_oauth_refresh_tokens.sql\n    psql -U postgres -d janus_control -f /opt/janus/migrations/030_private_stock_master_read.sql\n  '\n'''
          if old not in text: raise SystemExit('migration 030 anchor not found')
          text = text.replace(old, new, 1)
          old = '''sudo docker exec --user postgres janus-postgres \\\n  psql -U postgres -d janus_control -f /opt/janus/private-storage-acceptance.sql\n\nswitched=false\n'''
          new = '''sudo docker exec --user postgres janus-postgres \\\n  psql -U postgres -d janus_control -f /opt/janus/private-storage-acceptance.sql\nsudo docker exec --user postgres janus-postgres psql -U postgres -d janus_control -v ON_ERROR_STOP=1 <<'SQL'\nSELECT has_schema_privilege('janus_private_api', 'control', 'USAGE')\n  AND has_table_privilege('janus_private_api', 'control.stock_master', 'SELECT')\n  AS private_api_stock_master_read;\nSELECT has_schema_privilege('janus_private_pipeline', 'control', 'USAGE')\n  AND has_table_privilege('janus_private_pipeline', 'control.stock_master', 'SELECT')\n  AS private_pipeline_stock_master_read;\nSQL\n\nswitched=false\n'''
          if old not in text: raise SystemExit('migration acceptance anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run deployment closure tests
        env:
          PYTHONPATH: jobs/ingestion-core:jobs/intelligence-mart:.
        run: |
          bash -n scripts/gcp/deploy-dev.sh scripts/gcp/verify-dev.sh scripts/gcp/apply-private-storage-postgres-migration.sh
          python -m pytest -q tests/test_portfolio_deploy_contract.py tests/test_portfolio_completeness.py tests/test_portfolio_api_completeness.py tests/test_private_pipeline.py tests/test_user_api.py tests/test_postgres_web_roles.py
      - name: Commit deployment green
        run: |
          git config user.name 'janus-ci'
          git config user.email 'janus-ci@users.noreply.github.com'
          git add .github/workflows/deploy-dev.yml scripts/gcp/verify-dev.sh scripts/gcp/apply-private-storage-postgres-migration.sh
          git commit -m 'ci: deploy private portfolio pipeline with api changes'
          git push origin HEAD:main
