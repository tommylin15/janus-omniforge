name: Apply Portfolio Completeness UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-completeness-apply-core.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply portfolio UI completeness changes
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/user_app/lib/main.dart')
          text = path.read_text()

          anchor = '''List<dynamic> effectiveLedgerEvents(List<dynamic> rows) {\n'''
          helpers = '''String stockDisplayName(Map row) {\n  final symbol = '${row['symbol'] ?? '—'}';\n  final name = '${row['stock_name'] ?? ''}'.trim();\n  return name.isEmpty ? symbol : '$name（$symbol）';\n}\n\nString portfolioReturnLabel(Object? value) {\n  if (value == null) return '資料不足';\n  final ratio = double.tryParse('$value');\n  return ratio == null ? '$value' : '${(ratio * 100).toStringAsFixed(2)}%';\n}\n\nString portfolioMissingReasonLabel(Object? value) => const {\n      'no_eligible_persisted_ohlcv': '缺少符合估值日的正式行情',\n      'stock_master_not_found': '股票主檔缺少正式名稱',\n    }[value?.toString()] ?? '';\n\n'''
          if 'String stockDisplayName(Map row)' not in text:
              if anchor not in text: raise SystemExit('display helper anchor not found')
              text = text.replace(anchor, helpers + anchor, 1)

          text = text.replace("'股票：${row['symbol'] ?? '—'}',", "'股票：${stockDisplayName(row)}',", 1)
          text = text.replace("title: Text('${uiLabel(row['event_type'])} ${row['symbol'] ?? ''}'),",
                              "title: Text('${uiLabel(row['event_type'])} ${stockDisplayName(row)}'),", 1)

          old = '''            title: Text('${row['symbol']} · ${row['currency'] ?? 'TWD'}'),\n            subtitle: Text('持有 ${row['shares'] ?? '—'} 股 · 現價 ${row['market_price'] ?? '—'} · 均價 ${row['average_cost'] ?? '—'}\\n市值 ${row['market_value'] ?? '缺價'} · 未實現損益 ${row['unrealized_pnl'] ?? '資料不足'}\\n估值日 ${row['valuation_date'] ?? '—'} · 行情日 ${row['price_date'] ?? '—'} · ${row['price_status'] == 'missing' ? '缺價' : row['price_status'] == 'stale' ? '資料過期' : '可用'}'),\n'''
          new = '''            title: Text('${stockDisplayName(row)} · ${row['currency'] ?? 'TWD'}'),\n            subtitle: Text('持有 ${row['shares'] ?? '—'} 股 · 現價 ${row['market_price'] ?? '—'} · 均價 ${row['average_cost'] ?? '—'}\\n市值 ${row['market_value'] ?? '缺價'} · 未實現損益 ${row['unrealized_pnl'] ?? '資料不足'} · 未實現報酬 ${portfolioReturnLabel(row['unrealized_return'])}\\n估值日 ${row['valuation_date'] ?? '—'} · 行情日 ${row['price_date'] ?? '—'} · ${row['price_status'] == 'missing' ? '缺價' : row['price_status'] == 'stale' ? '資料過期' : '可用'}${portfolioMissingReasonLabel(row['missing_reason']).isEmpty ? '' : ' · ${portfolioMissingReasonLabel(row['missing_reason'])}'}'),\n'''
          if old not in text: raise SystemExit('holdings card anchor not found')
          text = text.replace(old, new, 1)

          old = "title: Text('${uiLabel(row['event_type'])} · ${row['symbol']}'),"
          new = "title: Text('${uiLabel(row['event_type'])} · ${stockDisplayName(row)}'),"
          if old not in text: raise SystemExit('transaction title anchor not found')
          text = text.replace(old, new, 1)

          old = '''        final realized = pnl.isEmpty ? '資料不足' : pnl.length == 1\n            ? '${pnl.first['currency']} ${pnl.first['realized_pnl'] ?? '資料不足'}' : '多幣別';\n        final value = portfolio.isEmpty ? '資料不足' : portfolio.length == 1\n            ? '${portfolio.first['currency']} ${portfolio.first['market_value'] ?? '資料不足'}' : '多幣別';\n        final unrealized = portfolio.isEmpty ? '資料不足' : portfolio.length == 1\n            ? '${portfolio.first['currency']} ${portfolio.first['unrealized_pnl'] ?? ((portfolio.first['stale_price_count'] ?? 0) > 0 ? '資料過期' : '資料不足')}' : '多幣別';\n'''
          new = '''        final realized = pnl.isEmpty ? '資料不足' : pnl.length == 1\n            ? '${pnl.first['currency']} ${pnl.first['realized_pnl'] ?? '資料不足'}' : '多幣別';\n        final aggregateWithheld = portfolio.any((row) => row['aggregate_status'] == 'withheld');\n        final value = aggregateWithheld ? '總額暫不發布' : portfolio.isEmpty ? '資料不足' : portfolio.length == 1\n            ? '${portfolio.first['currency']} ${portfolio.first['market_value'] ?? '資料不足'}' : '多幣別';\n        final unrealized = aggregateWithheld ? '總額暫不發布' : portfolio.isEmpty ? '資料不足' : portfolio.length == 1\n            ? '${portfolio.first['currency']} ${portfolio.first['unrealized_pnl'] ?? ((portfolio.first['stale_price_count'] ?? 0) > 0 ? '資料過期' : '資料不足')}' : '多幣別';\n'''
          if old not in text: raise SystemExit('summary value anchor not found')
          text = text.replace(old, new, 1)

          old = '''        final valuationStatus = hasMissing && hasStale ? '部分可用，含缺價與過期行情'\n            : hasMissing ? '部分可用，含缺價' : hasStale ? '行情過期' : '資料完整';\n'''
          new = '''        final affectedStatus = portfolio.where((row) => row['aggregate_status'] == 'withheld').map((row) {\n          final symbols = _asList(row['affected_symbols']).join('、');\n          return '受影響 ${row['affected_symbol_count'] ?? _asList(row['affected_symbols']).length} 檔${symbols.isEmpty ? '' : '：$symbols'}';\n        }).join(' / ');\n        final valuationStatus = aggregateWithheld ? affectedStatus\n            : hasMissing && hasStale ? '部分可用，含缺價與過期行情'\n            : hasMissing ? '部分可用，含缺價' : hasStale ? '行情過期' : '資料完整';\n'''
          if old not in text: raise SystemExit('summary status anchor not found')
          text = text.replace(old, new, 1)

          old = '''        for (final row in summary.cast<Map<String, dynamic>>())\n          ListTile(title: Text('${row['currency']} 投資組合'),\n            subtitle: Text('市值 ${money(row['market_value'])}・未實現 ${money(row['unrealized_pnl'])}'),\n            trailing: Text(row['cash_safety_status'] == 'insufficient_data' ? '現金資料不足' : '${row['cash_ratio']}')),\n'''
          new = '''        for (final row in summary.cast<Map<String, dynamic>>())\n          ListTile(title: Text('${row['currency']} 投資組合'),\n            subtitle: Text(row['aggregate_status'] == 'withheld'\n              ? '總額暫不發布・受影響 ${row['affected_symbol_count'] ?? _asList(row['affected_symbols']).length} 檔${_asList(row['affected_symbols']).isEmpty ? '' : '：${_asList(row['affected_symbols']).join('、')}'}'\n              : '市值 ${money(row['market_value'])}・未實現 ${money(row['unrealized_pnl'])}・未實現報酬 ${portfolioReturnLabel(row['unrealized_return'])}'),\n            trailing: Text(row['cash_safety_status'] == 'insufficient_data' ? '現金資料不足' : '${row['cash_ratio']}')),\n'''
          if old not in text: raise SystemExit('portfolio dashboard anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Generate Janus PNG branding assets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
          python3 tool/generate_brand_assets.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test
      - run: flutter build web --base-href /app/
      - name: Commit UI green
        working-directory: .
        run: |
          git config user.name 'janus-ci'
          git config user.email 'janus-ci@users.noreply.github.com'
          git add apps/user_app/lib/main.dart
          git commit -m 'feat: render complete portfolio state in user app'
          git push origin HEAD:main
