name: P0 private recalculation read-only diagnostic
on:
  push:
    branches: [main]
    paths: ['ops/private-recalc-diagnostic-request.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: janus-dev-runtime-writers
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded immutable request
        run: |
          jq -e '.intent=="readonly-failed-private-recalc-canary" and
            .approved==true and .read_only==true and
            .scope=="one-failed-verify-execution" and
            .run_id=="38274621290" and
            .verify_execution=="janus-ingestion-core-5hksw" and
            .seed_execution=="janus-ingestion-core-prv6p" and
            .queue_execution=="janus-private-pipeline-45h2t"' \
            ops/private-recalc-diagnostic-request.json >/dev/null
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read exact executions and allowlisted failure classifications only
        shell: bash
        run: |
          set -Eeuo pipefail
          for execution in janus-ingestion-core-prv6p janus-private-pipeline-45h2t janus-ingestion-core-5hksw; do
            gcloud run jobs executions describe "$execution" --project gen-lang-client-0593591102 \
              --region us-central1 --format=json > "/tmp/$execution.json"
          done
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="janus-ingestion-core" AND timestamp>="2026-10-12T16:35:00Z" AND timestamp<="2026-10-12T16:41:00Z"' \
            --project gen-lang-client-0593591102 --limit 100 --format=json > /tmp/recalc-logs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          executions=('janus-ingestion-core-prv6p','janus-private-pipeline-45h2t','janus-ingestion-core-5hksw')
          for name in executions:
              d=json.loads(Path('/tmp/'+name+'.json').read_text())
              st=d.get('status',{})
              print(json.dumps({'execution':name,
                  'succeeded_count':st.get('succeededCount'),
                  'failed_count':st.get('failedCount'),
                  'completion_condition':[(c.get('type'),c.get('state') or c.get('status'),c.get('reason'))
                                          for c in st.get('conditions',[])],
                  'task_count':d.get('spec',{}).get('taskCount')},sort_keys=True))
          data=json.loads(Path('/tmp/recalc-logs.json').read_text())
          kinds={}
          matched=0
          for row in data:
              labels=row.get('labels',{})
              ex=str(labels.get('run.googleapis.com/execution_name') or '')
              if ex!='janus-ingestion-core-5hksw': continue
              matched+=1
              payload=row.get('jsonPayload') or {}
              raw=row.get('textPayload')
              if not isinstance(payload,dict) and isinstance(raw,str):
                  try: payload=json.loads(raw)
                  except (ValueError,TypeError): payload={}
              if not isinstance(payload,dict): payload={}
              kind=str(payload.get('error_code') or payload.get('operation') or payload.get('status') or row.get('severity') or 'unknown')[:60]
              kinds[kind]=kinds.get(kind,0)+1
          print(json.dumps({'verify_log_entries':matched,'verify_error_classes':kinds,
              'log_queries_read_only':True,'raw_logs_not_printed':True},sort_keys=True))
          PY

      - name: Read recently started diagnostic task and safe state log without starting workloads
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud run jobs executions list --job janus-ingestion-core \
            --project gen-lang-client-0593591102 --region us-central1 \
            --limit 20 --format=json > /tmp/recent-ingestion-executions.json
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="janus-ingestion-core" AND timestamp>="2026-10-12T23:19:00Z" AND timestamp<="2026-10-12T23:29:00Z"' \
            --project gen-lang-client-0593591102 --limit 180 --format=json > /tmp/recent-readonly-logs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          executions=json.loads(Path('/tmp/recent-ingestion-executions.json').read_text())
          for e in executions:
              meta=e.get('metadata',{})
              st=e.get('status',{})
              name=str(meta.get('name',e.get('name',''))).split('/')[-1]
              if not name.startswith('janus-ingestion-core-'):continue
              start=str(st.get('startTime') or meta.get('creationTimestamp') or '')
              if start and not start.startswith(('2026-10-12T23:','2026-10-13T00:')):
                  continue
              print(json.dumps({'read_only_execution':name,
                  'started':bool(st.get('startTime')),
                  'succeeded_count':st.get('succeededCount'),
                  'failed_count':st.get('failedCount'),
                  'completion':[(c.get('type'),c.get('status') or c.get('state'),c.get('reason'))
                      for c in st.get('conditions',[])],
                  },sort_keys=True))
          rows=json.loads(Path('/tmp/recent-readonly-logs.json').read_text())
          parsed=[]
          for row in rows:
              raw=row.get('textPayload') or ''
              if not isinstance(raw,str) or 'RECALC_P0_STATE=' not in raw: continue
              try:
                  obj=json.loads(raw.split('RECALC_P0_STATE=',1)[1])
              except (ValueError,TypeError):continue
              if not isinstance(obj,dict) or obj.get('query_read_only') is not True:continue
              safe={'query_read_only':True,
                  'matching_window_count':obj.get('matching_window_count'),
                  'active_request_count':obj.get('active_request_count'),
                  'dispatch_active':obj.get('dispatch_active'),
                  'rows':[{
                      k:v for k,v in item.items()
                      if k in ('status','attempt_count','worker_index_valid',
                          'execution_matches','checkpoint_matches','error_class','synthetic_marker')
                    } for item in obj.get('rows',[])[:8] if isinstance(item,dict)]}
              parsed.append(safe)
          print(json.dumps({'read_only_state_log_results':parsed[:2],
              'raw_logs_not_printed':True},sort_keys=True))
          PY

      - name: Classify exact failed read-only probe stderr without printing raw contents
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="janus-ingestion-core" AND timestamp>="2026-10-12T23:13:00Z" AND timestamp<="2026-10-12T23:21:00Z"' \
            --project gen-lang-client-0593591102 --limit 180 --format=json > /tmp/probe-error-classes.json
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          rows=json.loads(Path('/tmp/probe-error-classes.json').read_text())
          classes={}
          matched=0
          for row in rows:
              if (row.get('labels') or {}).get('run.googleapis.com/execution_name')!='janus-ingestion-core-hxzzs':
                  continue
              matched+=1
              message=row.get('textPayload') or ''
              for code,pattern in (
                  ('SQL_PRIVILEGE',r'(permission denied|InsufficientPrivilege)'),
                  ('SQL_COLUMN',r'(UndefinedColumn|column .+ does not exist)'),
                  ('SQL_TABLE',r'(UndefinedTable|relation .+ does not exist)'),
                  ('PYTHON_SYNTAX',r'SyntaxError'),
                  ('PYTHON_IMPORT',r'(ModuleNotFoundError|ImportError)'),
                  ('PYTHON_VALUE',r'ValueError:'),
                  ('PYTHON_TYPE',r'TypeError:'),
                  ('PYTHON_RUNTIME',r'RuntimeError:'),
                  ('SQL_ERROR',r'psycopg\\.errors\\.[A-Za-z]+'),
                  ('CONNECTION',r'(OperationalError|connection refused|timeout expired)')):
                  if re.search(pattern,str(message),re.I):
                      classes[code]=classes.get(code,0)+1
          print(json.dumps({'execution':'janus-ingestion-core-hxzzs',
              'matched_log_entries':matched,'sanitized_error_classes':classes,
              'raw_logs_not_printed':True},sort_keys=True))
          PY

      - name: Read only sanitized historical parallel queue worker counts
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="janus-private-pipeline" AND timestamp>="2026-10-12T16:31:00Z" AND timestamp<="2026-10-12T16:35:00Z"' \
            --project gen-lang-client-0593591102 --limit 100 --format=json > /tmp/worker-queue-logs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          entries=json.loads(Path('/tmp/worker-queue-logs.json').read_text())
          outcome=[]
          for entry in entries:
              if (entry.get('labels') or {}).get('run.googleapis.com/execution_name')!='janus-private-pipeline-45h2t':
                  continue
              payload=entry.get('textPayload') or ''
              if not isinstance(payload,str):
                  continue
              try: data=json.loads(payload)
              except (ValueError,TypeError): continue
              result=data.get('private_recalc_queue')
              if not isinstance(result,dict): continue
              if not all(isinstance(result.get(k),int) for k in ('processed','succeeded','failed','cancelled')):
                  continue
              outcome.append({k:result[k] for k in ('processed','succeeded','failed','cancelled')})
          print(json.dumps({'run_id':'38274621290','worker_execution':'janus-private-pipeline-45h2t',
              'task_outputs':outcome,'status':'OBSERVED' if outcome else 'NOT_VERIFIED',
              'raw_logs_not_printed':True},sort_keys=True))
          PY
