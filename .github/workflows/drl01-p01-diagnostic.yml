name: DRL-01 P0-1 Two-Year Profile Diagnostic

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL (required)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run P0-1 Diagnostic
        env:
          JANUS_API_URL: ${{ inputs.api_url }}
        run: |
          python scripts/gcp/drl01_two_year_profile_diagnostic.py

      - name: Upload Receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drl01-p01-diagnostic-receipt
          path: ops/drl01-p01-diagnostic-receipt.json
          retention-days: 30
