name: janus_user_app
description: Minimal private Janus workspace.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: 6.3.0
  google_sign_in_web: 0.12.4+4
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/janus_app_icon_192.png
    - assets/branding/janus_app_icon_512.png
