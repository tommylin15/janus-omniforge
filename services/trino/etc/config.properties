coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080

# Cloud Run IAM protects the service endpoint. Trino receives the caller's
# logical job user through X-Trino-User from the internal client.
http-server.authentication.type=NONE
# The service is an internal query endpoint; Cloud Run IAM protects the API.
# Disable Trino's browser UI to avoid enabling a second authentication plane.
web-ui.enabled=false

# Keep the single Cloud Run instance and the e2-micro catalog database bounded.
query.max-concurrent-queries=2
query.max-memory=2GB
query.max-memory-per-node=1536MB
query.max-execution-time=10m
query.max-run-time=15m
task.concurrency=2
task.max-worker-threads=4
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
memory.heap-headroom-per-node=512MB
