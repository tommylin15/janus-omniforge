connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=janus
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://${ENV:CATALOG_DB_HOST}:5432/${ENV:CATALOG_DB_NAME}
iceberg.jdbc-catalog.connection-user=${ENV:CATALOG_DB_USER}
iceberg.jdbc-catalog.connection-password=${ENV:CATALOG_DB_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=gs://${ENV:CORE_BUCKET}/warehouse

# Workload Identity / ADC is provided by the Cloud Run runtime service account.
fs.gcs.enabled=true
gcs.project-id=${ENV:GCP_PROJECT_ID}
gcs.auth-type=APPLICATION_DEFAULT

# Keep metadata memory bounded; query concurrency is bounded in config.properties.
iceberg.metadata-cache.enabled=true
fs.memory-cache.max-size=64MB
