substitutions:
  _SERVICE_URL: https://janus-api-2oo7qbkd5q-uc.a.run.app
steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python - <<'PY'
        import json
        import urllib.error
        import urllib.request

        base = "${_SERVICE_URL}".rstrip("/")

        def get(path):
            try:
                response = urllib.request.urlopen(base + path, timeout=20)
                result = response.status, json.loads(response.read())
            except urllib.error.HTTPError as error:
                result = error.code, json.loads(error.read())
            payload = result[1] if isinstance(result[1], dict) else {}
            print(path, result[0], payload.get("detail", payload.get("data_status", "ok")))
            return result

        assert get("/health")[0] == 200
        assert get("/api/v1/public/health")[0] == 200
        assert get("/api/v1/me/profile")[0] == 401
        feedback = get("/api/v1/me/analysis-feedback?analysis_execution_id=11111111-1111-1111-1111-111111111111&scope_type=symbol&scope_id=2330")
        assert feedback[0] == 401, feedback
        with urllib.request.urlopen(base + "/usefulness-feedback-acceptance.html", timeout=20) as response:
            page = response.read().decode("utf-8")
        assert "Janus usefulness feedback acceptance" in page
        assert "google.accounts.id.initialize" in page
        admin_status, _ = get("/api/v1/admin/stocks")
        assert admin_status in {401, 503}, admin_status
        unknown = get("/api/v1/public/history/JANUS-NOT-A-STOCK")
        assert unknown == (404, {"detail": "stock not found"}), unknown
        for path in (
            "/api/v1/public/daily-brief",
            "/api/v1/public/topics",
            "/api/v1/public/candidates",
            "/api/v1/public/history/2330",
            "/api/v1/public/kline/2330",
            "/api/v1/public/events/2330",
        ):
            status, payload = get(path)
            assert status in {200, 404, 503}, (path, status, payload)
            if status == 200 and isinstance(payload, dict):
                text = json.dumps(payload, ensure_ascii=False).lower()
                for forbidden in ("traceback", "raw_payload", "artifact_uri", "gcs_uri", "secret", "token", "password"):
                    assert forbidden not in text, (path, forbidden, payload)
                assert payload.get("data_status") in {"waiting", "publishable", "published", None}, (path, payload)
            if status == 503:
                assert payload == {"detail": "public data unavailable"}, (path, payload)
        print("public API GCP dev acceptance passed")
        PY
options:
  logging: CLOUD_LOGGING_ONLY
