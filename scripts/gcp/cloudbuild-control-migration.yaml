substitutions:
  _POSTGRES_VM: janus-postgres-dev
  _POSTGRES_ZONE: us-central1-a
  _MIGRATION: ""

steps:
  - id: apply-bounded-control-migration
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        migration="${_MIGRATION}"
        case "${migration}" in
          029_twse_2026_holiday_overrides.sql) ;;
          *) echo "Refusing unapproved control migration: ${migration}" >&2; exit 2 ;;
        esac
        source="infra/postgres/migrations/${migration}"
        test -f "${source}"
        remote="/tmp/janus-control-migration-${BUILD_ID}.sql"

        cleanup() {
          gcloud compute ssh "${_POSTGRES_VM}" \
            --project="${PROJECT_ID}" --zone="${_POSTGRES_ZONE}" \
            --tunnel-through-iap --quiet \
            --command="sudo rm -f '${remote}' /tmp/janus-control-migration.sql" \
            >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        gcloud compute scp "${source}" \
          "${_POSTGRES_VM}:${remote}" \
          --project="${PROJECT_ID}" --zone="${_POSTGRES_ZONE}" \
          --tunnel-through-iap --quiet

        gcloud compute ssh "${_POSTGRES_VM}" \
          --project="${PROJECT_ID}" --zone="${_POSTGRES_ZONE}" \
          --tunnel-through-iap --quiet --command="
            set -eu
            sudo docker cp '${remote}' janus-postgres:/tmp/janus-control-migration.sql
            sudo docker exec --user postgres janus-postgres \
              psql -v ON_ERROR_STOP=1 -U postgres -d janus_control \
              -f /tmp/janus-control-migration.sql
            sudo docker exec --user postgres janus-postgres \
              psql -v ON_ERROR_STOP=1 -U postgres -d janus_control -Atc \
              \"SELECT version FROM control.schema_migrations WHERE version='029_twse_2026_holiday_overrides';\"
            sudo docker exec --user postgres janus-postgres \
              psql -v ON_ERROR_STOP=1 -U postgres -d janus_control -Atc \
              \"SELECT jsonb_build_object('time',value_json->'time','enabled',value_json->'enabled','holiday_overrides',value_json->'holiday_overrides','version',version,'updated_by',updated_by) FROM control.admin_settings WHERE setting_key='schedule';\"
            sudo rm -f '${remote}'
          "

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
