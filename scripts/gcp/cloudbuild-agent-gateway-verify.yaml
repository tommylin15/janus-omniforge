substitutions:
  _SERVICE_URL: ""
  _TOKEN_SERVICE_ACCOUNT: ""

steps:
  - id: verify-codex-bridge-contract
    name: node:22.20.0-bookworm-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run build:agent-gateway
        npm run test:agent-gateway

  - id: verify-private-agent-gateway
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_SERVICE_URL}"
        test -n "${_TOKEN_SERVICE_ACCOUNT}"
        token=''
        for attempt in {1..24}; do
          if token="$(gcloud auth print-identity-token \
            --impersonate-service-account="${_TOKEN_SERVICE_ACCOUNT}" \
            --audiences="${_SERVICE_URL}" --include-email 2>/tmp/token-error)"; then
            break
          fi
          echo "identity token attempt=${attempt} pending"
          sleep 5
        done
        [[ -n "${token}" ]] || { cat /tmp/token-error >&2; exit 1; }
        status=000
        ready=0
        for attempt in {1..120}; do
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${token}" "${_SERVICE_URL}/health")"
          echo "health attempt=${attempt} status=${status}"
          if [[ "${status}" == 200 ]]; then ready=$((ready + 1)); else ready=0; fi
          [[ "${ready}" == 3 ]] && break
          sleep 5
        done
        [[ "${ready}" == 3 ]]
        response_file="$(mktemp)"
        status=000
        for attempt in {1..12}; do
          if status="$(curl --silent --show-error --max-time 300 --output "${response_file}" --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" --data '' "${_SERVICE_URL}/internal/v1/poc/codex")"; then
            echo "poc attempt=${attempt} status=${status}"
            [[ "${status}" == 200 ]] && break
          else
            status=000
          fi
          sleep 5
        done
        if [[ "${status}" != 200 ]]; then cat "${response_file}" >&2; exit 1; fi
        result="$(cat "${response_file}")"
        checkpoint="$(python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["cancelled"] is True and value["process"] == "stopped-after-response"; print(value["checkpointId"])' <<<"${result}")"
        cursor="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["cursor"])' <<<"${result}")"
        replay="$(curl --fail --silent --show-error --max-time 60 \
          -H "Authorization: Bearer ${token}" "${_SERVICE_URL}/internal/v1/poc/checkpoints/${checkpoint}?cursor=-1")"
        python3 -c 'import json,sys; value=json.load(sys.stdin); events=value["events"]; assert events and [e["seq"] for e in events] == list(range(len(events))); assert any(e["type"] == "turn_cancelled" for e in events); assert all(e["providerIds"]["codexThreadId"] == e["threadId"] for e in events)' <<<"${replay}"
        empty="$(curl --fail --silent --show-error --max-time 60 \
          -H "Authorization: Bearer ${token}" "${_SERVICE_URL}/internal/v1/poc/checkpoints/${checkpoint}?cursor=${cursor}")"
        python3 -c 'import json,sys; assert json.load(sys.stdin)["events"] == []' <<<"${empty}"
        printf '%s\n' "${result}" "GCP dev checkpoint reconnect passed: ${checkpoint}"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
