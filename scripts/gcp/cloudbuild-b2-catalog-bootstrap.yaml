steps:
  - id: create-b2-catalog
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        project='gen-lang-client-0593591102'
        catalog='janus_core_dev'

        if ! gcloud biglake iceberg catalogs describe "${catalog}" --project="${project}" --format=json >/tmp/catalog.json 2>/dev/null; then
          gcloud biglake iceberg catalogs create "${catalog}"             --project="${project}"             --catalog-type=biglake             --credential-mode=end-user             --primary-location=us-central1             --quiet
          gcloud biglake iceberg catalogs describe "${catalog}" --project="${project}" --format=json >/tmp/catalog.json
        fi

        python3 - <<'PY'
        import json
        p=json.load(open('/tmp/catalog.json'))
        s=json.dumps(p,sort_keys=True).lower()
        assert 'janus_core_dev' in s
        assert 'us-central1' in s
        assert 'end-user' in s or 'end_user' in s
        print('B2 catalog metadata-only bootstrap PASS')
        PY

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 300s
