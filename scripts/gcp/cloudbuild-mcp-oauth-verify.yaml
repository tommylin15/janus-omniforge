substitutions:
  _SERVICE_URL: ""
  _EXPECTED_ISSUER: ""
  _EXPECTED_RESOURCE: ""

steps:
  - id: verify-mcp-oauth-metadata
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_SERVICE_URL}"
        test -n "${_EXPECTED_ISSUER}"
        test -n "${_EXPECTED_RESOURCE}"
        protected_status="$(curl --silent --show-error --output /tmp/protected.json --write-out '%{http_code}' --max-time 30 "${_SERVICE_URL}/.well-known/oauth-protected-resource")"
        echo "protected_status=${protected_status}"
        test "${protected_status}" = 200
        EXPECTED_ISSUER="${_EXPECTED_ISSUER}" EXPECTED_RESOURCE="${_EXPECTED_RESOURCE}" python3 - <<'PY'
        import json, os
        protected = json.load(open('/tmp/protected.json'))
        assert protected['resource'] == os.environ['EXPECTED_RESOURCE']
        assert protected['authorization_servers'] == [os.environ['EXPECTED_ISSUER']]
        assert set(protected['scopes_supported']) == {'janus.sources.read','janus.market.read','janus.private.read'}
        PY
        authorization_status="$(curl --silent --show-error --output /tmp/authorization.json --write-out '%{http_code}' --max-time 30 "${_SERVICE_URL}/.well-known/oauth-authorization-server")"
        echo "authorization_status=${authorization_status}"
        test "${authorization_status}" = 200
        EXPECTED_ISSUER="${_EXPECTED_ISSUER}" python3 - <<'PY'
        import json, os
        metadata = json.load(open('/tmp/authorization.json'))
        assert metadata['issuer'] == os.environ['EXPECTED_ISSUER']
        assert metadata['code_challenge_methods_supported'] == ['S256']
        assert metadata['token_endpoint_auth_methods_supported'] == ['none']
        assert metadata['client_id_metadata_document_supported'] is True
        PY
        status="$(curl --silent --show-error --output /tmp/invalid.json --write-out '%{http_code}' --max-time 30 -X POST \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          --data 'grant_type=authorization_code&client_id=https%3A%2F%2Fchatgpt.com%2Foauth%2Fclient.json' \
          "${_SERVICE_URL}/oauth/token")"
        echo "token_negative_status=${status}"
        test "${status}" = 400
        resource_encoded="$(RESOURCE="${_EXPECTED_RESOURCE}" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["RESOURCE"], safe=""))')"
        status="$(curl --silent --show-error --output /tmp/authorize.json --write-out '%{http_code}' --max-time 30 \
          "${_SERVICE_URL}/oauth/authorize?response_type=code&client_id=https%3A%2F%2Fchatgpt.com%2Foauth%2Fclient.json&redirect_uri=https%3A%2F%2Fchatgpt.com%2Fconnector_platform_oauth_redirect&resource=${resource_encoded}&scope=janus.market.read&state=test")"
        echo "authorize_negative_status=${status}"
        test "${status}" = 400
        echo 'MCP OAuth metadata and negative guards passed.'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
