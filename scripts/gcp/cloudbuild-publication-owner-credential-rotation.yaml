substitutions:
  _POSTGRES_VM: janus-postgres-dev
  _POSTGRES_ZONE: us-central1-a

steps:
  - id: prepare-publication-owner-secret
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    secretEnv:
      - RUNTIME_BUNDLE
    args:
      - -ceu
      - |
        set -Eeuo pipefail
        umask 077
        work=/workspace/.publication-owner-rotation
        rm -rf "$${work}"
        mkdir -m 700 "$${work}"
        printf '%s' "$${RUNTIME_BUNDLE}" > "$${work}/current.json"
        unset RUNTIME_BUNDLE
        python3 - "$${work}/current.json" "$${work}/next.json" \
          "$${work}/password" "$${work}/mode" <<'PY'
        import json
        from pathlib import Path
        import secrets
        import sys

        current_path, next_path, password_path, mode_path = map(Path, sys.argv[1:])
        value = json.loads(current_path.read_text(encoding="utf-8"))
        if not isinstance(value, dict):
            raise SystemExit("runtime bundle must be a JSON object")
        existing = value.get("publication_password")
        if existing is not None:
            if not isinstance(existing, str) or len(existing) < 40:
                raise SystemExit("existing publication_password is invalid")
            password = existing
            mode = "existing"
        else:
            password = secrets.token_urlsafe(48)
            value["publication_password"] = password
            mode = "created"
        next_path.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")), encoding="utf-8")
        password_path.write_text(password + "\n", encoding="utf-8")
        mode_path.write_text(mode + "\n", encoding="utf-8")
        for path in (current_path, next_path, password_path, mode_path):
            path.chmod(0o600)
        PY

        mode="$$(cat "$${work}/mode")"
        if [[ "$${mode}" == created ]]; then
          candidate_version="$$(gcloud secrets versions add janus-runtime-bundle \
            --project="${PROJECT_ID}" --data-file="$${work}/next.json" \
            --format='value(name)')"
          test -n "$${candidate_version}"
          candidate_number="$${candidate_version##*/}"
          latest_version="$$(gcloud secrets versions describe latest \
            --secret=janus-runtime-bundle --project="${PROJECT_ID}" \
            --format='value(name)')"
          test "$${latest_version##*/}" = "$${candidate_number}"
        elif [[ "$${mode}" != existing ]]; then
          echo 'Unexpected publication owner rotation mode.' >&2
          exit 1
        fi

  - id: install-publication-owner-rotation-script
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        set -Eeuo pipefail
        gcloud compute ssh "${_POSTGRES_VM}" \
          --project="${PROJECT_ID}" \
          --zone="${_POSTGRES_ZONE}" \
          --tunnel-through-iap \
          --quiet \
          --command 'sudo tee /tmp/rotate-publication-owner-credential-dev.sh >/dev/null && sudo chmod 700 /tmp/rotate-publication-owner-credential-dev.sh' \
          < scripts/gcp/rotate-publication-owner-credential-dev.sh

  - id: rotate-publication-owner-database
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        set -Eeuo pipefail
        work=/workspace/.publication-owner-rotation
        test -s "$${work}/password"
        cat "$${work}/password" | gcloud compute ssh "${_POSTGRES_VM}" \
          --project="${PROJECT_ID}" \
          --zone="${_POSTGRES_ZONE}" \
          --tunnel-through-iap \
          --quiet \
          --command 'sudo bash /tmp/rotate-publication-owner-credential-dev.sh'

  - id: finalize-publication-owner-secret
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        set -Eeuo pipefail
        work=/workspace/.publication-owner-rotation
        latest_payload="$$(gcloud secrets versions access latest \
          --secret=janus-runtime-bundle --project="${PROJECT_ID}")"
        printf '%s' "$${latest_payload}" | python3 -c \
          'import json,sys; v=json.load(sys.stdin); p=v.get("publication_password"); assert isinstance(p,str) and len(p)>=40'
        unset latest_payload

        latest_version="$$(gcloud secrets versions describe latest \
          --secret=janus-runtime-bundle --project="${PROJECT_ID}" \
          --format='value(name)')"
        latest_number="$${latest_version##*/}"
        while IFS= read -r version; do
          test -n "$${version}" || continue
          number="$${version##*/}"
          if [[ "$${number}" != "$${latest_number}" ]]; then
            gcloud secrets versions disable "$${number}" \
              --secret=janus-runtime-bundle --project="${PROJECT_ID}" --quiet
          fi
        done < <(gcloud secrets versions list janus-runtime-bundle \
          --project="${PROJECT_ID}" --filter='state=ENABLED' --format='value(name)')

        rm -rf "$${work}"
        gcloud compute ssh "${_POSTGRES_VM}" \
          --project="${PROJECT_ID}" \
          --zone="${_POSTGRES_ZONE}" \
          --tunnel-through-iap \
          --quiet \
          --command 'sudo rm -f /tmp/rotate-publication-owner-credential-dev.sh' >/dev/null 2>&1 || true
        echo 'Publication owner credential rotation completed and verified.'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/janus-runtime-bundle/versions/latest
      env: RUNTIME_BUNDLE

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
