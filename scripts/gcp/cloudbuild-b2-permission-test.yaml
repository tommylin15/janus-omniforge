substitutions:
  _RESOURCE: project
  _PERMISSION: storage.buckets.list

steps:
  - id: b2-permission-test
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        token="$(gcloud auth print-access-token)"
        project='gen-lang-client-0593591102'
        bucket='gen-lang-client-0593591102-dev-core'
        python3 - "$token" "$project" "$bucket" "${_RESOURCE}" "${_PERMISSION}" <<'PY'
        import json, sys, urllib.parse, urllib.request
        token, project, bucket, resource, permission = sys.argv[1:6]
        if resource == 'project':
            url=f'https://cloudresourcemanager.googleapis.com/v1/projects/{project}:testIamPermissions'
            req=urllib.request.Request(
                url,
                data=json.dumps({'permissions':[permission]}).encode(),
                headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},
                method='POST',
            )
        elif resource == 'bucket':
            qs=urllib.parse.urlencode([('permissions',permission)])
            url=f'https://storage.googleapis.com/storage/v1/b/{bucket}/iam/testPermissions?{qs}'
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
        else:
            raise SystemExit(64)
        with urllib.request.urlopen(req,timeout=30) as resp:
            payload=json.load(resp)
        raise SystemExit(0 if permission in payload.get('permissions',[]) else 3)
        PY

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 180s
