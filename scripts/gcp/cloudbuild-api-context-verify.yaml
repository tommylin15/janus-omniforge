substitutions:
  _API_URL: ""
  _USER_API_SERVICE_ACCOUNT: ""
  _TOKEN_SERVICE_ACCOUNT: ""

steps:
  - id: verify-api-context-sources
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_API_URL}"
        test -n "${_USER_API_SERVICE_ACCOUNT}"
        test -n "${_TOKEN_SERVICE_ACCOUNT}"
        api="${_API_URL}"
        user_sa="${_USER_API_SERVICE_ACCOUNT}"
        token_sa="${_TOKEN_SERVICE_ACCOUNT}"
        client_id="$(gcloud secrets versions access latest --project="${PROJECT_ID}" \
          --secret=janus-postgres-api-bundle --impersonate-service-account="${user_sa}" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["google_user_client_id"])')"
        user_token="$(gcloud auth print-identity-token --impersonate-service-account="${user_sa}" \
          --audiences="${client_id}" --include-email)"
        internal_token="$(gcloud auth print-identity-token --impersonate-service-account="${token_sa}" \
          --audiences="${api}" --include-email)"
        auth=(-H "Authorization: Bearer ${user_token}")
        internal_auth=(-H "Authorization: Bearer ${internal_token}")
        profile_status="$(curl --silent --show-error --output /tmp/profile.json --write-out '%{http_code}' --max-time 60 "${auth[@]}" "${api}/api/v1/me/profile")"
        if [[ "${profile_status}" != 200 ]]; then echo "profile_status=${profile_status}"; cat /tmp/profile.json; exit 1; fi
        profile="$(cat /tmp/profile.json)"
        owner_id="$(printf '%s' "${profile}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["user_id"])')"
        sources_status="$(curl --silent --show-error --output /tmp/sources.json --write-out '%{http_code}' --max-time 60 "${auth[@]}" "${api}/api/v1/me/ai-sources")"
        if [[ "${sources_status}" != 200 ]]; then echo "sources_status=${sources_status}"; cat /tmp/sources.json; exit 1; fi
        sources="$(cat /tmp/sources.json)"
        printf '%s' "${sources}" | grep -q 'janus-core'
        printf '%s' "${sources}" | grep -q 'janus-private-core'
        printf '%s' "${sources}" | grep -q 'janus-private-mart'
        core_status="$(curl --silent --show-error --output /tmp/core.json --write-out '%{http_code}' --max-time 60 -X POST "${auth[@]}" \
          -H 'Content-Type: application/json' \
          --data '{"selector":{"source_id":"janus-core","resource":"ohlcv","symbol":"2330","limit":1}}' \
          "${api}/api/v1/me/chats/wbs-4c-context/context-preview")"
        if [[ "${core_status}" != 200 ]]; then echo "core_status=${core_status}"; cat /tmp/core.json; exit 1; fi
        core_preview="$(cat /tmp/core.json)"
        private_status="$(curl --silent --show-error --output /tmp/private.json --write-out '%{http_code}' --max-time 60 -X POST "${auth[@]}" \
          -H 'Content-Type: application/json' \
          --data '{"selector":{"source_id":"janus-private-mart","resource":"positions","limit":1}}' \
          "${api}/api/v1/me/chats/wbs-4c-context/context-preview")"
        if [[ "${private_status}" != 200 ]]; then echo "private_status=${private_status}"; cat /tmp/private.json; exit 1; fi
        private_preview="$(cat /tmp/private.json)"
        refs="$(printf '%s\n%s' "${core_preview}" "${private_preview}" | python3 -c 'import json,sys; print(json.dumps([json.loads(line)["context_ref"] for line in sys.stdin]))')"
        test "$(printf '%s' "${core_preview}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["context_ref"]))')" -ge 32
        resolve_payload="$(OWNER="${owner_id}" REFS="${refs}" python3 -c 'import json,os; print(json.dumps({"owner_id":os.environ["OWNER"],"thread_id":"wbs-4c-context","turn_id":"turn-1","context_refs":json.loads(os.environ["REFS"])}))')"
        echo "resolve_shape=$(OWNER="${owner_id}" REFS="${refs}" python3 -c 'import json,os; p=json.loads(os.environ["REFS"]); print(json.dumps({"owner_id":os.environ["OWNER"],"ref_lengths":[len(v) for v in p]}))')"
        resolved_status="$(curl --silent --show-error --output /tmp/resolved.json --write-out '%{http_code}' --max-time 60 -X POST "${internal_auth[@]}" \
          -H 'Content-Type: application/json' \
          --data "${resolve_payload}" "${api}/internal/v1/assistant/context:resolve")"
        if [[ "${resolved_status}" != 200 ]]; then echo "resolved_status=${resolved_status}"; cat /tmp/resolved.json; exit 1; fi
        resolved="$(cat /tmp/resolved.json)"
        printf '%s' "${resolved}" | grep -q 'snapshots'
        bad_thread_payload="$(OWNER="${owner_id}" REFS="${refs}" python3 -c 'import json,os; print(json.dumps({"owner_id":os.environ["OWNER"],"thread_id":"wrong-thread","turn_id":"turn-1","context_refs":json.loads(os.environ["REFS"])}))')"
        bad_thread="$(curl --silent --output /tmp/bad-thread.json --write-out '%{http_code}' --max-time 60 -X POST "${internal_auth[@]}" \
          -H 'Content-Type: application/json' \
          --data "${bad_thread_payload}" \
          "${api}/internal/v1/assistant/context:resolve")"
        test "${bad_thread}" = 404
        invalid="$(curl --silent --output /tmp/invalid-context.json --write-out '%{http_code}' --max-time 60 -X POST "${auth[@]}" \
          -H 'Content-Type: application/json' \
          --data '{"selector":{"source_id":"janus-core","resource":"ohlcv","symbol":"2330","sql":"select *"}}' \
          "${api}/api/v1/me/chats/wbs-4c-context/context-preview")"
        test "${invalid}" = 422
        echo 'api context source acceptance passed'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
