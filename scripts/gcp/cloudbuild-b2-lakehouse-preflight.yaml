substitutions:
  _MODE: catalog-permission

steps:
  - id: b2-read-only-probe
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        case "${_MODE}" in
          catalog-permission)
            gcloud biglake iceberg catalogs list               --project="${PROJECT_ID}"               --format='value(name)' >/dev/null
            ;;
          catalog-nonempty)
            first="$(gcloud biglake iceberg catalogs list               --project="${PROJECT_ID}"               --format='value(name)' | head -1)"
            test -n "${first}"
            ;;
          catalog-specific)
            gcloud biglake iceberg catalogs describe janus_core_dev               --project="${PROJECT_ID}"               --format=json >/dev/null
            ;;
          bq-metadata)
            python3 - <<'PY'
            import json, subprocess, urllib.request
            project='gen-lang-client-0593591102'
            dataset='janus_analytics_dev'
            tables=[
                'benchmark_v1_b2_5084459386493044934',
                'ohlcv_v1_b2_8549832172546885809',
                'financials_v1_b2_801346769573568770',
            ]
            token=subprocess.run(
                ['gcloud','auth','print-access-token'],
                capture_output=True,text=True,check=True
            ).stdout.strip()
            for table in tables:
                url=f'https://bigquery.googleapis.com/bigquery/v2/projects/{project}/datasets/{dataset}/tables/{table}'
                req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
                with urllib.request.urlopen(req,timeout=30) as resp:
                    payload=json.load(resp)
                ext=payload.get('externalDataConfiguration') or {}
                if ext.get('sourceFormat')!='ICEBERG' or not ext.get('sourceUris'):
                    raise SystemExit(f'invalid external table metadata: {table}')
            PY
            ;;
          *)
            echo 'unsupported mode' >&2
            exit 64
            ;;
        esac

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 180s
