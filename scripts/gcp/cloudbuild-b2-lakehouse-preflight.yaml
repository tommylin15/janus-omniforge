steps:
  - id: read-b2-lakehouse-metadata
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python3 - <<'PY'
        import base64
        import json
        import subprocess
        import urllib.request
        import urllib.error

        project = "gen-lang-client-0593591102"
        dataset = "janus_analytics_dev"
        tables = [
            "benchmark_v1_b2_5084459386493044934",
            "ohlcv_v1_b2_8549832172546885809",
            "financials_v1_b2_801346769573568770",
        ]

        def run(args):
            p = subprocess.run(args, capture_output=True, text=True)
            return {
                "returncode": p.returncode,
                "stdout": p.stdout.strip()[:12000],
                "stderr": p.stderr.strip()[:4000],
            }

        catalogs = run([
            "gcloud", "biglake", "iceberg", "catalogs", "list",
            f"--project={project}", "--format=json",
        ])

        token = subprocess.run(
            ["gcloud", "auth", "print-access-token"],
            capture_output=True, text=True, check=True
        ).stdout.strip()

        table_results = {}
        for table in tables:
            url = (
                f"https://bigquery.googleapis.com/bigquery/v2/projects/{project}"
                f"/datasets/{dataset}/tables/{table}"
            )
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    payload = json.load(resp)
                external = payload.get("externalDataConfiguration") or {}
                table_results[table] = {
                    "http_status": 200,
                    "location": payload.get("location"),
                    "type": payload.get("type"),
                    "source_format": external.get("sourceFormat"),
                    "source_uris": external.get("sourceUris"),
                    "etag": payload.get("etag"),
                }
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")
                table_results[table] = {
                    "http_status": exc.code,
                    "error": body[:4000],
                }

        evidence = {
            "identity": "cloud-build-default",
            "mutations_performed": False,
            "catalogs": catalogs,
            "legacy_external_tables": table_results,
        }
        raw = json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode()
        print("B2_CLOUD_BUILD_PREFLIGHT=" + base64.b64encode(raw).decode())
        PY

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 180s
