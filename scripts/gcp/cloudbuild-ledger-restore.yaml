substitutions:
  _BUCKET: ""
  _OBJECT: ""

steps:
  - id: download-bounded-backup
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ "${_BUCKET}" =~ ^[a-z0-9._-]+$ ]]
        [[ "${_OBJECT}" =~ ^pilot-ledger-backups/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump$ ]]
        gcloud storage cp "gs://${_BUCKET}/${_OBJECT}" /workspace/ledger.dump --quiet >/dev/null 2>&1
        test -s /workspace/ledger.dump

  - id: isolated-restore
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        restore=janus-ledger-restore
        object='${_OBJECT}'
        cleanup() { docker rm -f "$${restore}" >/dev/null 2>&1 || true; rm -f /workspace/ledger.dump; }
        trap cleanup EXIT
        image='postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825'
        docker run -d --name "$${restore}" --network none --tmpfs /var/lib/postgresql/data:rw,size=1g \
          -e POSTGRES_HOST_AUTH_METHOD=trust "$${image}" >/dev/null
        for _ in $(seq 1 60); do
          docker exec "$${restore}" pg_isready -U postgres >/dev/null 2>&1 && break
          sleep 1
        done
        docker exec "$${restore}" pg_isready -U postgres >/dev/null
        docker exec "$${restore}" createdb -U postgres janus_restore
        docker cp /workspace/ledger.dump "$${restore}:/tmp/ledger.dump" >/dev/null
        echo 'restore container ready'
        docker exec "$${restore}" pg_restore --exit-on-error --no-owner --no-acl \
          -U postgres -d janus_restore /tmp/ledger.dump
        echo 'pg_restore completed'
        checks="$(docker exec -i "$${restore}" psql -At -U postgres -d janus_restore 2>&1 <<'SQL' || true
        SELECT NOT EXISTS(
            SELECT 1 FROM private.ledger_events event LEFT JOIN private.users owner USING(user_id)
             WHERE owner.user_id IS NULL)
          AND NOT EXISTS(
            SELECT 1 FROM private.users owner WHERE owner.ledger_version <>
              COALESCE((SELECT max(event.ledger_version) FROM private.ledger_events event WHERE event.user_id=owner.user_id),0))
          AND NOT EXISTS(
            SELECT 1 FROM private.ledger_events event
              LEFT JOIN private.ledger_events target
                ON target.event_id=COALESCE(event.reverses_event_id,event.replaces_event_id)
             WHERE event.event_action <> 'ORIGINAL'
               AND (target.event_id IS NULL OR target.user_id <> event.user_id))
          AND NOT EXISTS(
            SELECT 1 FROM information_schema.columns
             WHERE table_schema IN ('private','publication','control','audit')
               AND column_name ~* '(password|secret|token|credential|api_key)');
        SQL
        )"
        echo "restore_checks=$${checks}"
        [[ "$${checks}" == t ]]
        evidence="$(docker exec -i "$${restore}" psql -At -U postgres -d janus_restore <<'SQL'
        SELECT json_build_object(
          'owners',(SELECT count(*) FROM private.users),
          'ledger_events',(SELECT count(*) FROM private.ledger_events),
          'owner_boundary_valid',NOT EXISTS(
            SELECT 1 FROM private.ledger_events event LEFT JOIN private.users owner USING(user_id) WHERE owner.user_id IS NULL),
          'latest_versions_valid',NOT EXISTS(
            SELECT 1 FROM private.users owner WHERE owner.ledger_version <>
              COALESCE((SELECT max(event.ledger_version) FROM private.ledger_events event WHERE event.user_id=owner.user_id),0)),
          'correction_links_valid',NOT EXISTS(
            SELECT 1 FROM private.ledger_events event
              LEFT JOIN private.ledger_events target
                ON target.event_id=COALESCE(event.reverses_event_id,event.replaces_event_id)
             WHERE event.event_action <> 'ORIGINAL'
               AND (target.event_id IS NULL OR target.user_id <> event.user_id)),
          'credential_columns',(
            SELECT count(*) FROM information_schema.columns
             WHERE table_schema IN ('private','publication','control','audit')
               AND column_name ~* '(password|secret|token|credential|api_key)'));
        SQL
        )"
        printf '{"restore":"success","backup_id":"%s","checks":%s}\n' "$${object##*/}" "$${evidence}"

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
