substitutions:
  _DOCKERFILE: services/trino/Dockerfile
  _IMAGE_NAME: trino
  _IMAGE_REPOSITORY: us-central1-docker.pkg.dev/gen-lang-client-0593591102/janusai-poc
  _IMAGE_TAG: bootstrap
  _DEPLOY_TARGET: ""
  _RUNTIME_NAME: ""
  _REGION: us-central1
  _GIT_SHA: ""
  _NO_TRAFFIC: "false"
  _TRAFFIC_TAG: ""
  _REVISION_SUFFIX: ""
  _GOOGLE_USER_CLIENT_ID: ""
  _GOOGLE_ADMIN_CLIENT_ID: ""

steps:
  - id: plan-build
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        selected="${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}"
        # Reuse only immutable commit-scoped builds. Local/manual non-SHA tags
        # always rebuild so stale mutable tags cannot masquerade as evidence.
        if [[ "${_GIT_SHA}" =~ ^[0-9a-f]{7,64}$ ]] && \
           gcloud artifacts docker images describe "${selected}" \
             --format='value(image_summary.digest)' >/dev/null 2>&1; then
          touch /workspace/selected-image-exists
          echo "Reusing existing immutable image ${selected}"
        fi

        # API and private-pipeline are one image family. When the private
        # pipeline deploy runs first for a shared backend change, prebuild the
        # sibling API target in the same Cloud Build so its Python base is
        # reused and the later API deploy only consumes the already-pushed tag.
        if [[ "${_DOCKERFILE}" == "services/api/Dockerfile" && \
              "${_IMAGE_NAME}" == "private-pipeline" && \
              "${_GIT_SHA}" =~ ^[0-9a-f]{7,64}$ ]]; then
          api_peer="${_IMAGE_REPOSITORY}/api:${_IMAGE_TAG}"
          if gcloud artifacts docker images describe "${api_peer}" \
               --format='value(image_summary.digest)' >/dev/null 2>&1; then
            touch /workspace/api-peer-image-exists
            echo "Reusing existing immutable image ${api_peer}"
          fi
        fi

  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        build_image() {
          local target="$1"
          local image="$2"
          args=(
            build
            --file="${_DOCKERFILE}"
            --build-arg="GOOGLE_USER_CLIENT_ID=${_GOOGLE_USER_CLIENT_ID}"
            --build-arg="GOOGLE_ADMIN_CLIENT_ID=${_GOOGLE_ADMIN_CLIENT_ID}"
            --build-arg="JANUS_GIT_SHA=${_GIT_SHA}"
          )
          if [[ -n "${target}" ]]; then
            args+=(--target="${target}")
          fi
          args+=(--tag="${image}" .)
          docker "${args[@]}"
        }

        selected="${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}"
        if [[ ! -f /workspace/selected-image-exists ]]; then
          target=""
          case "${_DOCKERFILE}:${_IMAGE_NAME}" in
            services/api/Dockerfile:api) target="api" ;;
            services/api/Dockerfile:private-pipeline) target="private-pipeline" ;;
            jobs/intelligence-mart/Dockerfile:*) target="mart-specialist" ;;
          esac
          build_image "${target}" "${selected}"
          touch /workspace/built-selected
        fi

        if [[ "${_DOCKERFILE}" == "services/api/Dockerfile" && \
              "${_IMAGE_NAME}" == "private-pipeline" && \
              ! -f /workspace/api-peer-image-exists ]]; then
          api_peer="${_IMAGE_REPOSITORY}/api:${_IMAGE_TAG}"
          build_image "api" "${api_peer}"
          touch /workspace/built-api-peer
        fi

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        selected="${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}"
        if [[ -f /workspace/built-selected ]]; then
          docker push "${selected}"
        fi
        if [[ -f /workspace/built-api-peer ]]; then
          docker push "${_IMAGE_REPOSITORY}/api:${_IMAGE_TAG}"
        fi

  - id: deploy-runtime
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ -z "${_DEPLOY_TARGET}" || -z "${_RUNTIME_NAME}" ]]; then
          echo "No runtime deployment requested for this trigger."
          exit 0
        fi
        digest="$(gcloud artifacts docker images describe \
          "${_IMAGE_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}" \
          --format='value(image_summary.digest)')"
        test -n "${digest}"
        printf '%s' "${digest}" > /workspace/deployed-digest
        image="${_IMAGE_REPOSITORY}/${_IMAGE_NAME}@${digest}"
        runtime_flags=()
        if [[ "${_RUNTIME_NAME}" == janus-intelligence-mart && "${_GIT_SHA}" =~ ^[0-9a-f]{7,64}$ ]]; then
          runtime_flags+=(--update-env-vars="JANUS_GIT_SHA=${_GIT_SHA},JANUS_IMAGE_DIGEST=${digest}")
        fi
        if [[ "${_RUNTIME_NAME}" == "janus-private-pipeline" ]]; then
          runtime_flags+=(
            --service-account="janus-private-pipeline@${PROJECT_ID}.iam.gserviceaccount.com"
            --tasks=1
            --parallelism=1
            --max-retries=1
            --task-timeout=30m
            --command="python"
            --args="-m,services.api.private_pipeline_runtime"
            --remove-env-vars="VALUATION_DATE"
            --remove-secrets="CORE_CATALOG_PASSWORD,PRIVATE_DATABASE_URL,PRIVATE_CATALOG_PASSWORD,JANUS_PIPELINE_POSTGRES_BUNDLE"
            --update-secrets="JANUS_API_POSTGRES_BUNDLE=janus-runtime-bundle:latest"
          )
        fi
        if [[ "${_DEPLOY_TARGET}" == "service" ]]; then
          if [[ "${_NO_TRAFFIC}" == "true" ]]; then runtime_flags+=(--no-traffic); fi
          if [[ -n "${_TRAFFIC_TAG}" ]]; then runtime_flags+=(--tag="${_TRAFFIC_TAG}"); fi
          if [[ -n "${_REVISION_SUFFIX}" ]]; then runtime_flags+=(--revision-suffix="${_REVISION_SUFFIX}"); fi
          gcloud run services update "${_RUNTIME_NAME}" \
            --region="${_REGION}" --image="${image}" "${runtime_flags[@]}" --quiet
        elif [[ "${_DEPLOY_TARGET}" == "job" ]]; then
          gcloud run jobs update "${_RUNTIME_NAME}" \
            --region="${_REGION}" --image="${image}" "${runtime_flags[@]}" --quiet
        else
          echo "Unsupported deploy target: ${_DEPLOY_TARGET}" >&2
          exit 1
        fi
        echo "Deployed ${image} to ${_RUNTIME_NAME}"

  - id: cleanup-untagged-images
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ! -s /workspace/deployed-digest ]]; then
          echo "No runtime deployment completed; skipping image cleanup."
          exit 0
        fi
        current="$(cat /workspace/deployed-digest)"
        while IFS= read -r version; do
          [[ -z "${version}" || "${version}" == "${current}" ]] && continue
          gcloud artifacts docker images delete \
            "${_IMAGE_REPOSITORY}/${_IMAGE_NAME}@${version}" --quiet
        done < <(gcloud artifacts docker images list \
          "${_IMAGE_REPOSITORY}/${_IMAGE_NAME}" --include-tags \
          --filter='-tags:*' --format='value(version)')
        echo "Removed untagged old image versions; preserved ${current}."

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
